<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FSM — NFPA 25 ITM Trainer</title>
<meta name="description" content="Fire System Mastery trainer for NFPA 25 (2020 edition). Inspection, Testing and Maintenance across all 16 chapters: vocabulary cards, scenario questions, a frequency drill, and a weak-spot engine. Every answer cites its section." />
<meta name="theme-color" content="#0A0C10" />
<style>
/* ============================================================
   FSM — NFPA 25 ITM TRAINER
   Dark theme. I-T-M maps to Blue-Red-Green.
   Deck colour identifies a deck; it never appears on an answer
   option. Inside a question, red and green mean wrong and right
   and nothing else.
   ============================================================ */
:root{
  --bg:#0A0C10;
  --bg-2:#0D1016;
  --panel:#12161E;
  --panel-2:#171C26;
  --panel-3:#1D2430;
  --line:#222A36;
  --line-2:#2E3846;
  --text:#E9EDF3;
  --muted:#93A0B1;
  --dim:#66738699;

  --red:#F04A3F;
  --red-lt:#FF6B60;
  --red-soft:rgba(240,74,63,.13);
  --red-glow:rgba(240,74,63,.30);

  --green:#2FD37E;
  --green-lt:#5BE39B;
  --green-soft:rgba(47,211,126,.13);
  --green-glow:rgba(47,211,126,.28);

  --blue:#3B93F7;
  --blue-lt:#6BB0FF;
  --blue-soft:rgba(59,147,247,.13);
  --blue-glow:rgba(59,147,247,.30);

  --steel:#9CAABE;
  --steel-soft:rgba(156,170,190,.11);
  --steel-glow:rgba(156,170,190,.22);

  --amber:#F5B544;

  --rgb-line:linear-gradient(90deg,var(--red) 0%,var(--red) 18%,var(--green) 44%,var(--green) 56%,var(--blue) 82%,var(--blue) 100%);
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5;
  min-height:100vh;display:flex;flex-direction:column;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
a{color:var(--blue);text-decoration:none}
::selection{background:var(--blue);color:#fff}

/* ---------- ambient background ---------- */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(58vw 42vh at 8% -6%, rgba(240,74,63,.10), transparent 60%),
    radial-gradient(58vw 42vh at 92% -2%, rgba(59,147,247,.11), transparent 60%),
    radial-gradient(70vw 50vh at 50% 108%, rgba(47,211,126,.07), transparent 62%);
}
#shell{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;min-height:100vh}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(10,12,16,.90);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header::after{content:'';display:block;height:2px;background:var(--rgb-line);opacity:.85}
.hd{max-width:1120px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{
  width:34px;height:34px;border-radius:9px;flex:none;position:relative;
  background:conic-gradient(from 210deg,var(--red),var(--green) 40%,var(--blue) 72%,var(--red));
  display:grid;place-items:center;
}
.mark::after{content:'';position:absolute;inset:2px;border-radius:7px;background:var(--bg-2)}
.mark span{position:relative;z-index:1;font-size:15px;font-weight:800;letter-spacing:-.4px;
  background:var(--rgb-line);-webkit-background-clip:text;background-clip:text;color:transparent}
.bname{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.bname b{font-size:14.5px;font-weight:800;letter-spacing:.2px}
.bname i{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);margin-top:2px}
.hd-actions{display:flex;align-items:center;gap:7px;flex:none}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line-2);border-radius:999px;padding:5px 10px;white-space:nowrap;background:var(--panel)}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);
  display:grid;place-items:center;color:var(--muted);font-size:14px;transition:.15s}
.icon-btn:hover{color:var(--text);border-color:var(--line-2);background:var(--panel-2)}

main{flex:1;max-width:1120px;width:100%;margin:0 auto;padding:22px 16px calc(60px + var(--safe-b))}

/* ---------- generic ---------- */
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);margin-bottom:16px;flex-wrap:wrap}
.crumb a{color:var(--muted)}
.crumb a:hover{color:var(--text)}
.crumb .sep{opacity:.45}
.sec-title{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--dim);margin:30px 0 13px}
.sec-title::before{content:'';width:16px;height:2px;border-radius:2px;background:var(--rgb-line)}
.fade{animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;
  padding:12px 18px;font-size:14px;font-weight:700;transition:.15s;border:1px solid transparent;min-height:44px}
.btn-primary{background:var(--blue);color:#04101F;border-color:var(--blue)}
.btn-primary:hover{background:var(--blue-lt);border-color:var(--blue-lt)}
.btn-secondary{background:var(--panel-2);color:var(--text);border-color:var(--line-2)}
.btn-secondary:hover{background:var(--panel-3);border-color:var(--dim)}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn-ghost:hover{color:var(--text);border-color:var(--line-2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.btn-row .btn{flex:1;min-width:118px}

/* ---------- hero ---------- */
.hero{text-align:center;padding:16px 0 6px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;
  padding:6px 14px;background:var(--panel);margin-bottom:16px}
.eyebrow .dots{display:inline-flex;gap:3px}
.eyebrow .dots i{width:5px;height:5px;border-radius:50%;display:block}
.eyebrow .dots i:nth-child(1){background:var(--red)}
.eyebrow .dots i:nth-child(2){background:var(--green)}
.eyebrow .dots i:nth-child(3){background:var(--blue)}
.hero h1{font-size:clamp(28px,7.4vw,46px);font-weight:800;letter-spacing:-1.1px;line-height:1.1;margin-bottom:13px}
.hero h1 .r{color:var(--red)}
.hero h1 .g{color:var(--green)}
.hero h1 .b{color:var(--blue)}
.hero p{color:var(--muted);font-size:14.5px;max-width:620px;margin:0 auto}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:24px}
.stat{background:var(--panel);padding:15px 8px;text-align:center}
.stat b{display:block;font-size:23px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.stat span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--dim);margin-top:5px}
.stat.s-r b{color:var(--red)} .stat.s-g b{color:var(--green)} .stat.s-b b{color:var(--blue)}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:13px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:19px;display:flex;flex-direction:column;gap:9px;transition:.17s;overflow:hidden;width:100%}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--ac,var(--steel))}
.card:hover{border-color:var(--ac,var(--line-2));transform:translateY(-2px);box-shadow:0 10px 32px -14px var(--acg,transparent)}
.card-top{display:flex;align-items:center;gap:11px}
.card-ic{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;
  font-size:14px;font-weight:800;background:var(--acs,var(--steel-soft));color:var(--ac,var(--steel));
  border:1px solid var(--ac,var(--steel));letter-spacing:-.3px}
.card h3{font-size:16.5px;font-weight:750;letter-spacing:-.25px}
.card .tag{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--ac,var(--steel))}
.card p{font-size:13px;color:var(--muted);line-height:1.55;flex:1}
.bar{height:4px;border-radius:99px;background:var(--panel-3);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ac,var(--steel));transition:width .4s ease}
.card-foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin-top:2px}
.card-foot .n{font-weight:700;color:var(--ac,var(--steel))}
.card-foot .cta{color:var(--dim);font-weight:600}

/* ---------- mode picker ---------- */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:12px;margin-top:6px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;
  display:flex;flex-direction:column;gap:7px;transition:.15s;width:100%}
.mode:hover{border-color:var(--line-2);background:var(--panel-2)}
.mode h3{font-size:15.5px;font-weight:750;display:flex;align-items:center;gap:8px}
.mode h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--ac,var(--steel));flex:none}
.mode p{font-size:12.5px;color:var(--muted);line-height:1.55}

/* ---------- filter chips ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:12px;font-weight:650;padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--panel);color:var(--muted);transition:.13s;min-height:34px;display:inline-flex;align-items:center}
.chip:hover{color:var(--text);border-color:var(--dim)}
.chip.on{background:var(--acs,var(--blue-soft));border-color:var(--ac,var(--blue));color:var(--ac,var(--blue))}
.chip .c{font-size:10.5px;opacity:.7;margin-left:5px}

/* ---------- question ---------- */
.qwrap{max-width:760px;margin:0 auto}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;
  font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.qmeta .sys{color:var(--ac,var(--steel))}
.qbar{height:3px;border-radius:99px;background:var(--panel-3);overflow:hidden;margin-bottom:20px}
.qbar i{display:block;height:100%;background:var(--ac,var(--blue));transition:width .3s ease}
.qtext{font-size:clamp(17px,4.4vw,21px);font-weight:650;line-height:1.42;letter-spacing:-.25px;margin-bottom:19px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border-radius:12px;
  border:1px solid var(--line-2);background:var(--panel);transition:.14s;font-size:14.5px;line-height:1.45;
  width:100%;min-height:52px}
.opt:not(.locked):hover{border-color:var(--dim);background:var(--panel-2)}
.opt .k{width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;
  font-size:11.5px;font-weight:800;background:var(--panel-3);color:var(--muted);border:1px solid var(--line-2);margin-top:1px}
.opt .t{flex:1}
/* Answer feedback. Red = wrong, green = right. Nothing else uses these here. */
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .k{background:var(--green);color:#032414;border-color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#2A0704;border-color:var(--red)}
.opt.dim{opacity:.5}
.opt.locked{cursor:default}
.opt .note{display:block;font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5;padding-top:7px;border-top:1px solid var(--line)}
.opt.right .note{color:var(--green-lt)}
.opt.wrong .note{color:var(--red-lt)}

.verdict{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:800;letter-spacing:.4px;
  text-transform:uppercase;margin:18px 0 11px}
.verdict .g{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex:none}
.verdict.ok{color:var(--green)} .verdict.ok .g{background:var(--green);color:#032414}
.verdict.no{color:var(--red)} .verdict.no .g{background:var(--red);color:#2A0704}

.explain{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ac,var(--blue));
  border-radius:10px;padding:15px 16px;font-size:13.5px;line-height:1.62;color:var(--text)}
.explain .lbl{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:7px}
.cite{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;padding:5px 10px;margin-top:12px;font-variant-numeric:tabular-nums}
.cite::before{content:'§';color:var(--ac,var(--blue));font-weight:800}

/* ---------- flashcard ---------- */
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 22px;
  min-height:270px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;
  cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.fcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--rgb-line);opacity:.7}
.fcard:hover{border-color:var(--line-2)}
.fcard .side{font-size:9.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim)}
.fcard .term{font-size:clamp(21px,5.6vw,29px);font-weight:750;letter-spacing:-.6px;line-height:1.22}
.fcard .plain{font-size:15.5px;line-height:1.6;color:var(--text);max-width:540px;margin:0 auto}
.fcard .job{font-size:13px;line-height:1.55;color:var(--muted);max-width:520px;margin:0 auto;
  padding-top:13px;border-top:1px solid var(--line)}
.fcard .job b{color:var(--green);font-weight:700;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;display:block;margin-bottom:5px}
.fcard .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--dim);letter-spacing:.5px}

/* ---------- setup / results ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.panel h2{font-size:20px;font-weight:750;letter-spacing:-.4px;margin-bottom:7px}
.panel .lead{font-size:13.5px;color:var(--muted);margin-bottom:18px}
.opts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px}
.len{border:1px solid var(--line-2);background:var(--panel-2);border-radius:11px;padding:14px 8px;text-align:center;transition:.14s}
.len:hover{border-color:var(--dim)}
.len.on{border-color:var(--blue);background:var(--blue-soft)}
.len b{display:block;font-size:19px;font-weight:800}
.len.on b{color:var(--blue)}
.len span{display:block;font-size:10.5px;color:var(--dim);margin-top:3px}

.score{text-align:center;padding:26px 16px}
.score .ring{width:132px;height:132px;margin:0 auto 18px;position:relative}
.score .ring svg{transform:rotate(-90deg)}
.score .ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score .ring .v b{font-size:33px;font-weight:800;letter-spacing:-1.2px;line-height:1}
.score .ring .v span{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-top:3px}
.score h2{font-size:23px;font-weight:750;margin-bottom:7px}
.score p{color:var(--muted);font-size:14px;max-width:460px;margin:0 auto}

.review{margin-top:26px;display:flex;flex-direction:column;gap:11px}
.rq{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:11px;padding:15px 16px}
.rq .q{font-size:14.5px;font-weight:650;line-height:1.45;margin-bottom:11px}
.rq .line{font-size:13px;line-height:1.55;display:flex;gap:8px;margin-bottom:6px}
.rq .line .lb{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;flex:none;width:52px;padding-top:2px}
.rq .line.y .lb{color:var(--red)} .rq .line.c .lb{color:var(--green)}

/* ---------- progress ---------- */
.mastery{display:flex;flex-direction:column;gap:9px}
.mrow{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.mrow .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.mrow .nm{font-size:13.5px;font-weight:650}
.mrow .pc{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.mrow .sub{font-size:11px;color:var(--dim);margin-top:6px}
.mbar{height:5px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px;transition:width .4s}

.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .ic{font-size:34px;margin-bottom:12px;opacity:.4}
.empty h3{font-size:17px;font-weight:700;color:var(--text);margin-bottom:7px}
.empty p{font-size:13.5px;max-width:400px;margin:0 auto}

footer{border-top:1px solid var(--line);padding:20px 16px calc(24px + var(--safe-b));margin-top:26px}
.ft{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;
  align-items:center;font-size:11.5px;color:var(--dim)}
.ft a{color:var(--muted)}
.ft .links{display:flex;gap:14px;flex-wrap:wrap}

@media(max-width:560px){
  main{padding:18px 13px calc(50px + var(--safe-b))}
  .stats{grid-template-columns:repeat(2,1fr)}
  .card{padding:16px}
  .panel{padding:17px}
  .fcard{padding:26px 17px;min-height:240px}
  .opt{padding:13px 13px;font-size:14px}
  .btn-row .btn{min-width:0;padding:12px 12px;font-size:13.5px}
  .hd{padding:10px 13px}
  .bname i{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="shell">

<header>
  <div class="hd">
    <button class="brand" onclick="go('/')" aria-label="Home">
      <span class="mark"><span>25</span></span>
      <span class="bname"><b>NFPA 25 ITM Trainer</b><i>Fire System Mastery</i></span>
    </button>
    <div class="hd-actions">
      <span class="pill" id="ed">2020 Ed.</span>
      <button class="icon-btn" id="reset" title="Reset all progress" aria-label="Reset progress">&#8635;</button>
    </div>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="ft">
    <span>Concepts explained in original wording and cited to NFPA 25 (2020). Always verify against the standard itself.</span>
    <span class="links">
      <a href="index.html">Quiz Hub</a>
      <a href="NFPA13-Hazard-Trainer.html">Hazard</a>
      <a href="NFPA13-Storage-Trainer.html">Storage</a>
      <a href="NFPA13-Hydraulic-Trainer.html">Hydraulic</a>
    </span>
  </div>
</footer>

<script type="application/json" id="bank">
{"edition":"NFPA 25, 2020","definitions":[{"term":"Authority Having Jurisdiction (AHJ)","plain":"Whoever actually has legal say over your work on that building — a person, an office, or an organization empowered to enforce the code and to approve equipment, materials, installations, or procedures.","onTheJob":"The AHJ is not always the fire marshal — it can be an insurance authority, a building official, or a federal agency, so find out who signs off before you argue a point.","citation":"NFPA 25 (2020) §3.2.2","system":"General"},{"term":"Approved","plain":"Something the AHJ is willing to accept. It is a judgement call made by the enforcing authority, not a laboratory result.","onTheJob":"\"Approved\" and \"listed\" are not interchangeable — an item can be listed and still be rejected by your AHJ.","citation":"NFPA 25 (2020) §3.2.1","system":"General"},{"term":"Listed","plain":"An item that appears on a published list from an organization the AHJ accepts, where that organization evaluates products or periodically inspects production and states the item meets designated standards or is suitable for a stated purpose.","onTheJob":"Listing is tied to a specific intended purpose, so a listed device used outside that purpose is effectively unlisted.","citation":"NFPA 25 (2020) §3.2.3","system":"General"},{"term":"Shall","plain":"The signal word for a mandatory requirement — no discretion.","onTheJob":"On an exam and on a job, every \"shall\" in NFPA 25 is a pass/fail item, not a suggestion.","citation":"NFPA 25 (2020) §3.2.4","system":"General"},{"term":"Should","plain":"The signal word for a recommendation or advice — something suggested, not required.","onTheJob":"You cannot write a violation against a \"should,\" and you cannot ignore a \"shall.\"","citation":"NFPA 25 (2020) §3.2.5","system":"General"},{"term":"Qualified","plain":"A person who is both capable and competent, has met the training and requirements for that particular field, and is acceptable to the AHJ.","onTheJob":"Being qualified for sprinkler ITM does not make someone qualified for fire pump ITM — the qualification is field-specific and the AHJ gets a vote.","citation":"NFPA 25 (2020) §3.3.36","system":"General"},{"term":"Inspection, Testing, and Maintenance Service","plain":"A service program, run by a qualified contractor or a qualified representative of the property owner, under which every component of the property's systems gets inspected and tested at its required interval and gets the maintenance it needs.","onTheJob":"This is the contracted program the owner buys — its scope must cover all components, not just the ones easy to reach.","citation":"NFPA 25 (2020) §3.3.25","system":"General"},{"term":"Performance-Based Program","plain":"An alternative approach that adjusts ITM methods and intervals using quantitative performance analysis, where that analysis shows equal or better performance than the prescribed schedule.","onTheJob":"This is how a facility justifies stretching or shortening an interval — it requires documented data, not a manager's opinion.","citation":"NFPA 25 (2020) §3.3.31","system":"General"},{"term":"Automated Inspection and Testing","plain":"Performing inspections and tests from a location away from the component itself, using electronic devices or equipment installed for that purpose.","onTheJob":"New in the 2020 edition — it lets remote monitoring hardware satisfy certain ITM tasks, but only where the standard specifically permits it.","citation":"NFPA 25 (2020) §3.3.3","system":"General"},{"term":"Deficiency","plain":"For ITM purposes, a condition that hurts, or could hurt, how a system or part of it performs — but has not gotten bad enough to be an impairment.","onTheJob":"Deficiency versus impairment is the single most common report-writing mistake: if the system is still in service, it is a deficiency.","citation":"NFPA 25 (2020) §3.3.8","system":"General"},{"term":"Critical Deficiency","plain":"A deficiency serious enough that, left uncorrected, it would materially affect whether the system or unit does its job in an actual fire.","onTheJob":"Critical deficiencies drive urgency in your report and the owner notification — they are the ones that get someone hurt if they sit.","citation":"NFPA 25 (2020) §3.3.8.1","system":"General"},{"term":"Noncritical Deficiency","plain":"A deficiency that does not materially affect fire performance, but still has to be fixed to satisfy this standard or to allow proper ITM of the system or unit.","onTheJob":"Noncritical does not mean optional — it still goes on the report and still has to be corrected.","citation":"NFPA 25 (2020) §3.3.8.2","system":"General"},{"term":"Impairment","plain":"A condition where a fire protection system, or some portion of it, is out of order, such that in a fire it may not do what it was installed to do.","onTheJob":"The moment you close a control valve or drain a system, you own an impairment and the impairment procedures kick in.","citation":"NFPA 25 (2020) §3.3.22","system":"General"},{"term":"Emergency Impairment","plain":"An impairment that happens without warning — from an unplanned event, or one that shows up while you are in the middle of inspection, testing, or maintenance.","onTheJob":"Freeze-ups, breaks, and \"the main drain test wouldn't reset\" are emergency impairments — no advance planning was possible.","citation":"NFPA 25 (2020) §3.3.22.1","system":"General"},{"term":"Preplanned Impairment","plain":"An impairment arranged deliberately ahead of time, such as taking a system down to revise piping or the water supply.","onTheJob":"If it was on the schedule, it is preplanned — and the standard expects the notifications and precautions to be handled before the valve is closed.","citation":"NFPA 25 (2020) §3.3.22.2","system":"General"},{"term":"Inspection","plain":"A visual check of a system or part of a system to confirm it looks like it is in operating condition and shows no physical damage.","onTheJob":"Inspection is eyes only — the second you operate a valve or take a reading you have crossed into testing.","citation":"NFPA 25 (2020) §3.3.24","system":"General"},{"term":"Test","plain":"Operating a device to confirm it works correctly, or measuring a system characteristic to confirm it meets its requirements.","onTheJob":"A test always produces either an operation you witnessed or a number you recorded.","citation":"NFPA 25 (2020) §3.3.47","system":"General"},{"term":"Testing","plain":"The overall procedure of periodically checking a component's or system's operational status through physical checks — waterflow tests, fire pump tests, alarm tests, and trip tests of dry pipe, deluge, and preaction valves are the examples given.","onTheJob":"Testing is what generates your pass/fail data; the standard names trip tests and pump tests specifically as belonging in this bucket.","citation":"NFPA 25 (2020) §3.3.48","system":"General"},{"term":"Maintenance","plain":"For water-based systems, the work you do to keep the equipment operable.","onTheJob":"Maintenance is the corrective side — cleaning, lubricating, rebuilding — and it is a separate obligation from inspecting and testing.","citation":"NFPA 25 (2020) §3.3.27","system":"General"},{"term":"Repair","plain":"Bringing something back to sound working condition, or fixing the damage to it.","onTheJob":"Repair keeps the original component in service; replace swaps it out — the standard treats these as distinct actions.","citation":"NFPA 25 (2020) §3.3.40","system":"General"},{"term":"Replace","plain":"Taking a component out and installing a new or equivalent one in its place.","onTheJob":"\"Equivalent\" matters — a replacement sprinkler has to match the characteristics of what came out, not just fit the thread.","citation":"NFPA 25 (2020) §3.3.41","system":"General"},{"term":"Rebuild","plain":"Putting a component back into service by swapping out or fixing only the parts inside it that are worn or damaged, instead of replacing the whole unit.","onTheJob":"Rebuilding a valve is maintenance on the existing component — different from replacing the whole assembly, and it should be logged as such.","citation":"NFPA 25 (2020) §3.3.37","system":"General"},{"term":"Adjust","plain":"Bringing a device's operating characteristics to the specified values and holding them within the allowed limits.","onTheJob":"Adjusting a pressure-reducing valve back to its set point is maintenance work, and it should be documented like any other correction.","citation":"NFPA 25 (2020) §3.3.1","system":"General"},{"term":"Hydrostatic Test","plain":"Pressurizing closed piping and its attached fittings above normal pressure for a set length of time to prove the piping holds together and to measure how much it leaks.","onTheJob":"Duration and pressure are both part of the test — walking away early invalidates it.","citation":"NFPA 25 (2020) §3.3.21","system":"General"},{"term":"Main Drain","plain":"The principal drain outlet built into the system riser — the one that dumps the full riser rather than a branch or a section.","onTheJob":"This is the connection used for the main drain test that tells you whether the supply to that riser is still open and unobstructed.","citation":"NFPA 25 (2020) §3.3.11.1","system":"Valves"},{"term":"Sectional Drain","plain":"A drain located downstream of a sectional control valve that drains only one portion of the system rather than the whole thing.","onTheJob":"A sectional drain test only proves the supply through that one sectional valve — it says nothing about the rest of the building.","citation":"NFPA 25 (2020) §3.3.11.2","system":"Valves"},{"term":"Valve Status Test","plain":"Flowing water to prove that the valves feeding a portion of the system are not shut.","onTheJob":"The point is confirming an open water path, which is why a closed valve anywhere upstream shows up immediately as no flow.","citation":"NFPA 25 (2020) §3.3.49","system":"Valves"},{"term":"Valve Status Test Connection","plain":"The specific point in the system where water is discharged in order to perform a valve status test.","onTheJob":"Know where this connection is before you start — using the wrong outlet can leave part of the supply path untested.","citation":"NFPA 25 (2020) §3.3.50","system":"Valves"},{"term":"Control Valve","plain":"A valve that controls the flow of water to water-based fire protection systems.","onTheJob":"Every control valve is an impairment waiting to happen, which is why their position and supervision get so much attention in this standard.","citation":"NFPA 25 (2020) §3.5.1","system":"Valves"},{"term":"Deluge Valve","plain":"A water supply control valve that is opened by the action of an automatic detection system, with that detection installed in the same area as the discharge devices it serves.","onTheJob":"The detection system and the valve are one functional unit — testing the valve without the detection proves only half of it.","citation":"NFPA 25 (2020) §3.5.2","system":"Valves"},{"term":"Hose Valve","plain":"The valve serving an individual hose connection, fitted with an outlet a fire hose can be attached to.","onTheJob":"Hose valves are where pressure-regulating hardware most often hides on high-rise standpipes.","citation":"NFPA 25 (2020) §3.5.3","system":"Standpipe"},{"term":"Hose Connection","plain":"The threaded discharge point a fire hose gets coupled to on a standpipe — it is the outlet side of a hose valve, not a valve in its own right.","onTheJob":"Counting hose connections by class and size is how you determine which standpipe class you are actually inspecting.","citation":"NFPA 25 (2020) §3.3.16","system":"Standpipe"},{"term":"Pressure-Regulating Device","plain":"The umbrella term for any device designed to reduce, regulate, control, or restrict water pressure.","onTheJob":"Use this as the family name; when writing a report, name the specific type you found instead.","citation":"NFPA 25 (2020) §3.3.32","system":"Standpipe"},{"term":"Pressure-Restricting Device","plain":"A valve or device that cuts downstream pressure only while water is flowing — it does nothing to static pressure.","onTheJob":"If a device leaves full static pressure downstream when nothing is flowing, it is restricting, not reducing.","citation":"NFPA 25 (2020) §3.3.33","system":"Standpipe"},{"term":"Pressure-Reducing Valve","plain":"A valve that reduces the downstream pressure under both flowing and no-flow conditions.","onTheJob":"The flowing-and-static distinction is exactly what separates a PRV from a pressure-restricting device on an exam question.","citation":"NFPA 25 (2020) §3.5.5","system":"Standpipe"},{"term":"Master Pressure-Reducing Valve","plain":"A pressure-reducing valve installed to control pressure across an entire fire protection zone, a standpipe zone, or both — rather than at one outlet.","onTheJob":"A master PRV failure affects a whole zone at once, so its test results carry far more weight than a single hose-valve PRV.","citation":"NFPA 25 (2020) §3.5.5.1","system":"Standpipe"},{"term":"Pressure Control Valve","plain":"A pilot-operated pressure-reducing valve that holds downstream pressure to a specific value under both flowing and static conditions.","onTheJob":"The giveaway is the pilot control line — that external pilot is what distinguishes it from a plain PRV in the field.","citation":"NFPA 25 (2020) §3.5.4","system":"Standpipe"},{"term":"Relief Valve","plain":"A device that lets excess pressure out of a system by diverting liquid.","onTheJob":"On a fire pump, a relief valve discharging during a normal test is a finding, not a feature — investigate why pressure is that high.","citation":"NFPA 25 (2020) §3.5.6","system":"Fire Pump"},{"term":"Circulation Relief Valve","plain":"A small, separate valve that keeps the pump cool by bleeding off a small quantity of water; it is independent of the main relief valve.","onTheJob":"If this valve is stuck shut at churn, the pump can overheat — expect to verify it discharges during the no-flow portion of the test.","citation":"NFPA 25 (2020) §3.5.6.1","system":"Fire Pump"},{"term":"Double Check Valve Assembly (DCVA)","plain":"A backflow assembly built from two internally loaded check valves — spring-loaded or weighted — installed as a unit between two tight-closing resilient-seated shutoff valves, with properly located resilient-seated test cocks.","onTheJob":"Both shutoffs and all test cocks are part of the assembly, so a missing or damaged test cock is a finding on the assembly itself.","citation":"NFPA 25 (2020) §3.3.10","system":"Private Mains"},{"term":"Reduced-Pressure Principle Backflow Prevention Assembly (RPBA)","plain":"Two independently acting check valves with a hydraulically operating, mechanically independent pressure differential relief valve between them, bracketed by two resilient-seated shutoff valves and fitted with properly located test cocks.","onTheJob":"The relief port on an RPBA is supposed to be able to dump water — never plug or pipe it in a way that defeats it.","citation":"NFPA 25 (2020) §3.3.38","system":"Private Mains"},{"term":"Fire Department Connection","plain":"The connection through which the fire department can pump extra water into a sprinkler system, standpipe, or other system to boost what the existing supply provides.","onTheJob":"An FDC is supplemental — a system that depends entirely on it is a manual system, and that distinction changes the class of the standpipe.","citation":"NFPA 25 (2020) §3.3.12","system":"General"},{"term":"Dry Barrel Hydrant (Frostproof Hydrant)","plain":"A hydrant whose main control valve sits below the frost line, down between the footpiece and the barrel, so the barrel drains and stays empty.","onTheJob":"Water standing in a dry barrel hydrant means the drain is not working — that is a freeze hazard, not a nuisance.","citation":"NFPA 25 (2020) §3.3.13.1","system":"Private Mains"},{"term":"Wet Barrel Hydrant","plain":"A hydrant meant for locations with no freezing danger, where each outlet has its own valve and its own outlet.","onTheJob":"Because the barrel stays charged, a leaking outlet valve on a wet barrel hydrant leaks continuously.","citation":"NFPA 25 (2020) §3.3.13.5","system":"Private Mains"},{"term":"Dry Hydrant","plain":"Piping permanently connected to a water source that is not a piped, pressurized supply — it gives fire apparatus a ready place to draft from using a pump's suction capability.","onTheJob":"Do not confuse this with a dry barrel hydrant; a dry hydrant has no pressure behind it at all and exists to draft from ponds or similar sources.","citation":"NFPA 25 (2020) §3.3.13.2","system":"Private Mains"},{"term":"Monitor Nozzle Hydrant","plain":"A hydrant fitted with a monitor nozzle able to deliver more than 250 gpm (946 L/min).","onTheJob":"The over-250-gpm capability is the defining number — it puts this hydrant in a different category from a standard fire hydrant.","citation":"NFPA 25 (2020) §3.3.13.3","system":"Private Mains"},{"term":"Wall Hydrant","plain":"A hydrant mounted on the outside wall of a building, fed from piping inside, with controls located inside the building that are normally key-operated from outside.","onTheJob":"Because the controls live inside, verifying a wall hydrant means getting access to the interior valve, not just looking at the outlet.","citation":"NFPA 25 (2020) §3.3.13.4","system":"Private Mains"},{"term":"Private Fire Service Main","plain":"The pipe and appurtenances on private property running between the water source and the base of the system riser for water-based systems; between the source and inlets to foam-making systems; between the source and the base elbow of private hydrants or monitor nozzles; and the fire pump suction and discharge piping starting at the inlet side of the check valve on a gravity or pressure tank.","onTheJob":"Knowing exactly where the main ends and the system begins decides which chapter of NFPA 25 governs the component you are looking at.","citation":"NFPA 25 (2020) §3.6.3","system":"Private Mains"},{"term":"Class I Standpipe System","plain":"A standpipe system providing 2½ in. (65 mm) hose connections intended for fire department use.","onTheJob":"Class I means fire department only — no hose or nozzles are required at the outlets.","citation":"NFPA 25 (2020) §3.3.44.1","system":"Standpipe"},{"term":"Class II Standpipe System","plain":"A standpipe system providing 1½ in. (40 mm) hose stations, intended mainly for trained personnel or for the fire department during initial response.","onTheJob":"Class II is the one with hose stations, so hose, rack, and nozzle condition all become inspection items.","citation":"NFPA 25 (2020) §3.3.44.2","system":"Standpipe"},{"term":"Class III Standpipe System","plain":"A standpipe system that provides both 1½ in. (40 mm) hose stations for use by trained personnel and 2½ in. (65 mm) hose connections that supply a larger volume of water for fire department use.","onTheJob":"Class III combines the obligations of Class I and Class II — you inspect both the hose stations and the fire department connections.","citation":"NFPA 25 (2020) §3.3.44.3","system":"Standpipe"},{"term":"Automatic Standpipe System","plain":"A standpipe attached to a water supply that can meet the system demand, and that needs no action other than opening a hose valve to get water at the connection.","onTheJob":"If a firefighter has to do anything besides open the hose valve, it is not an automatic standpipe.","citation":"NFPA 25 (2020) §3.3.43.1","system":"Standpipe"},{"term":"Manual Standpipe System","plain":"A standpipe that depends entirely on the fire department connection to supply the system demand.","onTheJob":"No pumper at the FDC means no water — which is why FDC condition on a manual standpipe is a life-safety item, not housekeeping.","citation":"NFPA 25 (2020) §3.3.43.3","system":"Standpipe"},{"term":"Semiautomatic Dry Standpipe System","plain":"A standpipe permanently attached to a supply that can meet the system demand at all times, arranged through a device such as a deluge valve, where a separate remote control device has to be actuated before water will reach the hose connections.","onTheJob":"Look for the remote actuation station near the hose valve; verifying that device operates is what separates this from a plain dry standpipe.","citation":"NFPA 25 (2020) §3.3.43.4","system":"Standpipe"},{"term":"Dry Standpipe System","plain":"A standpipe designed so the piping only holds water while the system is actually being used.","onTheJob":"Dry standpipe piping is subject to corrosion and debris because it sits empty — internal condition matters here.","citation":"NFPA 25 (2020) §3.3.43.2","system":"Standpipe"},{"term":"Wet Standpipe System","plain":"A standpipe whose piping holds water at all times.","onTheJob":"Wet standpipes in unheated areas are freeze candidates, which ties them straight back to the freeze-protection requirements.","citation":"NFPA 25 (2020) §3.3.43.5","system":"Standpipe"},{"term":"Combined Standpipe and Sprinkler System","plain":"A single system where the water piping serves both the 2½ in. (65 mm) fire department outlets and the outlets feeding automatic sprinklers.","onTheJob":"One impairment on a combined system takes out both the sprinklers and the standpipe — plan the shutdown accordingly.","citation":"NFPA 25 (2020) §3.6.1","system":"Standpipe"},{"term":"Wet Pipe Sprinkler System","plain":"A system with automatic sprinklers on water-filled piping connected to a water supply, so water discharges the instant a sprinkler opens from fire heat.","onTheJob":"The simplest system to inspect and the one most vulnerable to freezing — the 40°F minimum temperature rule exists for these.","citation":"NFPA 25 (2020) §3.6.4.6","system":"Sprinkler"},{"term":"Dry Pipe Sprinkler System","plain":"A system with automatic sprinklers on piping held under air or nitrogen pressure; when a sprinkler opens and that pressure escapes, water pressure opens the dry pipe valve and water flows to the open sprinklers.","onTheJob":"Trip testing is what proves the valve actually opens — air pressure alone on the gauge proves nothing about the trip.","citation":"NFPA 25 (2020) §3.6.4.3","system":"Sprinkler"},{"term":"Preaction Sprinkler System","plain":"A system with automatic sprinklers on piping that may or may not carry air pressure, plus a supplemental detection system installed in the same areas as the sprinklers.","onTheJob":"Two things must happen for water to flow, so the detection system is part of the fire protection system and gets tested with it.","citation":"NFPA 25 (2020) §3.6.4.5","system":"Sprinkler"},{"term":"Deluge Sprinkler System","plain":"A system using open sprinklers or nozzles on piping fed through a valve that is opened by a detection system located in the same area; when the valve opens, every attached sprinkler or nozzle flows.","onTheJob":"Because all heads are open, a deluge trip floods the entire protected area — coordinate drainage before you test.","citation":"NFPA 25 (2020) §3.6.4.2","system":"Sprinkler"},{"term":"Antifreeze Sprinkler System","plain":"A wet pipe system with automatic sprinklers whose piping holds an antifreeze solution, arranged to discharge that solution when a sprinkler opens and then feed water in behind it from the supply.","onTheJob":"The solution is the first thing out of the head, so its concentration and condition are directly a life-safety matter.","citation":"NFPA 25 (2020) §3.6.4.1","system":"Sprinkler"},{"term":"Premixed Antifreeze Solution","plain":"Antifreeze material blended with water at the factory under a quality control procedure that keeps the mixture uniform and holds the concentration to the stated value.","onTheJob":"Factory-premixed means you are not supposed to be mixing or topping off in the field — do not dilute it on site.","citation":"NFPA 25 (2020) §3.6.4.1.1","system":"Sprinkler"},{"term":"Early Suppression Fast-Response (ESFR) Sprinkler","plain":"A fast-response sprinkler whose thermal element has an RTI of 50 (meters-seconds)^½ or less, listed for its ability to suppress specific high-challenge fire hazards.","onTheJob":"Replace an ESFR only with an ESFR of the same characteristics — substituting a standard spray head destroys the design basis.","citation":"NFPA 25 (2020) §3.3.42.5","system":"Sprinkler"},{"term":"Quick-Response (QR) Sprinkler","plain":"A spray sprinkler with a thermal element rated at RTI 50 (meters-seconds)^½ or less that is listed as quick-response for its intended use.","onTheJob":"RTI 50 or less is the line for quick response — the same number that defines ESFR, QRES, and quick-response extended coverage thermal elements.","citation":"NFPA 25 (2020) §3.3.42.14","system":"Sprinkler"},{"term":"Quick-Response Early Suppression (QRES) Sprinkler","plain":"A quick-response sprinkler with a thermal element rated RTI 50 (meters-seconds)^½ or less that is listed for suppressing specific fire hazards.","onTheJob":"Easy to confuse with ESFR on a spare-head cabinet — read the listing, not just the response speed.","citation":"NFPA 25 (2020) §3.3.42.12","system":"Sprinkler"},{"term":"Residential Sprinkler","plain":"A fast-response sprinkler with an RTI of 50 (meters-seconds)^½ or less, specifically investigated for improving survivability in the room of fire origin and listed for protecting dwelling units.","onTheJob":"Residential heads are listed for dwelling units — do not carry them into a commercial area as a convenient spare.","citation":"NFPA 25 (2020) §3.3.42.15","system":"Sprinkler"},{"term":"Control Mode Specific Application (CMSA) Sprinkler","plain":"A spray sprinkler that produces characteristically large water droplets and is listed for controlling specific high-challenge fire hazards.","onTheJob":"Large-drop performance depends on the listing — the droplet characteristic is the whole point and cannot be matched by an ordinary spray head.","citation":"NFPA 25 (2020) §3.3.42.2","system":"Sprinkler"},{"term":"Old-Style/Conventional Sprinkler","plain":"A sprinkler that throws roughly 40 to 60 percent of its water downward initially, and that is designed to work installed either upright or pendent.","onTheJob":"Finding old-style heads tells you the installation is dated and the spare-head stock has to match — modern spray sprinklers do not distribute the same way.","citation":"NFPA 25 (2020) §3.3.42.9","system":"Sprinkler"},{"term":"Dry Sprinkler","plain":"A sprinkler mounted on an extension nipple that is sealed at the inlet end so water cannot enter the nipple until the sprinkler operates.","onTheJob":"Dry sprinklers let you feed a freezer or canopy off a wet system, and their seal condition is what keeps that arrangement from freezing.","citation":"NFPA 25 (2020) §3.3.42.4","system":"Sprinkler"},{"term":"Corrosion-Resistant Sprinkler","plain":"A sprinkler made from corrosion-resistant material, or given a special coating or plating, so it can live in an atmosphere that would normally attack a standard sprinkler.","onTheJob":"Field-painting a standard head does not create a corrosion-resistant sprinkler — the coating has to be the manufacturer's.","citation":"NFPA 25 (2020) §3.3.42.3","system":"Sprinkler"},{"term":"Ornamental/Decorative Sprinkler","plain":"A sprinkler that was painted or plated by the manufacturer.","onTheJob":"The word that matters is \"manufacturer\" — a head painted by a contractor or a painter is a replacement item, not an ornamental sprinkler.","citation":"NFPA 25 (2020) §3.3.42.11","system":"Sprinkler"},{"term":"No Flow (Churn, Shutoff)","plain":"The fire pump condition where the pump runs but the only water moving through it is the small amount going out the circulation relief valve or supplying driver cooling.","onTheJob":"Churn is the starting point of the annual flow test, and the pump should not be left there long enough to overheat.","citation":"NFPA 25 (2020) §3.6.2.4","system":"Fire Pump"},{"term":"Peak Load","plain":"As it applies to annual testing in this standard, the greatest power the driver has to produce at any flow rate from churn up through 150 percent of rated capacity.","onTheJob":"Peak load is why the annual test runs out to 150 percent of rated flow — that is where the driver demand is verified.","citation":"NFPA 25 (2020) §3.6.2.5","system":"Fire Pump"},{"term":"Net Pressure (Differential Pressure)","plain":"For a vertical turbine pump, the discharge flange pressure plus the total suction lift. For every other fire pump, the discharge flange pressure minus the suction flange pressure.","onTheJob":"Two different formulas — using the subtraction method on a vertical turbine will give you a wrong net pressure and a wrong test result.","citation":"NFPA 25 (2020) §3.6.2.6.2","system":"Fire Pump"},{"term":"Rated Pressure","plain":"The net (differential) pressure the pump produces at rated flow and rated speed, as marked on the manufacturer's nameplate.","onTheJob":"Test results are judged against the nameplate values, so photograph the nameplate before you start the pump test.","citation":"NFPA 25 (2020) §3.6.2.6.3","system":"Fire Pump"},{"term":"Rated Flow","plain":"The pump capacity at rated speed and rated pressure as stamped on the manufacturer's nameplate.","onTheJob":"The nameplate is the authority for rated flow — read it, do not take the flow figure from a submittal or a previous report.","citation":"NFPA 25 (2020) §3.6.2.7","system":"Fire Pump"},{"term":"Lowest Permissible Suction Pressure","plain":"The minimum suction pressure this standard and the AHJ will allow.","onTheJob":"You must not draw suction below this value during a flow test — it protects the supply system, and the AHJ has a say in the number.","citation":"NFPA 25 (2020) §3.3.26","system":"Fire Pump"},{"term":"Unadjusted Field Test Curve","plain":"The pump curve plotted straight from the raw discharge gauge readings taken at churn, at 100 percent of rated flow, and at up to 150 percent of rated flow — with no correction made for speed or velocity pressure.","onTheJob":"Plot the unadjusted curve first; corrections come afterward, and mixing the two produces a curve you cannot compare year over year.","citation":"NFPA 25 (2020) §3.6.2.11","system":"Fire Pump"},{"term":"Variable Speed Pump","plain":"A fire pump equipped with variable speed pressure limiting control or self-regulating variable speed fire pump control.","onTheJob":"New term in the 2020 edition — these pumps do not hold a fixed speed, so the field test data has to be interpreted accordingly.","citation":"NFPA 25 (2020) §3.6.2.12","system":"Fire Pump"},{"term":"Water Mist System","plain":"A distribution system tied to a water supply, or to water plus an atomizing medium supply, with one or more nozzles capable of controlling, suppressing, or extinguishing fire, and demonstrated to meet the performance requirements of its listing and the applicable standard.","onTheJob":"Water mist is governed by its listing — the manufacturer's data is not optional background reading, it drives the ITM.","citation":"NFPA 25 (2020) §3.6.5","system":"Water Mist"},{"term":"Water Spray System","plain":"A fixed pipe system, actuated automatically or manually, connected to a water supply and fitted with water spray nozzles that put a specific water discharge and distribution onto the surface or area being protected.","onTheJob":"Nozzle aim and pattern are the whole design here — a bumped or painted nozzle defeats the system's purpose.","citation":"NFPA 25 (2020) §3.6.6","system":"Water Spray"},{"term":"Ultra High-Speed Water Spray System","plain":"A water spray system that applies water very rapidly, used to protect specific hazards where a deflagration is expected.","onTheJob":"Response time is the performance metric that matters — these protect explosion hazards, not ordinary fires.","citation":"NFPA 25 (2020) §3.6.6.1","system":"Water Spray"},{"term":"Supervision","plain":"In water-based fire protection, a means of watching system status and signalling when something is abnormal.","onTheJob":"Supervision is how a closed valve gets caught before a fire, which is why supervisory signal testing is treated seriously.","citation":"NFPA 25 (2020) §3.3.46","system":"General"},{"term":"Waterflow Alarm Device","plain":"An attachment to a water-based system that senses a predetermined flow of water and signals it.","onTheJob":"The device has to both detect and signal — a flow switch that senses but never transmits is a failed device.","citation":"NFPA 25 (2020) §3.3.53","system":"General"},{"term":"Alarm Receiving Facility","plain":"The place where alarm signals and supervisory signals end up.","onTheJob":"This is one of the parties that has to be notified before you shut a system down and again when it is back in service.","citation":"NFPA 25 (2020) §3.3.2","system":"General"},{"term":"Frequency","plain":"The wording NFPA 25 uses to bound how often a task happens — it sets both the minimum and the maximum time allowed between events, not just an average.","onTheJob":"This is the definition that makes every interval in the standard a window with two edges: too soon can be as noncompliant as too late.","citation":"NFPA 25 (2020) §3.7.1","system":"General"},{"term":"Daily Frequency","plain":"The task occurs every day.","onTheJob":"Daily means every day — used for things like checking valve enclosure temperatures during cold weather.","citation":"NFPA 25 (2020) §3.7.1.1","system":"General"},{"term":"Weekly Frequency","plain":"The task occurs once per calendar week.","onTheJob":"It is tied to the calendar week, not to a rolling seven-day clock.","citation":"NFPA 25 (2020) §3.7.1.2","system":"General"},{"term":"Monthly Frequency","plain":"The task occurs once per calendar month.","onTheJob":"Calendar month again — a task done on the 1st of one month and the 30th of the next is still compliant.","citation":"NFPA 25 (2020) §3.7.1.3","system":"General"},{"term":"Quarterly Frequency","plain":"The task occurs four times per year, with at least 2 months and at most 4 months between occurrences.","onTheJob":"Doing two quarterly inspections six weeks apart to catch up does not count — the 2-month minimum is a real requirement.","citation":"NFPA 25 (2020) §3.7.1.4","system":"General"},{"term":"Semiannual Frequency","plain":"The task occurs twice per year, with at least 4 months and at most 8 months between occurrences.","onTheJob":"The 8-month ceiling gives real scheduling room, but it also means a January visit cannot wait past September.","citation":"NFPA 25 (2020) §3.7.1.5","system":"General"},{"term":"Annual Frequency","plain":"The task occurs once per year, with at least 9 months and at most 15 months between occurrences.","onTheJob":"The 9-to-15-month window is the most-tested frequency definition in the standard — annual is not \"same month every year.\"","citation":"NFPA 25 (2020) §3.7.1.6","system":"General"},{"term":"Three Years Frequency","plain":"The task occurs once every 36 months, with at least 30 months and at most 40 months between occurrences.","onTheJob":"Note the window is not symmetric — 30 months early but only 40 months late.","citation":"NFPA 25 (2020) §3.7.1.7","system":"General"},{"term":"Five Years Frequency","plain":"The task occurs once every 60 months, with at least 54 months and at most 66 months between occurrences.","onTheJob":"Five-year tasks such as internal inspections still have a hard 66-month outside limit — past that you are out of compliance.","citation":"NFPA 25 (2020) §3.7.1.8","system":"General"}],"questions":[{"deck":"general","system":"General","frequency":"Annual","drill":true,"question":"NFPA 25 defines each ITM frequency as a window with a minimum and a maximum. For a task with an annual frequency, what is that window?","options":["A minimum of 9 months and a maximum of 15 months between occurrences","A minimum of 4 months and a maximum of 8 months between occurrences","A minimum of 2 months and a maximum of 4 months between occurrences","A minimum of 10 months and a maximum of 14 months between occurrences"],"correctIndex":0,"citation":"NFPA 25 (2020) §3.7.1.6","explanation":"Annual is defined as occurring once per year with no less than 9 months and no more than 15 months between events. The standard deliberately writes every frequency as a two-sided window so both early and late work can be judged.","optionNotes":["Correct. Annual permits 9 to 15 months between occurrences, so an annual task done in March one year can legitimately land anywhere from December to June the following year.","This is the semiannual window (§3.7.1.5) — twice per year, 4 to 8 months apart. Not annual.","This is the quarterly window (§3.7.1.4) — four times per year, 2 to 4 months apart. Not annual.","A tempting symmetric-sounding answer, but the standard does not use 10 and 14. The published numbers are 9 and 15."]},{"deck":"general","system":"General","frequency":"Quarterly","drill":true,"question":"A quarterly inspection was completed on January 10. Applying the NFPA 25 definition of quarterly frequency, when may the next occurrence of that inspection legitimately take place?","options":["Any time from March 10 through May 10","Any time from February 10 through April 10","Any time from May 10 through September 10","On April 10 only, because quarterly means exactly every 3 months"],"correctIndex":0,"citation":"NFPA 25 (2020) §3.7.1.4","explanation":"Quarterly is defined as four times per year with a minimum of 2 months and a maximum of 4 months between events. From a January 10 inspection, 2 months forward is March 10 and 4 months forward is May 10, so the next one belongs inside that range.","optionNotes":["Correct. March 10 is the 2-month minimum and May 10 is the 4-month maximum measured from the January 10 event.","February 10 is only 1 month out, which violates the 2-month minimum. Bunching tasks together to catch up a schedule is not compliant.","This is the semiannual window of 4 to 8 months (§3.7.1.5) applied to a quarterly task — far too long between quarterly occurrences.","The standard defines quarterly as a window, not a fixed date. Requiring exactly 3 months ignores the 2-to-4-month range in §3.7.1.4."]},{"deck":"general","system":"General","frequency":"Five Years","drill":true,"question":"What does NFPA 25 permit for a task assigned a five-year frequency?","options":["Once every 60 months, with a minimum of 54 months and a maximum of 66 months","Once every 60 months, with a minimum of 48 months and a maximum of 72 months","Once every 36 months, with a minimum of 30 months and a maximum of 40 months","Once in each calendar five-year period, with no minimum or maximum spacing"],"correctIndex":0,"citation":"NFPA 25 (2020) §3.7.1.8","explanation":"A five-year frequency means the event happens once every 60 months, and the standard bounds that with 54 months on the early side and 66 months on the late side.","optionNotes":["Correct. 54 and 66 months are the published minimum and maximum for a five-year task per §3.7.1.8.","48 and 72 months would be a full year of slack in each direction. The standard allows only 6 months either way from the 60-month target.","This is the three-year frequency (§3.7.1.7) — 36 months with a 30-to-40-month window. Wrong interval entirely.","Five-year frequency is not an open allowance inside a calendar period. §3.7.1.8 fixes it at 60 months and bounds it at 54 months early and 66 months late. (Note that daily, weekly, and monthly in §3.7.1.1 through §3.7.1.3 are the frequencies written against the calendar with no stated min/max — the bounded windows begin at quarterly, §3.7.1.4.)"]},{"deck":"general","system":"General","frequency":"Three Years","drill":true,"question":"A task on a three-year frequency was last performed 41 months ago. What is its compliance status under NFPA 25?","options":["Overdue — the maximum interval for a three-year frequency is 40 months","Compliant — three-year tasks are permitted up to 48 months","Overdue — the maximum interval for a three-year frequency is 36 months","Compliant — it only has to fall within the same 3 calendar years"],"correctIndex":0,"citation":"NFPA 25 (2020) §3.7.1.7","explanation":"A three-year frequency is once every 36 months, bounded by a 30-month minimum and a 40-month maximum. At 41 months the task has passed the outside limit and is overdue.","optionNotes":["Correct. 40 months is the published maximum, so 41 months is out of compliance.","48 months does not appear in §3.7.1 for a three-year task. The outside limit is 40 months.","36 months is the nominal target, not the maximum. The standard specifically allows up to 40 months, so calling 37 months overdue would also be an error.","Only daily, weekly, and monthly frequencies are written against the calendar (§3.7.1.1 through §3.7.1.3). Three-year frequency is expressed in months with a fixed window."]},{"deck":"general","system":"General","frequency":"Weekly","drill":true,"question":"How does NFPA 25 define a weekly frequency?","options":["Occurring once per calendar week","Occurring every 7 days, with a minimum of 5 days and a maximum of 9 days","Occurring four times per calendar month, with at least 3 weeks between events","Occurring twice per calendar month, at least 10 days apart"],"correctIndex":0,"citation":"NFPA 25 (2020) §3.7.1.2","explanation":"Weekly is tied to the calendar week, not to a rolling count of days. One occurrence inside each calendar week satisfies the requirement even if two occurrences land close together across a week boundary.","optionNotes":["Correct. The definition is written against the calendar week, the same way daily and monthly are written against the calendar day and calendar month.","No day-count window is given for weekly. Minimum-and-maximum windows first appear at the quarterly frequency (§3.7.1.4).","The standard never expresses weekly as a count per month, and it imposes no 3-week separation rule.","This describes an invented twice-monthly pattern. Weekly is simply once per calendar week."]},{"deck":"inspection","system":"General","frequency":"","drill":false,"question":"During an annual inspection you find a condition that has not taken the system out of service, but if it is left uncorrected it would materially affect whether the system performs in a fire. Using NFPA 25 terminology, how do you classify it?","options":["A critical deficiency","A noncritical deficiency","An impairment","An emergency impairment"],"correctIndex":0,"citation":"NFPA 25 (2020) §3.3.8.1","explanation":"A deficiency is a condition that adversely affects, or could adversely affect, performance without rising to the level of an impairment. It becomes critical when, uncorrected, it would have a material effect on the system's ability to function in a fire event.","optionNotes":["Correct. The system is still in service, so it is a deficiency, and the material effect on fire performance makes it critical per §3.3.8.1.","A noncritical deficiency (§3.3.8.2) is one that does NOT have a material effect on fire performance but still must be corrected to satisfy the standard or to permit proper ITM. The material effect here rules it out.","An impairment (§3.3.22) requires the system or a portion of it to be out of order. The scenario states the system is still in service.","Emergency impairment (§3.3.22.1) is an impairment from an unplanned occurrence or one discovered while performing ITM. There is no impairment here at all."]},{"deck":"general","system":"Sprinkler","frequency":"","drill":false,"question":"A contractor schedules a Saturday shutdown of a sprinkler riser weeks in advance so that piping revisions can be made. Under NFPA 25 definitions, this shutdown is best described as which of the following?","options":["A preplanned impairment","An emergency impairment","A critical deficiency","A noncritical deficiency"],"correctIndex":0,"citation":"NFPA 25 (2020) §3.3.22.2","explanation":"When a system or portion of it is taken out of service under work planned in advance — such as revisions to the water supply or sprinkler piping — the standard calls it a preplanned impairment. The advance planning is what separates it from the emergency category.","optionNotes":["Correct. The work was arranged ahead of time and the system goes out of service, which matches the preplanned impairment definition in §3.3.22.2.","Emergency impairment (§3.3.22.1) applies to an unplanned occurrence, or to an impairment discovered while performing inspection, testing, or maintenance. Nothing here was unplanned.","A critical deficiency (§3.3.8.1) is a condition found in a system that is still in service. Here the system is deliberately taken out of service, which makes it an impairment, not a deficiency.","A noncritical deficiency (§3.3.8.2) also presumes the system is in service and covers conditions with no material effect on fire performance."]},{"deck":"general","system":"Standpipe","frequency":"","drill":false,"question":"On a standpipe survey you find a device at a hose valve that lowers pressure only while water is flowing; with the valve closed, full static pressure is present downstream. Which NFPA 25 term describes this device?","options":["Pressure-restricting device","Pressure-reducing valve","Pressure control valve","Master pressure-reducing valve"],"correctIndex":0,"citation":"NFPA 25 (2020) §3.3.33","explanation":"NFPA 25 separates these terms by whether static pressure is affected. A pressure-restricting device acts only under flowing (residual) conditions, which is exactly what the scenario describes.","optionNotes":["Correct. Reducing pressure only under flowing conditions and leaving static pressure alone is the defining characteristic in §3.3.33.","A pressure-reducing valve (§3.5.5) reduces downstream pressure under BOTH flowing and nonflowing conditions. The unchanged static pressure rules it out.","A pressure control valve (§3.5.4) is a pilot-operated pressure-reducing valve that holds a specific downstream value under both flowing and static conditions — again, static pressure would be controlled.","A master pressure-reducing valve (§3.5.5.1) controls pressure for an entire fire protection or standpipe zone rather than at one hose valve, and it too acts under both conditions."]},{"deck":"inspection","system":"Standpipe","frequency":"","drill":false,"question":"You are inspecting a building whose standpipe risers serve only 1½ in. (40 mm) hose stations, intended primarily for trained building personnel and for the fire department during initial response. There are no 2½ in. (65 mm) connections. What class of standpipe system is this?","options":["Class II","Class I","Class III","A combined standpipe and sprinkler system"],"correctIndex":0,"citation":"NFPA 25 (2020) §3.3.44.2","explanation":"NFPA 25 classifies standpipes by the outlets provided and who is expected to use them. Only 1½ in. hose stations, intended for trained personnel or fire department initial response, matches the Class II definition.","optionNotes":["Correct. Class II is defined by 1½ in. (40 mm) hose stations for trained personnel or fire department initial response.","Class I (§3.3.44.1) provides 2½ in. (65 mm) hose connections for fire department use. The scenario explicitly has none.","Class III (§3.3.44.3) provides BOTH 1½ in. hose stations and 2½ in. connections. Missing the 2½ in. connections rules it out.","A combined standpipe and sprinkler system (§3.6.1) describes shared water piping serving both fire department outlets and automatic sprinklers — a property of the system, not a standpipe class."]},{"deck":"general","system":"Standpipe","frequency":"","drill":false,"question":"A standpipe is permanently attached to a water supply capable of meeting the system demand at all times, and it is arranged through a device such as a deluge valve — but a remote control device must be activated before water reaches the hose connections. What type of standpipe system is this?","options":["Semiautomatic dry standpipe system","Automatic standpipe system","Manual standpipe system","Wet standpipe system"],"correctIndex":0,"citation":"NFPA 25 (2020) §3.3.43.4","explanation":"Three things have to be true at once: an adequate supply is permanently connected, the arrangement uses a device such as a deluge valve, and a separate remote control device has to be actuated before water reaches the hose connections. That combination is the semiautomatic dry standpipe in §3.3.43.4.","optionNotes":["Correct. Permanent supply capable of the system demand, a deluge-type arrangement, and a required remote control device activation together match §3.3.43.4.","An automatic standpipe (§3.3.43.1) is attached to a supply capable of the system demand and requires no action other than opening a hose valve. The extra actuation step rules it out.","A manual standpipe (§3.3.43.3) relies exclusively on the fire department connection to supply the system demand. Here a capable supply is already permanently attached.","A wet standpipe (§3.3.43.5) has piping containing water at all times and needs no control device actuated. The semiautomatic dry standpipe's piping is not normally charged and it needs the remote device operated first."]},{"deck":"inspection","system":"Private Mains","frequency":"","drill":false,"question":"Which hydrant type has its main control valve located below the frost line, in the section between the footpiece and the barrel?","options":["Dry barrel hydrant (frostproof hydrant)","Wet barrel hydrant","Dry hydrant","Wall hydrant"],"correctIndex":0,"citation":"NFPA 25 (2020) §3.3.13.1","explanation":"Placing the main control valve below the frost line lets the barrel drain after use so no water is left standing to freeze. That is the dry barrel design.","optionNotes":["Correct. The below-frost-line main valve between footpiece and barrel is the definition in §3.3.13.1.","A wet barrel hydrant (§3.3.13.5) is intended for locations with no danger of freezing, and each of its outlets is provided with its own valve — the barrel stays charged.","A dry hydrant (§3.3.13.2) is not connected to a piped, pressurized supply at all; it is an arrangement of pipe to a water source that apparatus can draft from. Similar name, completely different device.","A wall hydrant (§3.3.13.4) is mounted on the outside of a building wall, fed from interior piping, with controls inside the building that are normally key-operated from the exterior."]},{"deck":"testing","system":"Fire Pump","frequency":"","drill":false,"question":"As NFPA 25 uses the term for annual fire pump testing, \"peak load\" refers to which of the following?","options":["The maximum power required to drive the pump at any flow rate up to 150 percent of rated capacity","The power required to drive the pump at exactly 100 percent of rated capacity","The maximum power required to drive the pump at any flow rate up to 100 percent of rated capacity","The power drawn by the driver while the pump is running at churn"],"correctIndex":0,"citation":"NFPA 25 (2020) §3.6.2.5","explanation":"Peak load is a driver-power concept, and the standard bounds it at any flow rate up to 150 percent of rated capacity — which is why the annual test is run out to that point.","optionNotes":["Correct. Maximum power at any flow rate up to 150 percent of rated capacity (flow) is the published definition for annual testing.","100 percent of rated flow is the rated point, but driver demand normally keeps climbing beyond it. Stopping there understates peak load.","This truncates the range at the rated point. The definition specifically extends to 150 percent of rated capacity.","Churn is the no-flow condition (§3.6.2.4), where the only water moving is through the circulation relief valve or driver cooling. Driver power at churn is the low end of the curve, not the peak."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"A single-family home has a sprinkler system that was designed and installed to NFPA 13D. The owner asks whether NFPA 25 governs its inspection, testing, and maintenance. What is the correct answer?","options":["NFPA 25 applies to it in full, exactly as it would to any NFPA 13 system","NFPA 25 does not apply to it unless Chapter 16 of NFPA 25 requires it","NFPA 25 applies only to the water supply serving the system, not the sprinklers","NFPA 25 applies only if the local AHJ has specifically adopted it for dwellings"],"correctIndex":1,"citation":"NFPA 25 (2020) §1.1.5","explanation":"The scope carves 13D systems out: NFPA 25 does not reach a system designed, installed, and maintained to NFPA 13D unless Chapter 16 pulls it in. So for a dwelling system the starting assumption is that the rest of NFPA 25 does not govern it — but you have to actually check Chapter 16 before concluding NFPA 25 is silent.","optionNotes":["Wrong. The standard explicitly excludes 13D systems from general application; treating a dwelling system like a 13 system would impose ITM the standard never intended.","Correct. The exclusion is conditional, and the condition is Chapter 16 — which is exactly the sub-clause candidates forget.","Wrong. There is no partial water-supply-only carve-in for 13D; the exclusion is at the system level, subject only to Chapter 16.","Wrong. AHJ adoption is not the trigger stated in the scope. The AHJ does have separate authority to require more ITM where a distinct hazard exists (§1.2.2), but that is a different provision."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"While performing an annual sprinkler inspection, a technician suspects the remote area used in the original hydraulic design was too small for the current layout. Under NFPA 25, what is the technician's obligation regarding the system's design?","options":["The technician must recalculate the remote area and document whether the design is adequate","The technician is not required by this standard to verify that the design itself is adequate","The technician must red-tag the system as impaired until a designer verifies the calculations","The technician must compare the design against the current edition of NFPA 13 and report deficiencies"],"correctIndex":1,"citation":"NFPA 25 (2020) §1.1.3, §1.1.3.1","explanation":"NFPA 25 addresses the operating condition of systems that were properly installed in the first place. It does not put design verification on the inspector. Design adequacy becomes an issue through a different door — the hazard-evaluation duty placed on the owner when occupancy, storage, or water supply changes.","optionNotes":["Wrong. Recalculating hydraulics is design work, not the periodic ITM this standard requires of the inspector.","Correct. The standard expressly does not require the inspector to verify design adequacy.","Wrong. An impairment tag is for a system that is out of service or not functioning as intended, not for a suspicion about the original design.","Wrong. NFPA 25 does not require retroactive comparison to the current installation standard during routine ITM."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"An AHJ inspects a warehouse and concludes the stored commodity creates a distinct hazard to life and property. She wants sprinkler ITM performed more often than NFPA 25 requires. Is she permitted to do that?","options":["No — NFPA 25 frequencies are maximums and minimums both; only the technical committee can change them","Yes — where an existing situation involves a distinct hazard to life or property, the AHJ may require ITM in excess of the standard","Yes, but only if the owner agrees in writing to an approved performance-based program","No — she must instead require the system to be redesigned to the current installation standard"],"correctIndex":1,"citation":"NFPA 25 (2020) §1.2.2","explanation":"NFPA 25 sets a floor, not a ceiling. When the AHJ determines an existing condition presents a distinct hazard to life or property, she is permitted to require inspection, testing, and maintenance beyond what the standard calls for.","optionNotes":["Wrong. The standard's requirements are minimums; the purpose statement frames them as minimum ITM methods.","Correct. The AHJ's authority to exceed the standard is tied specifically to a determination of distinct hazard to life or property.","Wrong. A performance-based program (§4.7) is a separate pathway for an approved alternative program; it is not the mechanism for the AHJ to increase frequencies.","Wrong. Requiring more frequent ITM and requiring a redesign are different actions; §1.2.2 grants the former."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"A large corporate owner runs a proprietary ITM program that he believes gives equal or better system integrity than NFPA 25. What does the standard require before that program can be used?","options":["Nothing — alternative programs of equivalent integrity are automatically acceptable","The AHJ must be consulted and approval for the alternative program obtained","The program must first be listed by a nationally recognized testing laboratory","The program must be submitted to NFPA for a formal interpretation"],"correctIndex":1,"citation":"NFPA 25 (2020) §1.3.1, §1.3.2","explanation":"The standard does not intend to block other ITM programs that deliver an equivalent level of system integrity and performance. But the application section attaches a condition: the AHJ has to be consulted and has to approve. Equivalence alone is not enough — approval is the gate.","optionNotes":["Wrong. This is the trap: §1.3.1 permits alternatives, but reading it alone skips the approval requirement in the very next paragraph.","Correct. Consultation with and approval by the AHJ is the stated condition for an alternative program.","Wrong. Listing applies to devices and equipment, not to an owner's ITM program.","Wrong. Formal interpretations are an NFPA administrative process, not a prerequisite for an alternative program."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"A requirement in NFPA 25 is printed as a value in U.S. customary units followed by a metric value in parentheses. Which value is the actual requirement?","options":["The metric value, since the standard uses SI as its base measurement system","The first value stated; the value that follows it is to be treated as approximate","Whichever value is more restrictive in the given situation","Both are equally binding and must both be satisfied exactly"],"correctIndex":1,"citation":"NFPA 25 (2020) §1.4, §1.4.1","explanation":"NFPA 25 expresses metric units using SI, but when a measurement is printed with an equivalent in other units, the first-stated value is the requirement and the equivalent is approximate. That is why a converted number can look slightly rounded — conversions are rounded to an appropriate number of significant digits.","optionNotes":["Wrong. SI is the metric system the standard uses, but that does not make the parenthetical metric value the governing one.","Correct. The first stated value governs; the equivalent that follows is approximate.","Wrong. The standard resolves this by print order, not by which number happens to be more restrictive.","Wrong. Treating an approximate converted value as an exact requirement misapplies §1.4.1."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"A preaction system's releasing detection is being serviced. Which standard governs the inspection and testing of the electrical components of that automatic fire detection equipment?","options":["NFPA 25, because the detection activates a water-based system","NFPA 72 — NFPA 25 does not address all ITM of those electrical detection components","NFPA 70E, because the components are electrical","Whichever standard the servicing contractor's license covers"],"correctIndex":1,"citation":"NFPA 25 (2020) §1.1.1.1,

y; the standard provides the bypass as the sanctioned alternative.","The main drain test is its own procedure under Chapter 13; it is not the substitute the standard names here.","The standard provides an alternative method rather than a waiver."]},{"deck":"testing","system":"Sprinkler","frequency":"","drill":false,"question":"You are testing a vane-type waterflow alarm device on a wet pipe system, and the device is not one that is listed with an integral automated test feature. How much water has to move past the flow switch?","options":["Roughly what a single sprinkler would put out, benchmarked to the lowest k-factor sprinkler on that system — or less","Whatever the highest k-factor sprinkler on the system would discharge","Whatever two sprinklers operating at once would discharge","A full main drain flow"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.3.4, with the exception at §5.3.3.4.1","explanation":"The point of the test is to prove the switch will pick up the smallest credible fire flow — one sprinkler, and specifically the one with the lowest k-factor on that system. If the device alarms at that flow it will alarm at anything larger. NFPA 25 (2020) §5.3.3.4 also carves out devices listed with an integral automated test feature under §5.3.3.4.1, which is why the question rules that case out.","optionNotes":["Correct — benchmark to the lowest k-factor sprinkler on the system, or less.","Testing at the highest-flow sprinkler proves nothing about whether the device detects the least-flow condition.","The criterion is built around a single sprinkler, not two.","Main drain flow is far above the single-sprinkler criterion and tells you nothing about the device's sensitivity."]},{"deck":"testing","system":"Sprinkler","frequency":"Every 3 years","drill":true,"question":"A vane-type waterflow alarm device is being tested semiannually using circulated water. What additional requirement applies?","options":["It shall also be tested by opening the inspector's test connection at a minimum frequency of once every 3 years","No additional testing is required — circulated water satisfies the requirement entirely","It shall also be tested by opening the inspector's test connection annually","It shall also receive a main drain test quarterly"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.3.4.2","explanation":"Circulated water and integral automated test features prove the device functions, but they do not prove water actually reaches the remote end of the system. Opening the inspector's test connection at least once every 3 years closes that gap.","optionNotes":["Correct — a real inspector's test connection flow at least once every 3 years.","Circulated water alone does not satisfy the requirement; a periodic real flow test is still required.","The required minimum for the inspector's test connection under this provision is once every 3 years, not annually.","The main drain test is a separate Chapter 13 requirement and is not what §5.3.3.4.2 calls for."]},{"deck":"general","system":"Fire Pump","frequency":"","drill":false,"question":"Waterflow alarm testing on a system fed by a fire pump is scheduled. What does NFPA 25 Chapter 5 say about taking the fire pump out of service during that testing?","options":["Leave the pump in service unless a qualified person stays with it the entire time, or every impairment step in Chapter 15 is carried out","The pump shall always be taken out of service to prevent an unintended start","The pump may be taken out of service for up to 4 hours without any further measures","The pump may be taken out of service if the fire department is notified"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.3.5","explanation":"Pulling the pump strips the building of its water supply boost for the duration of the test. NFPA 25 (2020) §5.3.3.5 allows it only two ways: someone qualified stays with the pump continuously, or the building goes through the full impairment program in Chapter 15.","optionNotes":["Correct — continuous qualified attendance, or the complete Chapter 15 impairment process.","The standard's default is that the pump stays in service, not that it comes out.","There is no blanket 4-hour allowance in §5.3.3.5.","Notifying the fire department is one piece of an impairment program, but on its own it does not satisfy the requirement."]},{"deck":"testing","system":"Sprinkler","frequency":"Annually","drill":true,"question":"When must antifreeze solution be tested under NFPA 25?","options":["Annually, before the onset of freezing weather","Annually, at any convenient time during the year","Semiannually — once before and once after the freezing season","Every 3 years, before the onset of freezing weather"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.4 and Table 5.1.1.2","explanation":"The timing matters as much as the interval. Testing after the cold has already arrived does nothing to prevent a frozen, burst system — the standard requires the annual test before freezing weather begins.","optionNotes":["Correct — annual, and specifically before freezing weather sets in.","The standard is explicit about doing it before the onset of freezing weather, not at an arbitrary point in the year.","The requirement is annual, not semiannual.","Three years is the minimum inspector's test connection frequency for certain vane-type waterflow devices, not the antifreeze test interval."]},{"deck":"testing","system":"Sprinkler","frequency":"","drill":false,"question":"During the annual antifreeze procedure you cannot reliably determine what type of antifreeze is in the system from the sign, installation records, maintenance records, or chemical tests. What does NFPA 25 require?","options":["The system shall be drained completely and the antifreeze replaced with an acceptable solution","Samples shall be taken and, if the freeze point is adequate, the solution shall be left in place","The solution shall be topped off with a listed premixed antifreeze to dilute the unknown","The system shall be converted to a dry pipe system"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.4(1)(b)","explanation":"An unknown antifreeze is treated the same as a prohibited one. If you cannot establish what is in the pipe, you drain it completely and refill with an acceptable solution — freeze-point testing alone does not tell you whether the fluid is combustible or permitted.","optionNotes":["Correct — drain completely and replace with an acceptable solution.","A passing freeze point does not resolve the real concern, which is whether the fluid type itself is permitted.","Topping off does not establish the identity of the existing fluid; complete drainage is required.","Conversion to a dry system is not the remedy §5.3.4 specifies."]},{"deck":"testing","system":"Sprinkler","frequency":"","drill":false,"question":"Where the antifreeze solution is not being replaced, where must test samples be taken?","options":["At the top and the bottom of each system, plus the most remote portion and the water supply connection if those are not near the top or bottom","At the inspector's test connection only","At the riser only, since the solution is circulated","At the bottom of each system only, since the heavier solution settles"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.4(2)(a) and (b)","explanation":"Antifreeze can stratify and can be diluted where it meets the wet system, so a single sample proves nothing. The baseline is top and bottom of each system, with extra samples at the most remote portion and at the water supply connection whenever those points are not already covered.","optionNotes":["Correct — top and bottom of each system, plus the most remote portion and the water supply connection when not already sampled.","A single inspector's test connection sample cannot detect stratification or dilution elsewhere in the system.","A riser-only sample misses the remote portion where dilution and freezing risk are highest.","Bottom-only sampling misses the top of the system, which the standard specifically requires."]},{"deck":"testing","system":"Sprinkler","frequency":"","drill":false,"question":"What instrument does NFPA 25 require for checking the specific gravity of an antifreeze sample?","options":["Either a hydrometer carrying an appropriate scale, or a refractometer set up for the particular antifreeze being checked","A digital thermometer placed in the sample","A pressure gauge reading at the sample point","Litmus test strips rated for glycol"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.4(3)","explanation":"NFPA 25 (2020) §5.3.4(3) accepts two instruments for checking specific gravity, and calibration is the part people skip: the hydrometer's scale has to suit the solution, and the refractometer's scale has to be calibrated for the specific antifreeze in the system.","optionNotes":["Correct — a suitably scaled hydrometer, or a refractometer calibrated for that antifreeze.","Temperature alone tells you nothing about concentration or freeze point.","Pressure has no relationship to antifreeze concentration.","Litmus strips read pH, not specific gravity or concentration."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"A listed CPVC sprinkler pipe and fitting system needs freeze protection. What does NFPA 25 permit?","options":["Glycerine only — diethylene, ethylene, and propylene glycols are specifically prohibited","Propylene glycol only","Any listed premixed antifreeze solution","Ethylene glycol, provided the concentration stays at or below 30 percent"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.4.3.1 and §5.3.4.3.1.1","explanation":"Glycols attack CPVC. The standard permits glycerine alone for listed CPVC pipe and fittings and names diethylene, ethylene, and propylene glycols as specifically prohibited in that application.","optionNotes":["Correct — glycerine only for listed CPVC.","Propylene glycol is one of the three glycols specifically prohibited for use with listed CPVC.","Being listed as an antifreeze does not make a solution compatible with CPVC; the glycols are prohibited regardless.","Ethylene glycol is specifically prohibited with listed CPVC at any concentration."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"An antifreeze system needs to be refilled with a new solution. What does NFPA 25 require of the newly introduced solution?","options":["It shall be a factory premixed antifreeze solution","It may be mixed on site provided the final concentration is verified with a refractometer","It may be mixed on site provided a qualified person supervises the batching","It shall be mixed on site to match the existing solution's specific gravity"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.4.4.2","explanation":"Site mixing produced inconsistent and sometimes dangerously rich solutions, so the standard now requires newly introduced solutions to be factory premixed — chemically pure or United States Pharmacopeia 96.5 percent.","optionNotes":["Correct — newly introduced solutions must be factory premixed.","Field verification of concentration does not substitute for the factory premix requirement.","Supervision does not create an exception to the factory premix requirement.","Matching an existing solution by site mixing is precisely what the factory premix rule is written to prevent."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"A sprinkler is removed from a system so an overhead duct can be installed, and is undamaged. What does NFPA 25 require?","options":["It shall not be reinstalled","It may be reinstalled if it passes a visual inspection","It may be reinstalled if it is less than 10 years old","It may be reinstalled anywhere in the same system, but not in a different system"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.4.1.1 and Table 5.1.1.2","explanation":"This one is absolute: a sprinkler removed for any reason is never put back. Wrenching a sprinkler out can distort the seat and stress the operating element in ways no field inspection will catch.","optionNotes":["Correct — removed means retired, for any reason.","A visual inspection cannot detect the internal damage that removal can cause.","Age is irrelevant; the prohibition applies to any removed sprinkler.","The prohibition is on reinstallation anywhere, not just in a different system."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"Which characteristics must a replacement sprinkler match, per NFPA 25?","options":["Style, orifice size and K-factor, temperature rating, coating if any, deflector type, and design requirements","Temperature rating and K-factor only","Manufacturer and model number only","Orifice size and thread size only"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.4.1.2","explanation":"The standard lists six characteristics the replacement must carry: style, orifice size and K-factor, temperature rating, coating if any, deflector type (upright, pendent, sidewall), and design requirements.","optionNotes":["Correct — all six characteristics are specified.","Temperature and K-factor alone leave out style, coating, deflector type, and design requirements.","The standard is written around performance characteristics, not brand — the same manufacturer and model is not the criterion, and this list omits everything the standard names.","Thread size is not among the six listed characteristics, and this option omits temperature rating, coating, style, and deflector type."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"A quick-response sprinkler is damaged and must be replaced. What does NFPA 25 require of the replacement?","options":["Same orifice, size, temperature range, thermal response characteristics, and K-factor","Any standard-response sprinkler of the same K-factor","Any listed sprinkler of the same temperature rating","Same manufacturer, with thermal response left to the installer's judgement"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.4.1.4","explanation":"Special and quick-response sprinklers as defined by NFPA 13 have to be swapped like-for-like on five counts: orifice, size, temperature range, thermal response characteristics, and K-factor. Substituting a standard-response head into a quick-response design changes the whole basis of the protection, and a mismatched K-factor changes the hydraulics on top of that.","optionNotes":["Correct — all five characteristics have to match, K-factor included.","Substituting standard response for quick response defeats the design basis and is not permitted.","Matching temperature alone ignores orifice, size, thermal response, and K-factor.","Thermal response is explicitly required to match; it is not a judgement call."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"A facility has 1,400 installed sprinklers. What is the minimum number of spare sprinklers required on the premises?","options":["24","12","6","30"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.4.1.5.4","explanation":"The spare stock scales in three tiers: under 300 sprinklers means no fewer than 6 spares; 300 to 1000 means no fewer than 12; over 1000 means no fewer than 24. At 1,400 sprinklers the facility is in the top tier.","optionNotes":["Correct — over 1000 installed sprinklers requires no fewer than 24 spares.","Twelve is the minimum for facilities with 300 to 1000 sprinklers.","Six is the minimum for facilities with under 300 sprinklers, and is also the overall floor stated in §5.4.1.5.","Thirty is not a tier value in §5.4.1.5.4."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"Where must the stock of spare sprinklers be kept?","options":["In a cabinet located where the temperature will at no time exceed the maximum ceiling temperature listed for each sprinkler in the cabinet","In a cabinet at the main riser, regardless of ambient temperature","In any locked storage room on the premises","In the mechanical room, provided the room is under 100°F at all times"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.4.1.5.2 and Table 5.4.1.5.2","explanation":"Spares stored too warm can be pre-stressed or even operate in the cabinet. The temperature limit is tied to the maximum ceiling temperature column of Table 5.4.1.5.2 for the lowest-rated sprinkler stored there — for ordinary-rated sprinklers that ceiling is 100°F (38°C).","optionNotes":["Correct — the cabinet location is governed by the maximum ceiling temperature for the sprinklers stored in it.","Riser location alone does not satisfy the requirement; the temperature limit governs.","A locked room is not the criterion; a cabinet with a temperature limit is.","A flat 100°F limit happens to match ordinary-rated sprinklers but is not the rule — the limit varies by the temperature rating of the sprinklers in the cabinet."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"A building has pendent, upright, sidewall, and dry sprinklers installed, all from the same manufacturer. How many sprinkler wrenches must be in the spare cabinet?","options":["One wrench as specified by the manufacturer for each type of sprinkler installed","One wrench total, since all sprinklers are from the same manufacturer","Two wrenches, to allow two technicians to work simultaneously","One wrench for every 100 installed sprinklers"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.4.1.5.5","explanation":"The count is driven by sprinkler type, not by manufacturer or by installed quantity. Each type installed needs its own manufacturer-specified wrench in the cabinet so any sprinkler can be removed and replaced promptly.","optionNotes":["Correct — one manufacturer-specified wrench per type of sprinkler installed.","A single manufacturer often uses different wrenches for different sprinkler types; the requirement is per type.","The requirement is not about crew size.","Wrench count is not tied to the number of installed sprinklers — that is how spare sprinkler quantity is determined (§5.4.1.5.4)."]},{"deck":"general","system":"Sprinkler","frequency":"","drill":false,"question":"What must the list of sprinklers posted in the sprinkler cabinet include?","options":["The SIN if equipped (or manufacturer, model, orifice, deflector type, thermal sensitivity, and pressure rating), a general description, the quantity of each type to be in the cabinet, and the issue or revision date","Only the manufacturer and model of each sprinkler in the building","Only the quantity of each spare type and the date the cabinet was last stocked","The hydraulic design basis and the name of the installing contractor"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.4.1.5.6 and §5.4.1.5.6.1","explanation":"The posted list has four required elements. The identification element accepts the sprinkler identification number where the sprinkler has one; where it does not, the manufacturer, model, orifice, deflector type, thermal sensitivity, and pressure rating must all be shown.","optionNotes":["Correct — identification, general description, quantity of each type, and issue or revision date.","Manufacturer and model alone omits description, quantity, and the revision date, and does not cover the SIN alternative.","Quantity plus a stocking date omits the sprinkler identification and general description elements.","Hydraulic design information belongs on the hydraulic design information sign at the riser (§5.2.5), not on the spare sprinkler list."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"A facility manager asks whether the sprinklers in a newly renovated lobby can be sprayed to match the ceiling color. What does NFPA 25 say?","options":["Once a sprinkler leaves the factory it cannot be modified, decorated, painted, or coated in any way","It is acceptable if only the frame arms and not the deflector are painted","It is acceptable if a paint listed as low-heat-capacity is used","It is acceptable if the sprinklers are painted before being installed"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.4.1.6","explanation":"Anything applied to a sprinkler after it ships from the place of manufacture — paint, coatings, decorative ornamentation, or any other alteration — is prohibited under NFPA 25 (2020) §5.4.1.6. Because the cutoff is factory shipment rather than installation, painting the heads on the ground before they go up is no better than spraying them in place.","optionNotes":["Correct — no alteration, ornamentation, paint, or coating once the sprinkler has shipped from the factory.","The prohibition covers the sprinkler, not just the deflector.","No field-applied paint product creates an exception.","Painting before installation is still after shipment from the manufacturer, so it is still prohibited."]},{"deck":"maintenance","system":"Sprinkler","frequency":"Annually","drill":true,"question":"Sprinklers and automatic spray nozzles protect a commercial kitchen cooking line and its ventilating system. What does NFPA 25 require?","options":["Replace them annually, except that bulb-type sprinklers and nozzles need not be replaced if the annual examination shows no buildup of grease or other material","Replace them annually with no exceptions","Replace them every 5 years","Clean them annually and replace them every 10 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.4.1.7 and §5.4.1.7.1","explanation":"The baseline is annual replacement because grease loading defeats the thermal element. The one relief is for automatic bulb-type sprinklers and spray nozzles: if the annual examination shows no grease or other material buildup, replacement is not required.","optionNotes":["Correct — annual replacement with a documented exception for clean bulb-type sprinklers and nozzles.","The bulb-type exception in §5.4.1.7.1 is real, so an unqualified 'no exceptions' answer is wrong.","Five years is a sprinkler sampling interval for other categories, not the commercial cooking replacement interval.","The standard does not offer a clean-and-defer program for cooking-area sprinklers."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"Sprinklers protecting a resin mixing room are installed with protective coverings against overspray. What coverings does NFPA 25 permit?","options":["Cellophane bags 0.003 in. (0.076 mm) thick or less, or thin paper bags","Any plastic bag secured with a wire tie","Heavy-gauge polyethylene sleeves","Aluminum foil wraps"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.4.1.9.2","explanation":"The covering has to burn or fall away instantly so it does not delay operation. That is why the standard names a specific maximum cellophane thickness — 0.003 in. — or thin paper.","optionNotes":["Correct — thin cellophane at 0.003 in. or less, or thin paper bags.","Plastic bag material and thickness matter; the standard names cellophane at a specific maximum thickness.","Heavy-gauge material would delay or prevent operation and exceeds the permitted thickness.","Foil is not a permitted covering and would shield the thermal element from heat."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"A dry pipe system is out of service waiting on a replacement dry valve trim part during mild spring weather. What does NFPA 25 permit?","options":["The system may be left wet, since removing it from service while waiting for parts is the only other option — but not in refrigerated spaces or areas maintained at or below 40°F (4°C)","The system may be left wet indefinitely as long as the weather stays above freezing","The system must be left dry and out of service until the part arrives","The system may be left wet in any area, including refrigerated spaces, if the freeze protection is monitored"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.4.2, §5.4.2.1, and §5.4.2.2","explanation":"Dry pipe systems are to be kept dry at all times. The narrow relief applies during nonfreezing weather and only where the alternative is having the system out of service — and refrigerated spaces or interior areas held at or below 40°F (4°C) are carved out of that relief entirely.","optionNotes":["Correct — the relief exists during nonfreezing weather when the alternative is out of service, and excludes refrigerated and sub-40°F areas.","There is no indefinite allowance; the relief is tied to repair or parts-wait activities.","Leaving the system out of service is precisely the outcome the relief is written to avoid.","Refrigerated spaces and interior areas at or below 40°F (4°C) are specifically not permitted to be left wet, monitored or not."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"A shipboard sprinkler system normally supplied with fresh water has had raw water introduced into it. What does NFPA 25 require?","options":["Drain and refill with fresh water, then drain and refill with fresh water again","Drain and refill with fresh water once","Flush the system until the discharge runs clear, with no drain-and-refill cycles required","Hydrostatically test the system at 200 psi before returning it to service"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.4.3","explanation":"Raw water leaves corrosive residue that a single flush will not clear. The standard requires two complete drain-and-refill cycles with fresh water after raw water has entered the system.","optionNotes":["Correct — two full drain-and-refill cycles with fresh water.","One cycle is insufficient; the standard calls for draining and refilling, then draining and refilling again.","Clear discharge is not the criterion; the standard prescribes the cycles.","A hydrostatic test is not what §5.4.3 requires for this condition."]},{"deck":"general","system":"Sprinkler","frequency":"","drill":false,"question":"A contractor replaces a run of sprinkler pipe and fittings that serves 34 sprinklers. What action does Table 5.5.1 require?","options":["A hydrostatic test in conformance with NFPA 13","Inspection for leaks at system working pressure","A main drain test only","An operational test of the waterflow alarm only"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 5.5.1","explanation":"The dividing line in Table 5.5.1 is 20 sprinklers. Work affecting not more than 20 sprinklers only needs an inspection for leaks at system working pressure; work affecting more than 20 requires a full hydrostatic test to NFPA 13.","optionNotes":["Correct — more than 20 sprinklers affected triggers the NFPA 13 hydrostatic test.","Inspecting for leaks at system working pressure is the required action when the work affects not more than 20 sprinklers.","A main drain test is the required action for main drain work and for auxiliary drain and inspector's test connection work, not for this.","Waterflow alarm operational testing is the action tied to waterflow alarm components, not to pipe and fitting replacement."]},{"deck":"general","system":"Sprinkler","frequency":"","drill":false,"question":"A system pressure gauge is replaced on a wet pipe sprinkler riser. What action does Table 5.5.1 require?","options":["Verify the gauge at 0 bar (0 psi) and at system working pressure","Perform a main drain test","Perform a hydrostatic test in conformance with NFPA 13","Perform an operational test using the inspector's test connection"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 5.5.1","explanation":"A replaced gauge has to be proven at both ends of its useful reading range — at zero and at the actual system working pressure — so you know it is not reading high or low in service.","optionNotes":["Correct — verify at 0 psi and at system working pressure.","The main drain test is the action tied to main drain, auxiliary drain, and inspector's test connection work.","A hydrostatic test to NFPA 13 is the action for pipe and fittings affecting more than 20 sprinklers.","Testing through the inspector's test connection is the action for vane-type waterflow, pressure switch-type waterflow, and water motor gong work."]},{"deck":"general","system":"Sprinkler","frequency":"","drill":false,"question":"After a sprinkler system component is repaired and the Table 5.5.1 action is performed, what does NFPA 25 say about design review?","options":["None is called for — design review falls outside what this standard covers","A design review is required whenever more than 20 sprinklers are affected","A design review is required for any component replacement","A design review is required only where the original installation standard differs from the cited standard"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.5.3","explanation":"NFPA 25 governs inspection, testing, and maintenance of a system that already exists. The component action requirements in Table 5.5.1 exist to confirm the repaired or replaced component works — per NFPA 25 (2020) §5.5.3 they are not a trigger to re-evaluate the system's hydraulic design, which belongs to the installation standard instead.","optionNotes":["Correct — component actions do not trigger a design review; that sits outside this standard's scope.","The 20-sprinkler threshold determines whether a hydrostatic test is required, not whether a design review is.","No component replacement under Table 5.5.1 triggers a design review.","Where the original installation standard differs from the cited standard, §5.5.2 permits using the appropriate installing standard — it does not create a design review requirement."]},{"deck":"testing","system":"Standpipe","frequency":"Every 5 years","drill":true,"question":"An automatic standpipe system is installed in a 12-story office building. How often does NFPA 25 require a flow test on that system?","options":["Quarterly","Annually","Every 5 years","Every 10 years"],"correctIndex":2,"citation":"NFPA 25 (2020) §6.3.1.1 and Table 6.1.1.2","explanation":"Automatic standpipe systems get a full flow test on a five-year cycle to confirm the required flow and pressure are actually available at the hydraulically most remote hose valve outlet while the system demand is flowing. The five-year interval appears both in the Chapter 6 summary table and in the body text.","optionNotes":["Quarterly is the interval for hose house inspections and dry hydrant inspections in Chapter 7 — it is not a standpipe flow test interval.","Annual is the interval for the visual component inspections in Chapter 6 (cabinet, hose, piping, signs) and for private hydrant flow testing, not for the standpipe system flow test.","Correct — the standpipe flow test rides a five-year cycle, the same cycle as the standpipe hydrostatic test for manual and semiautomatic dry systems.","Ten years is not the interval given for the standpipe flow test anywhere in Chapter 6."]},{"deck":"testing","system":"Standpipe","frequency":"","drill":false,"question":"You are setting up the five-year flow test on a Class I standpipe system that has three standpipes. What flow must be developed to satisfy the system demand requirement?","options":["500 gpm from the most remote standpipe only","500 gpm from the most remote standpipe plus 250 gpm from each additional standpipe, flowed simultaneously up to the total system demand","250 gpm from each of the three standpipes, flowed one at a time","100 gpm from the most remote hose connection"],"correctIndex":1,"citation":"NFPA 25 (2020) §6.3.1.2","explanation":"For Class I and Class III systems, the demand starts at 500 gpm for the hydraulically most remote standpipe and adds 250 gpm for every additional standpipe, with the flows running at the same time until the total system demand is being delivered. The 250 gpm from each additional standpipe may be taken from whichever hose valve on that standpipe is most convenient.","optionNotes":["Flowing only the most remote standpipe understates the demand — the additional standpipes each add flow to the total the water supply has to deliver.","Correct — 500 gpm for the most remote standpipe, 250 gpm added for each additional standpipe, flowed simultaneously.","The 250 gpm figure applies only to the ADDITIONAL standpipes, not to the most remote one, and the flows must be simultaneous rather than sequential — sequential flowing would not load the supply the way the design intends.","100 gpm at the most remote hose connection is the Class II standpipe system demand, not Class I."]},{"deck":"testing","system":"Standpipe","frequency":"","drill":false,"question":"A building is protected by a Class II standpipe system. What system demand does NFPA 25 use for its flow test?","options":["100 gpm at the most remote hose connection","250 gpm at the most remote hose connection","500 gpm at the most remote hose connection","500 gpm plus 250 gpm for each additional standpipe"],"correctIndex":0,"citation":"NFPA 25 (2020) §6.3.1.3","explanation":"Class II systems are intended for occupant use with small hose, so the demand used for the flow test is much smaller than a Class I or Class III system — the standard sets it at the most remote hose connection.","optionNotes":["Correct — the Class II standpipe system demand is based on the most remote hose connection.","250 gpm is the additional-standpipe increment for Class I and Class III systems, not the Class II demand.","500 gpm is the demand for the most remote standpipe on a Class I or Class III system, not Class II.","That is the full Class I/Class III demand formula; Class II uses a single, much smaller figure."]},{"deck":"testing","system":"Standpipe","frequency":"Every 5 years","drill":false,"question":"Which standpipe systems are subject to the five-year hydrostatic test required by Chapter 6?","options":["All standpipe systems, regardless of type","Automatic wet standpipe systems only","Manual and semiautomatic dry standpipe systems, together with the fire department connection piping that serves them","Class II systems only"],"correctIndex":2,"citation":"NFPA 25 (2020) §6.3.2.1","explanation":"The five-year hydrostatic test targets standpipes that do not normally sit full of water under pressure — manual systems and semiautomatic dry systems — plus the fire department connection piping serving them. Systems that are constantly wet and pressurized reveal leaks on their own.","optionNotes":["Overbroad — the requirement names specific system types rather than every standpipe.","Backwards: automatic wet systems are the ones NOT named in this hydrostatic test requirement.","Correct — manual and semiautomatic dry standpipe systems, and the requirement expressly reaches the fire department connection piping. Note the further carve-out in 6.3.2.1.1 for manual wet standpipes in a combined sprinkler/standpipe system.","Class designation (I, II, III) is about hose size and intended user; this hydrostatic test requirement is keyed to whether the system is manual or semiautomatic dry, not to its class."]},{"deck":"testing","system":"Standpipe","frequency":"Every 5 years","drill":false,"question":"A manual standpipe system has a maximum system pressure of 100 psi. What is the minimum hydrostatic test pressure and duration for its five-year test?","options":["150 psi for 1 hour","200 psi for 2 hours","200 psi for 1 hour","50 psi above the maximum pressure, for 2 hours"],"correctIndex":1,"citation":"NFPA 25 (2020) §6.3.2.1","explanation":"The baseline hydrostatic test is a floor value held for a set duration. The alternative pressure calculation only kicks in once the system's maximum pressure climbs past a threshold — at 100 psi maximum, this system stays on the baseline.","optionNotes":["Both the pressure and the duration are short of what the standard requires for this test.","Correct — this is the baseline hydrostatic test value and hold time for a system whose maximum pressure does not exceed the threshold.","The pressure is right but the hold time is only half of what the standard requires.","The 'add 50 psi to the maximum' method is the alternative used only when maximum pressure exceeds 150 psi. This system's maximum is 100 psi, so the baseline applies — and 50 psi over 100 psi would be well below the baseline anyway."]},{"deck":"testing","system":"Standpipe","frequency":"Every 5 years","drill":false,"question":"A semiautomatic dry standpipe zone in a high-rise has a maximum pressure of 175 psi. What hydrostatic test pressure applies?","options":["200 psi","225 psi","175 psi","350 psi"],"correctIndex":1,"citation":"NFPA 25 (2020) §6.3.2.1","explanation":"Once a system's maximum pressure exceeds 150 psi, the flat baseline test pressure is no longer adequate, so the standard switches to a margin above the actual maximum pressure the system sees. Applying that margin to a 175 psi maximum gives the answer. The hold time does not change.","optionNotes":["200 psi is the baseline test pressure, which applies only when the system's maximum pressure does not exceed 150 psi. This system is above that threshold, so the margin method controls.","Correct — the required margin above the 175 psi maximum lands the test pressure here.","Testing at the maximum operating pressure provides no margin at all; the standard requires the test to exceed the maximum pressure.","Doubling the maximum pressure is not the method the standard uses and would risk damaging the system."]},{"deck":"testing","system":"Standpipe","frequency":"","drill":false,"question":"A manual wet standpipe is part of a combined sprinkler/standpipe system. How does the five-year hydrostatic test requirement apply to it?","options":["It is not required to be hydrostatically tested under that requirement","It must be tested at 200 psi for 2 hours like any other manual standpipe","It must be tested, but only at the low point of the building","It must be tested annually instead of every 5 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §6.3.2.1.1","explanation":"This is a specific carve-out. A manual wet standpipe that is part of a combined sprinkler/standpipe arrangement is exempted from the five-year hydrostatic test, because it is a wet, pressurized system whose integrity is demonstrated through normal operation and sprinkler system ITM.","optionNotes":["Correct — the standard expressly relieves this arrangement from the five-year hydrostatic test.","This ignores the exception; a technician who missed the sub-clause would scope a hydrostatic test the standard does not require.","Measuring at the low elevation point is the rule for WHERE test pressure is read when a hydrostatic test is required — it does not create a testing obligation for an exempted system.","There is no annual hydrostatic test in Chapter 6 for any standpipe type."]},{"deck":"testing","system":"Standpipe","frequency":"","drill":false,"question":"When a standpipe zone is hydrostatically tested, where is the test pressure required to be measured?","options":["At the roof manifold of the zone","At the fire department connection","At the low elevation point of the individual system or zone being tested","At the pressure-reducing valve nearest the midpoint of the zone"],"correctIndex":2,"citation":"NFPA 25 (2020) §6.3.2.2","explanation":"Static head means pressure varies by elevation within a standpipe. The standard fixes the measurement location at the bottom of the system or zone under test so the whole zone is proven at or above the required pressure, and it further requires that the inside standpipe piping show no leakage.","optionNotes":["Reading at the top of the zone would understate pressure relative to the rest of the zone because of elevation loss and would not establish the required pressure throughout.","The fire department connection is included in the piping being tested on manual and semiautomatic dry systems, but it is not the specified measurement point.","Correct — the reading is taken at the low elevation point of the individual system or zone under test.","Pressure-reducing valves are inspected, tested, and maintained under Chapter 13; they are not the reference point for hydrostatic test measurement."]},{"deck":"testing","system":"Standpipe","frequency":"","drill":false,"question":"Before introducing water into a standpipe system for testing in a building where water damage is a real possibility, NFPA 25 directs the technician to do what first?","options":["Conduct an air test on the system at 25 psi","Conduct an air test on the system at 40 psi","Conduct a hydrostatic test at 200 psi","Notify the AHJ in writing and proceed with water"],"correctIndex":0,"citation":"NFPA 25 (2020) §6.3","explanation":"A low-pressure air test is a cheap way to find an open drain, missing cap, or unrepaired break before water goes in and ruins a tenant space. The standard sets a specific low test pressure for this precaution.","optionNotes":["Correct — a low-pressure air test at the value stated in the standard is conducted before water is introduced where water damage is possible.","40 psi is a plausible-sounding pneumatic value but is not the figure the standard sets for this precautionary air test.","A hydrostatic test uses water, which is exactly what this precaution is trying to keep out of the building until the system is proven tight.","Notification does not substitute for the physical precaution the standard requires."]},{"deck":"inspection","system":"Standpipe","frequency":"Annually and after each use","drill":true,"question":"How often must hose nozzles on a standpipe hose station be inspected?","options":["Annually only","Annually and after each use","Quarterly","Semiannually and after each use"],"correctIndex":1,"citation":"NFPA 25 (2020) Table 6.1.1.2 and §6.2.6.1","explanation":"Nozzles get an inspection on the routine annual cycle, and the standard adds a trigger-based inspection any time the nozzle is actually used — because use is exactly when gaskets get lost, threads get damaged, and debris gets caught. Inspectors look for a missing nozzle, a missing or deteriorated gasket, obstructions, and a nozzle that does not operate smoothly.","optionNotes":["The annual cycle is right, but the summary table adds a second trigger the technician has to catch.","Correct — the routine annual inspection plus an inspection after each use.","Quarterly is the Chapter 7 interval for hose houses and dry hydrants, not for standpipe hose nozzles.","Semiannual is the Chapter 7 monitor nozzle inspection interval; standpipe hose nozzles are on the annual cycle."]},{"deck":"inspection","system":"Standpipe","frequency":"","drill":false,"question":"During an annual inspection you find a hose rack enclosed in a cabinet that only swings out about 45 degrees before hitting the cabinet frame. What does NFPA 25 say about this?","options":["It is acceptable as long as the hose can still be pulled from the rack","It is a deficiency — the standard requires the rack to swing out at least 90 degrees","It is a deficiency only if the AHJ has previously cited it","It is acceptable for Class II systems and a deficiency only for Class I systems"],"correctIndex":1,"citation":"NFPA 25 (2020) §6.2.7.1(6) and §6.2.7.2","explanation":"A hose rack that cannot swing clear of the cabinet forces the hose to kink or bind on deployment. The standard lists a minimum swing angle among the hose storage device inspection conditions, and where any listed deficiency is found, corrective action is required.","optionNotes":["The standard sets an explicit minimum swing angle; 'the hose still comes out' is not the acceptance criterion.","Correct — the minimum swing-out angle is a listed inspection condition, and a deficiency requires corrective action.","The condition is a deficiency on its own terms; it does not require prior citation by the AHJ to become one.","Class designation does not change the hose storage device inspection conditions."]},{"deck":"inspection","system":"Standpipe","frequency":"","drill":false,"question":"A standpipe system in an older building was never sized by hydraulic calculation. What does NFPA 25 require regarding its hydraulic design information sign?","options":["No sign is required since there is no hydraulic design","The sign must be provided and must read \"Pipe Schedule System\"","The sign must state the AHJ's approved design flow and pressure","The sign must be removed to avoid confusion during a fire"],"correctIndex":1,"citation":"NFPA 25 (2020) §6.2.2.2","explanation":"Responding firefighters need to know how the system was sized. Rather than leaving a blank or missing sign, the standard requires a sign that plainly identifies the system as pipe-schedule-sized so nobody assumes a hydraulic design exists.","optionNotes":["A missing sign is exactly what the standard is trying to prevent — the absence of a hydraulic design does not excuse the absence of a sign.","Correct — the sign is still required and carries specific wording identifying the system as pipe schedule.","The standard specifies the wording for this case; it does not call for the AHJ to supply flow and pressure figures on the sign.","Removing the sign leaves responders with no information about how the system was sized."]},{"deck":"inspection","system":"Standpipe","frequency":"Annually","drill":false,"question":"During the annual inspection you find the hydraulic design information sign on a standpipe riser has faded to the point that it cannot be read. What does NFPA 25 require?","options":["Note it as an impairment and follow Chapter 15","Replace the sign","Record it as a non-deficiency observation since the data is available in the as-built drawings","Have the AHJ re-approve the system design"],"correctIndex":1,"citation":"NFPA 25 (2020) §6.2.2 and §6.2.2.1","explanation":"The annual sign inspection verifies three things: the sign is present, it is securely attached, and it is legible. A sign that fails any of those — missing or illegible — is replaced. This is a straightforward corrective action, not a system impairment.","optionNotes":["An unreadable sign does not take the system out of service, so the Chapter 15 impairment procedures are not what this triggers.","Correct — a missing or illegible sign is replaced.","The standard's inspection criteria are provided, attached securely, and legible; drawings in a file cabinet do not satisfy a legibility requirement at the riser.","Sign replacement is a component action that does not require a design review."]},{"deck":"general","system":"Standpipe","frequency":"","drill":false,"question":"A building owner, with the authority having jurisdiction's approval, removes the existing hose from all Class II hose stations. How should the inspector handle this on the report?","options":["Record it as a critical deficiency requiring immediate correction","Record it as a non-critical deficiency to be corrected within 90 days","It is permitted and shall not be recorded as a deficiency","Record it as an impairment under Chapter 15"],"correctIndex":2,"citation":"NFPA 25 (2020) §6.1.6","explanation":"Many jurisdictions have concluded that untrained occupants should not be pulling hose, so the standard allows existing hose to be removed when the AHJ approves — and expressly directs that the removal not be written up as a deficiency. The key is that the AHJ approval must actually exist.","optionNotes":["The standard specifically prevents this from being written as a deficiency once the AHJ has approved the removal.","Same problem — it is not a deficiency of any severity when AHJ approval is in hand.","Correct — with AHJ approval, removal of existing hose is permitted and is not recorded as a deficiency.","Nothing here places the system out of service, so the impairment procedures do not apply."]},{"deck":"testing","system":"Standpipe","frequency":"","drill":false,"question":"You are scheduling a standpipe flow test, but the hydraulically most remote hose valve outlet is behind a locked tenant space that cannot be accessed and has no safe discharge path. What does NFPA 25 direct you to do?","options":["Skip the flow test and note the reason on the report","Test at the closest accessible outlet and adjust the results by calculation","Consult the authority having jurisdiction to determine the appropriate location for the test","Perform a main drain test in place of the flow test"],"correctIndex":2,"citation":"NFPA 25 (2020) §6.3.1.1.1; §6.3.1.4.2","explanation":"The standard anticipates that the theoretically correct test point is sometimes unusable, and it puts the substitute location decision in the AHJ's hands rather than leaving it to the technician. The standard also directs that the actual test method and performance criteria be discussed with the AHJ in advance.","optionNotes":["Skipping the test entirely is not the remedy the standard provides.","Picking a substitute location yourself and back-calculating is not authorized — the standard assigns that decision to the AHJ.","Correct — where testing the most remote outlet is not practical, the AHJ is consulted for the appropriate location.","A main drain test is separately required on standpipe systems with automatic water supplies; it evaluates the supply connection and does not substitute for the five-year flow test."]},{"deck":"testing","system":"Standpipe","frequency":"","drill":false,"question":"Where is the main drain test performed on a standpipe system with an automatic water supply?","options":["At the roof manifold of the highest zone","At the low point drain for each standpipe, or at the main drain test connection where the supply main enters the building when one is provided","At the fire department connection","At the inspector's test connection of the associated sprinkler system"],"correctIndex":1,"citation":"NFPA 25 (2020) §6.3.1.6 and §6.3.1.6.1","explanation":"Standpipe systems with automatic supplies get a main drain test per Chapter 13, and Chapter 6 tells you where to perform it: the low point drain of each standpipe, or the dedicated main drain test connection at the point of building supply if the system has one. Pressure gauges meeting the Chapter 13 requirements have to be in place for the test.","optionNotes":["The roof manifold is a flow test consideration, not the main drain test location.","Correct — the low point drain for each standpipe, or the main drain test connection at the supply entrance when provided.","The fire department connection is an inlet, not a drain point, and is not where the main drain test is taken.","The sprinkler inspector's test connection is sized for a single sprinkler orifice and is used for waterflow alarm testing, not for a main drain test."]},{"deck":"testing","system":"Standpipe","frequency":"","drill":false,"question":"An older standpipe system's original design documents are gone and nobody can establish what the system was designed to deliver. How does NFPA 25 say to establish the standpipe system demand for the flow test?","options":["Use the current edition of NFPA 14 demand values in all cases","The authority having jurisdiction determines the standpipe system demand","Use 500 gpm at the most remote outlet as a universal default","The system cannot be tested until it is recalculated by a design professional"],"correctIndex":1,"citation":"NFPA 25 (2020) §6.3.1.4 and §6.3.1.4.1","explanation":"The baseline rule is that the demand is whatever the design criteria in effect at the time of installation called for — the standard does not retroactively upgrade old systems. When that demand cannot be determined, the decision falls to the AHJ.","optionNotes":["The standard bases the demand on the criteria in effect when the system was installed, not automatically on today's edition.","Correct — when the demand cannot be determined, the AHJ determines it.","500 gpm is the most-remote-standpipe figure in the Class I/III demand formula, not a universal default to apply when the design is unknown.","NFPA 25 does not condition testing on a new hydraulic design; it routes the unknown-demand situation to the AHJ."]},{"deck":"maintenance","system":"Standpipe","frequency":"","drill":false,"question":"A section of fire hose at a Class II station is taken out and replaced with new hose. According to the Chapter 6 component action requirements, what action is required?","options":["A hydrostatic test of the new hose in accordance with NFPA 1962","No action is required","A flow test of the standpipe system","A hydrostatic test of the standpipe piping in accordance with NFPA 14"],"correctIndex":1,"citation":"NFPA 25 (2020) Table 6.5.1","explanation":"The component action table splits fire hose into two rows. Hose that is REPAIRED gets a hydrostatic test per NFPA 1962, because a repair has to be proven. Hose that is simply REPLACED with new hose requires no action under this table — the new hose arrives already proven.","optionNotes":["That is the action for hose that has been REPAIRED, not hose that has been replaced — the table lists both cases separately and this is the classic trap.","Correct — replaced fire hose is listed in the table as requiring no action.","Flow testing the whole system is not triggered by swapping out a length of hose.","Hydrostatic testing of the piping per NFPA 14 is the action for adjusted, repaired, or replaced standpipe PIPING, not for hose."]},{"deck":"maintenance","system":"Standpipe","frequency":"","drill":false,"question":"A damaged section of standpipe piping is replaced. Under the Chapter 6 component action requirements, what must follow?","options":["A hydrostatic test in conformance with NFPA 14","A hydrostatic test in conformance with NFPA 24","An operational test using the inspector's test connection","Verification of the gauge at 0 psi and at system working pressure"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 6.5.1","explanation":"When standpipe piping is adjusted, repaired, or replaced, the component action table sends you to the installation standard for standpipes to hydrostatically prove the work. Note that a component action of this kind does not require a design review.","optionNotes":["Correct — standpipe piping work is proven by a hydrostatic test to the standpipe installation standard.","NFPA 24 is the private fire service main installation standard — that is the reference used in the Chapter 7 component action table for underground and exposed mains, not for standpipe piping.","Operational testing at the inspector's test connection is the listed action for waterflow devices such as pressure switch–type waterflow, vane-type waterflow, and the water motor gong.","Verifying a gauge at 0 psi and at system working pressure is the action listed for gauges."]},{"deck":"inspection","system":"Standpipe","frequency":"Annually","drill":false,"question":"During an annual cabinet inspection you find that the lock on a break-glass-type hose cabinet is not functioning properly and the glass break device is missing. What does NFPA 25 require?","options":["Nothing — these are convenience items, not required inspection points","Both are listed cabinet inspection conditions and appropriate corrective action must be taken","Only the missing break device matters; a non-functioning lock is a maintenance preference","The cabinet must be removed from service and the system declared impaired"],"correctIndex":1,"citation":"NFPA 25 (2020) §6.2.8.1 and §6.2.8.2","explanation":"The annual cabinet inspection has its own list of conditions, and a break-glass lock that does not work properly and a missing or unattached glass break device are both on it. The rule that follows the list is simple: any deficiency noted gets appropriate corrective action. The rest of the list covers the same theme — the cabinet has to open, stay intact, be identifiable as fire equipment, and leave the equipment inside reachable.","optionNotes":["Both conditions are expressly on the cabinet inspection list.","Correct — both are listed conditions and the standard requires appropriate corrective action when a deficiency is noted.","The lock on a break-glass-type cabinet not functioning properly is its own listed inspection condition, on equal footing with the missing break device.","A cabinet hardware deficiency does not by itself place the standpipe system out of service; the Chapter 15 impairment procedures apply when a system or portion of it is out of service."]},{"deck":"maintenance","system":"Standpipe","frequency":"","drill":false,"question":"A pressure gauge on a standpipe riser fails its inspection. What does NFPA 25 require for equipment that does not pass inspection or testing?","options":["It shall be repaired and tested again, or replaced","It shall be tagged and re-evaluated at the next annual inspection","It shall be replaced only if the AHJ requires it","It shall be adjusted in place and returned to service without retest"],"correctIndex":0,"citation":"NFPA 25 (2020) §6.4.2","explanation":"Chapter 6 states the rule in one line: equipment that fails gets fixed and re-proven, or it gets swapped out. The critical half that technicians drop is the retest — a repair is not finished until the repaired equipment is tested again.","optionNotes":["Correct — repair and retest, or replace.","Deferring a failure to the next annual cycle leaves known-bad equipment in service.","The obligation to repair-and-retest or replace does not depend on an AHJ directive.","Adjusting without retesting skips the verification step the standard requires."]},{"deck":"general","system":"Standpipe","frequency":"","drill":false,"question":"A standpipe zone must be shut down for three days for riser replacement, and separately a technician suspects the piping is fouled with tubercles. Which chapters does Chapter 6 direct you to?","options":["Chapter 15 for the shutdown and Chapter 14 for the obstruction investigation","Chapter 14 for the shutdown and Chapter 15 for the obstruction investigation","Chapter 13 for both","Chapter 4 for the shutdown and Chapter 13 for the obstruction investigation"],"correctIndex":0,"citation":"NFPA 25 (2020) §6.1.4 and §6.1.5","explanation":"Chapter 6 hands off two situations to other chapters. When standpipe ITM work results in or involves a system being out of service, the impairment procedures apply. When there is a need to investigate for internal obstruction, the obstruction investigation procedures apply. Chapter 6 also sends common components and valves to Chapter 13.","optionNotes":["Correct — out-of-service conditions follow the impairment chapter; obstruction investigations follow the obstruction chapter.","The two chapters are reversed.","Chapter 13 is where Chapter 6 sends common components and valves — it is not where impairments or obstruction investigations are handled.","Chapter 6 names neither of these chapters for these situations: it points to Chapter 15 for impairments and Chapter 14 for obstruction investigations."]},{"deck":"inspection","system":"Private Mains","frequency":"Each scheduled shutdown","drill":false,"question":"A section of exposed private fire service main piping runs through a process area that cannot be safely entered while the plant is operating. How does NFPA 25 handle its inspection?","options":["It is exempt from inspection because it is inaccessible","It is inspected during each scheduled shutdown","It is inspected annually using remote video equipment","It is inspected quarterly from outside the process area"],"correctIndex":1,"citation":"NFPA 25 (2020) §7.2.2.1.3","explanation":"The standard does not let inaccessibility become a permanent exemption. Instead it re-times the inspection to the plant's own scheduled shutdowns, when the area can be safely entered. Note this applies to piping inaccessible for safety reasons due to process operations, not merely piping that is inconvenient to reach.","optionNotes":["Inaccessibility does not remove the inspection obligation — it changes when the inspection happens.","Correct — piping inaccessible for safety reasons because of process operations is inspected during each scheduled shutdown.","The standard does not specify a remote inspection method here; it ties the inspection to shutdowns.","Quarterly is the interval for hose houses and dry hydrants, and inspecting from outside the area would not achieve the required examination for leaks, physical damage, corrosion, and restraint methods."]},{"deck":"inspection","system":"Private Mains","frequency":"After each system flow exceeding that of a nominal 2 in. orifice","drill":false,"question":"A private fire service main was flowed through a 4 in. main drain during testing. What does NFPA 25 require regarding the mainline strainer?","options":["Nothing — strainers are only serviced on the annual cycle","The strainer shall be inspected and cleaned, because the flow exceeded that of a nominal 2 in. orifice","The strainer shall be replaced after any flow event","The strainer shall be inspected only if the flow test showed reduced pressure"],"correctIndex":1,"citation":"NFPA 25 (2020) §7.2.2.3.1","explanation":"Flowing a main dislodges scale and debris that lands in the strainer. The standard sets a size threshold for the flow event that triggers strainer service — any system flow exceeding a nominal 2 in. orifice requires the strainer to be inspected and cleaned afterward. A 4 in. drain is well past that threshold.","optionNotes":["The annual removal and inspection is a separate, additional requirement — it does not replace the after-flow cleaning trigger.","Correct — the trigger is a system flow exceeding that of a nominal 2 in. orifice.","The standard calls for inspection and cleaning after a qualifying flow, not wholesale replacement.","The trigger is the size of the flow event, not whether a pressure problem showed up."]},{"deck":"inspection","system":"Private Mains","frequency":"Annually","drill":true,"question":"Beyond cleaning after significant flows, how often must a mainline strainer be removed and inspected?","options":["Quarterly","Semiannually","Annually","Every 5 years"],"correctIndex":2,"citation":"NFPA 25 (2020) §7.2.2.3.2 and Table 7.1.1.2","explanation":"The strainer comes out of the line on the annual cycle and is examined for plugging, fouling, and damaged and corroded parts. The summary table reinforces this by listing mainline strainers at annually and after each significant flow.","optionNotes":["Quarterly is the interval for hose houses and dry hydrants in Chapter 7, not for mainline strainers.","Semiannual is the monitor nozzle inspection interval in Chapter 7.","Correct — removed and inspected annually for plugging, fouling, and damaged and corroded parts.","Five years is the flow test interval for exposed and underground piping, not a strainer interval."]},{"deck":"inspection","system":"Private Mains","frequency":"Annually and after each operation","drill":true,"question":"How often must dry barrel and wall hydrants on a private fire service main be inspected?","options":["Annually only","Annually and after each operation","Quarterly","Semiannually"],"correctIndex":1,"citation":"NFPA 25 (2020) §7.2.2.4 and Table 7.1.1.2","explanation":"Both dry barrel and wet barrel hydrants carry a routine annual inspection plus one triggered by each operation — operating a hydrant is exactly when caps go missing, threads get chewed, and drains stop working. The dry barrel and wall hydrant condition list covers access to the hydrant, whether water or ice is sitting in the barrel and whether the barrel drains, leaks and cracks, the condition and tightness of caps and threads, the operating nut, whether the wrench is on hand, and — new emphasis in this edition — corrosion serious enough to threaten the hydrant's integrity.","optionNotes":["The annual cycle is only half of it — the standard adds an inspection tied to each operation.","Correct — annually and after each operation, for both dry barrel and wet barrel hydrants.","Quarterly is the interval for hose houses and for dry hydrants (the suction-type hydrants drawing from static water), not for dry BARREL hydrants.","Semiannual is the monitor nozzle inspection interval."]},{"deck":"inspection","system":"Private Mains","frequency":"","drill":false,"question":"You open a dry barrel hydrant during inspection and find standing water in the barrel. Per NFPA 25, what does this condition point to?","options":["Normal condition for a dry barrel hydrant between operations","A faulty drain, a leaking hydrant valve, or a high groundwater table","A cracked mainline strainer downstream","An undersized hydrant lateral"],"correctIndex":1,"citation":"NFPA 25 (2020) §7.2.2.4(2)","explanation":"A dry barrel hydrant is supposed to be empty above the valve when not in use — that is the whole point of the design in freezing climates. Water or ice found in the barrel is a listed inspection condition, and the standard names the three things it can indicate. Any of them means the hydrant can freeze and fail when it is needed.","optionNotes":["Standing water is precisely the condition a dry barrel hydrant is designed to avoid; it is a listed deficiency, not normal.","Correct — the standard identifies a faulty drain, a leaky hydrant valve, or a high groundwater table as the causes.","A strainer problem restricts flow; it does not put water into a dry barrel above the hydrant valve.","Lateral size affects available flow, not whether the barrel holds water when the hydrant is closed."]},{"deck":"inspection","system":"Private Mains","frequency":"Semiannually","drill":true,"question":"How often must monitor nozzles on a private fire service main be inspected?","options":["Quarterly","Semiannually","Annually","Annually and after each operation"],"correctIndex":1,"citation":"NFPA 25 (2020) §7.2.2.7 and Table 7.1.1.2","explanation":"Monitor nozzles get a twice-a-year visual inspection looking for leakage, physical damage, and corrosion. Their other requirements land on the annual cycle: they are flow tested annually with range and operation checked, moved through their full range annually, and lubricated annually.","optionNotes":["Quarterly is the hose house and dry hydrant inspection interval.","Correct — monitor nozzles are inspected twice a year for leakage, physical damage, and corrosion.","Annual is the interval for monitor nozzle flow testing, full-range operation, and lubrication — but the visual inspection is more frequent than that.","That combined trigger applies to dry barrel, wall, and wet barrel hydrants, not to monitor nozzle inspection."]},{"deck":"testing","system":"Private Mains","frequency":"Annually","drill":false,"question":"Besides being flow tested, what must be done to every monitor nozzle annually?","options":["It must be oscillated and moved throughout its full range to confirm operability","It must be removed and bench tested by the manufacturer","It must be hydrostatically tested at 200 psi","It must be replaced if it is more than 10 years old"],"correctIndex":0,"citation":"NFPA 25 (2020) §7.3.3.2","explanation":"A monitor nozzle that flows water but cannot be aimed is useless. The annual requirement is to run it through its whole travel — oscillation and full range of motion — to confirm it actually operates. Monitor nozzles mounted on hydrants are also tested the same way hydrants are, and all monitor nozzles are lubricated annually.","optionNotes":["Correct — oscillated and moved through the full range annually to confirm operability.","The standard calls for field operation, not factory bench testing.","200 psi for 2 hours is the Chapter 6 standpipe hydrostatic test baseline, not a monitor nozzle requirement.","NFPA 25 does not set an age-based replacement rule for monitor nozzles here; it requires inspection, testing, and lubrication."]},{"deck":"inspection","system":"Private Mains","frequency":"Quarterly","drill":true,"question":"How often must hose houses on a private fire service main be inspected?","options":["Monthly","Quarterly","Semiannually","Annually"],"correctIndex":1,"citation":"NFPA 25 (2020) §7.2.2.8 and Table 7.1.1.2","explanation":"Hose houses sit outdoors and are easy targets for theft, vandalism, and drifting snow, so they are checked four times a year. The inspection looks for inaccessibility, physical damage, and missing equipment.","optionNotes":["Monthly is not the interval given for hose houses.","Correct — hose houses are inspected quarterly for inaccessibility, physical damage, and missing equipment.","Semiannual is the monitor nozzle inspection interval.","Annual is the interval for exposed pipe and fittings, hydrant inspection, and hydrant testing — hose houses are checked more often than that."]},{"deck":"testing","system":"Private Mains","frequency":"Every 5 years","drill":true,"question":"What is the maximum interval for flow testing underground and exposed private fire service main piping?","options":["Annually","Every 3 years","Every 5 years","Every 10 years"],"correctIndex":2,"citation":"NFPA 25 (2020) §7.3.1 and Table 7.1.1.2","explanation":"Underground mains are flow tested on a five-year cycle to prove the water supply has not silently degraded from tuberculation, a partially closed valve, or a break. Where the underground supplies individual sprinkler, standpipe, water spray, or foam-water systems and there is no way to develop full flow, the standard permits a test that generates the maximum flow available.","optionNotes":["Annual is the interval for hydrant flow testing and monitor nozzle flow testing, not for the underground main flow test.","Three years is not an interval used for this test in Chapter 7.","Correct — underground and exposed piping is flow tested at minimum five-year intervals.","Ten years is not the interval given for underground main flow testing."]},{"deck":"testing","system":"Private Mains","frequency":"","drill":false,"question":"A five-year underground main flow test comes back noticeably weaker than the previous test — flow and pressure have both dropped. What does NFPA 25 require?","options":["Repeat the test the following year to confirm the trend","Investigate the results to the complete satisfaction of the authority having jurisdiction to ensure required flow and pressure are available","Record the new values as the system's baseline going forward","Immediately conduct an obstruction investigation of every sprinkler system on the site"],"correctIndex":1,"citation":"NFPA 25 (2020) §7.3.1.1","explanation":"Declining flow test results are the main early warning that a private main is closing up or that a valve is partially shut. The standard does not let the numbers simply be logged — it requires the deterioration to be run to ground, with the AHJ as the judge of when the investigation is complete.","optionNotes":["Waiting a year to reconfirm leaves a possibly compromised water supply in place through that period.","Correct — deterioration in flow and pressure must be investigated to the AHJ's complete satisfaction.","Accepting the degraded numbers as the new normal is exactly what the standard is written to prevent.","An obstruction investigation may end up being part of the answer, but the standard's requirement is an investigation of the flow test results satisfying the AHJ — not an automatic site-wide obstruction investigation."]},{"deck":"testing","system":"Private Mains","frequency":"Annually","drill":false,"question":"During the annual hydrant test, how long must flow be maintained?","options":["Not less than 1 minute","Not less than 5 minutes","Until the residual pressure stabilizes for 10 minutes","Not less than 30 seconds"],"correctIndex":0,"citation":"NFPA 25 (2020) §7.3.2.1 and §7.3.2.2","explanation":"Hydrants are tested annually to confirm proper functioning. Each hydrant is opened fully — not cracked partway — and water is flowed until all foreign material has cleared, with a minimum duration specified so the flush is meaningful. Partial opening can damage the hydrant valve and will not clear the barrel.","optionNotes":["Correct — flow is maintained for at least this duration after opening the hydrant fully.","Five minutes exceeds the minimum the standard sets for this test.","Residual pressure stabilization is a flow test technique, not the duration criterion for the annual hydrant test.","Thirty seconds is less than the minimum the standard requires."]},{"deck":"testing","system":"Private Mains","frequency":"","drill":false,"question":"After operating a dry barrel hydrant, you check drainage and find the barrel still holds water 75 minutes later. What does NFPA 25 require?","options":["Nothing — drainage times vary with soil and up to 2 hours is acceptable","The hydrant drain shall be plugged and the water in the barrel pumped out","The hydrant shall be replaced with a wet barrel hydrant","The hydrant shall be flowed again for a full 5 minutes to clear the drain"],"correctIndex":1,"citation":"NFPA 25 (2020) §7.3.2.3, §7.3.2.4, and §7.3.2.5","explanation":"After operation, dry barrel and wall hydrants are watched for proper drainage, and the standard sets a maximum drainage time. When soil conditions or other factors keep the barrel from draining within that time — or when the groundwater level sits above the hydrant drain — leaving the drain open just keeps refilling the barrel, so the remedy is to plug the drain and pump the barrel dry.","optionNotes":["The standard sets a specific maximum drainage time, and this hydrant has exceeded it.","Correct — plug the drain and pump the water out of the barrel.","The standard prescribes plugging and pumping, not swapping the hydrant to a different type.","Flowing the hydrant again adds water; it does not fix a drain that cannot discharge because of soil conditions or a high water table."]},{"deck":"maintenance","system":"Private Mains","frequency":"","drill":false,"question":"A dry barrel hydrant in northern Illinois has had its drain plugged because the barrel would not drain. What additional requirement does NFPA 25 place on that hydrant?","options":["It shall be marked for removal at the next budget cycle","It shall be clearly identified as needing pumping after operation","It shall be inspected quarterly instead of annually","It shall be converted to a wet barrel hydrant"],"correctIndex":1,"citation":"NFPA 25 (2020) §7.3.2.6","explanation":"Once the drain is plugged, nothing empties the barrel automatically — so in freezing climates the hydrant will freeze solid after use unless somebody pumps it out. The standard requires clear identification on those hydrants so the next crew that operates it knows the barrel must be pumped.","optionNotes":["The standard's remedy is identification so the hydrant gets pumped, not scheduled removal.","Correct — dry barrel hydrants in freezing areas with plugged drains must be clearly identified as needing pumping after operation.","Quarterly is the dry hydrant and hose house inspection interval; plugging a drain does not change the hydrant inspection frequency.","Nothing in the standard requires conversion to a different hydrant type."]},{"deck":"inspection","system":"Private Mains","frequency":"At least quarterly","drill":true,"question":"A rural site draws fire water from a pond through a dry hydrant. How often must that dry hydrant be inspected under the 2020 edition?","options":["Annually","Semiannually","At least quarterly","Every 5 years"],"correctIndex":2,"citation":"NFPA 25 (2020) §7.2.2.6, extracted from NFPA 1142 (2017)","explanation":"Dry hydrants — the suction-side hydrants that draw from ponds, streams, and cisterns — were added as an explicit section in the 2020 edition. They are inspected at least four times a year and maintained as necessary to keep them in good working condition. Do not confuse a dry hydrant with a dry BARREL hydrant, which is a pressurized-main hydrant inspected annually and after each operation.","optionNotes":["Annual is the interval for the reflective marking and signage check on a dry hydrant, and for its flow test — but the general dry hydrant inspection is more frequent.","Semiannual is the monitor nozzle inspection interval.","Correct — dry hydrants are inspected at least quarterly and maintained as necessary.","Five years is the underground and exposed piping flow test interval."]},{"deck":"maintenance","system":"Private Mains","frequency":"","drill":false,"question":"Under the dry hydrant requirements added in the 2020 edition, how far must vegetation be cleared around the hydrant?","options":["A minimum 3 ft (0.9 m) radius","A minimum 18 in. (0.45 m) radius","A minimum 5 ft (1.5 m) radius","A minimum 10 ft (3 m) radius"],"correctIndex":0,"citation":"NFPA 25 (2020) §7.2.2.6.2, extracted from NFPA 1142 (2017)","explanation":"Dry hydrants are frequently in rural, overgrown locations, so the standard sets a minimum cleared radius so a pumper crew can find and connect to the hydrant without fighting brush. The same dry hydrant section also requires the riser to be protected against ultraviolet degradation by painting or other measures.","optionNotes":["Correct — vegetation is cleared for at least this radius around the hydrant.","This is shorter than the minimum radius the standard sets.","This exceeds the radius stated in the standard.","This exceeds the radius stated in the standard."]},{"deck":"testing","system":"Private Mains","frequency":"At least annually","drill":true,"question":"How does NFPA 25 require a dry hydrant to be flow tested?","options":["By connecting a hydrant flow gauge and reading residual pressure quarterly","At least annually, with an approved pump, to confirm the minimum design flow is maintained","Every 5 years, along with the underground main flow test","Only when the AHJ requests it, since dry hydrants have no pressurized supply"],"correctIndex":1,"citation":"NFPA 25 (2020) §7.2.2.6.5, extracted from NFPA 1142 (2017)","explanation":"A dry hydrant has no pressure behind it — it is a suction connection to a static source — so the only way to prove it still delivers is to draft through it with a pump. The standard sets a minimum test frequency and ties the acceptance criterion to the minimum design flow. The dry hydrant section also requires surveys for deterioration in the water supply situation in ponds, streams, or cisterns.","optionNotes":["A residual pressure reading assumes a pressurized supply, which a dry hydrant does not have.","Correct — flow tested at least annually with an approved pump to confirm the minimum design flow is maintained.","The five-year interval belongs to underground and exposed piping flow tests; dry hydrants are tested more often than that.","The standard sets a recurring requirement rather than leaving the testing to an AHJ request."]},{"deck":"maintenance","system":"Private Mains","frequency":"Annually","drill":false,"question":"What annual maintenance does NFPA 25 require on private fire service main hydrants?","options":["Lubrication to keep stems, caps, plugs, and threads in proper operating condition","Repacking of the operating stem","Hydrostatic testing to 200 psi","Replacement of all cap gaskets"],"correctIndex":0,"citation":"NFPA 25 (2020) §7.4.2.1 and Table 7.1.1.2","explanation":"The named annual hydrant maintenance task is lubrication, aimed at the moving and threaded parts a firefighter has to operate under pressure — stems, caps, plugs, and threads. Separately, hydrants must be kept clear of snow, ice, and other materials and protected against mechanical damage so free access is ensured.","optionNotes":["Correct — hydrants are lubricated annually so stems, caps, plugs, and threads stay in proper operating condition.","Repacking is a repair performed when a hydrant leaks; it is not the annual maintenance task named in Chapter 7.","Hydrostatic testing of hydrants appears in the Chapter 7 component action table as an action following adjustment, repair, or replacement — it is not a routine annual maintenance item.","Chapter 7 sets no

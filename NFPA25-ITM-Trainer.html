l couplings are replaced every 5 years or as required by the component manufacturer, §8.1.1.2.23.","Engine crankcase breathers are inspected quarterly under §8.1.1.2.12."]},{"deck":"general","system":"Fire Pump","frequency":"","drill":false,"question":"A fire pump component needs replacement, but the original equipment manufacturer no longer supplies that part. What does NFPA 25 permit?","options":["An approved like part is permitted to be used","The entire pump assembly must be replaced","Any commercially equivalent part may be used at the contractor's discretion","The pump must be declared permanently impaired until an OEM part is located"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.6.3.1","explanation":"The baseline is that replacement parts should preserve the listing of the pump component assembly. When the OEM part no longer exists, the standard provides a practical fallback — but the substitute has to be approved, not simply selected by the installer.","optionNotes":["Correct — §8.6.3.1 permits an approved like part where the part is no longer available from the original equipment manufacturer. §8.6.3 sets the baseline that replacement parts maintain the listing for the fire pump component assembly whenever possible.","Replacing the entire assembly is not required, and doing so would trigger a full NFPA 20 acceptance test under Table 8.6.1.","The word 'approved' matters — the substitution is not left to contractor discretion.","There is no provision declaring a pump permanently impaired for parts unavailability; §8.6.3.1 exists precisely to keep the pump serviceable."]},{"deck":"inspection","system":"Fire Pump","frequency":"Weekly","drill":false,"question":"During a weekly electrical system inspection of a fire pump installation with a standby (emergency) power source, what does NFPA 25 direct you to verify about the isolating switch?","options":["That the isolating switch is closed","That the isolating switch is open and padlocked","That the isolating switch has been exercised six times since the last inspection","That the isolating switch is in the automatic position"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.2.2(3)(c)","explanation":"The isolating switch on the standby source has to be closed for that source to be available when the utility fails. An open switch means the emergency power path is dead and nobody would find out until the fire.","optionNotes":["Correct — §8.2.2(3)(c) lists 'isolating switch is closed — standby (emergency) source' among the weekly electrical system observations.","An open isolating switch would cut the pump off from its standby power source. Nothing in §8.2.2(3) calls for it to be open.","Exercising the isolating switch six times is the return-to-service criterion after the switch is REPLACED, per Table 8.6.1 — not a weekly inspection item.","'Auto position' is the weekly checkpoint for the diesel controller SELECTOR SWITCH under §8.2.2(4)(b), a different device."]},{"deck":"general","system":"Fire Pump","frequency":"","drill":false,"question":"NFPA 25 lists the auxiliary equipment that is part of a fire pump assembly. Which of the following is included in that list, with a stated limitation on when it applies?","options":["The circulation relief valve, which is not used in conjunction with a diesel engine drive with heat exchanger","The jockey pump, which is only included where the pump is electric motor-driven","The pressure relief valve, which is only included on pumps rated above 500 gpm","The automatic air release valve, which is only included on vertical turbine pumps"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.1.4(1)(d)","explanation":"A diesel engine drive with a heat exchanger already circulates water through the cooling loop, so a circulation relief valve would be redundant. The standard notes that limitation right in the auxiliary equipment list.","optionNotes":["Correct — §8.1.4(1)(d) lists the circulation relief valve and notes it is not used in conjunction with a diesel engine drive with heat exchanger.","§8.1.4(6) lists the pressure maintenance (jockey) pump and accessories with no driver-type limitation.","§8.1.4(3) lists the pump relief valve and piping where the maximum pump discharge pressure exceeds the rating of the system components or the driver of a variable speed pump — a pressure-based condition, not a gpm threshold.","§8.1.4(1)(b) lists the automatic air release valve with no pump-type limitation. The vertical shaft turbine limitation in §8.1.4(5) applies to right-angle gear sets for engine-driven pumps."]},{"deck":"inspection","system":"Water Tank","frequency":"Quarterly","drill":true,"question":"A gravity tank is equipped with water level alarms that are supervised in accordance with NFPA 72 and connected to a constantly attended location. How often must the water level be inspected?","options":["Quarterly","Monthly","Weekly","Annually"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.2.1.1 and Table 9.1.1.2","explanation":"Supervision buys you a longer manual interval. When the level alarms are supervised per NFPA 72 and reported to a constantly attended location, the physical water level check drops to a quarterly task because the alarm system is watching between visits.","optionNotes":["Correct — supervised, constantly attended level alarms allow a quarterly manual water level inspection.","Monthly is the interval for tanks that do NOT have supervised water level alarms connected to a constantly attended location (§9.2.1.2).","Weekly is the water temperature inspection/recording interval during heating season for tanks without low temperature alarms connected to a constantly attended location (§9.2.3.3).","Annually applies to items like expansion joints, hoops and grillage, and painted/coated surfaces — not water level."]},{"deck":"inspection","system":"Water Tank","frequency":"Monthly","drill":true,"question":"A suction tank has a simple sight glass but no supervised water level alarm reporting to a constantly attended location. What is the required water level inspection frequency?","options":["Monthly","Quarterly","Weekly","Daily during the heating season"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.2.1.2 and Table 9.1.1.2","explanation":"With no supervised alarm watching the level, the standard shortens the human check to monthly. The absence of supervision is what drives the tighter interval.","optionNotes":["Correct — no supervised level alarms connected to a constantly attended location means the water level is inspected monthly.","Quarterly applies only when the tank HAS supervised water level alarms connected to a constantly attended location (§9.2.1.1).","Weekly is the heating-season water temperature inspection/recording interval for tanks without low temperature alarms connected to a constantly attended location (§9.2.3.3).","Daily during the heating season is the heating system inspection interval for tanks without a supervised low temperature alarm connected to a constantly attended location (§9.2.2.2)."]},{"deck":"inspection","system":"Water Tank","frequency":"Every 3 years","drill":true,"question":"A steel ground storage tank has no interior corrosion protection. How often must the tank interior be inspected?","options":["Every 3 years","Every 5 years","Annually","Every 2 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.2.5.1.1 and Table 9.1.1.2","explanation":"Unprotected steel corrodes faster, so NFPA 25 pulls the interior inspection in to a 3-year cycle. Corrosion protection is the deciding factor between the 3-year and 5-year interval.","optionNotes":["Correct — bare steel with no corrosion protection gets an interior inspection every 3 years.","Every 5 years is the interior inspection interval for all other tank types (§9.2.5.1.2), and also the interval for testing level indicators (§9.3.1).","Annually applies to exterior painted/coated/insulated surfaces, expansion joints, and hoops and grillage — not the tank interior.","Every 2 years is the cleaning-and-painting interval for exposed surfaces of embankment-supported coated fabric (ESCF) tanks (§9.4.6.2)."]},{"deck":"inspection","system":"Water Tank","frequency":"Every 5 years","drill":true,"question":"An interior-coated steel tank (corrosion protection provided) and a fiberglass tank are both on your ITM schedule. What is the interior inspection interval for these tanks?","options":["Every 5 years","Every 3 years","Annually","Quarterly"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.2.5.1.2 and Table 9.1.1.2","explanation":"Every tank type other than unprotected steel falls on a 5-year interior inspection cycle. The 3-year interval is reserved specifically for steel tanks with no corrosion protection.","optionNotes":["Correct — interiors of all tank types other than unprotected steel are inspected every 5 years.","Every 3 years is only for steel tanks WITHOUT corrosion protection (§9.2.5.1.1).","Annually is for exterior items such as expansion joints and painted, coated, or insulated surfaces — not the interior.","Quarterly is the exterior/support structure/vents/foundation/catwalk inspection interval (§9.2.4.1)."]},{"deck":"inspection","system":"Water Tank","frequency":"Quarterly","drill":false,"question":"You are doing the quarterly walk-around on a gravity tank, checking for visible damage or deterioration. Which set of items belongs on that quarterly check?","options":["The outside of the tank shell, the structure holding it up, the vents, the foundation, and any catwalks or ladders","Expansion joints, the hoops and grillage on a wooden tank, and painted or insulated surfaces","The interior coating, the anti-vortex plate, and the heating system piping","Level indicators, high and low water level signals, and pressure gauges"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.2.4.1 and Table 9.1.1.2","explanation":"The quarterly check is about structural condition you can see from outside: the shell itself, whatever holds the tank up, the vents, the foundation under it, and the access catwalks or ladders if the tank has them. Everything on that list is reachable without draining or entering the tank.","optionNotes":["Correct — the shell exterior, support structure, vents, foundation, and catwalks or ladders (where provided) are the quarterly visual items.","Expansion joints (§9.2.4.3), hoops and grillage on wooden tanks (§9.2.4.4), and painted, coated, or insulated surfaces (§9.2.4.5) are all annual items, not quarterly.","These are interior items, examined on the 3-year or 5-year interior inspection cycle (§9.2.5.3, §9.2.5.6, §9.2.5.7).","These are tests, not quarterly inspections — level indicators every 5 years (§9.3.1), high and low level signals annually (§9.3.5), pressure gauges per Chapter 13."]},{"deck":"inspection","system":"Water Tank","frequency":"Annually","drill":true,"question":"Expansion joints on an elevated tank riser must be inspected at what interval, and what are you looking for?","options":["Annually, for leaks and cracks","Quarterly, for leaks and cracks","Every 5 years, for corrosion and pitting","Every 3 years, for coating failure"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.2.4.3 and Table 9.1.1.2","explanation":"Expansion joints are an annual visual item, and the specific defects called out are leakage and cracking — the two failure modes of a flexible joint.","optionNotes":["Correct — expansion joints, where provided, are inspected annually for leaks and cracks.","The interval is annual, not quarterly. Quarterly covers the tank exterior, supporting structure, vents, foundation, catwalks/ladders, and surrounding area.","Five years is the interior inspection interval for tanks other than unprotected steel, and the level indicator test interval — not expansion joints.","Three years is the interior inspection interval for unprotected steel tanks; coating failure is an interior inspection finding (§9.2.5.3)."]},{"deck":"inspection","system":"Water Tank","frequency":"Annually","drill":true,"question":"How often must exterior painted, coated, or insulated surfaces of a tank and its supporting structure be inspected for signs of degradation?","options":["Annually","Quarterly","Every 2 years","Every 5 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.2.4.5 and Table 9.1.1.2","explanation":"Protective finishes on the outside of the tank and on its supporting steel get an annual look for signs of degradation. The standard does not spell out what counts as degradation, so the judgment is the inspector's — the point is that a failing coating stops protecting the metal underneath.","optionNotes":["Correct — exterior painted, coated, or insulated surfaces, where provided, are inspected annually for degradation.","Quarterly is the general exterior damage/weakening inspection (§9.2.4.1); the finish-condition inspection is a separate annual item.","Two years is the interval for cleaning and painting exposed surfaces of ESCF tanks (§9.4.6.2) — that is a maintenance action on a specific tank type, not this inspection.","Five years is the interior inspection interval for non-steel-unprotected tanks and the level indicator test interval."]},{"deck":"inspection","system":"Water Tank","frequency":"Quarterly","drill":false,"question":"During a quarterly inspection of the area surrounding a tank you find pallets stacked against the support legs and a heavy ice ring built up on the tank base. Which of these is a code-recognized deficiency under the surrounding-area inspection?","options":["Both conditions — the area must be free of combustible storage that presents a fire exposure hazard, and the tank and support must be free of ice buildup","Only the pallets — ice buildup is addressed solely as a heating system issue","Only the ice — combustible storage near a water tank is a Chapter 14 obstruction issue","Neither — these are housekeeping items outside the scope of NFPA 25"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.2.4.2(1) and §9.2.4.2(3)","explanation":"The quarterly surrounding-area inspection has four specific checks. Two of them are directly triggered here: combustible storage, trash, debris, brush, or material that could present a fire exposure hazard, and ice buildup on the tank and its support.","optionNotes":["Correct — combustible storage creating a fire exposure hazard and ice buildup on the tank and support are both listed conditions in the quarterly surrounding-area inspection.","Ice buildup is explicitly one of the four surrounding-area inspection conditions, not just a heating system concern.","Combustible storage that could present a fire exposure hazard is explicitly listed in §9.2.4.2(1). Chapter 14 covers internal obstruction investigations, not exterior storage.","Both are named conditions in §9.2.4.2; the standard also lists accumulation of material causing accelerated corrosion or rot, and erosion of embankments supporting coated fabric tanks."]},{"deck":"inspection","system":"Water Tank","frequency":"","drill":false,"question":"NFPA 25 sets a floor on stored water temperature for fire protection tanks. What is that minimum?","options":["40°F (4°C)","32°F (0°C)","45°F (7°C)","50°F (10°C)"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.2.3.1","explanation":"Water in the tank must not drop below 40°F (4°C). That same 40°F mean-temperature threshold also triggers the periodic temperature recording requirements during heating season.","optionNotes":["Correct — the standard sets 40°F (4°C) as the minimum stored water temperature.","32°F (0°C) is the freezing point, but the standard requires a margin above freezing, not merely unfrozen water.","45°F is not a value used in Chapter 9.","50°F is not a value used in Chapter 9."]},{"deck":"inspection","system":"Water Tank","frequency":"Weekly","drill":true,"question":"A tank has no low water temperature alarms connected to a constantly attended location. During the heating season, the mean temperature drops below 40°F (4°C). How often must the water temperature be inspected and recorded?","options":["Weekly","Quarterly","Daily","Monthly"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.2.3.3 and Table 9.1.1.2","explanation":"No alarm reporting to an attended location means somebody has to physically read and record the temperature weekly through the cold months whenever the mean temperature is under 40°F.","optionNotes":["Correct — weekly inspection and recording of water temperature is required in this configuration during heating season below a 40°F mean temperature.","Quarterly is the recording interval when the tank DOES have low temperature alarms supervised per NFPA 72 and connected to a constantly attended location (§9.2.3.2).","Daily is the heating SYSTEM inspection interval for tanks without a supervised low temperature alarm connected to a constantly attended location (§9.2.2.2) — a different item than water temperature recording.","Monthly is the water LEVEL inspection interval for tanks without supervised level alarms connected to a constantly attended location (§9.2.1.2)."]},{"deck":"inspection","system":"Water Tank","frequency":"Daily","drill":true,"question":"A tank heating system is installed on a tank that has NO supervised low temperature alarm connected to a constantly attended location. How often must the heating system be inspected during the heating season?","options":["Daily","Weekly","Quarterly","Monthly"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.2.2.2 and Table 9.1.1.2","explanation":"Without a supervised low temperature alarm reporting to an attended location, nothing will tell you the heater quit — so the heating system gets a daily eyes-on check through the heating season.","optionNotes":["Correct — daily heating system inspection during the heating season when there is no supervised low temperature alarm connected to a constantly attended location.","Weekly is the water TEMPERATURE inspection and recording interval in that same unsupervised configuration (§9.2.3.3), not the heating system inspection.","Quarterly during the heating season is the heating system inspection interval when the tank IS equipped with a supervised low temperature alarm connected to a constantly attended location (§9.2.2.1).","Monthly is the water level inspection interval for tanks without supervised level alarms connected to a constantly attended location."]},{"deck":"testing","system":"Water Tank","frequency":"Every 5 years","drill":true,"question":"Tank level indicators must be tested for accuracy and freedom of movement at what interval?","options":["Every 5 years","Annually","Every 3 years","Quarterly"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.3.1 and Table 9.1.1.2","explanation":"The mechanical level indicator gets a 5-year test that checks two things: whether the reading is accurate and whether the indicator moves freely rather than sticking.","optionNotes":["Correct — level indicators are tested every 5 years for accuracy and freedom of movement.","Annually is the test interval for high and low water level SIGNALS (§9.3.5) — the alarm devices, not the mechanical indicator.","Three years is the interior inspection interval for steel tanks without corrosion protection, not a test interval for level indicators.","Quarterly is an inspection interval (exterior, vents, foundation, catwalks, surrounding area), not a level indicator test interval."]},{"deck":"testing","system":"Water Tank","frequency":"Prior to the heating season","drill":true,"question":"When must a tank heating system be tested to confirm it is in proper working order?","options":["Prior to the heating season","Quarterly year-round","Annually in the spring","Monthly during the heating season"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.3.2 and Table 9.1.1.2","explanation":"The heating system test is scheduled ahead of the cold weather so a failure is found before it matters. Low water temperature signals and high water temperature limit switches follow the same pre-season timing.","optionNotes":["Correct — the tank heating system, where provided, is tested prior to the heating season to confirm proper working order.","Quarterly during the heating season is the heating system INSPECTION interval for tanks with supervised low temperature alarms connected to a constantly attended location (§9.2.2.1), not the test.","The standard ties the test to the start of the heating season rather than a fixed calendar month; testing after the season ends defeats the purpose.","Monthly is not a heating system interval in Chapter 9; the unsupervised-configuration heating system inspection is daily during the heating season."]},{"deck":"testing","system":"Water Tank","frequency":"Annually","drill":true,"question":"High and low water level signals on a fire protection storage tank must be tested at what frequency?","options":["Annually","Every 5 years","Quarterly","Prior to the heating season"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.3.5 and Table 9.1.1.2","explanation":"The high and low level alarm signals are proven annually. Do not confuse this with the mechanical level indicator, which is a 5-year accuracy and freedom-of-movement test.","optionNotes":["Correct — high and low water level signals are tested annually.","Five years is the level INDICATOR test interval (§9.3.1) — the gauge itself, not the alarm signals.","Quarterly is an inspection interval for exterior items and for water level where supervised alarms exist; it is not the level signal test interval.","Prior to the heating season applies to the tank heating system, low water TEMPERATURE signals, and high water temperature limit switches (§9.3.2, §9.3.3, §9.3.4) — temperature devices, not level signals."]},{"deck":"inspection","system":"Water Tank","frequency":"","drill":false,"question":"A contractor proposes performing the required interior inspection by underwater evaluation rather than draining the tank. What must be done first?","options":["Silt must be removed from the tank floor","The tank must be drained to half depth to expose the shell","The water must be chlorinated to permit diver entry","A full-flow main drain test must be performed"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.2.5.2","explanation":"An underwater evaluation cannot assess a floor buried under sediment. Silt has to come off the floor first so the inspection can actually see the steel and any pitting or coating failure.","optionNotes":["Correct — where interior inspection is performed by underwater evaluation, silt is removed from the tank floor first.","Draining to half depth is not a requirement; the entire point of an underwater evaluation is to inspect without draining.","Chlorination is not a requirement stated in Chapter 9 for underwater evaluation.","A main drain test is a Chapter 13 waterflow verification and has nothing to do with preparing for an interior inspection."]},{"deck":"testing","system":"Water Tank","frequency":"","drill":false,"question":"During a drained interior inspection of a steel tank you find widespread pitting and areas where the coating has failed. What does NFPA 25 require next?","options":["The tank must be subjected to the tests of §9.2.6, including coating adhesion testing, dry film thickness measurement, ultrasonic wall thickness readings, and wet-sponge testing","The tank must be immediately removed from service and recoated before any further evaluation","Only a visual record and photographs are required; testing is at the owner's discretion","The tank interior inspection interval must be shortened to annually and no other action is required"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.2.5.4 and §9.2.6","explanation":"Visible pitting, corrosion, or coating failure on a steel tank is the trigger for the quantitative test battery: cross-hatch adhesion testing per ASTM D3359, dry film thickness readings, nondestructive ultrasonic wall thickness where pitting or corrosion is evident, and spot wet-sponge testing to find pinholes and cracks in the coating.","optionNotes":["Correct — steel tanks exhibiting interior pitting, corrosion, or coating failure are tested in accordance with §9.2.6.","Immediate removal from service and recoating is not what the standard directs; the required next step is the defined evaluation testing, which then informs repair decisions.","The tests in §9.2.6 are mandatory once §9.2.5.4 is triggered, not discretionary documentation.","Chapter 9 does not create a shortened interior inspection interval as the remedy for observed pitting; it requires the §9.2.6 tests."]},{"deck":"testing","system":"Water Tank","frequency":"","drill":false,"question":"During a drained interior inspection, tank bottoms are tested for metal loss and rust on the underside where there is evidence of pitting or corrosion. What method does NFPA 25 accept as an alternative to ultrasonic testing?","options":["Removal, visual inspection, and replacement of random floor coupons","Hydrostatic testing of the tank at 200 psi","Magnetic particle testing of the shell seams","A vacuum-box test of the roof plate seams"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.2.6(5)","explanation":"Cutting out random floor coupons, examining them, and replacing them is expressly recognized as an acceptable substitute for ultrasonic testing of the tank bottom, because it gives direct visual evidence of underside metal loss.","optionNotes":["Correct — random floor coupon removal, visual inspection, and replacement is the accepted alternative to ultrasonic testing of tank bottoms.","Hydrostatic pressure testing is not offered as an alternative to bottom ultrasonic testing in §9.2.6.","Magnetic particle testing is not listed among the tests during interior inspection in §9.2.6.","Vacuum-box testing is required for tanks with FLAT BOTTOMS at the bottom seams per NFPA 22 procedures (§9.2.6(6)) — it is a separate required test, not an alternative to bottom ultrasonic testing, and it is not applied to roof plates."]},{"deck":"maintenance","system":"Water Tank","frequency":"Every 2 years","drill":true,"question":"Exposed surfaces of an embankment-supported coated fabric (ESCF) suction tank must be cleaned and painted at what interval?","options":["Every 2 years, or in accordance with the manufacturer's instructions","Annually, or in accordance with the manufacturer's instructions","Every 5 years","Every 3 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.4.6.2 and Table 9.1.1.2","explanation":"ESCF tanks get a dedicated 2-year clean-and-paint cycle for their exposed surfaces, with the manufacturer's instructions as an accepted alternative schedule.","optionNotes":["Correct — 2 years or per the manufacturer's instructions for cleaning and painting exposed ESCF tank surfaces.","Annually is the inspection interval for painted, coated, or insulated exterior surfaces generally (§9.2.4.5) — inspecting is not the same as the ESCF clean-and-paint maintenance action.","Five years is the interior inspection interval for tanks other than unprotected steel, and the level indicator test interval.","Three years is the interior inspection interval for steel tanks without corrosion protection."]},{"deck":"testing","system":"Water Tank","frequency":"Annually","drill":false,"question":"An automatic tank fill valve is tested yearly. What two things must the test include?","options":["Actuating the valve automatically by lowering the water level in the tank, and measuring and recording the refill rate","Manually opening the valve at the handwheel and verifying it closes within 60 seconds","Closing the OS&Y isolation valve and confirming the low level alarm sounds","Performing a full-flow main drain test downstream of the valve and recording static and residual pressure"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.5.3 and Table 9.5.1.1","explanation":"The annual fill valve test has to prove automatic operation the way the valve actually works in service — by dropping the tank level so the valve calls for water — and then quantify performance by measuring and recording how fast the tank refills.","optionNotes":["Correct — the valve is actuated automatically by lowering the tank water level, and the refill rate is measured and recorded.","Manual handwheel operation does not verify automatic actuation, and Chapter 9 sets no 60-second closing criterion for fill valves.","OS&Y isolation valves that are part of the automatic fill valve assembly are inspected per Chapter 13 (§9.5.1.1.1); closing one is not the annual fill valve test.","A full-flow main drain test is a Chapter 13 water supply verification, not the automatic tank fill valve test."]},{"deck":"maintenance","system":"Water Tank","frequency":"Quarterly","drill":true,"question":"Strainers associated with automatic tank fill valves must be cleaned at what interval?","options":["Quarterly","Annually","Every 5 years","Monthly"],"correctIndex":0,"citation":"NFPA 25 (2020) §9.5.2.3 and Table 9.5.1.1","explanation":"Cleaning the fill valve strainers is a quarterly maintenance task. Note that inspecting strainers, filters, and orifices on the fill valve assembly is on a 5-year cycle per Chapter 13 — different action, different interval.","optionNotes":["Correct — strainers on automatic tank fill valves are cleaned quarterly.","Annually is the fill valve TEST interval (§9.5.3), not the strainer cleaning interval.","Five years is the inspection interval for strainers, filters, and orifices on the fill valve assembly per Chapter 13 — inspecting, not cleaning.","Monthly is the exterior inspection interval for the fill valve per Chapter 13, and the inspection interval for valves secured with locks or electrically supervised (§9.5.1.2)."]},{"deck":"general","system":"Water Spray","frequency":"","drill":false,"question":"A plant has water spray protection on a transformer supplied by fixed directional nozzles, plus a manned monitor nozzle on the tank farm and a hose station with portable nozzles. Which of these does Chapter 10 of NFPA 25 cover?","options":["Only the fixed nozzle water spray system on the transformer","All three, since all discharge water spray","The fixed system and the monitor nozzle, but not the portable nozzles","Only the monitor nozzle and portable nozzles; fixed systems fall under Chapter 5"],"correctIndex":0,"citation":"NFPA 25 (2020) §10.1.1.1 and §10.1.2","explanation":"Chapter 10 is written for water spray protection delivered by fixed nozzle systems. It expressly does not cover portable nozzles, sprinkler systems, monitor nozzles, or other means of application.","optionNotes":["Correct — Chapter 10 applies to water spray protection from fixed nozzle systems only.","Portable nozzles and monitor nozzles are specifically excluded from Chapter 10 by §10.1.2.","Monitor nozzles are named in the exclusion list in §10.1.2 along with portable nozzles, sprinkler systems, and other means of application.","This reverses the scope. Fixed nozzle systems are exactly what Chapter 10 covers; Chapter 5 addresses sprinkler systems."]},{"deck":"inspection","system":"Water Spray","frequency":"Each scheduled shutdown, not exceeding 18 months","drill":true,"question":"Portions of a water spray system run through an area that cannot be safely accessed because of continuous process operations and energized electrical equipment. How does NFPA 25 handle inspection of those items?","options":["They are inspected during each scheduled shutdown, but at intervals not exceeding 18 months","They are exempt from inspection entirely as long as the exemption is documented","They must still be inspected annually, using remote means if necessary","They are inspected every 5 years along with the mainline strainer"],"correctIndex":0,"citation":"NFPA 25 (2020) §10.2.1.1","explanation":"The standard recognizes that some process areas cannot be entered on a fixed calendar. It ties the inspection to the plant's scheduled shutdowns, with a hard ceiling of 18 months between inspections so the interval cannot drift indefinitely.","optionNotes":["Correct — inspection during each scheduled shutdown, not exceeding 18 months.","There is a narrow exemption in §10.2.1.2 only for items in areas with NO provision for access that are also not subject to the conditions of §10.2.3.1, §10.2.3.2, and §10.2.4.1 — safety-inaccessible items with access provisions still get inspected.","Annual is the general interval for piping, fittings, hangers, and nozzles; the safety-inaccessible provision replaces it with the shutdown-based schedule capped at 18 months.","Five years is the mainline strainer removal and inspection interval (§10.2.1.7), unrelated to inaccessible areas."]},{"deck":"inspection","system":"Water Spray","frequency":"Quarterly","drill":true,"question":"How often must the area beneath and surrounding a water spray fixed system be inspected to confirm trap sumps and drainage trenches are not blocked and retention embankments or dikes are in good repair?","options":["Quarterly","Annually","Monthly","Semiannually"],"correctIndex":0,"citation":"NFPA 25 (2020) §10.2.7 and Table 10.1.1.2","explanation":"Drainage is a quarterly visual item for water spray systems. If a system dumps a large volume of water onto a hazard such as a transformer or a tank, blocked drainage turns a controlled discharge into a spreading-fuel problem.","optionNotes":["Correct — drainage is inspected visually on a quarterly basis.","Annually is the interval for nozzles, piping, fittings, and hangers/braces/supports — not drainage.","Monthly is the UHSWSS detector inspection and test interval (§10.4.2), not the drainage inspection.","Semiannual is not an interval used in Chapter 10."]},{"deck":"inspection","system":"Water Spray","frequency":"Annually and after each system activation","drill":true,"question":"A water spray system on a transformer discharged during an actual fire event three months after its last annual inspection. When must the nozzles, piping, rubber-gasketed fittings, hangers, braces, and supports next be inspected?","options":["After the activation — these items carry a dual trigger: annually AND after each system activation","At the next scheduled annual inspection, since the system operated as designed","Within 18 months of the activation","Only if visible damage was reported by operations personnel"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 10.1.1.2; §10.2.3.1, §10.2.3.2, §10.2.4","explanation":"For water spray systems, nozzles, piping, rubber-gasketed fittings, and hangers/braces/supports carry a dual trigger: annually and after each system activation. A discharge event resets the clock because the fire exposure and the flow event can damage exactly these components.","optionNotes":["Correct — Table 10.1.1.2 lists nozzles, piping, rubber-gasketed fittings, and hangers/braces/supports as annually and after each system activation. The table sets the trigger, not a stopwatch.","Waiting for the annual ignores the after-each-activation trigger built into the table for these items.","Eighteen months is the ceiling for inspecting items inaccessible for safety considerations (§10.2.1.1), not a post-activation interval.","The post-activation inspection is required by the table regardless of whether damage was reported."]},{"deck":"inspection","system":"Water Spray","frequency":"Every 5 years","drill":true,"question":"Mainline strainers on a water spray fixed system must be removed and inspected for damaged and corroded parts at what interval?","options":["Every 5 years","Annually","Quarterly","Every 3 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §10.2.1.7 and Table 10.1.1.2","explanation":"Pulling the mainline strainer apart to look for damaged and corroded internals is a 5-year task. That is separate from the annual strainer inspection and maintenance, and separate again from flushing after each operation.","optionNotes":["Correct — mainline strainers are removed and inspected every 5 years for damaged and corroded parts.","Annually is the mainline strainer inspection and maintenance interval and the strainer operational test interval in Table 10.1.1.2; the 5-year task is the full removal and internal examination for damage and corrosion.","Quarterly is the drainage inspection interval (§10.2.7), not a strainer interval.","Three years is a Chapter 9 tank interior interval, not used for water spray strainers."]},{"deck":"maintenance","system":"Water Spray","frequency":"After each operation or flow test","drill":false,"question":"A water spray system has just completed a full flow test. What does NFPA 25 require regarding the strainers?","options":["The mainline strainer is flushed until clear, and individual nozzle strainers are removed, cleaned, and inspected","Only the mainline strainer needs attention; nozzle strainers are on a 5-year cycle","Strainers are left undisturbed unless the discharge pattern was visibly impeded","Only the nozzle strainers are cleaned; the mainline strainer is cleaned annually regardless"],"correctIndex":0,"citation":"NFPA 25 (2020) §10.2.6.1 and §10.2.6.2","explanation":"After every operation or flow test, debris from the underground and mains ends up in the strainers. The mainline basket or screen strainer is flushed until it runs clear, and each individual nozzle strainer is pulled, cleaned, and inspected.","optionNotes":["Correct — both actions are required after each operation or flow test.","Nozzle strainers are removed, cleaned, and inspected after each operation or flow test (§10.2.6.2); the 5-year task applies to mainline strainer removal and inspection (§10.2.1.7).","The requirement is triggered by the operation or flow test itself, not by an observed impairment of the pattern.","Both strainer types require attention after each operation or flow test; the mainline strainer is not deferred to an annual-only schedule."]},{"deck":"inspection","system":"Water Spray","frequency":"","drill":false,"question":"During an annual inspection you find a water spray nozzle that has been knocked out of aim. What does NFPA 25 require?","options":["Adjust (re-aim) the nozzle by visual means, then inspect the discharge patterns at the next scheduled flow test","Replace the nozzle, since a misaligned nozzle cannot be recertified","Perform an immediate full flow test to verify the corrected pattern before returning the system to service","Document the condition only; nozzle aiming is a design matter outside the scope of NFPA 25"],"correctIndex":0,"citation":"NFPA 25 (2020) §10.2.4.3","explanation":"Re-aiming is done visually in the field. The standard then defers pattern verification to the next scheduled flow test rather than forcing an out-of-cycle discharge, which keeps you from soaking energized or process equipment unnecessarily.","optionNotes":["Correct — misaligned nozzles are adjusted by visual means, and discharge patterns are inspected at the next scheduled flow test.","Nothing in §10.2.4 requires replacement for misalignment; replacement is driven by damage, external loading, or corrosion issues under §10.2.4.1.","The standard specifically ties pattern verification to the NEXT scheduled flow test, not an immediate one.","Nozzle position and aim are explicit inspection and maintenance items under §10.2.4.1 and §10.2.4.3."]},{"deck":"testing","system":"Water Spray","frequency":"","drill":false,"question":"During an operational test of a water spray system, the heat detection system is exposed to a heat test source. Within what time must it operate?","options":["40 seconds","30 seconds","60 seconds","100 milliseconds"],"correctIndex":0,"citation":"NFPA 25 (2020) §10.3.3.1.1","explanation":"Under test conditions, heat detection exposed to a heat test source has to operate within 40 seconds, and the response time must be recorded. Flammable gas detection instead has to operate within the time frame specified in the system design.","optionNotes":["Correct — heat detection systems must operate within 40 seconds under test conditions.","30 seconds is not a value used in §10.3.3.1.","60 seconds is not a value used in §10.3.3.1.","100 milliseconds is the maximum response time for an Ultra-High-Speed Water Spray System (§10.4.5.2), a completely different and far faster system type."]},{"deck":"testing","system":"Water Spray","frequency":"","drill":false,"question":"A water spray system protects equipment where the nature of the protected property means water cannot be discharged during testing. What does NFPA 25 permit?","options":["Inspect the nozzles for proper orientation and test the system with air to confirm the nozzles are not obstructed","Waive the operational test entirely and rely on the annual visual nozzle inspection","Test with a foam-water solution instead of plain water to reduce equipment damage","Discharge only the hydraulically most remote branch line and extrapolate the results"],"correctIndex":0,"citation":"NFPA 25 (2020) §10.3.3.3.1.1","explanation":"When wetting the protected property is unacceptable, the standard substitutes a visual orientation check plus an air test that proves the nozzles are open and unobstructed — you still verify the flow path, just without water.","optionNotes":["Correct — nozzles are inspected for proper orientation and the system is tested with air to verify the nozzles are not obstructed.","The test is not waived; an alternate air-based method is prescribed.","Foam-water solution is not offered as a substitute in §10.3.3.3.1.1; foam-water systems are covered by Chapter 11.","Partial discharge and extrapolation is not a method recognized in §10.3.3.3."]},{"deck":"testing","system":"Water Spray","frequency":"","drill":false,"question":"During a water spray operational test, where must pressure readings be taken?","options":["At the hydraulically most remote nozzle, plus a second reading at the deluge valve","At the fire department connection and at the main drain outlet","At the system riser only, since that is where the design pressure is stated","At each nozzle in the protected area"],"correctIndex":0,"citation":"NFPA 25 (2020) §10.3.3.4.1 and §10.3.3.4.2","explanation":"The most remote nozzle reading proves flow has not been choked by a partially closed valve, plugged strainer, or obstructed piping. The second reading at the deluge valve confirms the water supply itself is adequate. Both are compared against the hydraulic design pressures.","optionNotes":["Correct — one reading at the hydraulically most remote nozzle and a second at the deluge valve.","The FDC and main drain outlet are not the specified pressure reading locations for this test.","A riser-only reading misses the remote nozzle. In fact, if the riser reading indicates the supply has deteriorated, §10.3.3.4.3.2 requires a gauge be placed on the hydraulically most remote nozzle and the results compared with the required design pressure.","Readings at every nozzle are not required; §10.3.3.4.3.1 even permits nozzles to be checked visually without a pressure reading when the most remote nozzle is inaccessible."]},{"deck":"testing","system":"Water Spray","frequency":"Annually","drill":true,"question":"Manual actuation devices on a water spray fixed system must be operated at what frequency?","options":["Annually","Quarterly","Monthly","At the start of each working shift"],"correctIndex":0,"citation":"NFPA 25 (2020) §10.3.5 and Table 10.1.1.2","explanation":"Manual release is what an operator reaches for when detection has not tripped yet. It is proven annually by actually operating it, and the component action table also requires checking for leaks at system working pressure and testing all alarms when a manual release is adjusted, repaired, or replaced.","optionNotes":["Correct — manual actuation devices are operated annually.","Quarterly is the drainage inspection interval for water spray systems (§10.2.7).","Monthly is the UHSWSS detector test and inspection interval (§10.4.2).","Start of each working shift applies to UHSWSS controllers (§10.4.3) and UHSWSS water supply line valves (§10.4.4.1)."]},{"deck":"testing","system":"Water Spray","frequency":"Annually (not exceeding 1 year)","drill":true,"question":"An Ultra-High-Speed Water Spray System (UHSWSS) requires a full operational test including measurement of response time. What is the maximum interval between these tests?","options":["Not exceeding 1 year","Not exceeding 6 months","Not exceeding 3 years","Not exceeding 18 months"],"correctIndex":0,"citation":"NFPA 25 (2020) §10.4.1 and Table 10.1.1.2","explanation":"A UHSWSS gets a full operational test, response time measurement included, at intervals not exceeding one year. In addition, a UHSWSS that has been out of service must be tested before it is placed back in service.","optionNotes":["Correct — full UHSWSS operational tests including response time measurement occur at intervals not exceeding 1 year.","Six months is not an interval used in Chapter 10.","Three years is a Chapter 9 tank interior interval, not a UHSWSS test interval.","Eighteen months is the ceiling for inspecting water spray items in areas inaccessible for safety considerations (§10.2.1.1), not the UHSWSS test interval."]},{"deck":"inspection","system":"Water Spray","frequency":"Monthly","drill":true,"question":"How often must the detectors on an Ultra-High-Speed Water Spray System be tested and inspected for physical damage and accumulation of deposits on the lenses of optical detectors?","options":["Monthly","Quarterly","At the start of each working shift","Annually"],"correctIndex":0,"citation":"NFPA 25 (2020) §10.4.2 and Table 10.1.1.2","explanation":"UHSWSS detectors — typically optical devices watching for a deflagration — are checked monthly. Film or dust on a lens will blind the detector, and at these response speeds there is no margin for a delayed signal.","optionNotes":["Correct — all UHSWSS detectors are tested and inspected monthly for physical damage and lens deposits.","Quarterly is the water spray drainage inspection interval, not the UHSWSS detector interval.","Start of each working shift applies to UHSWSS controllers (§10.4.3) and water supply line valves (§10.4.4.1), not detectors.","Annually is the UHSWSS full operational test interval (§10.4.1); the detector check is more frequent than the full system test."]},{"deck":"inspection","system":"Water Spray","frequency":"Start of each working shift","drill":false,"question":"On a UHSWSS installation, valves on the water supply line are inspected at the start of each working shift to verify they are open. When is that shift inspection NOT required?","options":["When the valve is held open by a locking device, or is supervised so that a trouble signal would reach the deluge control panel or another central monitoring point","When the facility operates only one shift per day","When the valves were verified open during the most recent annual operational test","When the valves are OS&Y type and the stem position is visible from the floor"],"correctIndex":0,"citation":"NFPA 25 (2020) §10.4.4.1 and §10.4.4.2","explanation":"A closed supply valve silently disables a UHSWSS, which is why the valve is confirmed open at every shift change. That confirmation becomes unnecessary once the valve is physically locked in the open position, or once supervision would announce the problem at the deluge control panel or another central monitoring point — the assurance already exists without sending someone to look.","optionNotes":["Correct — locking the valve open, or supervising it so that a trouble signal reaches the deluge control panel or another central monitoring point, removes the shift-start inspection requirement.","The number of shifts operated creates no exemption; the requirement is tied to the start of each working shift.","An annual test result does not substitute for confirming the valve is open right now, at shift start.","Visible stem position alone is not the exemption — what the standard accepts is a locking device or supervisory signaling, not merely being able to see the stem."]},{"deck":"testing","system":"Water Spray","frequency":"","drill":false,"question":"What is the maximum permitted response time for an Ultra-High-Speed Water Spray System, verified during the operational test?","options":["100 milliseconds","40 seconds","1 second","500 milliseconds"],"correctIndex":0,"citation":"NFPA 25 (2020) §10.4.5.1 and §10.4.5.2","explanation":"Response time must meet whatever the system's own requirements state, but in no case may it exceed 100 milliseconds. It is verified during the operational test — this speed is what lets the system knock down a deflagration before it develops.","optionNotes":["Correct — response time must meet the system requirements and shall not exceed 100 milliseconds.","40 seconds is the maximum operating time for a heat detection system under test conditions on a conventional water spray system (§10.3.3.1.1) — hundreds of times too slow for a UHSWSS.","One second is not a value used in §10.4.5.","500 milliseconds is not a value used in §10.4.5."]},{"deck":"maintenance","system":"Water Spray","frequency":"After the full flow test","drill":false,"question":"After a full flow test of a water spray system, what must be done with the low point drains in aboveground piping?","options":["Open them, drain the pipe, then close the valves and replace the plugs to prevent freezing and corrosion","Leave them open until the next scheduled inspection so the piping stays dry","Cap them permanently and rely on the main drain for future testing","Nothing — low point drains are only opened before a system is placed in service for the first time"],"correctIndex":0,"citation":"NFPA 25 (2020) §10.3.6.1.1 and §10.3.6.1.2","explanation":"Trapped water left in aboveground piping after a test freezes and corrodes. The standard requires opening every low point drain, draining the pipe, then closing the valves and replacing the plugs. Where weep holes are provided in lieu of low point drains, they are inspected to confirm they are clear and unobstructed.","optionNotes":["Correct — open, drain, then close the valves and replace the plugs, specifically to prevent freezing and corrosion.","Leaving drains open would defeat the system's ability to hold pressure and deliver water; the standard requires them closed and plugged after draining.","Permanently capping low point drains removes the means of draining trapped water and is not permitted by §10.3.6.1.1.","This is a return-to-service requirement after the full flow test, not a one-time commissioning step."]},{"deck":"general","system":"Foam-Water","frequency":"","drill":false,"question":"Chapter 11 of NFPA 25 sets the ITM rules for foam-water sprinkler systems. Which installation standard do the systems covered by Chapter 11 come from?","options":["NFPA 16","NFPA 11","NFPA 750","NFPA 409"],"correctIndex":0,"citation":"NFPA 25 (2020) §11.1.3.1 and §11.1.3.2","explanation":"Chapter 11 is scoped to foam-water sprinkler systems installed to NFPA 16, and the chapter expressly excludes systems detailed in NFPA 11.","optionNotes":["Correct — §11.1.3.1 ties the chapter to systems as specified in NFPA 16.","Wrong — §11.1.3.2 specifically carves NFPA 11 systems out of this chapter. NFPA 11 covers low-, medium-, and high-expansion foam systems.","Wrong — NFPA 750 is the water mist installation standard; NFPA 25 Chapter 12 handles water mist ITM.","Wrong — NFPA 409 is aircraft hangars. The footnote to Table 11.1.1.2 sends you to the NFPA 409 table for hangar foam-water systems, but that is a pointer for a special occupancy, not the chapter's scope."]},{"deck":"inspection","system":"Foam-Water","frequency":"Monthly","drill":true,"question":"You are setting up an ITM schedule for a foam-water deluge system whose discharge devices are open spray nozzles. How often must the location and position of those discharge devices be inspected?","options":["Monthly","Quarterly","Semiannually","Annually"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 11.1.1.2, §11.2.4","explanation":"Table 11.1.1.2 splits the discharge device inspection by device type: spray nozzles get a monthly location and position inspection, while sprinklers get the same inspection annually.","optionNotes":["Correct — spray nozzles are the monthly line item in Table 11.1.1.2.","Wrong — quarterly is the table interval for drainage in the system area (§11.2.7) and for foam concentrate strainers (§11.2.6.4), not for discharge devices.","Wrong — semiannual is not an interval used for foam-water discharge devices in Table 11.1.1.2.","Wrong — annually is the interval for discharge device location and position when the discharge devices are sprinklers, not spray nozzles. Annually is also the interval for the discharge device tests under 11.3.2.6."]},{"deck":"inspection","system":"Foam-Water","frequency":"Quarterly","drill":true,"question":"How often does NFPA 25 require inspection of the foam concentrate strainers on a foam-water sprinkler system?","options":["Quarterly","Monthly","Annually","Every 5 years"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 11.1.1.2, §11.2.6.4","explanation":"Foam concentrate strainers are a quarterly inspection item in Table 11.1.1.2.","optionNotes":["Correct — Table 11.1.1.2 lists foam concentrate strainers quarterly for inspection, referencing 11.2.6.4.","Wrong — monthly is the interval for proportioning systems (§11.2.8), spray nozzle discharge devices, and foam concentrate pump operation (§11.4.7.1).","Wrong — annually applies to pipe and fitting corrosion and damage, hangers and braces, and the water supply line item.","Wrong — 5 years is the mainline and individual discharge device strainer inspection for damaged and corroded parts (§11.2.6.1)."]},{"deck":"inspection","system":"Foam-Water","frequency":"","drill":false,"question":"What specific condition must be verified during the routine visual inspection of a foam concentrate strainer?","options":["That the blowdown valve is closed and plugged","That the basket or screen has been removed and inspected for damaged and corroded parts","That the strainer has been replaced with a new element","That the sight glass has been removed and cleaned"],"correctIndex":0,"citation":"NFPA 25 (2020) §11.2.6.4","explanation":"The routine visual check on the foam concentrate strainer is confirming that the blowdown valve is shut and plugged, so concentrate cannot be lost through it.","optionNotes":["Correct — §11.2.6.4 makes the blowdown valve position and plug the object of the visual inspection.","Wrong — pulling baskets or screens for inspection is triggered after each operation or flow test (§11.2.6.5), and the 5-year damaged/corroded parts inspection applies to mainline and individual discharge device strainers (§11.2.6.1).","Wrong — nothing in §11.2.6 requires routine replacement; §11.2.6.2 actually allows other maintenance intervals based on visual inspection and operating test results.","Wrong — removing and cleaning the sight glass is bladder tank proportioner maintenance (§11.4.5.1), a 10-year item in Table 11.1.1.2."]},{"deck":"inspection","system":"Foam-Water","frequency":"Every 5 years","drill":true,"question":"Mainline and individual discharge device strainers on a foam-water system must be inspected for damaged and corroded parts at what interval?","options":["Every 5 years","Quarterly","Annually","Every 10 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §11.2.6.1","explanation":"The damaged-and-corroded-parts inspection of mainline and individual discharge device strainers is on a 5-year cycle.","optionNotes":["Correct — §11.2.6.1 sets a 5-year inspection of these strainers for damaged and corroded parts.","Wrong — quarterly is the foam concentrate strainer inspection interval (§11.2.6.4).","Wrong — annually covers pipe and fitting corrosion and damage, hangers/braces/supports, and the water supply line item in Table 11.1.1.2.","Wrong — 10 years is used for foam concentrate tank maintenance items such as drain and flush and the corrosion/hydrostatic test (§11.4.4.2, §11.4.4.4)."]},{"deck":"inspection","system":"Foam-Water","frequency":"Quarterly","drill":true,"question":"How often must the drainage facilities beneath and around a foam-water spray system — trap sumps, drainage trenches, retention dikes — be inspected?","options":["Quarterly","Monthly","Annually","Every 5 years"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 11.1.1.2, §11.2.7","explanation":"Drainage in the system area is a quarterly inspection: you confirm the sumps and trenches are not blocked and the embankments or dikes are in good repair.","optionNotes":["Correct — Table 11.1.1.2 lists drainage in the system area quarterly, referencing 11.2.7.","Wrong — monthly covers proportioning systems, spray nozzle discharge devices, and foam concentrate pump operation.","Wrong — annual items include pipe and fitting corrosion and damage and hangers, braces, and supports.","Wrong — 5-year items include mainline strainers, pressure vacuum vents, and balancing valve diaphragms."]},{"deck":"inspection","system":"Foam-Water","frequency":"Monthly","drill":true,"question":"Table 11.1.1.2 gives one inspection frequency that covers all types of proportioning systems. What is it?","options":["Monthly","Quarterly","Semiannually","Annually"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 11.1.1.2, §11.2.8","explanation":"Every proportioning system type — standard pressure, bladder tank, line, standard balanced pressure, in-line balanced pressure, orifice plate — is inspected monthly.","optionNotes":["Correct — the table's line for proportioning system(s) — all is monthly, referencing 11.2.8.","Wrong — quarterly is drainage in the system area and foam concentrate strainers.","Wrong — semiannual is not used for foam-water proportioning systems in Table 11.1.1.2.","Wrong — annually is the interval for the complete foam-water system operational test and for the foam-water solution (concentration) test, both of which exercise the proportioner but are tests, not the monthly inspection."]},{"deck":"maintenance","system":"Foam-Water","frequency":"Monthly","drill":true,"question":"Table 11.1.1.2 lists foam concentrate pump operation as a maintenance item. How often must the concentrate pump be run and the concentrate circulated back to the tank?","options":["Monthly","Quarterly","Annually","Every 5 years"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 11.1.1.2, §11.4.7.1.1 and §11.4.7.1.2","explanation":"Running the foam concentrate pump and circulating concentrate back to the tank is a monthly exercise.","optionNotes":["Correct — the table shows foam concentrate pump operation monthly, referencing 11.4.7.1.","Wrong — quarterly applies to foam concentrate strainers and drainage in the system area.","Wrong — annually is the complete system operational test interval, not the pump exercise.","Wrong — 5 years is the maximum interval for servicing the foam pumps, drive train, and drivers per the manufacturer's instructions (§11.4.7.2, §11.4.8.2) — servicing, not routine operation."]},{"deck":"testing","system":"Foam-Water","frequency":"Annually","drill":true,"question":"How often must a complete foam-water sprinkler system operational test be performed?","options":["Annually","Quarterly","Every 3 years","Every 5 years"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 11.1.1.2, §11.3.2 and §11.3.3","explanation":"The complete foam-water sprinkler system operational test is an annual item, and it must confirm the system responds as designed both automatically and manually.","optionNotes":["Correct — Table 11.1.1.2 lists the complete foam-water sprinkler system operational test annually.","Wrong — quarterly is an inspection interval in this chapter (drainage, foam concentrate strainers), not a system test interval.","Wrong — 3 years is not an interval used in Chapter 11.","Wrong — 5 years covers maintenance items such as mainline strainers, pressure vacuum vents, ball drip drain valves, and balancing valve diaphragms."]},{"deck":"testing","system":"Foam-Water","frequency":"","drill":false,"question":"During an annual foam-water system test you take a foam sample and check it with a refractometer. What tolerance does NFPA 25 give for the proportioner's foam concentrate induction rate?","options":["The mix may never be leaner than the listed concentration, and may run rich by at most 30 percent of that value or 1 percentage point above it, whichever cap is smaller","Plus or minus 10 percent of the manufacturer's listed concentration","As lean as 10 percent below and as rich as 30 percent above the listed concentration","Plus or minus 1 percentage point, with no percentage-based limit"],"correctIndex":0,"citation":"NFPA 25 (2020) §11.3.5.4","explanation":"Induction rate is judged as a share of the total foam solution moving through the system — the water and the concentrate together. NFPA 25 allows no shortfall at all below the listed concentration, and caps how rich the mix may run at either 30 percent above the listed value or 1 percentage point above it, whichever of those two limits is tighter.","optionNotes":["Correct — this is the tolerance band set by §11.3.5.4, which NFPA 25 carries over from NFPA 16.","Wrong — a symmetric band would let the system run lean, and the standard permits no shortfall below the listed concentration.","Wrong — there is no allowance on the lean side at all; running below the listed concentration is a failure.","Wrong — the 1 percentage point figure is only the tighter of two caps on the rich side, not a standalone plus/minus tolerance."]},{"deck":"testing","system":"Foam-Water","frequency":"","drill":false,"question":"During a foam-water system flow test, where does NFPA 25 require pressure readings to be recorded?","options":["At the highest, most remote discharge device, with a second reading at the main control valve","At the system riser gauge only","At the deluge valve only","At the discharge of the foam concentrate pump only"],"correctIndex":0,"citation":"NFPA 25 (2020) §11.3.2.7.1 and §11.3.2.7.3","explanation":"Two readings are required: one at the highest and most remote discharge device and a second one at the main control valve. Both are then compared against the hydraulic design pressures per §11.3.2.7.4.","optionNotes":["Correct — the pair of readings called for by §11.3.2.7.1 and §11.3.2.7.3.","Wrong — a single riser reading does not prove the remote device is getting design pressure, which is the point of §11.3.2.7.1.","Wrong — taking a second reading at the deluge valve is the water mist requirement for systems with a deluge valve (§12.3.16.6.2). For foam-water, the second reading is at the main control valve.","Wrong — Chapter 11 does not designate the concentrate pump discharge as the required pressure reading location for the discharge test."]},{"deck":"inspection","system":"Foam-Water","frequency":"","drill":false,"question":"On a monthly inspection you find a foam-water spray nozzle that is no longer aimed where the design intended. What does NFPA 25 require?","options":["Re-aim it by eye during the inspection, then confirm its spray pattern at the next scheduled flow test","Replace the discharge device immediately","Perform an immediate full flow test to verify the corrected pattern","Record it as a deficiency only; no correction is required until the annual test"],"correctIndex":0,"citation":"NFPA 25 (2020) §11.2.4.3","explanation":"A device that has drifted off target is corrected visually right there during the inspection; proving out the resulting spray pattern waits for the next scheduled flow test rather than triggering one on the spot.","optionNotes":["Correct — §11.2.4.3 pairs visual re-aiming with pattern verification deferred to the next scheduled flow test.","Wrong — replacement is not the prescribed response to misalignment; §11.2.4.1 covers devices being in place, aimed as designed, and free of external loading and corrosion.","Wrong — the standard defers pattern verification to the next scheduled flow test instead of forcing an out-of-cycle one.","Wrong — the device has to be physically corrected, not just written up."]},{"deck":"inspection","system":"Foam-Water","frequency":"","drill":false,"question":"Before performing the inspection of a standard pressure proportioner or a bladder tank proportioner, what safety step does NFPA 25 require?","options":["Remove the pressure to prevent injury","Leave the unit at system working pressure so leaks are visible","Drain all foam concentrate from the tank","Lock out electrical power to the concentrate pump"],"correctIndex":0,"citation":"NFPA 25 (2020) §11.2.8.5.1.1 and §11.2.8.5.2.1","explanation":"Both the standard pressure proportioner and the bladder tank proportioner inspections begin with removing the pressure, because these are pressure vessels and the inspection is hands-on.","optionNotes":["Correct — the standard states plainly that pressure is removed before the inspection to prevent injury.","Wrong — there is a leak check performed under system working pressure, but it is a maintenance step on the bladder tank exterior (§11.4.5.2.2), not the routine proportioner inspection covered here.","Wrong — draining the concentrate is a 10-year maintenance action (for example §11.4.4.2 and §11.4.6.3), not a prerequisite to the routine inspection.","Wrong — verifying that power is available to the foam liquid pump is part of the balanced pressure and orifice plate proportioner inspections (§11.2.8.5.4 through §11.2.8.5.6); the standard does not make a lockout the stated prerequisite here."]},{"deck":"maintenance","system":"Foam-Water","frequency":"Every 5 years","drill":true,"question":"Foam pumps, drive train, and drivers on a balanced pressure proportioning system are serviced per the manufacturer's instructions and frequency, but NFPA 25 caps the interval. What is the maximum?","options":["5 years","3 years","Annually","10 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §11.4.7.2 and §11.4.8.2","explanation":"The manufacturer's schedule governs, but servicing may never be stretched beyond a 5-year interval.","optionNotes":["Correct — both the standard balanced pressure and in-line balanced pressure sections cap servicing at 5 years.","Wrong — 3 years is not an interval used in Chapter 11.","Wrong — annual is the interval for the complete system operational test and the foam-water solution test, not pump servicing.","Wrong — 10 years applies to foam concentrate tank items such as drain and flush and the corrosion/hydrostatic test."]},{"deck":"maintenance","system":"Foam-Water","frequency":"","drill":false,"question":"The 2020 edition added a specific constraint on how the bladder tank hydrostatic test is performed. What is it?","options":["The test must not create a pressure differential across the diaphragm","The test must be performed at 200 psi regardless of system working pressure","The test must be repeated annually","The bladder must be removed from the tank before testing"],"correctIndex":0,"citation":"NFPA 25 (2020) §11.4.5.2.1","explanation":"The hydrostatic test of a foam concentrate bladder tank has to be set up so pressure is balanced across the diaphragm — an unbalanced test can damage the bladder itself. The companion new requirement, §11.4.5.2.2, adds an exterior leak inspection while the tank is at system working pressure.","optionNotes":["Correct — this is the new requirement at §11.4.5.2.1.","Wrong — §11.4.5.2 ties the test pressure to system working pressure, not to a fixed number.","Wrong — Table 11.1.1.2 places the bladder tank hydrostatic test on a 10-year cycle.","Wrong — the standard does not call for bladder removal; it constrains the pressure differential across the diaphragm instead."]},{"deck":"maintenance","system":"Foam-Water","frequency":"Every 5 years","drill":false,"question":"On a standard pressure proportioning system, which maintenance task falls on the 5-year cycle?","options":["Disassemble, clean, and reassemble the ball drip (automatic-type) drain valves","Drain the foam liquid storage tank and flush it","Inspect the foam liquid tank for corrosion and hydrostatically test it","Remove and clean the sight glass"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 11.1.1.2, §11.4.4.1","explanation":"Under the standard pressure proportioner heading, Table 11.1.1.2 puts the ball drip drain valves at 5 years and the tank-related work at 10 years.","optionNotes":["Correct — ball drip (automatic type) drain valves are the 5-year item, and §11.4.4.1 describes disassembling, cleaning, and reassembling them.","Wrong — draining and flushing the foam liquid storage tank (§11.4.4.2) is a 10-year item in Table 11.1.1.2.","Wrong — the corrosion inspection and hydrostatic test of the foam liquid tank (§11.4.4.4) is a 10-year item.","Wrong — the sight glass removal and cleaning (§11.4.5.1) belongs to the bladder tank proportioner and is a 10-year item."]},{"deck":"maintenance","system":"Foam-Water","frequency":"Every 5 years","drill":false,"question":"You are performing the 5-year pressure vacuum vent maintenance on a foam concentrate tank. Which of the following does NFPA 25 prohibit?","options":["Using any type of oil for lubrication","Soaking the vent body and parts in hot soapy water","Spraying the parts with a light Teflon coating","Removing the vent bonnet"],"correctIndex":0,"citation":"NFPA 25 (2020) §11.4.9.11, with §11.4.9 setting the 5-year interval","explanation":"Oil is off limits on a pressure vacuum vent because it can gum the moving parts and contaminate the concentrate; the standard's own cleaning and lubrication method uses hot soapy water and a light Teflon coating instead.","optionNotes":["Correct — §11.4.9.11 bars any type of oil for lubrication purposes.","Wrong — hot soapy water soaking is what the standard prescribes when the liquid has become excessively gummy or solidified (§11.4.9.7).","Wrong — a light Teflon coating is the prescribed treatment before reassembly (§11.4.9.10).","Wrong — removing the bonnet is a required step in the procedure (§11.4.9.3), and it is replaced afterward with the vent turned upside down slowly a few times to confirm free movement (§11.4.9.12)."]},{"deck":"general","system":"Foam-Water","frequency":"","drill":false,"question":"A batch of foam concentrate in a foam-water system is replaced. Per the component action table, what does NFPA 25 require after that replacement?","options":["Send a sample out for laboratory analysis to confirm it still meets the manufacturer's specification","Hydrostatically test the concentrate tank","Perform a full-flow main drain test","Run a flow test and check the proportioning ratio with a refractometer"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 11.5.1, §11.5.1","explanation":"Table 11.5.1 pairs each component action — adjust, repair/recondition, or replace — with a required verification. For foam concentrate, that verification is laboratory analysis of a sample against the manufacturer's specification.","optionNotes":["Correct — this is the action Table 11.5.1 assigns to the foam concentrate row.","Wrong — in Table 11.5.1 the foam concentrate tank row calls for inspecting its condition and repairing as appropriate. The table's only hydrostatic test is for pipe and fittings on a closed-head system; the 10-year tank hydrostatic test lives separately in §11.4.4.4.","Wrong — the full-flow main drain test is the action listed for the main drain row of Table 11.5.1.","Wrong — the flow test plus refractometer (or equivalent) proportioning check is the action listed for the proportioning system(s) row, not the foam concentrate row."]},{"deck":"general","system":"Water Mist","frequency":"","drill":false,"question":"Chapter 12 does not give an inspection, testing, or maintenance criterion for a particular common component on a water mist system. Which chapter do you fall back to?","options":["Chapter 13","Chapter 6","Chapter 14","Chapter 15"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.1.2","explanation":"Chapter 12 stands alone for water-mist-specific items; anything about common components and valves that Chapter 12 does not address is governed by Chapter 13.","optionNotes":["Correct — §12.1.2 sends unaddressed common components and valves to Chapter 13.","Wrong — Chapter 6 is invoked with Chapter 13 for hose connections specifically (§12.1.4), not as the general fallback.","Wrong — Chapter 14 covers internal piping conditions and obstruction investigations; Table 12.1.1.2 references it for internal piping conditions only.","Wrong — Chapter 15 is referenced for impairments (§12.1.3), not as the general common-component fallback."]},{"deck":"inspection","system":"Water Mist","frequency":"Annually","drill":true,"question":"A water mist system protects a high-bay area with nozzles about 22 ft above the floor. What routine inspection does NFPA 25 require of those nozzles?","options":["Inspect them annually from the floor level","Inspect them quarterly from the floor level","Inspect them annually, with each nozzle examined at close range from a lift","No inspection is required because the nozzles are out of reach"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.2.1.1; Table 12.1.1.2","explanation":"Water mist nozzles are inspected annually, and the standard expressly permits that inspection to be made from the floor level. Table 12.1.1.2 adds that nozzles are also inspected after each system discharge or activation.","optionNotes":["Correct — §12.2.1.1 sets an annual inspection from floor level.","Wrong — quarterly is used for other water mist items such as compressed gas cylinder securement (§12.2.5.1.1), unsupervised water levels in high-pressure cylinders (§12.2.5.5.1), and water supply pressure (§12.2.10.1).","Wrong — the standard does not require close-range examination of each nozzle; floor level is expressly acceptable.","Wrong — height does not exempt nozzles. The only relief is for nozzles in concealed spaces (§12.2.1.1.4), and nozzles in areas inaccessible for safety reasons are inspected during each scheduled shutdown (§12.2.1.1.5)."]},{"deck":"inspection","system":"Water Mist","frequency":"","drill":false,"question":"Water mist nozzles are installed in a concealed space above a suspended ceiling. What does NFPA 25 require for their routine inspection?","options":["They do not require inspection","They must be inspected annually from below the ceiling grid","They must be inspected during each scheduled shutdown","They must be inspected every 5 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.2.1.1.4","explanation":"Nozzles in concealed spaces such as above suspended ceilings are exempt from the routine inspection requirement — the same relief applies to piping, tubing, fittings (§12.2.3.4) and to hangers, braces, and supports (§12.2.4.4) in those spaces.","optionNotes":["Correct — §12.2.1.1.4 exempts concealed-space nozzles from inspection.","Wrong — the annual floor-level inspection of §12.2.1.1 applies to nozzles that are visible from the floor, not to concealed-space nozzles, which are exempted outright.","Wrong — inspection at each scheduled shutdown is the requirement for nozzles in areas inaccessible for safety considerations due to process operations (§12.2.1.1.5), which is a different situation than a concealed ceiling space.","Wrong — 5 years is not an inspection interval for nozzles; the 5-year figures in Chapter 12 relate to testing intervals and cylinder inspections."]},{"deck":"inspection","system":"Water Mist","frequency":"","drill":false,"question":"During an annual inspection you find a glass-bulb water mist nozzle whose bulb is about half full of fluid. What does NFPA 25 require?","options":["Replace the nozzle","Leave it in service as long as the bulb is not completely empty","Re-test the nozzle in a laboratory before deciding","Replace it only if the same condition is found at the next annual inspection"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.2.1.1.3, with §12.2.1.1.1(4)","explanation":"Partial loss of bulb fluid is treated the same as total loss — the nozzle comes out. §12.2.1.1.1 already lists loss of fluid in the glass bulb heat responsive element as a replacement trigger, and §12.2.1.1.3 makes clear that partially empty counts.","optionNotes":["Correct — §12.2.1.1.3 requires replacement when the bulb is partially or fully empty.","Wrong — the standard specifically covers partially empty bulbs, so 'not completely empty' is not a basis for leaving it in service.","Wrong — laboratory testing is for representative sample programs under §12.3.1, not for a nozzle with an obvious physical defect.","Wrong — deferring is not permitted; the replacement triggers in §12.2.1.1.1, which also include leakage, corrosion, physical damage, loading, and unapproved painting, require action."]},{"deck":"testing","system":"Water Mist","frequency":"At 10 years and every 5 years thereafter","drill":false,"question":"Automatic water mist nozzles in a normal (non-harsh) environment have been in service 10 years. What does NFPA 25 require?","options":["Replace them, or test representative samples and then retest at 5-year intervals","Replace them all; sample testing is not permitted at 10 years","Nothing until they reach 20 years in service","Replace them, or test representative samples and then retest at 10-year intervals"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.3.1.2; Table 12.1.1.2","explanation":"At 10 years the owner has a choice: replace the nozzles outright, or run a representative sample through a testing laboratory and then repeat that sample testing every 5 years thereafter.","optionNotes":["Correct — matches §12.3.1.2 and the Table 12.1.1.2 entry 'at 10 years and every 5 years thereafter.'","Wrong — sample testing is expressly offered as an alternative to wholesale replacement.","Wrong — 20 years is not an interval in Chapter 12.","Wrong — the retest cycle after the first sample test is 5 years, not 10."]},{"deck":"testing","system":"Water Mist","frequency":"At 5 years and every 5 years thereafter","drill":false,"question":"Automatic water mist nozzles are installed in a harsh environment with a corrosive atmosphere. On what basis must they be replaced or sample-tested?","options":["On a 5-year basis","On a 10-year basis","On a 1-year basis","On a 20-year basis"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.3.1.3; Table 12.1.1.2","explanation":"Harsh environments — including corrosive atmospheres and corrosive water supplies — pull automatic nozzles onto a 5-year replace-or-sample-test cycle instead of the normal 10-year first check.","optionNotes":["Correct — §12.3.1.3 sets the 5-year basis, and Table 12.1.1.2 lists automatic nozzles in harsh environments at 5 years and every 5 years thereafter.","Wrong — 10 years is the first-check interval for automatic nozzles in normal environments (§12.3.1.2) and for open nozzles under §12.3.2.3.","Wrong — the 1-year basis applies to open water mist nozzles subjected to residues, corrosive atmospheres, and corrosive water supplies (§12.3.2.2), not to automatic nozzles.","Wrong — 20 years is not an interval used in Chapter 12."]},{"deck":"testing","system":"Water Mist","frequency":"Annually","drill":true,"question":"Open water mist nozzles are installed where they are subjected to residues and a corrosive water supply. How often must they be replaced or representative samples tested?","options":["On a 1-year basis","On a 5-year basis","On a 10-year basis","Only after each system discharge"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.3.2.2; Table 12.1.1.2","explanation":"Open nozzles exposed to residues or corrosive conditions are on the tightest nozzle cycle in the chapter — annual replacement or sample testing.","optionNotes":["Correct — §12.3.2.2 puts these open nozzles on a 1-year basis, and Table 12.1.1.2 lists 'nozzles, open (harsh environments)' as annual.","Wrong

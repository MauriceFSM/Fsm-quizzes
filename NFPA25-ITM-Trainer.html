blanket annual cap gasket replacement for hydrants; the hydrant inspection lists address the tightness of outlet caps and worn threads, and the named annual maintenance task is lubrication."]},{"deck":"testing","system":"Fire Pump","frequency":"","drill":false,"question":"You are running a weekly no-flow (churn) test on a diesel engine-driven fire pump. The engine has been running for 12 minutes and everything looks normal. Can you shut it down?","options":["No — a diesel pump must run a minimum of 30 minutes","Yes — 10 minutes is the minimum for any fire pump","No — a diesel pump must run a minimum of 45 minutes","Yes — as long as the engine reached rated speed, run time is not specified"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.2.4","explanation":"The standard sets separate minimum churn run times by driver type, and the diesel engine gets the longer one — half an hour — because the engine needs that time to reach stable operating temperature and reveal cooling, fuel, and exhaust problems that a short run would hide.","optionNotes":["Correct — §8.3.2.4 sets 30 minutes as the minimum for a diesel-driven pump during the no-flow test.","10 minutes is the minimum for an ELECTRIC motor-driven pump under §8.3.2.3, not a diesel.","45 minutes is not a run time used anywhere in Chapter 8; the diesel figure is 30 minutes.","Run time is specified. §8.3.2.4 gives an explicit minimum, and §8.3.3.10(4) repeats the 30-minute floor for diesels during the annual flow test."]},{"deck":"testing","system":"Fire Pump","frequency":"","drill":false,"question":"During a no-flow test of an electric motor-driven fire pump, what is the minimum time the pump must run before it can be shut down?","options":["10 minutes","5 minutes","30 minutes","2 minutes"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.2.3","explanation":"An electric motor-driven pump has no engine to warm up, so the standard allows a shorter churn run than a diesel — ten minutes, which is also repeated as the minimum before shutdown during the annual flow test.","optionNotes":["Correct — §8.3.2.3 requires the electric pump to run at least 10 minutes, and §8.3.3.10(3) repeats the same 10-minute floor during the annual test.","5 minutes is not a run time in Chapter 8. It is close to the 5-minute personnel response time for remotely monitored automated testing in §8.3.2.10.4, which is a different subject.","30 minutes is the diesel engine-driven pump minimum under §8.3.2.4, not the electric minimum.","2 minutes is the minimum time the pump must continue to perform at peak horsepower load on the alternate power source during the automatic transfer switch test, §8.3.3.12(4)."]},{"deck":"testing","system":"Fire Pump","frequency":"Weekly","drill":true,"question":"A building is served by a vertical turbine fire pump with an electric motor driver. There is no redundant fire pump, and no approved risk analysis has been performed. The owner wants to move the no-flow test to a monthly schedule to save labor. What does NFPA 25 require?","options":["Weekly — vertical turbine fire pumps are specifically listed as requiring the weekly no-flow frequency","Monthly is permitted for any electric motor-driven pump","Weekly, but only if the pump also has a limited service controller","Quarterly, because vertical turbine pumps are tested less often than horizontal split-case pumps"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.1.2.1(3)","explanation":"Vertical turbine pumps are one of four categories of electric motor-driven pump that NFPA 25 holds to the weekly churn schedule. The general monthly step-down is written only for electric pumps outside that list, and the two other routes off weekly — a redundant fire pump, or a frequency set by an approved risk analysis — do not apply to this installation.","optionNotes":["Correct — §8.3.1.2.1(3) lists vertical turbine fire pumps among the electric pumps that require the weekly no-flow test frequency.","Monthly under §8.3.1.2.2 is permitted only for electric fire pumps NOT identified in §8.3.1.2.1. A vertical turbine pump is identified there, so it does not qualify. (Two separate allowances CAN move a listed pump off weekly — a redundant fire pump under §8.3.1.2.3, or an approved risk analysis under §8.3.1.2.4 — but neither exists at this site.)","The limited service controller is a separate qualifying condition at §8.3.1.2.1(2). Either condition on its own triggers the weekly frequency — they are not cumulative.","Chapter 8 contains no quarterly no-flow test frequency for any pump. Quarterly appears for the engine crankcase breather (§8.1.1.2.12) and the interstitial space fuel tank monitoring (§8.1.1.2.7)."]},{"deck":"testing","system":"Fire Pump","frequency":"Monthly","drill":true,"question":"An electric motor-driven fire pump takes suction from a pressurized city main, has a full-service controller, is horizontal split-case, and the fire department can reach the top floor with its apparatus. What no-flow test frequency does NFPA 25 permit?","options":["Monthly","Weekly, with no exception","Semiannually","Annually, combined with the flow test"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.1.2.2","explanation":"This pump does not fall into any of the four categories that keep the weekly frequency, so the monthly allowance applies. The monthly step-down was written for electric pumps whose failure risk and consequence are lower than the listed categories.","optionNotes":["Correct — §8.3.1.2.2 permits a monthly no-flow frequency for electric fire pumps not identified in §8.3.1.2.1, and none of those four conditions apply here.","Weekly is required for the four categories in §8.3.1.2.1 and remains the baseline for diesel pumps under §8.3.1.1.1 — but this pump is outside those categories.","Chapter 8 has no semiannual no-flow test frequency. Semiannual appears only as the fuel retest interval after a fuel restoration, §8.3.4.2.1.","The annual flow test under §8.3.3 is a separate, additional requirement — it never replaces the no-flow test required by §8.3.1."]},{"deck":"testing","system":"Fire Pump","frequency":"Weekly","drill":true,"question":"What is the baseline no-flow test frequency for a diesel engine-driven fire pump, and what is the only alternative the standard allows?","options":["Weekly, unless a different frequency is established by an approved risk analysis","Monthly, unless the AHJ approves weekly","Weekly, with no alternative permitted","Monthly, unless the pump has a redundant standby pump"],"correctIndex":0,"citation":"NFPA 25 (2020) §§8.3.1.1.1 and 8.3.1.1.2","explanation":"Diesel pumps stay on the weekly churn schedule as the default. The 2020 edition permits one route away from weekly — an approved risk analysis — and there is no blanket monthly allowance for diesels the way there is for certain electric pumps.","optionNotes":["Correct — §8.3.1.1.1 requires weekly except as permitted in §8.3.1.1.2, which allows the frequency to be established by an approved risk analysis.","There is no monthly baseline for diesel pumps. Monthly applies only to certain electric pumps under §8.3.1.2.2 and §8.3.1.2.3.","An alternative does exist: §8.3.1.1.2 permits an approved risk analysis to set the frequency.","The redundant-pump allowance at §8.3.1.2.3 is written for electric fire pump systems, not diesel drivers, and it is a monthly allowance rather than a baseline."]},{"deck":"testing","system":"Fire Pump","frequency":"Monthly","drill":true,"question":"A facility has two electric fire pumps arranged so that either one alone can meet the system demand. What no-flow test frequency does NFPA 25 permit for these pumps?","options":["Monthly, because the system has a redundant fire pump","Weekly, because redundancy does not change the frequency","Quarterly, because two pumps share the duty","Annually, because the redundant pump acts as the backup during testing"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.1.2.3","explanation":"Redundancy is one of the specific conditions the 2020 edition recognizes for stepping an electric fire pump system down from weekly to monthly churn testing — if one pump fails between tests, the other is standing by.","optionNotes":["Correct — §8.3.1.2.3 permits a monthly test frequency for electric fire pump systems having a redundant fire pump.","Redundancy does change the permitted frequency for electric pumps; §8.3.1.2.3 is an explicit allowance.","There is no quarterly no-flow frequency in Chapter 8. Quarterly is the interval for the engine crankcase breather inspection (§8.1.1.2.12) and interstitial-space liquid intrusion testing (§8.1.1.2.7).","Annual is the flow test frequency under §8.3.3, not a substitute for the no-flow test."]},{"deck":"testing","system":"Fire Pump","frequency":"Annually","drill":false,"question":"At which flow conditions must a constant speed fire pump assembly be tested during the annual flow test?","options":["No-flow (churn), rated flow, and 150 percent of rated capacity","No-flow (churn), 100 percent, and 125 percent of rated capacity","25, 50, 75, 100, 125, and 150 percent of rated capacity","Rated flow and 150 percent of rated capacity only"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.3.1","explanation":"The classic three-point annual test defines the working pump curve: shutoff pressure at churn, the rated duty point, and the overload point at one and a half times rated capacity. NFPA 25 judges the results by comparing net pressure at each point against the pump's original curve, not against a fixed percentage of rated pressure.","optionNotes":["Correct — §8.3.3.1 requires the constant speed pump to be tested at no-flow (churn), rated flow, and 150 percent of rated capacity.","125 percent is a test point only in the variable-speed test series of §8.3.3.2; it is not one of the three constant-speed points, and 150 percent is missing here.","That seven-point series is the annual test for a VARIABLE-SPEED pump assembly under variable-speed control, §8.3.3.2 — not a constant speed pump.","Churn is required. Shutoff pressure at no flow is one of the three mandatory points and is where the circulation and pressure relief valves are checked per §8.3.3.10(1)."]},{"deck":"testing","system":"Fire Pump","frequency":"Annually","drill":false,"question":"A variable-speed fire pump assembly is being flow tested annually under variable-speed control. How many flow points does NFPA 25 require, and what are they?","options":["Seven — no-flow (churn) plus 25, 50, 75, 100, 125, and 150 percent of rated capacity","Three — no-flow (churn), 100 percent, and 150 percent of rated capacity","Five — no-flow (churn) plus 50, 100, 125, and 150 percent of rated capacity","Four — 25, 50, 100, and 150 percent of rated capacity"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.3.2","explanation":"A variable-speed drive can hold discharge pressure across the flow range, so the standard demands many more data points under variable-speed control to prove the controller is actually regulating correctly rather than just hitting the endpoints.","optionNotes":["Correct — §8.3.3.2 requires churn plus 25, 50, 75, 100, 125, and 150 percent under variable-speed control.","Churn, 100 percent, and 150 percent is the test series required when the SAME variable-speed assembly is run under constant speed control, §8.3.3.3 — both series are required, but this is the wrong one for variable-speed control.","75 percent is missing from this list. §8.3.3.2 includes every 25 percent increment from 25 through 150.","This drops 75 and 125 percent, both of which §8.3.3.2 requires, and omits the churn point."]},{"deck":"testing","system":"Fire Pump","frequency":"","drill":false,"question":"During annual testing you find the available suction supply will not allow the pump to flow 150 percent of rated capacity without dropping below the lowest permissible suction pressure. What does NFPA 25 require you to do?","options":["Test at 100 percent of the rated flow rate and at the maximum flow allowed at the lowest permissible suction pressure","Skip the flow test and perform an extended churn test instead","Flow 150 percent anyway and note the low suction pressure as a deficiency","Test at 125 percent of rated capacity as the substitute overload point"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.3.4","explanation":"The standard does not let you damage the pump by cavitating it to reach a paper number. When the water supply physically cannot support 150 percent, you get the rated point plus the highest flow the supply will actually deliver within its permissible suction pressure, and that becomes the test.","optionNotes":["Correct — §8.3.3.4 requires testing at 100 percent of rated flow and at the maximum flow allowed at the lowest permissible suction pressure.","Churn is only one of the required points; there is no provision to substitute a longer churn run for the flow portion of the annual test.","Flowing past the lowest permissible suction pressure risks cavitation and damage. §8.3.3.4 specifically caps the test at the maximum flow the suction will support, which is the opposite of pushing through.","125 percent is a variable-speed test point under §8.3.3.2. §8.3.3.4 does not name a fixed substitute percentage — the substitute point is whatever flow the suction supply actually allows."]},{"deck":"testing","system":"Fire Pump","frequency":"Annually","drill":true,"question":"How often must the gauges, transducers, and other measuring devices used during a fire pump test (other than flow meters) be calibrated, and to what accuracy?","options":["At least annually, to an accuracy level of plus or minus 1 percent","At least annually, to an accuracy level of plus or minus 3 percent","Every 5 years, to an accuracy level of plus or minus 1 percent","At least quarterly, to an accuracy level of plus or minus 5 percent"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.3.5.2","explanation":"Pressure-measuring instruments carry the tighter tolerance because the pass/fail decision on a fire pump turns on net pressure. They must also carry a label showing the latest calibration date.","optionNotes":["Correct — §8.3.3.5.2 requires calibration a minimum of annually to plus or minus 1 percent, and §8.3.3.5.1 requires a label showing the latest calibration date.","Plus or minus 3 percent is the accuracy required for FLOW METERS under §8.3.3.5.3, which are specifically excepted from the 1 percent rule.","The 5-year interval belongs to elastomeric power-transmitting components such as torsional couplings, §8.1.1.2.23 — not to instrument calibration.","There is no quarterly calibration requirement, and 5 percent is the threshold at which permanently installed pressure gauges and sensors must be replaced or recalibrated under §8.1.1.2.22, a different rule."]},{"deck":"testing","system":"Fire Pump","frequency":"Annually","drill":false,"question":"A contractor's bypass flow meter has a calibration sticker showing it was last calibrated 14 months ago to plus or minus 3 percent. What is the problem?","options":["The calibration is overdue — flow meters must be calibrated annually","The accuracy is wrong — flow meters must be calibrated to plus or minus 1 percent","Nothing — flow meters have no calibration interval, only a labeling requirement","Both the interval and the accuracy are wrong — flow meters require quarterly calibration to plus or minus 1 percent"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.3.5.3","explanation":"Flow meters get their own rule: annual calibration, and a looser tolerance than pressure instruments because measuring moving water is inherently less precise than measuring static pressure. The interval here has lapsed even though the accuracy is correct.","optionNotes":["Correct — §8.3.3.5.3 requires flow meters to be calibrated annually to plus or minus 3 percent, so 14 months is past due while the 3 percent figure is right.","Plus or minus 1 percent is the accuracy for gauges, transducers, and other devices EXCEPT flow meters, §8.3.3.5.2. Flow meters are expressly carved out.","Flow meters do have a calibration interval — annual, per §8.3.3.5.3. The labeling requirement in §8.3.3.5.1 is in addition to, not instead of, calibration.","There is no quarterly calibration requirement in Chapter 8, and the 3 percent accuracy shown on this meter is the correct tolerance."]},{"deck":"testing","system":"Fire Pump","frequency":"Every 3 years","drill":true,"question":"A facility has flow tested its fire pump using closed-loop bypass metering back to pump suction for the last two consecutive annual tests. What does NFPA 25 require for this year's test?","options":["Discharge via hose streams or via bypass flow meter to drain or suction reservoir, because that arrangement must be used at least every third year","Closed-loop metering again, since it is an approved permanent arrangement","Discharge via hose streams only — closed-loop metering is never permitted","Any arrangement the owner prefers, since all three methods are equally acceptable every year"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.3.9","explanation":"Closed-loop metering is convenient but recirculates the same water and can mask a degraded suction supply or a fouled meter. The standard therefore caps it at two years out of three and forces an open-discharge arrangement on the third year to verify the water supply as well as the pump.","optionNotes":["Correct — §8.3.3.9(1) requires the arrangement in §8.3.3.9.1 (hose streams) or §8.3.3.9.2 (bypass flow meter to drain or suction reservoir) at a minimum of every third year.","§8.3.3.9(2) permits closed-loop metering only 2 out of every 3 years; this facility has already used both of its allowed years.","Closed-loop metering is permitted — §8.3.3.9.3 describes it in detail — just not every year.","The three arrangements are not interchangeable year to year. §8.3.3.9 sets an explicit rotation requirement."]},{"deck":"testing","system":"Fire Pump","frequency":"","drill":false,"question":"This year's closed-loop bypass flow meter test produces results that do not line up with last year's annual test. What does NFPA 25 require next?","options":["Repeat the test using the hose stream discharge arrangement","Accept the results and note the discrepancy in the report","Repeat the closed-loop test a second time and average the two results","Declare the pump impaired and take it out of service immediately"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.3.9.3.3","explanation":"When closed-loop numbers drift from the prior year, the standard assumes the meter may be lying before it assumes the pump has failed. The fix is to retest by actually flowing water out through hose streams, which is the most direct measurement available.","optionNotes":["Correct — §8.3.3.9.3.3 requires the test to be repeated using the arrangement described in §8.3.3.9.1, which is discharge via hose streams.","Inconsistent results are not something to simply document. §8.3.3.9.3.3 makes a retest mandatory.","Repeating the same closed-loop arrangement does not resolve the question of whether the meter itself is the problem, and the standard names the hose stream arrangement specifically.","An impairment declaration under §8.3.7.2.4(3) is tied to failure to provide the maximum system demand, not to an inconsistency between two test arrangements. The retest comes first."]},{"deck":"testing","system":"Fire Pump","frequency":"","drill":false,"question":"Closed-loop metering gave inconsistent results, and site conditions make a hose stream test impossible. What does NFPA 25 require?","options":["Calibrate the flow meter and repeat the test","Accept the closed-loop results as final","Wait until the next annual test cycle and try the hose stream method then","Test using the bypass flow meter to drain arrangement without any calibration"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.3.9.3.4","explanation":"If you cannot fall back on the most direct measurement method, the standard makes you eliminate the most likely source of error instead — the meter itself — and then rerun the test.","optionNotes":["Correct — §8.3.3.9.3.4 requires flow meter calibration to be performed and the test repeated when testing per §8.3.3.9.1 is not possible.","Accepting inconsistent results is exactly what §8.3.3.9.3.3 and §8.3.3.9.3.4 are written to prevent.","There is no provision to defer the resolution of an inconsistent test to a future year; the retest requirement is immediate.","Calibration is the required step. Simply changing arrangements without calibrating the meter leaves the suspect instrument unverified."]},{"deck":"general","system":"Fire Pump","frequency":"","drill":false,"question":"Before performing the annual fire pump flow test using hose streams, what must the testing entity do?","options":["Tell the owner or the owner's representative, ahead of time, where the water will be discharged, roughly how much will flow, and how long the test will last","Obtain written AHJ approval for the discharge location","File a discharge permit with the water purveyor","Nothing beyond notifying the central station of the alarm test"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.3.9.1.2","explanation":"This 2020 addition exists because a hose stream test dumps a large volume of water for an extended time. The owner needs to know where it is going, roughly how much, and for how long, so drainage, erosion, and property damage can be managed before the valves open.","optionNotes":["Correct — §8.3.3.9.1.2 puts an advance-notice duty on whoever performs the test, covering three specifics: discharge location, approximate flow rate, and how long the flowing will last.","§8.3.3.9.1.2 places the notification duty toward the owner or their representative; it does not require AHJ written approval of the discharge location.","A water purveyor permit may be a local requirement, but it is not what §8.3.3.9.1.2 requires.","Notification of the owner is required and is broader than an alarm-test courtesy call — it must cover where, roughly how much, and for how long."]},{"deck":"testing","system":"Fire Pump","frequency":"Annually","drill":false,"question":"During evaluation of an annual flow test, what is the minimum net pressure the pump must produce at each flow point for the results to be considered acceptable?","options":["At least 95 percent of the original manufacturer's pump curve, the original unadjusted field test curve, or a curve generated from the fire pump nameplate","At least 90 percent of the original manufacturer's pump curve","At least 100 percent of the original manufacturer's pump curve","At least 95 percent of the previous year's test curve"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.7.2.3(3)","explanation":"The standard allows five percent of degradation before the pump is judged unacceptable, and it lets you measure that against any one of three reference curves — the factory curve, the original acceptance-test curve, or a curve built from the nameplate data if no curve survives on site.","optionNotes":["Correct — §8.3.7.2.3(3) accepts net pressure at each flow point that is at least 95 percent of the manufacturer's curve, the original unadjusted field test curve, or a nameplate-generated curve.","90 percent is not a threshold used in §8.3.7.2.3. The acceptance floor is 95 percent.","Requiring a full 100 percent would fail nearly every pump in service; the standard deliberately permits 5 percent degradation.","The comparison baseline is the ORIGINAL curve (factory, original field test, or nameplate), not last year's test. Comparing to previous results is a report content item under §8.4.1.1(7), not the acceptance criterion."]},{"deck":"general","system":"Fire Pump","frequency":"","drill":false,"question":"An annual flow test shows the pump cannot deliver the maximum system demand. How does NFPA 25 classify this condition?","options":["An impairment","A noncritical deficiency","A deficiency, but not an impairment","An observation requiring no formal classification"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.7.2.4(3)","explanation":"When the pump cannot make the demand the system was designed around, the protected property is effectively not protected to design. The standard elevates that to an impairment, which triggers the Chapter 15 impairment procedures rather than a routine correction letter.","optionNotes":["Correct — §8.3.7.2.4(3) states that failure to provide the maximum system demand is deemed an impairment.","Noncritical deficiency is the classification for DEGRADED performance that still provides the maximum system demand, §8.3.7.2.4(5). This pump cannot make the demand at all.","Deficiency (without impairment) is how §8.3.7.2.4(4) classifies excessive vibration or excessively worn or loose components — a condition that has not yet cost the pump its capacity.","The standard requires a formal classification here, plus written notification to the owner under §8.3.7.2.4(1) and an investigation under §8.3.7.2.4(2)."]},{"deck":"general","system":"Fire Pump","frequency":"","drill":false,"question":"A fire pump's annual test curve has dropped below the acceptance criteria, but the pump still supplies the maximum system demand. How does NFPA 25 classify this?","options":["A noncritical deficiency","An impairment","A critical deficiency requiring immediate shutdown","Acceptable performance requiring no action"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.7.2.4(5)","explanation":"The standard separates \"the pump is getting weaker\" from \"the pump can no longer do the job.\" As long as the design demand is still being met, the degradation is tracked as a noncritical deficiency rather than an impairment — but it is still a finding the owner must be notified of in writing.","optionNotes":["Correct — §8.3.7.2.4(5) deems degraded performance that still provides the maximum system demand a noncritical deficiency.","Impairment is reserved for FAILURE to provide the maximum system demand, §8.3.7.2.4(3). This pump still makes the demand.","Chapter 8 does not use a 'critical deficiency requiring immediate shutdown' classification for this condition, and shutting the pump down would create the impairment the classification is trying to avoid.","Action is required: §8.3.7.2.4(1) requires written notification of the unacceptable test results and §8.3.7.2.4(2) requires an investigation into the cause."]},{"deck":"testing","system":"Fire Pump","frequency":"","drill":false,"question":"An annual flow test fails to meet the acceptance criteria of NFPA 25. While investigating the cause, the technician documents excessive vibration and an excessively worn and loose coupling component. Under NFPA 25's evaluation rules, how is that mechanical condition classified?","options":["A deficiency","An impairment","A noncritical deficiency","No classification applies — Chapter 8's evaluation rules address only flow and pressure results"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.7.2.4(4)","explanation":"When a pump fails its acceptance criteria, NFPA 25 walks you through a required set of actions and classifications. Vibration and worn or loose components get their own line in that list, separate from any performance shortfall, and the standard labels them a deficiency.","optionNotes":["Correct — §8.3.7.2.4(4) deems excessive vibration and/or excessively worn or loose components a deficiency.","Impairment applies specifically to failure to provide the maximum system demand, §8.3.7.2.4(3).","Noncritical deficiency is reserved for degraded performance that still meets the maximum system demand, §8.3.7.2.4(5) — a performance condition, not a mechanical wear condition.","Mechanical condition is covered. §8.3.7.2.4(4) sits in the same required-action list as the performance classifications, alongside written notification to the owner (1) and an investigation into the cause (2)."]},{"deck":"testing","system":"Fire Pump","frequency":"","drill":false,"question":"A diesel fire pump is falling slightly short of its rated pressure during the annual test. A technician suggests bumping the governor to raise engine speed above rated speed so the pump makes its numbers. What does NFPA 25 say?","options":["Not permitted — increasing engine speed beyond rated speed cannot be used as a method of meeting rated pump performance","Permitted, provided the increase is recorded in the test report","Permitted, provided the speed increase does not exceed 5 percent","Permitted only if the pump is a variable-speed assembly"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.7.2.2","explanation":"Overspeeding masks a failing pump instead of finding it, and it pushes the driver and rotating assembly outside their listed operating conditions. The standard closes this shortcut explicitly.","optionNotes":["Correct — §8.3.7.2.2 prohibits increasing engine speed beyond the rated speed of the pump as a method for meeting rated pump performance.","Recording the change does not make it permissible; the prohibition in §8.3.7.2.2 is absolute.","There is no percentage allowance for overspeeding. The 5 percent figures elsewhere in Chapter 8 concern voltage tolerance (§8.3.7.2.9), pressure gauge calibration (§8.1.1.2.22), and the 95 percent net pressure acceptance floor (§8.3.7.2.3) — none of them permit overspeed.","Variable-speed pumps are tested under both variable-speed and constant-speed control per §§8.3.3.2 and 8.3.3.3, but §8.3.7.2.2 makes no exception for them."]},{"deck":"testing","system":"Fire Pump","frequency":"","drill":false,"question":"A 460-volt fire pump motor is reading 440 volts at the motor during the annual test. Nameplate voltage is 460. Is this acceptable under NFPA 25?","options":["Yes — readings within 5 percent below or 10 percent above the rated nameplate voltage are considered acceptable","No — any reading below nameplate voltage is a deficiency","Yes — readings within 10 percent below or 5 percent above nameplate are acceptable","No — the tolerance is 5 percent in either direction"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.7.2.9","explanation":"The tolerance band is deliberately asymmetric: motors tolerate being run a little high better than being run low, because low voltage drives current up and overheats the windings. 440 volts is about 4.3 percent below 460, which lands inside the allowance.","optionNotes":["Correct — §8.3.7.2.9 treats voltage at the motor within 5 percent below or 10 percent above rated (nameplate) voltage as acceptable, and 440 V is roughly 4.3 percent below 460 V.","Voltage below nameplate is expected under load; the standard gives an explicit 5 percent downward allowance.","The band is reversed. §8.3.7.2.9 allows the LARGER excursion above nameplate (10 percent) and the smaller one below (5 percent).","The tolerance is not symmetric — the upward allowance is 10 percent per §8.3.7.2.9."]},{"deck":"testing","system":"Fire Pump","frequency":"Annually","drill":false,"question":"During the annual test of an installation with an automatic transfer switch, you simulate a power failure while the pump runs at peak load and the switch transfers to the alternate source. How long must the pump continue to perform at peak horsepower load on the alternate power source?","options":["A minimum of 2 minutes","A minimum of 10 minutes","A minimum of 30 minutes","A minimum of 1 hour"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.3.12(4)","explanation":"The purpose of this test is narrow: prove the overcurrent protective devices on the alternate source do not open when the pump is loaded. Two minutes at peak horsepower is enough to demonstrate the breakers or fuses hold.","optionNotes":["Correct — §8.3.3.12(4) requires verification that the pump continues to perform at peak horsepower load on the alternate power source for a minimum of 2 minutes.","10 minutes is the minimum no-flow run time for an electric motor-driven pump, §8.3.2.3 — a different test.","30 minutes is the minimum no-flow run time for a diesel engine-driven pump, §8.3.2.4.","1 hour is the run time required by Table 8.6.1 after a circuit breaker, incoming power conductors, or transfer switch load-carrying parts are replaced — a component replacement test, not the annual ATS test."]},{"deck":"testing","system":"Fire Pump","frequency":"Annually","drill":false,"question":"The annual automatic transfer switch test also requires that, after the simulated power failure is removed, you verify what?","options":["That the pump gets reconnected to the normal power source once a built-in time delay has run out","That the pump immediately reconnects to normal power with no delay","That the alternate source shuts down within 30 seconds","That the pump shuts down and must be manually restarted"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.3.12(5)","explanation":"Retransfer is intentionally delayed so the pump does not swing back to a utility source that has not stabilized. The test confirms both that the delay exists and that retransfer actually completes.","optionNotes":["Correct — §8.3.3.12(5) has you clear the simulated power failure and then confirm that, following a time delay, the pump comes back onto the normal source.","Immediate retransfer is not what the standard describes; the time delay is part of the expected behavior and its intervals are reported under §8.4.1.1(6).","Chapter 8 sets no 30-second shutdown criterion for the alternate source in this test.","The pump is not expected to shut down on retransfer — the verification is that it is reconnected to normal power."]},{"deck":"inspection","system":"Fire Pump","frequency":"Annually","drill":false,"question":"You have just completed the waterflow portion of the annual fire pump test on a pump taking suction from a wet pit. What does NFPA 25 require next regarding the suction screens?","options":["Inspect the suction screens and clear them of any debris or obstructions","Nothing — suction screens are only inspected at the weekly visual check","Replace the suction screens, since flow testing is assumed to damage them","Inspect the screens only if suction pressure dropped below the lowest permissible value during the test"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.3.15","explanation":"Flowing the pump at 150 percent pulls debris onto the screens that normal standby conditions never would. The standard treats the post-flow screen check as mandatory — and applies the same rule after any fire protection system activation.","optionNotes":["Correct — §8.3.3.15 requires suction screens to be inspected and cleared of debris or obstructions after the waterflow portions of the annual test or after fire protection system activations.","The weekly check under §8.2.2(2)(f) verifies wet pit suction screens are unobstructed and in place, but it does not replace the post-flow inspection required by §8.3.3.15. Table 8.1.1.2 also lists suction screens as an annual inspection item.","Replacement is not required — the requirement is inspection and clearing of debris.","The requirement is unconditional after the waterflow portion of the test; it is not triggered only by a suction pressure excursion."]},{"deck":"testing","system":"Fire Pump","frequency":"Annually","drill":false,"question":"An alarm sensor is located inside an electric motor-driven fire pump controller and cannot be reached without opening the energized controller. How does NFPA 25 require the annual alarm test to be performed?","options":["Test the sensor at an alternative location outside the controller","Open the energized controller wearing arc-rated PPE and test the sensor in place","Skip the sensor and note it as inaccessible on the report","De-energize the fire pump controller for the duration of the alarm test"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.3.13.1","explanation":"The 2020 edition consistently steers technicians away from opening live fire pump controllers. Where a sensor is trapped behind an energized door, the test moves to a point outside the enclosure rather than putting a person in an arc flash boundary.","optionNotes":["Correct — §8.3.3.13.1 requires alarm sensors that cannot be accessed without opening an energized electric motor-driven fire pump controller to be tested at an alternative location outside the controller.","Opening an energized controller is precisely what the 2020 revisions to §§8.1.1.2 and 8.3.3.13.1 are written to avoid. PPE per NFPA 70E is referenced at §8.1.1.2.22.2 for gauge replacement work, not as a license to open the controller for alarm testing.","The test is not optional. §8.3.3.13 requires alarm conditions to be simulated and confirmed for proper operation; §8.3.3.13.1 tells you how to accomplish it safely.","De-energizing the fire pump controller takes the fire pump out of service and is not the method the standard specifies."]},{"deck":"testing","system":"Fire Pump","frequency":"Annually","drill":true,"question":"A diesel fire pump engine uses an electronic fuel management control system. What does NFPA 25 require regarding the electronic control module?","options":["The backup ECM and the primary and redundant sensors for the ECM must be tested annually","The ECM must be replaced every 5 years regardless of condition","The ECM requires no periodic testing because it is self-diagnosing","The primary ECM must be tested weekly along with the churn test"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.3.16","explanation":"On an electronically managed engine, the backup module and the redundant sensors are the reason the engine still runs when the primary system fails. They sit idle until they are needed, so the standard makes you prove them once a year.","optionNotes":["Correct — §8.3.3.16 requires the backup ECM and both the primary and redundant sensors for the ECM to be tested annually where engines use electronic fuel management control systems. Table 8.1.1.2 lists ECM testing as annual.","The 5-year replacement interval applies to power transmitting components containing elastomeric materials, such as torsional couplings, §8.1.1.2.23.","Self-diagnostics do not substitute for the annual test required by §8.3.3.16.","Weekly is the no-flow test frequency for diesel pumps (§8.3.1.1.1); the ECM testing interval is annual."]},{"deck":"testing","system":"Fire Pump","frequency":"Annually","drill":true,"question":"How often must diesel fuel be tested for degradation?","options":["No less than annually","Quarterly","Every 6 months","Every 3 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.4.1","explanation":"Stored diesel degrades on the shelf — oxidation, microbial growth, and water accumulation all attack fuel that sits for months. The standard sets a floor of one test per year, with the test method tied to the applicable ASTM specifications.","optionNotes":["Correct — §8.3.4.1 requires diesel fuel to be tested for degradation no less than annually, and Table 8.1.1.2 lists diesel fuel testing as an annual test item.","Quarterly is the frequency for engine crankcase breather inspection (§8.1.1.2.12) and for testing the fuel tank float switch and supervisory signal for interstitial space liquid intrusion (§8.1.1.2.7) — not for fuel degradation.","Every 6 months is the retest interval that applies only AFTER fuel has been reconditioned or replaced, §8.3.4.2.1, until a year of stable storage is demonstrated.","Every 3 years is the maximum interval between open-discharge annual test arrangements under §8.3.3.9, not a fuel testing interval."]},{"deck":"maintenance","system":"Fire Pump","frequency":"","drill":false,"question":"Annual testing shows the diesel fuel is degraded. Beyond reconditioning or replacing the fuel, what else does NFPA 25 require?","options":["Clean the supply tank internally and change the engine fuel filter(s)","Replace the fuel tank and install an active fuel maintenance system","Drain the fuel and leave the tank empty until the next test cycle","Add a biocide additive and retest in 30 days"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.4.2","explanation":"Bad fuel leaves residue behind. Putting clean fuel into a dirty tank with a loaded filter simply re-contaminates it, so the standard bundles the tank cleaning and filter change with the fuel correction.","optionNotes":["Correct — §8.3.4.2 requires the fuel to be reconditioned or replaced, the supply tank cleaned internally, and the engine fuel filter(s) changed.","Tank replacement is not required, and while §8.3.4.3 addresses active fuel maintenance systems where provided, installing one is not a mandated response to a failed fuel test.","Leaving the tank empty would leave the diesel pump unable to run — the opposite of restoring the system.","A 30-day retest is not the interval the standard sets. §8.3.4.2.1 requires retesting every 6 months after restoration until the fuel demonstrates a year of stable storage."]},{"deck":"testing","system":"Fire Pump","frequency":"Every 6 months","drill":true,"question":"After degraded diesel fuel has been replaced and the tank cleaned, how often must the fuel be retested, and for how long does that heightened frequency continue?","options":["Every 6 months, until experience shows the fuel can be stored a minimum of 1 year without degradation beyond the allowable limit","Every 3 months, until two consecutive passing tests are recorded","Annually, as with any other diesel fire pump","Every 6 months indefinitely, with no return to annual testing"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.4.2.1","explanation":"A tank that has already produced bad fuel is treated as suspect until it proves otherwise. The semiannual retest is a probation period that ends only once the site has demonstrated a full year of stable storage.","optionNotes":["Correct — §8.3.4.2.1 requires retesting every 6 months after restoration until experience indicates the fuel can be stored for a minimum of 1 year without degradation beyond what §8.3.4.1.1 allows.","There is no 3-month fuel retest interval or two-consecutive-passes rule in Chapter 8.","Annual is the baseline under §8.3.4.1, but a tank that has just failed does not go straight back to the baseline.","The heightened frequency is not permanent — §8.3.4.2.1 defines the exit condition as a demonstrated year of stable storage."]},{"deck":"inspection","system":"Fire Pump","frequency":"Quarterly","drill":true,"question":"How often must engine crankcase breathers on a diesel fire pump be inspected?","options":["Quarterly","Weekly","Annually","Every 50 hours of operation"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.1.1.2.12","explanation":"The crankcase breather is one of only two quarterly items in the entire fire pump chapter. A plugged breather pressurizes the crankcase and pushes oil out through the seals, so it gets checked more often than most engine components.","optionNotes":["Correct — §8.1.1.2.12 requires engine crankcase breathers to be inspected quarterly, and Table 8.1.1.2 lists this as a quarterly inspection item.","Weekly is the interval for the diesel engine system visual checklist under §8.2.2(4), not for the crankcase breather specifically.","Most engine items — exhaust systems, flexible hoses, fuel tank vents, turbo back pressure — are annual, which makes the quarterly breather easy to miss.","Every 50 operating hours or annually is the interval for engine lubricating oil, oil filters, and fuel filters under §§8.1.1.2.17 through 8.1.1.2.19."]},{"deck":"testing","system":"Fire Pump","frequency":"Quarterly","drill":true,"question":"A diesel fire pump has a double-wall fuel tank with an interstitial space monitored by a float switch and supervisory signal. How often must that arrangement be tested for liquid intrusion?","options":["Quarterly","Weekly","Monthly","Annually"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.1.1.2.7","explanation":"Liquid showing up in the space between the tank walls means either the inner tank is leaking fuel or the outer tank is letting water in. Either way it is an early warning of tank failure, and the standard tests the detection arrangement four times a year.","optionNotes":["Correct — §8.1.1.2.7 requires fuel tanks, float switches, and supervisory signals for interstitial space to be tested quarterly for liquid intrusion. Table 8.1.1.2 lists this as a quarterly test.","Weekly applies to the diesel engine system visual checklist (§8.2.2(4)) and the no-flow test (§8.3.1.1.1).","Monthly is a permitted no-flow test frequency for certain electric pumps (§§8.3.1.2.2 and 8.3.1.2.3); it is not used for interstitial space monitoring.","Annually applies to testing the fuel tank for water and foreign materials (§8.1.1.2.9) and to the fuel tank vents and overflow piping inspection (§8.1.1.2.10) — related but distinct items."]},{"deck":"maintenance","system":"Fire Pump","frequency":"Every 50 operating hours or annually","drill":true,"question":"A diesel fire pump engine has accumulated 50 hours of operation seven months into the year. What does NFPA 25 require for the lubricating oil and oil filter?","options":["Change both — the interval is every 50 hours of operation or annually, whichever comes first","Wait until the annual service, since scheduled maintenance governs","Change the filter only; oil is changed strictly on an annual basis","Change the oil only; filters are on a 5-year interval"],"correctIndex":0,"citation":"NFPA 25 (2020) §§8.1.1.2.17 and 8.1.1.2.18","explanation":"The standard sets a dual trigger for engine consumables — running hours or elapsed time. A pump that is exercised heavily hits the hour limit first; a pump that only sees weekly churn runs hits the annual limit first. Whichever arrives first governs.","optionNotes":["Correct — §8.1.1.2.17 sets engine lubricating oil at every 50 hours of operation or annually, and §8.1.1.2.18 sets the same interval for lubricating oil filters. Table 8.1.1.2 lists both as '50 operating hours or annually.'","The hour-based trigger is not optional; reaching 50 operating hours calls for the change regardless of where the calendar sits.","Both the oil and the oil filter share the same interval under §§8.1.1.2.17 and 8.1.1.2.18.","The 5-year interval belongs to power transmitting components containing elastomeric materials, §8.1.1.2.23 — not oil filters."]},{"deck":"maintenance","system":"Fire Pump","frequency":"Every 50 operating hours or annually","drill":true,"question":"What does NFPA 25 require regarding diesel engine fuel filter changes?","options":["Change as needed, but at a minimum every 50 hours of operation or annually","Change quarterly regardless of condition","Change only when the fuel degradation test fails","Change every 5 years or per the manufacturer"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.1.1.2.19","explanation":"Fuel filters carry a condition-based trigger on top of the time and hour limits — if the engine is running rough or the fuel has been in question, you change them sooner. The 50-hour-or-annual figure is the floor, not the schedule.","optionNotes":["Correct — §8.1.1.2.19 requires fuel filter(s) to be changed as needed, but at a minimum every 50 hours of operation or annually.","Quarterly applies to the engine crankcase breather inspection (§8.1.1.2.12) and interstitial space testing (§8.1.1.2.7), not fuel filters.","A failed fuel test does trigger a filter change under §8.3.4.2, but §8.1.1.2.19 imposes a routine minimum interval independent of that.","The 5-year-or-per-manufacturer interval applies to elastomeric power transmitting components such as torsional couplings, §8.1.1.2.23."]},{"deck":"maintenance","system":"Fire Pump","frequency":"Every 5 years","drill":true,"question":"A diesel fire pump drive train includes a torsional coupling made of elastomeric material. How often must this component be replaced?","options":["Every 5 years, or as required by the component manufacturer","Annually, along with the other drive train maintenance","Every 10 years, or when visible cracking appears","Only when the annual alignment inspection finds a problem"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.1.1.2.23","explanation":"Rubber-based coupling elements harden and lose their damping ability with age even if they are never loaded. Because that degradation is invisible until the part shears, the standard replaces them on a fixed clock rather than on condition.","optionNotes":["Correct — §8.1.1.2.23 requires power transmitting components used in pump drives that include elastomeric materials, such as torsional couplings, to be replaced every 5 years or as required by the component manufacturer. Table 8.1.1.2 lists this as '5 years or per manufacturer.'","Annual applies to greasing the pump and motor bearings and couplings under §8.1.1.2.3, which is lubrication rather than replacement of the elastomeric element.","There is no 10-year interval in Chapter 8, and waiting for visible cracking defeats the purpose of a fixed replacement clock.","The annual alignment inspection under §8.3.6.4 addresses parallel and angular alignment of the pump and driver — a separate requirement that does not replace the 5-year elastomer change."]},{"deck":"maintenance","system":"Fire Pump","frequency":"Annually","drill":false,"question":"During the annual battery check on a diesel fire pump with a 24-volt system, what minimum cranking voltage does NFPA 25 require you to confirm?","options":["More than 18 volts","More than 9 volts","More than 12 volts","More than 24 volts"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.1.1.2.15(3)","explanation":"Cranking voltage is the real measure of a starting battery — a battery can read full at rest and collapse the moment the starter engages. The standard sets the floor at three quarters of nominal: 9 volts on a 12-volt system, 18 volts on a 24-volt system.","optionNotes":["Correct — §8.1.1.2.15(3) requires ensuring that the cranking voltage exceeds 18 V on a 24 V system.","9 volts is the threshold for a 12 V system under the same subsection, not a 24 V system.","12 volts is the nominal voltage of the smaller battery system, not a cranking threshold for either system.","The battery will always sag below nominal under cranking load; requiring more than 24 V during cranking would be impossible to meet."]},{"deck":"maintenance","system":"Fire Pump","frequency":"Annually","drill":false,"question":"A technician tops off the fire pump batteries with tap water during the annual battery check. What does NFPA 25 say about this?","options":["Only distilled water is to be used in the batteries","Any potable water is acceptable as long as the electrolyte level is restored","Batteries must be replaced rather than topped off","Water may be added only if specific gravity is below the manufacturer's minimum"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.1.1.2.15(4)","explanation":"Minerals and chlorine in tap water plate out on the battery plates and shorten cell life. The annual battery check specifically calls for distilled water, alongside testing specific gravity, state of charge, and charger rates, and cleaning terminal corrosion.","optionNotes":["Correct — §8.1.1.2.15(4) requires ensuring that only distilled water is used in batteries.","Potable water is not acceptable; the standard names distilled water specifically.","Topping off with distilled water is the expected practice — replacement is not the standard response to a low electrolyte level.","The distilled water requirement is not conditional on a specific gravity reading. Specific gravity, state of charge, and charger rates are tested separately under §8.1.1.2.15(1)."]},{"deck":"inspection","system":"Fire Pump","frequency":"Weekly","drill":false,"question":"During a weekly inspection of a pump room containing a diesel engine-driven fire pump with NO engine heaters, the room temperature reads 55°F. What does NFPA 25 indicate?","options":["Inadequate — a pump room with diesel engine-driven pumps without engine heaters requires heat of not less than 70°F (21°C)","Adequate — 40°F (4°C) is the minimum for any fire pump room","Adequate — there is no specified minimum temperature, only a requirement that the room be above freezing","Inadequate — the minimum for any diesel pump room is 80°F (27°C)"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.2.2(1)(b)","explanation":"A cold diesel that has no jacket heater has to be warmed by room air alone, and a cold engine is a hard-starting engine. The standard therefore splits the pump room temperature requirement: 40°F where an electric motor or a heater-equipped diesel is installed, 70°F where the diesel has no engine heater.","optionNotes":["Correct — §8.2.2(1)(b) requires heat of not less than 70°F (21°C) for a pump room with diesel engine-driven pumps without engine heaters.","40°F (4°C) under §8.2.2(1)(a) is the minimum for a pump room with an electric motor, or with diesel engine-driven pumps that HAVE engine heaters. This room has no engine heaters.","There are specified minimums — §8.2.2(1)(a) and (b) give two distinct values depending on the driver and heater arrangement.","80°F is not a temperature used anywhere in Chapter 8."]},{"deck":"inspection","system":"Fire Pump","frequency":"Weekly","drill":false,"question":"During the weekly visual inspection of a diesel fire pump, what fuel tank level condition does NFPA 25 direct you to verify?","options":["The fuel tank is at least two-thirds full","The fuel tank is at least one-half full","The fuel tank is completely full","The fuel tank is at least three-quarters full"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.2.2(4)(a)","explanation":"Keeping the tank well filled leaves less air space for condensation, which is the main source of water contamination in stored diesel, and it guarantees run time during an actual fire. Two-thirds is the weekly checkpoint.","optionNotes":["Correct — §8.2.2(4)(a) lists 'fuel tank is at least two-thirds full' among the weekly diesel engine system observations.","One-half is not the figure the standard uses; the weekly threshold is two-thirds.","The standard does not require a completely full tank at the weekly check — expansion space is needed, and two-thirds is the stated minimum.","Three-quarters is close but not the printed value. The weekly checkpoint in §8.2.2(4)(a) is two-thirds."]},{"deck":"inspection","system":"Fire Pump","frequency":"Annually","drill":false,"question":"NFPA 25 requires annual inspection of electrical connections in a fire pump controller, but limits that work to what can be done without opening an energized controller. What does the 2020 edition permit as a means of meeting this requirement?","options":["Using the isolating switch in the fire pump controller, where it is located in a separate compartment from the other controller components","Opening the energized controller with arc-rated PPE and a written energized work permit","Deferring the inspection until the next scheduled shutdown of the building","Substituting an infrared thermographic scan of the closed controller enclosure"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.1.1.2.2.2","explanation":"This is one of the recurring 2020 additions. Where the isolating switch sits in its own compartment, it can be worked on and inspected without exposing the technician to the energized power section, so the standard accepts that compartment as satisfying the annual inspection duty.","optionNotes":["Correct — §8.1.1.2.2.2 permits the isolating switch located in a separate compartment from the other controller components to be used to meet the requirement of §8.1.1.2.2.1. The same allowance is repeated for PCBs (§8.1.1.2.4.2), cable and wire insulation (§8.1.1.2.5.2), plumbing parts (§8.1.1.2.6.2), controls and power wiring (§8.1.1.2.16.2), and pressure gauges and sensors (§8.1.1.2.22.1).","The entire structure of these 2020 revisions is to avoid opening energized controllers, not to permit it under a permit. NFPA 70E PPE is referenced at §8.1.1.2.22.2 for gauge or sensor replacement work, which is a narrower case.","Deferral is not offered; the standard gives a permitted alternative means of compliance instead.","Thermographic scanning is not named as a compliance option anywhere in §8.1.1.2."]},{"deck":"inspection","system":"Fire Pump","frequency":"Annually","drill":false,"question":"During annual inspection you find a permanently installed fire pump discharge pressure gauge reading 8 percent off from a calibrated reference gauge. What does NFPA 25 require?","options":["Replace or recalibrate the gauge, because it is more than 5 percent out of calibration","Nothing — gauges are acceptable up to 10 percent out of calibration","Replace the gauge only if it is more than 3 percent out of calibration","Tag the gauge and recheck it at the next annual inspection"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.1.1.2.22","explanation":"A gauge that lies by 8 percent will quietly corrupt every churn reading and every annual test point taken from it. The standard sets the correction threshold at 5 percent and requires replacement or recalibration once that is exceeded.","optionNotes":["Correct — §8.1.1.2.22 requires the accuracy of pressure gauges and sensors to be inspected annually and the device replaced or recalibrated when more than 5 percent out of calibration, to the extent the work can be done without opening an energized electric motor-driven fire pump controller.","10 percent is not a calibration threshold in Chapter 8. The 10 percent figure appears in §8.3.7.2.9 as the allowable voltage excursion ABOVE nameplate.","Plus or minus 3 percent is the required accuracy for FLOW METERS used during testing, §8.3.3.5.3 — a different rule for different equipment.","Deferring correction for a year leaves an inaccurate instrument in service through the next churn tests and the annual flow test."]},{"deck":"testing","system":"Fire Pump","frequency":"","drill":false,"question":"A facility uses remotely monitored automated testing for the fire pump no-flow test. What does NFPA 25 require regarding qualified personnel?","options":["Qualified personnel must be able to respond to the pump location upon an abnormal condition within 5 minutes","Qualified personnel must be physically present at the pump for the entire test","Qualified personnel must be able to respond within 30 minutes","No personnel response requirement applies once automated testing is approved"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.2.10.4","explanation":"Automated testing replaces the technician standing at the pump, but not the need for a human being who can reach it. Five minutes is the response window the standard sets for someone qualified to get to the pump when the automated system reports trouble.","optionNotes":["Correct — §8.3.2.10.4 requires qualified personnel to be able to respond to the pump location upon an abnormal condition within 5 minutes.","Physical attendance is the baseline requirement of §8.3.2.7, but that section expressly excepts automated inspection and testing performed per §8.3.2.10 (including automated engine shutdown per §8.3.2.10.3 for diesel drives).","30 minutes is the diesel no-flow run time under §8.3.2.4, not a response window.","A response requirement absolutely applies — it is the trade-off that makes unattended testing acceptable."]},{"deck":"testing","system":"Fire Pump","frequency":"","drill":false,"question":"A diesel fire pump is to be tested using remotely monitored automated testing. What does NFPA 25 require of the controller?","options":["It must be equipped with automatic engine shutdown as referenced in NFPA 20","It must be equipped with a solenoid valve drain on the pressure control line","It must be equipped with a redundant ECM and backup sensors","It must be equipped with a local audible alarm rated for the pump room"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.2.10.3","explanation":"Unattended diesel testing only works if the engine can protect itself. Without a human watching the oil pressure and temperature gauges, the controller has to be able to shut the engine down on its own before damage occurs.","optionNotes":["Correct — §8.3.2.10.3 requires the controller for a diesel engine-driven fire pump to be equipped with automatic engine shutdown as referenced in 12.2.7.2 of NFPA 20 when automated testing is used.","The solenoid valve drain on the pressure control line is the initiating means for an automatic timer starting a PRESSURE-ACTUATED controller under §8.3.2.6.1 — a different provision about how the test starts, not about unattended safety.","Backup ECM and redundant sensors are required to be tested annually where electronic fuel management is used, §8.3.3.16, but that is not the automated-testing prerequisite.","No local audible alarm requirement is attached to automated testing in Chapter 8."]},{"deck":"testing","system":"Fire Pump","frequency":"","drill":false,"question":"A fire pump no-flow test is started by an approved automatic timer. Does that eliminate the requirement for qualified personnel to be present?","options":["No — the automatic timer does not eliminate the requirement to have qualified personnel present during the test","Yes — an automatic timer is equivalent to remotely monitored automated testing","Yes, but only for electric motor-driven pumps","No, unless the controller is a non-pressure-actuated type"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.2.7.1","explanation":"There are two different concepts here that are easy to confuse. An automatic timer only automates the STARTING of the test; unattended operation requires the full remotely monitored automated testing package under 8.3.2.10. A timer alone still needs a person at the pump.","optionNotes":["Correct — §8.3.2.7.1 states that use of the automatic timer allowed in §8.3.2.6 does not eliminate the requirement of §8.3.2.7 to have qualified personnel present during the test.","A timer is not equivalent to remotely monitored automated testing. §8.3.2.7 excepts only testing performed in accordance with §8.3.2.10, which carries its own conditions including the 5-minute response requirement.","No driver-type exception exists in §8.3.2.7.1; the rule applies regardless of whether the pump is electric or diesel.","Controller type governs HOW the test may be initiated (§8.3.2.6.1 for pressure-actuated, §8.3.2.6.3 for non-pressure-actuated), not whether personnel must attend."]},{"deck":"testing","system":"Fire Pump","frequency":"","drill":false,"question":"During a routine no-flow (churn) test on a modern installation, you observe the main pressure relief valve discharging a substantial stream of water into the cone. What does NFPA 25 indicate about this observation?","options":["It is a problem — during the no-flow test the main pressure relief valve is permitted to weep, but not to discharge a significant quantity of water","It is normal — the main pressure relief valve is expected to discharge fully at churn","It is normal only if the circulation relief valve is closed at the same time","It is a problem only if the discharge continues for more than 10 minutes"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.2.1.1","explanation":"On a current installation the pressure relief valve is a last-resort protection device, not a normal operating component. Weeping is tolerated; a real discharge at churn means the valve is misadjusted or the pump is producing pressure the system components were never rated for.","optionNotes":["Correct — §8.3.2.1.1 permits the main pressure relief valve to weep but not to discharge a significant quantity of water during the no-flow test. The exceptions are §8.3.2.1.2 for certain legacy installations designed under 1993-and-earlier editions of NFPA 20, and §8.3.2.1.3 for positive displacement pumps.","Full discharge at churn is expected only under the narrow legacy allowance of §8.3.2.1.2, not as normal behavior for a current installation.","The relationship runs the other way: §8.3.2.1.1.2 says the CIRCULATION relief valve shall not operate when flow through the main pressure relief valve is greater than weeping.","Duration is not the test. The criterion in §8.3.2.1.1 is the quantity of water, not how long it flows."]},{"deck":"testing","system":"Fire Pump","frequency":"","drill":false,"question":"During a no-flow test of a positive displacement fire pump, the pressure relief valve does not open. What does NFPA 25 indicate?","options":["This is a failure — on a positive displacement pump the pressure relief valve is required to operate during the no-flow test","This is correct — the relief valve should only weep, as with a centrifugal pump","This is correct — positive displacement pumps are exempt from no-flow testing","This is a failure only if the pump is piping a liquid other than water"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.2.1.3","explanation":"A positive displacement pump moves a fixed volume per revolution and will build pressure until something gives. With the discharge closed, the relief valve is the only path — so it MUST open during churn, which is the reverse of the rule for a centrifugal pump.","optionNotes":["Correct — §8.3.2.1.3 requires the pressure relief valve to operate during the no-flow test for positive displacement pumps.","Weeping-only is the rule for centrifugal pumps under §8.3.2.1.1. Positive displacement pumps are specifically excepted from it.","Positive displacement pumps are tested in accordance with §§8.3.1 through 8.3.3 per §8.3.5.1, subject to the specific modifications in §§8.3.5.2 through 8.3.5.7.","The pumped liquid affects performance comparison under §8.3.5.7 (manufacturer's calculations showing the viscosity difference), not whether the relief valve must operate at churn."]},{"deck":"maintenance","system":"Fire Pump","frequency":"","drill":false,"question":"An isolating switch in a fire pump controller has been replaced. What testing does NFPA 25 require to restore the system to service?","options":["Perform a test in accordance with 8.3.2 and exercise the switch six times","Perform an acceptance test in accordance with NFPA 20","Perform the annual test in accordance with 8.3.3 with six starts at peak load","Perform six no-load operations of transfer of power"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 8.6.1","explanation":"Table 8.6.1 scales the return-to-service test to how badly the component could stop the pump. An isolating switch is a mechanical disconnect, so the standard pairs a no-flow test with repeated exercising to confirm the mechanism works reliably rather than just once.","optionNotes":["Correct — Table 8.6.1 lists 'Isolating switch — Replace' with the test criterion of performing a test in accordance with 8.3.2 and exercising six times.","A full NFPA 20 acceptance test is required for replacing the ENTIRE controller or for an electronic component or module that can prevent the controller from starting or running, per Table 8.6.1.","The 8.3.3 annual test with six starts at peak load and a minimum 1-hour run is the criterion for replacing a CIRCUIT BREAKER, per Table 8.6.1.","Six no-load operations of transfer of power is the criterion for transfer switch NO-LOAD parts, per Table 8.6.1."]},{"deck":"maintenance","system":"Fire Pump","frequency":"","drill":false,"question":"A circuit breaker in a fire pump controller has been replaced. What does Table 8.6.1 require to return the pump to service?","options":["Test in accordance with 8.3.3, including six starts at peak load, and operate the pump for a minimum of 1 hour","Six momentary starts in accordance with NFPA 20","A weekly test in accordance with 8.3.2","Six automatic no-load starts"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 8.6.1","explanation":"Note that Table 8.6.1 lists the circuit breaker twice with two different criteria. Adjusting the breaker gets the light treatment; replacing it gets the heavy one, because a new breaker has never carried this pump's inrush current or its sustained load.","optionNotes":["Correct — Table 8.6.1 lists 'Circuit breaker — Replace' with the criterion of testing in accordance with 8.3.3 including six starts at peak load and operating the pump for a minimum of 1 hour.","Six momentary starts in accordance with NFPA 20 is the criterion for ADJUSTING a circuit breaker, per the separate circuit breaker row in Table 8.6.1 — not for replacing one.","A weekly test per 8.3.2 is the criterion for items such as plumbing parts, electrical connection adjustment, and electronic components that will not prevent the controller from starting or running.","Six automatic no-load starts is the criterion for a pressure transducer adjustment or replacement, per Table 8.6.1."]},{"deck":"maintenance","system":"Fire Pump","frequency":"","drill":false,"question":"The impeller of a fire pump has been replaced. What testing does NFPA 25 require before the pump is returned to service?","options":["An acceptance test in accordance with NFPA 20","The annual test in accordance with 8.3.3","A no-flow test in accordance with 8.3.2","The annual test in accordance with 8.3.3 with an alignment inspection"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 8.6.1","explanation":"The impeller is the pump. Replacing it means the hydraulic performance of the assembly is unknown, so the standard sends you all the way back to a full NFPA 20 acceptance test rather than accepting a routine annual flow test.","optionNotes":["Correct — Table 8.6.1 lists 'Impeller/rotating assembly' for both repair and replace with the criterion of performing an acceptance test in accordance with NFPA 20.","The annual test per 8.3.3 is the criterion for replacing bearings, sleeves, wear rings, or motor bearings — components that do not redefine the pump curve.","A no-flow test per 8.3.2 is the criterion for lighter items such as packing adjustment, plumbing parts, and fuel system components.","The 8.3.3 test with alignment inspection is the criterion for drive coupling work and for baseplate replacement, per Table 8.6.1. Casing repair or replacement gets an NFPA 20 acceptance test WITH alignment inspection."]},{"deck":"maintenance","system":"Fire Pump","frequency":"","drill":false,"question":"Load-carrying parts of a fire pump transfer switch have been rebuilt. What does Table 8.6.1 require?","options":["Test per 8.3.3 including six starts at peak horsepower load, operate the pump for a minimum of 1 hour, and transfer from normal power to emergency power and back one time","Six no-load operations of transfer of power","Test per 8.3.2 and exercise six times","An acceptance test in accordance with NFPA 20 with alignment inspection"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 8.6.1","explanation":"Load-carrying contacts are the parts that have to hold the pump's full current during a transfer. The test loads them hard, runs them long enough to reveal heating, and proves the transfer works in both directions.","optionNotes":["Correct — Table 8.6.1 lists 'Transfer switch — load-carrying parts' for repair, rebuild, and replace with exactly this criterion.","Six no-load operations of transfer of power is the criterion for transfer switch NO-LOAD parts, per the adjacent row in Table 8.6.1.","Test per 8.3.2 with six exercises is the isolating switch replacement criterion in Table 8.6.1.","NFPA 20 acceptance testing WITH alignment inspection applies to casing work, electric motor work, and entire engine rebuild or replacement — rotating equipment where shaft alignment matters. (Gear right-angle drives also get an NFPA 20 acceptance test, but that row does not add an alignment inspection.)"]},{"deck":"maintenance","system":"Fire Pump","frequency":"","drill":false,"question":"A suction control valve on a fire pump has been rebuilt. What testing does NFPA 25 require to return it to service?","options":["An operational test in accordance with 13.3.3.1","A visual inspection in accordance with 8.2.2(2)","An acceptance test in accordance with NFPA 20","The annual flow test in accordance with 8.3.3"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 8.6.1","explanation":"Valves are common components, so Table 8.6.1 hands them off to the valve chapter rather than duplicating valve test requirements inside the fire pump chapter — the same way §8.1.2 sends common components and valves to Chapter 13 generally.","optionNotes":["Correct — Table 8.6.1 lists suction/discharge valves with the test criterion of an operational test in accordance with 13.3.3.1, and rebuilding the valve is one of the marked actions.","Visual inspection per 8.2.2(2) is the criterion for suction/discharge PIPE and FITTINGS in Table 8.6.1, not for valves.","NFPA 20 acceptance testing is reserved in Table 8.6.1 for major items such as the entire pump assembly, impeller, casing, entire controller, electric motor, and entire engine.","The annual flow test per 8.3.3 is the criterion for internal rotating components such as bearings, sleeves, wear rings, and the main shaft."]},{"deck":"general","system":"Fire Pump","frequency":"Annually","drill":false,"question":"Which of the following must be included in the written report of fire pump test results?","options":["All raw data necessary for a complete evaluation, including suction and discharge pressures, voltage and amperage readings, and pump speed at each flow rate tested","Only the final pass or fail determination and the technician's signature","Only the flow and pressure at the 150 percent point, since that is the controlling condition","A copy of the manufacturer's original acceptance test report, in lieu of current data"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.4.1.1(1)","explanation":"The report has to let a qualified person re-derive the conclusion, not just read it. That means the underlying numbers at every flow point, alongside the system demand, the pass/fail conclusion, deficiencies with recommendations, manufacturer data and curves, time delay intervals, and a comparison with previous results where applicable.","optionNotes":["Correct — §8.4.1.1(1) requires all raw data necessary for a complete evaluation, specifically naming suction and discharge pressures, voltage and amperage readings, and pump speed at each flow rate tested.","A bare conclusion fails §8.4.1.1(1). §8.4.1.1(3) does require the satisfactory/unsatisfactory determination, but it is one of seven listed items, not the whole report.","Data is required at EACH flow rate tested, not just the overload point. §8.3.7.2.3(3) evaluates net pressure at each flow point.","Historical acceptance data does not substitute for current test data. §8.4.1.1(5) requires manufacturer's performance data alongside ACTUAL performance, and §8.4.1.1(7) calls for comparison with previous results where applicable."]},{"deck":"general","system":"Fire Pump","frequency":"","drill":false,"question":"When must the preventive maintenance program for a fire pump assembly be initiated?","options":["Immediately after the pump assembly has passed its acceptance tests","At the first annual inspection following installation","Within 30 days of the certificate of occupancy","When the manufacturer's warranty period expires"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.5.3","explanation":"The standard closes the gap between commissioning and ongoing care. There is no grace period — the moment the pump passes acceptance testing, the maintenance clock is running.","optionNotes":["Correct — §8.5.3 requires the preventive maintenance program to be initiated immediately after the pump assembly has passed acceptance tests.","Waiting for the first annual inspection would leave a year of weekly and quarterly items unperformed.","A 30-day window tied to occupancy is not in Chapter 8; the trigger is passing the acceptance test.","Warranty expiration has no bearing. §8.5.1 requires the program to be established on all components per the manufacturer's recommendations or an approved alternative maintenance plan, which is a separate concept from warranty coverage."]},{"deck":"inspection","system":"Fire Pump","frequency":"Annually","drill":true,"question":"When does NFPA 25 require the parallel and angular alignment of the pump and driver to be inspected?","options":["During the annual test, with any misalignment corrected","During the weekly no-flow test","Only after a component covered by Table 8.6.1 has been replaced","Every 5 years, along with the elastomeric coupling replacement"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.3.6.4","explanation":"Misalignment destroys couplings, bearings, and seals, and it is easiest to see with the machine warm and loaded. The standard folds the alignment check into the annual test and requires correction rather than mere documentation.","optionNotes":["Correct — §8.3.6.4 requires parallel and angular alignment of the pump and driver to be inspected during the annual test and any misalignment corrected. Table 8.1.1.2 lists alignment as an annual inspection referencing §8.3.6.4.","The weekly checklist in §8.2.2 covers pump house conditions, pump system, electrical system, diesel engine system, and steam conditions — alignment is not among the weekly items.","Alignment inspection IS required after certain component work under Table 8.6.1 (casing, drive coupling, electric motor, entire engine, baseplate, foundation), but §8.3.6.4 imposes it annually regardless of whether any component was replaced.","The 5-year interval belongs to elastomeric power transmitting components under §8.1.1.2.23, not to alignment inspection."]},{"deck":"inspection","system":"Fire Pump","frequency":"Annually","drill":true,"question":"How does NFPA 25 require shaft movement or end play to be inspected on a fire pump?","options":["Annually, with the pump operating","Weekly, with the pump at rest","Annually, with the pump shut down and locked out","Quarterly, with the pump operating"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.1.1.2.1","explanation":"End play only shows itself under the axial thrust the pump develops when it is turning. Checking a stopped shaft tells you nothing, which is why the standard specifies the pump be operating during this annual inspection.","optionNotes":["Correct — §8.1.1.2.1 requires shaft movement or end play to be inspected annually with the pump operating. Table 8.1.1.2 lists 'Shaft movement or endplay while running' as annual.","Weekly items in §8.2.2 are visual observations of the pump house, pump system, electrical system, diesel engine system, and steam conditions — shaft end play is not among them.","The interval is right but the condition is wrong: §8.1.1.2.1 specifically calls for the inspection while the pump is operating.","Quarterly applies to the engine crankcase breather (§8.1.1.2.12) and interstitial space liquid intrusion testing (§8.1.1.2.7)."]},{"deck":"maintenance","system":"Fire Pump","frequency":"Annually","drill":true,"question":"Which of the following fire pump maintenance items does NFPA 25 assign an annual frequency?","options":["Replacing the circulating water filter","Changing the engine lubricating oil filter","Replacing torsional couplings and other elastomeric power transmitting components","Inspecting the engine crankcase breather"],"correctIndex":0,"citation":"NFPA 25 (2020) §8.1.1.2.21","explanation":"The circulating water filter protects the engine's cooling loop from fouling and is replaced on a straight annual schedule — no hour-based trigger, no multi-year interval.","optionNotes":["Correct — §8.1.1.2.21 requires circulating water filters to be replaced annually, and Table 8.1.1.2 lists the circulating water filter as an annual maintenance item.","Engine lubricating oil filters are changed every 50 hours of operation OR annually under §8.1.1.2.18 — an hour-or-time trigger, not a straight annual interval.","Elastomeric power transmitting components such as torsiona

/* ============================================================
   FLASHCARDS
   ============================================================ */
function renderCards(root){
  var items = BANK.definitions;
  crumb(root, {label:'Home', path:'/'}, {label:'Vocabulary'});
  if(!items.length){ return emptyDeck(root, 'Vocabulary'); }

  var order = shuffle(items.map(function(_,i){ return i; }));
  var pos = 0, flipped = false;
  var wrap = el('div',{class:'qwrap'});
  root.appendChild(wrap);

  function draw(){
    wrap.innerHTML = '';
    var item = items[order[pos]];
    state.cards[item.term] = 1; saveState();

    wrap.appendChild(el('div',{class:'qmeta'},
      el('span',{}, 'Card ' + (pos+1) + ' of ' + items.length),
      el('span',{class:'sys', style:'--ac:var(--steel)'}, item.system || 'General')
    ));
    wrap.appendChild(el('div',{class:'qbar', style:'--ac:var(--steel)'},
      el('i',{style:'width:'+(100*(pos+1)/items.length)+'%'})));

    var card = el('div',{class:'fcard', onclick:function(){ flipped = !flipped; draw(); }});
    card.appendChild(el('div',{class:'side'}, flipped ? 'What it means' : 'Term'));
    if(flipped){
      card.appendChild(el('div',{class:'plain'}, item.plain));
      if(item.onTheJob) card.appendChild(el('div',{class:'job'}, el('b',{},'On the job'), item.onTheJob));
    }else{
      card.appendChild(el('div',{class:'term'}, item.term));
    }
    card.appendChild(el('div',{class:'hint'}, flipped ? 'Tap to flip back' : 'Tap to reveal'));
    wrap.appendChild(card);

    if(item.citation) wrap.appendChild(el('div',{style:'text-align:center;margin-top:14px'},
      el('span',{class:'cite', style:'--ac:var(--steel)'}, String(item.citation).replace(/^NFPA 25 \(2020\)\s*§?\s*/,'').replace(/^§/,''))));

    wrap.appendChild(el('div',{class:'btn-row'},
      el('button',{class:'btn btn-ghost', onclick:function(e){ e.stopPropagation(); flipped=false; pos=(pos-1+items.length)%items.length; draw(); }},'← Back'),
      el('button',{class:'btn btn-secondary', onclick:function(e){ e.stopPropagation(); order = shuffle(order); pos = 0; flipped = false; draw(); }},'Shuffle'),
      el('button',{class:'btn btn-primary', onclick:function(e){ e.stopPropagation(); flipped=false; pos=(pos+1)%items.length; draw(); }},'Next →')
    ));
  }
  draw();
}

/* ============================================================
   QUESTION RUNNER  (study / frequency / weak)
   ============================================================ */
function renderRun(root, set, opt){
  crumb(root, {label:'Home', path:'/'}, {label:opt.title});
  if(!set.length){
    root.appendChild(el('div',{class:'empty'},
      el('div',{class:'ic'},'○'),
      el('h3',{},'Nothing to run'),
      el('p',{},'There are no questions in this set yet.')
    ));
    return;
  }

  var items = shuffle(set);
  var pos = 0, picked = -1;
  var wrap = el('div',{class:'qwrap'});
  root.appendChild(wrap);

  function draw(){
    wrap.innerHTML = '';
    var q = items[pos];
    var ac = opt.accent || deckMeta(q.deck).ac;
    wrap.setAttribute('style','--ac:'+ac);

    wrap.appendChild(el('div',{class:'qmeta'},
      el('span',{}, (pos+1) + ' of ' + items.length),
      el('span',{class:'sys'}, q.system || deckMeta(q.deck).name)
    ));
    wrap.appendChild(el('div',{class:'qbar'}, el('i',{style:'width:'+(100*(pos+1)/items.length)+'%'})));
    wrap.appendChild(el('div',{class:'qtext'}, q.question));

    var list = el('div',{class:'opts'});
    q.options.forEach(function(text, i){
      var cls = 'opt';
      if(picked >= 0){
        cls += ' locked';
        if(i === q.correctIndex) cls += ' right';
        else if(i === picked) cls += ' wrong';
        else cls += ' dim';
      }
      var note = (picked >= 0 && q.optionNotes && q.optionNotes[i] &&
                  (i === q.correctIndex || i === picked))
        ? el('span',{class:'note'}, q.optionNotes[i]) : null;

      list.appendChild(el('button',{class:cls, onclick:function(){
          if(picked >= 0) return;
          picked = i; record(q, i === q.correctIndex); draw();
        }},
        el('span',{class:'k'}, String.fromCharCode(65+i)),
        el('span',{class:'t'}, text, note)
      ));
    });
    wrap.appendChild(list);

    if(picked >= 0){
      var ok = picked === q.correctIndex;
      wrap.appendChild(el('div',{class:'verdict ' + (ok?'ok':'no')},
        el('span',{class:'g'}, ok ? '✓' : '✕'),
        ok ? 'Correct' : 'Not quite'
      ));
      wrap.appendChild(el('div',{class:'explain'},
        el('span',{class:'lbl'},'Why'),
        q.explanation,
        q.citation ? el('div',{}, el('span',{class:'cite'},
          String(q.citation).replace(/^NFPA 25 \(2020\)\s*§?\s*/,'').replace(/^§/,''))) : null
      ));
      wrap.appendChild(el('div',{class:'btn-row'},
        el('button',{class:'btn btn-ghost', onclick:function(){ go(opt.back || '/'); }},'Exit'),
        pos < items.length-1
          ? el('button',{class:'btn btn-primary', onclick:function(){ pos++; picked=-1; draw(); scrollTop(); }},'Next →')
          : el('button',{class:'btn btn-primary', onclick:function(){ go(opt.back || '/'); }},'Finish')
      ));
    }
  }
  draw();
}

function testSetupPanel(root, pool, title, ac, back){
  if(!pool.length) return emptyDeck(root, title);
  var lens = [10,20,30,50].filter(function(n){ return n <= pool.length; });
  if(lens.indexOf(pool.length) < 0) lens.push(pool.length);
  var chosen = lens[Math.min(1, lens.length-1)];

  var panel = el('div',{class:'panel', style:'--ac:'+ac});
  panel.appendChild(el('h2',{}, title));
  panel.appendChild(el('p',{class:'lead'}, pool.length + ' questions available. Randomised each time — run it again and you get a different set.'));

  var grid = el('div',{class:'opts-grid'});
  function paint(){
    grid.innerHTML = '';
    lens.forEach(function(n){
      grid.appendChild(el('button',{class:'len'+(n===chosen?' on':''), onclick:function(){ chosen = n; paint(); }},
        el('b',{}, String(n)),
        el('span',{}, n === pool.length ? 'all' : 'questions')
      ));
    });
  }
  paint();
  panel.appendChild(grid);
  panel.appendChild(el('div',{class:'btn-row'},
    el('button',{class:'btn btn-ghost', onclick:function(){ go(back); }},'Back'),
    el('button',{class:'btn btn-primary', onclick:function(){ startTest(pool, chosen, title, ac, back); }},'Start test →')
  ));
  root.appendChild(panel);
}

function startTest(pool, n, title, ac, back){
  var items = shuffle(pool).slice(0, n);
  var answers = new Array(items.length).fill(-1);
  var pos = 0;
  var app = document.getElementById('app');

  function draw(){
    app.innerHTML = '';
    app.className = 'fade';
    var q = items[pos];
    var wrap = el('div',{class:'qwrap', style:'--ac:'+ac});
    app.appendChild(wrap);

    wrap.appendChild(el('div',{class:'qmeta'},
      el('span',{}, 'Question ' + (pos+1) + ' of ' + items.length),
      el('span',{class:'sys'}, q.system || deckMeta(q.deck).name)
    ));
    wrap.appendChild(el('div',{class:'qbar'}, el('i',{style:'width:'+(100*(pos+1)/items.length)+'%'})));
    wrap.appendChild(el('div',{class:'qtext'}, q.question));

    var list = el('div',{class:'opts'});
    q.options.forEach(function(text, i){
      var on = answers[pos] === i;
      list.appendChild(el('button',{
        class:'opt', style: on ? 'border-color:'+ac+';background:var(--panel-2)' : '',
        onclick:function(){ answers[pos] = i; draw(); }
      },
        el('span',{class:'k', style: on ? 'background:'+ac+';color:#04101F;border-color:'+ac : ''}, String.fromCharCode(65+i)),
        el('span',{class:'t'}, text)
      ));
    });
    wrap.appendChild(list);

    wrap.appendChild(el('div',{class:'btn-row'},
      el('button',{class:'btn btn-ghost', onclick:function(){ if(pos>0){ pos--; draw(); scrollTop(); } }, disabled: pos===0 ? 'disabled' : null},'← Back'),
      pos < items.length-1
        ? el('button',{class:'btn btn-primary', onclick:function(){ pos++; draw(); scrollTop(); }, disabled: answers[pos]<0 ? 'disabled' : null},'Next →')
        : el('button',{class:'btn btn-primary', onclick:function(){ finish(); }, disabled: answers[pos]<0 ? 'disabled' : null},'Submit')
    ));
  }

  function finish(){
    var missed = [];
    items.forEach(function(q,i){
      var ok = answers[i] === q.correctIndex;
      record(q, ok);
      if(!ok) missed.push({q:q, picked:answers[i]});
    });
    var score = items.length - missed.length;
    var pct = Math.round(100*score/items.length);
    state.tests.push({t:title, n:items.length, s:score});
    if(state.tests.length > 40) state.tests = state.tests.slice(-40);
    saveState();

    app.innerHTML = '';
    app.className = 'fade';
    var col = pct >= 80 ? 'var(--green)' : (pct >= 60 ? 'var(--amber)' : 'var(--red)');
    var C = 2*Math.PI*58;

    app.appendChild(el('div',{class:'score'},
      el('div',{class:'ring', html:
        '<svg width="132" height="132" viewBox="0 0 132 132">'+
        '<circle cx="66" cy="66" r="58" fill="none" stroke="var(--panel-3)" stroke-width="9"/>'+
        '<circle cx="66" cy="66" r="58" fill="none" stroke="'+col+'" stroke-width="9" stroke-linecap="round" '+
        'stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct/100))+'"/></svg>'+
        '<div class="v"><b style="color:'+col+'">'+pct+'%</b><span>'+score+' / '+items.length+'</span></div>'
      }),
      el('h2',{}, pct >= 80 ? 'Solid.' : (pct >= 60 ? 'Getting there.' : 'Worth another pass.')),
      el('p',{}, missed.length
        ? missed.length + ' to review below. Each one is now in your Weak Spots until you beat it.'
        : 'Every question correct. Try a longer set or a different deck.')
    ));

    app.appendChild(el('div',{class:'btn-row', style:'max-width:460px;margin:20px auto 0'},
      el('button',{class:'btn btn-ghost', onclick:function(){ go(back); }},'Done'),
      el('button',{class:'btn btn-secondary', onclick:function(){ startTest(pool, n, title, ac, back); scrollTop(); }},'Retake'),
      missed.length ? el('button',{class:'btn btn-primary', onclick:function(){ go('/weak'); }},'Drill misses') : null
    ));

    if(missed.length){
      app.appendChild(el('div',{class:'sec-title'},'Review'));
      var rev = el('div',{class:'review'});
      missed.forEach(function(m){
        var q = m.q;
        rev.appendChild(el('div',{class:'rq'},
          el('div',{class:'q'}, q.question),
          el('div',{class:'line y'}, el('span',{class:'lb'},'Yours'), el('span',{}, m.picked >= 0 ? q.options[m.picked] : '—')),
          el('div',{class:'line c'}, el('span',{class:'lb'},'Correct'), el('span',{}, q.options[q.correctIndex])),
          el('div',{class:'explain', style:'margin-top:11px;--ac:'+col},
            el('span',{class:'lbl'},'Why'),
            q.explanation,
            q.citation ? el('div',{}, el('span',{class:'cite'},
              String(q.citation).replace(/^NFPA 25 \(2020\)\s*§?\s*/,'').replace(/^§/,''))) : null
          )
        ));
      });
      app.appendChild(rev);
    }
    scrollTop();
  }

  draw();
}

/* ============================================================
   PROGRESS
   ============================================================ */
function renderProgress(root){
  crumb(root, {label:'Home', path:'/'}, {label:'Progress'});

  var acc = accuracy();
  root.appendChild(el('div',{class:'stats'},
    el('div',{class:'stat s-b'}, el('b',{},String(state.answered)), el('span',{},'Answered')),
    el('div',{class:'stat s-g'}, el('b',{}, acc===null?'—':acc+'%'), el('span',{},'Accuracy')),
    el('div',{class:'stat s-r'}, el('b',{},String(weakList().length)), el('span',{},'Weak spots')),
    el('div',{class:'stat'}, el('b',{},String(state.tests.length)), el('span',{},'Tests taken'))
  ));

  if(!state.answered){
    root.appendChild(el('div',{class:'empty'},
      el('div',{class:'ic'},'○'),
      el('h3',{},'Nothing tracked yet'),
      el('p',{},'Answer some questions and this page fills in with per-system mastery.')
    ));
    return;
  }

  /* by deck */
  root.appendChild(el('div',{class:'sec-title'},'By I·T·M'));
  var d1 = el('div',{class:'mastery'});
  DECKS.concat(['general']).forEach(function(d){
    var set = deckSet(d);
    if(!set.length) return;
    d1.appendChild(masteryRow(set, deckMeta(d).name, deckMeta(d).ac));
  });
  root.appendChild(d1);

  /* by system */
  var systems = {};
  BANK.questions.forEach(function(q){ (systems[q.system] = systems[q.system] || []).push(q); });
  root.appendChild(el('div',{class:'sec-title'},'By system'));
  var d2 = el('div',{class:'mastery'});
  Object.keys(systems).sort().forEach(function(s){
    d2.appendChild(masteryRow(systems[s], s, null));
  });
  root.appendChild(d2);

  root.appendChild(el('div',{class:'btn-row', style:'max-width:460px;margin:24px auto 0'},
    el('button',{class:'btn btn-ghost', onclick:function(){ go('/'); }},'Home'),
    weakList().length ? el('button',{class:'btn btn-primary', onclick:function(){ go('/weak'); }},'Drill weak spots') : null
  ));
}

function masteryRow(set, name, forceColor){
  var att = 0, hit = 0, seen = 0;
  set.forEach(function(q){
    var s = state.seen[q._id]||0, r = state.right[q._id]||0;
    if(s){ seen++; att += s; hit += r; }
  });
  var pct = att ? Math.round(100*hit/att) : 0;
  var col = forceColor || (att === 0 ? 'var(--dim)' : (pct >= 80 ? 'var(--green)' : (pct >= 60 ? 'var(--amber)' : 'var(--red)')));
  return el('div',{class:'mrow'},
    el('div',{class:'top'},
      el('span',{class:'nm'}, name),
      el('span',{class:'pc', style:'color:'+col}, att ? pct+'%' : '—')
    ),
    el('div',{class:'mbar'}, el('i',{style:'width:'+(att?pct:0)+'%;background:'+col})),
    el('div',{class:'sub'}, att ? (seen + ' of ' + set.length + ' questions touched · ' + hit + '/' + att + ' right')
                                : (set.length + ' questions · not started'))
  );
}

/* ============================================================
   BOOT
   ============================================================ */
loadState();
document.getElementById('ed').textContent = (BANK.edition || 'NFPA 25, 2020').replace('NFPA 25, ','') + ' Ed.';
document.getElementById('reset').addEventListener('click', function(){
  if(confirm('Reset all progress on this device? This clears answers, weak spots and test history.')) resetState();
});
route();
</script>

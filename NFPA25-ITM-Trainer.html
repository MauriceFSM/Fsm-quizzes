 — 5 years is the harsh-environment interval for automatic nozzles (§12.3.1.3).","Wrong — 10 years applies to open nozzles that cannot be discharged annually and are not subject to the harsh conditions of §12.3.2.2 (§12.3.2.3).","Wrong — post-discharge actions exist (for example inspecting a representative sample of operated nozzles per §12.4.1.5), but they do not replace the annual requirement for these nozzles."]},{"deck":"testing","system":"Water Mist","frequency":"","drill":false,"question":"You are pulling a representative sample of automatic water mist nozzles for laboratory testing. What is the minimum sample size?","options":["Four nozzles or 1 percent of the nozzles per individual sample, whichever is greater","Three nozzles or 1 percent of the nozzles per individual sample, whichever is greater","Four nozzles or 1 percent of the nozzles per individual sample, whichever is less","Two nozzles per protected zone"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.3.1.4","explanation":"For automatic nozzles the floor is four nozzles, and on larger systems the 1 percent calculation governs because you take the greater of the two.","optionNotes":["Correct — §12.3.1.4 states a minimum of four nozzles or 1 percent, whichever is greater.","Wrong — three is the minimum for a representative sample of open water mist nozzles (§12.3.2.4), not automatic nozzles.","Wrong — taking the lesser would let a very large system be judged on four nozzles; the standard takes the greater value.","Wrong — the sample size is not expressed per zone in §12.3.1.4."]},{"deck":"testing","system":"Water Mist","frequency":"","drill":false,"question":"One water mist nozzle in a representative laboratory sample fails to meet the test requirement. What does NFPA 25 require?","options":["Replace all water mist nozzles within the area represented by that sample","Replace only the nozzle that failed","Pull a second, larger sample and test again before replacing anything","Replace every water mist nozzle in the building"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.3.1.5 and §12.3.2.5","explanation":"A sample failure condemns the population it represents. The scope of replacement is the area that sample was drawn to represent — not just the failed nozzle, and not the whole building.","optionNotes":["Correct — both the automatic nozzle rule (§12.3.1.5) and the open nozzle rule (§12.3.2.5) require replacing all nozzles in the represented area.","Wrong — the sample exists to judge the whole represented population; replacing only the failed nozzle defeats the purpose of sampling.","Wrong — the standard does not offer a second-sample reprieve.","Wrong — the replacement scope is the represented area, not every nozzle on the property."]},{"deck":"inspection","system":"Water Mist","frequency":"Monthly","drill":true,"question":"A water mist system uses compressed gas cylinders that are NOT electrically supervised and monitored. How often must cylinder pressure be inspected?","options":["Monthly","Semiannually","Quarterly","Annually"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.2.5.4.2","explanation":"Without electrical supervision, nothing tells you the cylinder has lost pressure, so the standard demands a monthly manual check (or the manufacturer's schedule).","optionNotes":["Correct — §12.2.5.4.2 sets a monthly minimum for unsupervised compressed gas cylinder pressure.","Wrong — semiannually is the minimum where the cylinders ARE electrically supervised and monitored (§12.2.5.4.1).","Wrong — quarterly is the interval for compressed gas cylinder securement (§12.2.5.1.1) and for unsupervised water levels in high-pressure cylinders (§12.2.5.5.1).","Wrong — annually is when the cylinder is visually inspected for proper specification, capacity, and pressure rating (§12.2.5.3), and when discharge-side cylinder pressure is checked (§12.2.5.4.3)."]},{"deck":"inspection","system":"Water Mist","frequency":"Semiannually","drill":true,"question":"The water level in a water mist system's high-pressure water storage cylinders is electrically supervised. How often must that water level be inspected?","options":["Semiannually","Quarterly","Monthly","Annually"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.2.5.5.2","explanation":"Supervision buys you a longer interval: supervised water levels in high-pressure cylinders are checked semiannually, while unsupervised levels are checked quarterly.","optionNotes":["Correct — §12.2.5.5.2 sets semiannual inspection for supervised water levels in high-pressure cylinders.","Wrong — quarterly is the interval for UNsupervised water levels in high-pressure cylinders (§12.2.5.5.1).","Wrong — monthly is the interval for unsupervised water levels in water recirculation tanks (§12.2.8.2.1).","Wrong — annually applies to items such as vent plug inspection (§12.2.5.6) and filter inspection (§12.2.5.7) on high-pressure water storage containers."]},{"deck":"inspection","system":"Water Mist","frequency":"Monthly","drill":true,"question":"A water mist system has a water recirculation tank whose level is not supervised. How often must the water level be inspected?","options":["Monthly","Quarterly","Semiannually","Annually"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.2.8.2.1","explanation":"Unsupervised recirculation tank levels get a monthly look; supervising the level relaxes it to quarterly. Note the recirculation tank intervals are one step tighter than the corresponding high-pressure cylinder intervals.","optionNotes":["Correct — §12.2.8.2.1 requires monthly inspection of unsupervised recirculation tank water levels.","Wrong — quarterly is the interval for SUPERVISED water levels in recirculation tanks (§12.2.8.2.2).","Wrong — semiannual is the supervised high-pressure cylinder water level interval (§12.2.5.5.2).","Wrong — annually is when recirculation tank water quality is inspected and the tank drained, flushed, and refilled as necessary (§12.2.8.3), and when filters, strainers, and the cyclone separator are inspected and cleaned (§12.2.8.4)."]},{"deck":"inspection","system":"Water Mist","frequency":"Every 5 years","drill":true,"question":"Compressed gas cylinders on a water mist system have remained continuously in service without discharging. What does NFPA 25 require?","options":["A complete external visual inspection every 5 years, or more often if required","A hydrostatic test every 5 years","A complete external visual inspection every 10 years","An internal inspection every year"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.2.5.2 and §12.2.5.2.1","explanation":"Cylinders that sit in service undischarged get a full external visual inspection on a 5-year cycle, performed in accordance with the CGA C-6 visual inspection standard, except that the cylinders need not be emptied or stamped while under pressure.","optionNotes":["Correct — §12.2.5.2 sets the 5-year complete external visual inspection.","Wrong — the 5-year figure in §12.3.6.1 is a recharge restriction: a DOT/CTC cylinder cannot be recharged without retesting if more than 5 years have elapsed since the last test. That is not the same as a scheduled hydrostatic test every 5 years.","Wrong — 10 years is not the interval for this external visual inspection.","Wrong — the required inspection is external and visual; §12.2.5.2.1 even relieves the requirement to empty the cylinder."]},{"deck":"testing","system":"Water Mist","frequency":"Every 5 years","drill":true,"question":"How does NFPA 25 require hose on a water mist system to be tested?","options":["Every 5 years, at 1½ times the maximum container pressure at 130°F (54.4°C)","Annually, at 150 psi at ambient temperature","Every 3 years, at system working pressure","Every 5 years, at 200 psi at ambient temperature"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.3.10.1 and §12.3.10.2","explanation":"Hose is tested on a 5-year cycle at one and a half times the maximum container pressure, with the test conducted at 130°F. The procedure in §12.3.10.3 requires reaching test pressure within 1 minute and holding it for a full minute, with hose that fails marked, destroyed, and replaced, and hose that passes marked with the test date.","optionNotes":["Correct — the interval from §12.3.10.1 combined with the test pressure and temperature from §12.3.10.2.","Wrong — the interval is 5 years, not annual, and the test pressure is tied to container pressure rather than a fixed 150 psi.","Wrong — 3 years is not an interval used in Chapter 12.","Wrong — the interval is right but the pressure basis and temperature are not; the standard specifies 1½ times maximum container pressure at 130°F (54.4°C)."]},{"deck":"testing","system":"Water Mist","frequency":"Quarterly","drill":true,"question":"A water mist system is powered by pressurized nitrogen cylinders. How often must it be tested to verify nozzle flow — no blockage and a fully developed spray pattern?","options":["Quarterly, or as determined by an approved risk analysis in accordance with the manufacturer's specifications","Annually only","Semiannually only","Every 5 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.3.9.2","explanation":"Gas-driven water mist systems are tested quarterly unless an approved risk analysis sets a different frequency. The test can use the primary cylinders or pressure vessels, or temporary/test cylinders or tanks, to confirm nozzle flow on operation.","optionNotes":["Correct — §12.3.9.2 sets quarterly with the risk-analysis alternative.","Wrong — annual testing is what §12.3.16 requires for operating the water mist system per the manufacturer's instructions; it does not replace the quarterly requirement for gas-powered systems.","Wrong — semiannual applies to items such as pneumatic valves (§12.3.12.2), enclosure and interlock integrity (§12.2.11), and pneumatically operated valves and tubing inspection (§12.2.6).","Wrong — 5 years applies to hose testing (§12.3.10.1) and rebuilding pneumatically operated standby pumps (§12.4.3)."]},{"deck":"maintenance","system":"Water Mist","frequency":"Annually","drill":false,"question":"Automatic water mist nozzles protect commercial cooking equipment and the ventilating system. The annual examination shows no buildup of grease or other material on the nozzles. What does NFPA 25 require?","options":["The nozzles are not required to be replaced","The nozzles must still be replaced annually","The nozzles must be replaced every 5 years","The nozzles must be sent to a testing laboratory instead of being replaced"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.4.2.7 and §12.4.2.7.1","explanation":"The base rule is annual replacement of automatic nozzles over cooking equipment, but the standard grants relief: if the annual examination shows no grease or material buildup, replacement is not required.","optionNotes":["Correct — §12.4.2.7.1 waives the replacement when the annual examination is clean.","Wrong — this ignores the exception; unconditional annual replacement is only the rule in §12.4.2.7 before §12.4.2.7.1 is applied.","Wrong — 5 years is not the interval for cooking-equipment nozzle replacement.","Wrong — laboratory sample testing is the alternative offered for the 10-year and harsh-environment nozzle programs (§12.3.1.2, §12.3.1.3), not for cooking-equipment nozzles."]},{"deck":"maintenance","system":"Water Mist","frequency":"Annually","drill":false,"question":"NFPA 25 (2020) added an annual maintenance requirement specific to water mist systems that use open nozzles. What is it?","options":["The system shall be flushed","All open nozzles shall be replaced","The system shall be hydrostatically tested","All strainers and filters shall be replaced"],"correctIndex":0,"citation":"NFPA 25 (2020) §12.4.1.8","explanation":"An open-nozzle water mist system has to be flushed once a year. Its neighbor, §12.4.1.7, puts a water tank that supplies a water mist system on an annual drain-and-refill — note that clause is marked in this edition as revised text, not as brand-new material like §12.4.1.8.","optionNotes":["Correct — §12.4.1.8 requires annual flushing of a water mist system with open nozzles.","Wrong — open nozzle replacement follows the test-or-replace program of §12.3.2.2 and §12.3.2.3, which is 1-year for harsh environments and 10 years then 5-year intervals otherwise.","Wrong — Chapter 12 does not impose an annual hydrostatic test of the water mist system.","Wrong — system filters and strainers are cleaned or replaced after each system operation due to fire (§12.4.1.6), and strainers and filters are inspected and cleaned per the manufacturer's instructions (§12.2.2.3) — cleaning, not annual wholesale replacement."]},{"deck":"testing","system":"General","frequency":"Annually","drill":true,"question":"A single water supply lead-in feeds a building's sprinkler system. How often does NFPA 25 require a main drain test on that lead-in to determine whether the condition of the water supply has changed?","options":["Quarterly","Semiannually","Annually","Every 3 years"],"correctIndex":2,"citation":"NFPA 25 (2020) §13.2.3","explanation":"The baseline main drain test interval is once a year for each water supply lead-in to a building housing a water-based fire protection system. The whole point of the test is to compare today's static and residual readings against past results so a closed or partially closed supply valve, or a deteriorating public main, gets caught.","optionNotes":["Quarterly is the main drain interval only in the special case where the sole water supply passes through a backflow preventer and/or a pressure-reducing valve (§13.2.3.2) — not the general rule.","Semiannually is not a main drain interval anywhere in Chapter 13; it belongs to valve supervisory switch testing (§13.3.3.5.1) and vane/paddle/pressure-switch waterflow device testing (§13.2.4.4.2).","Correct — annually per water supply lead-in.","Every 3 years is a real Chapter 13 interval (dry pipe full-flow trip test, dry pipe/preaction gas leakage test), but it is far too long for a main drain test."]},{"deck":"testing","system":"Valves","frequency":"Quarterly","drill":true,"question":"A building's only water supply to the sprinkler system passes through a reduced-pressure backflow preventer. At minimum, how often must a main drain test be conducted on at least one system downstream of that device?","options":["Quarterly","Annually","Semiannually","Monthly"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.2.3.2","explanation":"When every drop of water reaches the system through a backflow preventer and/or a pressure-reducing valve, the standard tightens the main drain interval to quarterly on at least one downstream system. Those devices contain internal checks and springs that can foul or stick, and a quarterly flow gives earlier warning of a supply restriction than an annual test would.","optionNotes":["Correct — quarterly on at least one system downstream of the device.","Annually is the general main drain interval under §13.2.3, but the backflow/PRV condition overrides it with a shorter interval.","Semiannually is not a main drain interval; it is used for valve supervisory switch testing (§13.3.3.5.1).","Monthly is shorter than the standard requires here; monthly appears for gauge inspection (§13.2.5.1.1) and dry pipe/preaction/deluge valve exterior inspection."]},{"deck":"testing","system":"General","frequency":"","drill":false,"question":"You run a main drain test and the full flow pressure reading is 12 percent lower than the reading from the original acceptance test. What does NFPA 25 require?","options":["Record the reading and re-test in 30 days to confirm the trend","Identify the cause of the reduction and correct it if necessary","Immediately declare the system impaired and notify the AHJ","Nothing — a reduction under 20 percent is within acceptable tolerance"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.2.3.3","explanation":"A 10 percent or greater drop in full flow pressure compared to the original acceptance test or previous tests is the trigger point. Once you cross it, the requirement is to find out why and fix it if a fix is warranted — the reading is telling you something changed in the supply or in a valve between the supply and the riser.","optionNotes":["A confirming re-test is not what the standard calls for; the 10 percent threshold has already been crossed, so investigation is required now.","Correct — the cause shall be identified and corrected if necessary.","An impairment declaration is not automatically triggered by the pressure drop itself; the required action is to investigate the cause. Impairment procedures live in Chapter 15 and apply when the system is actually out of service.","There is no 20 percent tolerance in this section — the threshold that triggers action is a 10 percent reduction."]},{"deck":"testing","system":"Sprinkler","frequency":"","drill":false,"question":"A water supply lead-in enters a building and feeds a manifold that serves four separate sprinkler systems. What does NFPA 25 permit for the main drain test?","options":["A main drain test must be run on each of the four systems","A single main drain test is permitted","Two of the four systems must be tested, alternating each year","A main drain test is not required where a manifold is used"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.2.3.1","explanation":"When the lead-in feeds a header or manifold serving multiple systems, one main drain test covers the lead-in. The test is evaluating the incoming supply, not each individual system, so draining one point gives you the information you need about that common supply.","optionNotes":["Testing all four is more than the standard requires when they share a single lead-in through a header or manifold.","Correct — a single main drain test is permitted in this arrangement.","There is no alternating or rotating sampling scheme for main drain tests in Chapter 13.","The test is still required — the allowance is that one test satisfies it, not that it is waived."]},{"deck":"testing","system":"Sprinkler","frequency":"","drill":false,"question":"During a waterflow alarm test on a wet pipe system, how quickly must the alarm become audible once flow begins, and how long must it continue?","options":["Within 90 seconds of flow, continuing for at least 5 minutes","Within 5 minutes after flow begins, and until flow stops","Within 30 seconds of flow, and until the system is reset","Within 5 minutes after flow begins, and for 90 seconds thereafter"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.2.4.1","explanation":"Two separate performance requirements get mixed up constantly. This one is about the audible alarm: it must sound no later than 5 minutes after flow starts, and it must keep sounding the entire time water is flowing. The 90-second number in the same area of the standard is a different requirement about the initiating device.","optionNotes":["90 seconds is the requirement for activation of the initiating device (§13.2.4.2), not the audible alarm, and the alarm duration is tied to flow stopping — not a fixed 5 minutes.","Correct — audible within 5 minutes after flow begins, and until such flow stops.","30 seconds is not a Chapter 13 waterflow criterion, and the duration is tied to flow stopping, not to a reset.","The 5-minute figure is right but the duration is wrong — the alarm continues until flow stops, not for a fixed 90 seconds."]},{"deck":"testing","system":"Sprinkler","frequency":"","drill":false,"question":"NFPA 25 sets a time limit for activation of the waterflow alarm-initiating device. What flow condition and time frame apply?","options":["Within 90 seconds, benchmarked to a flow at least as large as one sprinkler of the smallest orifice size present in that system","Within 5 minutes, benchmarked to one sprinkler of the largest orifice size present","Within 90 seconds, benchmarked to a flow at least as large as two sprinklers of the smallest orifice size present","Within 30 seconds of any measurable flow through the riser"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.2.4.2, extracted from NFPA 72","explanation":"The benchmark flow is one sprinkler of the smallest orifice size present in that system — the smallest realistic fire-sized flow the device has to catch. From the moment that flow reaches the device, it has 90 seconds to activate.","optionNotes":["Correct — 90 seconds, with the reference flow set by the smallest-orifice sprinkler in that system.","5 minutes is the audible alarm criterion (§13.2.4.1), and the benchmark sprinkler is the smallest orifice, not the largest — using the largest would make the test easier and defeat the purpose.","The benchmark is one sprinkler, not two.","30 seconds is not a Chapter 13 figure, and 'any measurable flow' is not the benchmark — the standard ties it to a defined single-sprinkler flow."]},{"deck":"testing","system":"Sprinkler","frequency":"Quarterly","drill":true,"question":"A wet system riser has a water motor gong. How often must this mechanical waterflow alarm device be tested?","options":["Semiannually","Quarterly","Annually","Monthly"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.2.4.3.2","explanation":"Mechanical waterflow alarm devices — water motor gongs and similar — are tested quarterly. They are purely hydraulic and have a strainer and small passages that silt up, so the standard keeps them on the shorter interval. They are also inspected quarterly for physical damage under §13.2.4.3.1.","optionNotes":["Semiannually is the test interval for vane-type, paddle-type, and pressure-switch-type waterflow devices (§13.2.4.4.2) — the electric ones, not the mechanical gong.","Correct — mechanical waterflow alarm devices are tested quarterly.","Annually is not the interval for waterflow alarm devices of either type.","Monthly is used for gauge inspection and dry pipe/preaction/deluge valve exterior inspection, not for waterflow alarm testing."]},{"deck":"testing","system":"Sprinkler","frequency":"Semiannually","drill":true,"question":"A wet pipe system uses a paddle-type waterflow switch. How often is that device tested, and how often is it inspected for physical damage?","options":["Tested quarterly, inspected quarterly","Tested semiannually, inspected quarterly","Tested annually, inspected monthly","Tested semiannually, inspected semiannually"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.2.4.4.1 and §13.2.4.4.2","explanation":"Vane-type, paddle-type, and pressure-switch-type devices get looked at quarterly for physical damage but only operated semiannually. Contrast this with the mechanical water motor gong, which is both inspected and tested quarterly — a favorite exam trap.","optionNotes":["Quarterly testing applies to mechanical waterflow alarm devices such as water motor gongs (§13.2.4.3.2), not to vane/paddle/pressure-switch devices.","Correct — semiannual test, quarterly inspection.","Annual testing is not the requirement for these devices, and the inspection interval is quarterly rather than monthly.","The test interval is right but the inspection interval is quarterly, not semiannually."]},{"deck":"testing","system":"Sprinkler","frequency":"","drill":false,"question":"You need to test the waterflow alarm on a dry pipe system. What does NFPA 25 require you to use?","options":["The inspector's test connection at the end of the most remote branch line","The bypass connection","The main drain valve at the riser","The auxiliary drain nearest the dry pipe valve"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.2.4.8","explanation":"On dry pipe, preaction, and deluge systems, waterflow alarm testing is done through the bypass connection. Using the inspector's test connection on a dry system would trip the valve and put water in the piping, which is exactly what you are trying to avoid for a routine alarm test.","optionNotes":["The inspector's test valve is the method for wet pipe systems (§13.2.4.5); using it on a dry system would trip the valve.","Correct — the bypass connection is used for dry pipe, preaction, and deluge systems.","The main drain valve is used for main drain testing (§13.2.3), not for waterflow alarm testing.","Auxiliary drains are operated for maintenance after system operation and before freezing weather (§13.4.5.3.2); they are not the alarm test path."]},{"deck":"testing","system":"Sprinkler","frequency":"","drill":false,"question":"It is January and freezing conditions make it unsafe to use the inspector's test valve on a wet system to test the waterflow alarm. What does NFPA 25 permit?","options":["Deferring the test until the next warm-weather quarter","Using the bypass connection","Using the main drain to simulate flow","Testing the alarm electrically at the panel only"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.2.4.6","explanation":"Where freezing weather or other circumstances prevent using the inspector's test valve, the standard explicitly allows the bypass connection instead. The test still happens on schedule — only the flow path changes.","optionNotes":["The standard provides an alternate method rather than permitting the test to be skipped or deferred.","Correct — the bypass connection is permitted where freezing weather or other circumstances prohibit using the inspector's test valve.","The main drain is not offered as a substitute for the waterflow alarm test path in this section.","Bench-testing at the panel does not verify that flow through the system actually operates the device; the standard names the bypass connection as the alternate."]},{"deck":"general","system":"Fire Pump","frequency":"","drill":false,"question":"NFPA 25 addresses taking a fire pump out of service during testing. Under Chapter 13, what does it allow?","options":["Fire pumps may never be taken out of service during testing under any circumstance","The pump may be out of service only if constantly attended by qualified personnel, or if all impairment procedures in Chapter 15 are followed","Written AHJ approval must be obtained at least 30 days in advance","The pump may be out of service for up to 4 hours with no further requirements"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.2.4.7","explanation":"Chapter 13 gives two acceptable paths for a fire pump that has to come out of service during testing: keep qualified personnel constantly attending it so protection can be restored immediately, or handle it formally as an impairment under Chapter 15. Either one — but not neither.","optionNotes":["The standard allows it under defined conditions rather than prohibiting it outright.","Correct — constant attendance by qualified personnel, or full Chapter 15 impairment procedures.","A 30-day advance AHJ approval requirement is not stated in this section.","There is no blanket 4-hour free window; the 4-hour figure in Chapter 13 belongs to the alternate air/gas leakage test method for dry pipe and preaction systems."]},{"deck":"inspection","system":"General","frequency":"Quarterly","drill":true,"question":"A gauge on a wet system riser monitors water pressure. Under NFPA 25, how often is it inspected to verify that normal water supply pressure is being maintained, and how often is it inspected to verify it is operable and undamaged?","options":["Both quarterly","Pressure verification quarterly; operable/undamaged verification monthly","Both monthly","Pressure verification monthly; operable/undamaged verification quarterly"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.2.5.1.1 and §13.2.5.1.2","explanation":"Two different gauge inspections run on two different clocks. Every month you confirm the gauge itself works and is not damaged. Every quarter you read a water-pressure gauge to confirm normal supply pressure is being maintained. That is why Table 13.1.1.2 lists gauges as \"monthly/quarterly.\"","optionNotes":["Only the pressure-verification check is quarterly; the operable/undamaged check is monthly.","Correct — quarterly for the water pressure verification, monthly for the operable and undamaged check.","Only the operable/undamaged check is monthly; the water pressure verification is quarterly.","The two intervals are reversed."]},{"deck":"inspection","system":"General","frequency":"Quarterly","drill":true,"question":"A dry pipe system has an air pressure supervisory signal connected to a constantly attended location. How often must the air pressure gauges be inspected?","options":["Monthly","Quarterly","Weekly","Annually"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.2.5.1.3 and §13.2.5.1.3.2","explanation":"Gauges monitoring air or nitrogen pressure are normally inspected monthly. But when air pressure supervision reports to a constantly attended location, someone is effectively watching the pressure continuously, so the standard relaxes the physical gauge inspection to quarterly.","optionNotes":["Monthly is the baseline interval for air or nitrogen gauges (§13.2.5.1.3), but the constantly attended supervision allowance extends it.","Correct — quarterly where air pressure supervision is connected to a constantly attended location.","Weekly is the control valve inspection interval for valves that are not locked or supervised (§13.3.2.1), not a gauge interval.","Annually is not a gauge inspection interval in Chapter 13."]},{"deck":"maintenance","system":"General","frequency":"Every 5 years","drill":true,"question":"A riser gauge has been in service for five years. What does NFPA 25 require?","options":["Replace it, or test it by comparison with a calibrated gauge","Replace it — no testing alternative is permitted","Recalibrate it and re-tag it for another 10 years","Nothing, unless it reads outside 10 percent of full scale"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.2.5.2 and §13.2.5.3","explanation":"At the 5-year mark you have a choice: swap the gauge out, or verify it against a calibrated gauge. If verification shows it is not accurate within 3 percent of full scale, it has to be recalibrated or replaced.","optionNotes":["Correct — replace every 5 years, or test every 5 years by comparison with a calibrated gauge.","Testing by comparison with a calibrated gauge is an explicit alternative to replacement.","The interval remains 5 years; recalibration does not buy a 10-year extension.","The accuracy threshold is 3 percent of full scale, not 10 percent, and the 5-year action is required regardless."]},{"deck":"maintenance","system":"General","frequency":"","drill":false,"question":"A riser gauge is compared against a calibrated gauge and is found to be off by 4 percent of full scale. What does NFPA 25 require?","options":["Nothing — it is within tolerance","Tag it and re-verify in 12 months","Recalibrate or replace it","Replace the entire gauge assembly including the gauge valve"],"correctIndex":2,"citation":"NFPA 25 (2020) §13.2.5.3","explanation":"The accuracy limit is 3 percent of full scale. A gauge outside that band is not giving usable information for main drain comparisons or air pressure supervision, so it must be recalibrated or replaced.","optionNotes":["4 percent exceeds the 3 percent of full scale accuracy limit, so it is not within tolerance.","There is no allowance to defer action on an out-of-tolerance gauge for a year.","Correct — a gauge not accurate to within 3 percent of full scale is recalibrated or replaced.","The requirement addresses the gauge itself; replacing the gauge valve is not what this section calls for."]},{"deck":"inspection","system":"Sprinkler","frequency":"","drill":false,"question":"A dry pipe system protects a freezer and has air pressure gauges on the air line between the compressor and the dry pipe valve. During a monthly comparison you find the gauge near the compressor reading higher than the gauge above the dry pipe valve. What does NFPA 25 require?","options":["Increase the compressor output until both gauges read the same","Take the in-service air line out of service and open the alternate air line to equalize the pressure","Recalibrate the gauge above the dry pipe valve","Trip test the dry pipe valve immediately"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.2.5.1.4 and §13.2.5.1.4.1","explanation":"A higher reading at the compressor than at the valve means the air line between them is restricted — in a freezer application, almost always ice. The response is to switch to the alternate air line so the system stays supervised, then deal with the blocked line.","optionNotes":["Raising output masks the restriction rather than addressing it, and does not restore a clear air path.","Correct — the air line in service is taken out of service and the alternate air line is opened to equalize the pressure.","The pressure difference is evidence of a blocked line, not a defective gauge; the standard directs you to the air line.","Tripping the valve is not the required response to a blocked air line and would put water into freezer piping."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"Following the discovery of a blocked air line on a freezer dry pipe system, the line has been taken out of service. Before it can serve as the future alternate air line, what does NFPA 25 require?","options":["Hydrostatic testing at 200 psi for 2 hours","Internal inspection, removal of all ice blockage, and reassembly","Replacement with new copper tubing of the same diameter","Certification by the compressor manufacturer"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.2.5.1.4.2","explanation":"The out-of-service line has to be opened up, inspected inside, cleared of every bit of ice blockage, and put back together before it can be counted on as the standby line. Otherwise you have swapped to the alternate line and left yourself with no real backup.","optionNotes":["Hydrostatic testing at 200 psi is not required here; the 200 psi minimum figure in Chapter 13 relates to replacing a fire department connection on other than sprinkler systems.","Correct — internally inspected, all ice blockage removed, and reassembled for use as the future alternate air line.","Replacement is not mandated; the standard requires the existing line be cleared and reassembled.","Manufacturer certification of the air line is not a requirement of this section."]},{"deck":"inspection","system":"Valves","frequency":"Monthly","drill":true,"question":"A sprinkler system control valve is chained and padlocked in the open position in accordance with the applicable NFPA standard. How often must it be inspected?","options":["Weekly","Monthly","Quarterly","Annually"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.3.2.1 and §13.3.2.1.1","explanation":"Control valve inspection runs on a three-tier ladder. Unsecured valves are weekly. Add a lock or supervision per the applicable NFPA standard and it drops to monthly. Electrically supervise it and it drops again to quarterly.","optionNotes":["Weekly is the baseline for valves that are not locked or supervised (§13.3.2.1).","Correct — valves secured with locks or supervised in accordance with applicable NFPA standards may be inspected monthly.","Quarterly applies to valves that are electrically supervised (§13.3.2.1.2), a step beyond a padlock.","Annually is the control valve operation test interval (§13.3.3.1), not an inspection interval."]},{"deck":"inspection","system":"Valves","frequency":"Quarterly","drill":true,"question":"A post indicator valve is electrically supervised with a tamper switch reporting to a monitored panel. What is the minimum inspection frequency?","options":["Weekly","Monthly","Quarterly","Semiannually"],"correctIndex":2,"citation":"NFPA 25 (2020) §13.3.2.1.2","explanation":"Electrical supervision earns the longest control valve inspection interval in the ladder — quarterly — because a tamper switch reports valve movement continuously, so the visual inspection is a backstop rather than the primary detection method.","optionNotes":["Weekly applies to valves that are neither locked nor supervised.","Monthly applies to valves secured with locks or supervised per applicable NFPA standards, a lesser level than electrical supervision.","Correct — electrically supervised valves are permitted to be inspected quarterly.","Semiannually is the valve supervisory switch test interval (§13.3.3.5.1), not a valve inspection interval."]},{"deck":"inspection","system":"Valves","frequency":"","drill":false,"question":"Which of the following is part of the required control valve inspection under NFPA 25?","options":["Verifying that post indicator valves are provided with the correct wrenches","Verifying the valve seat is not leaking internally","Verifying the priming water level is correct","Verifying the retarding chamber drain is not leaking"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.3.2.2","explanation":"The control valve inspection checklist covers position, sealing/locking/supervision, accessibility, correct wrenches for PIVs, freedom from external leaks, and proper identification. A PIV you cannot operate because the wrench is missing is a valve you cannot close in an emergency.","optionNotes":["Correct — PIVs provided with correct wrenches is an explicit item in the control valve inspection list.","Valve seat leakage is an item on the monthly external inspection of preaction and deluge valves (§13.4.3.1.1, §13.4.4.1.1), not the control valve inspection.","Priming water level is a quarterly test item on dry pipe and preaction systems (§13.4.5.2.1, §13.4.3.2.1), not a control valve inspection item.","The retarding chamber and alarm drains not leaking is part of the quarterly external inspection of alarm valves (§13.4.1.1)."]},{"deck":"testing","system":"Valves","frequency":"Annually","drill":true,"question":"How often must each control valve be operated through its full range and returned to its normal position?","options":["Semiannually","Annually","Every 3 years","Quarterly"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.3.3.1","explanation":"Once a year every control valve gets exercised through its full travel and put back where it belongs. This is what catches a valve that has seized, a stem that has become detached, or a gate that no longer seats — problems a visual inspection cannot find.","optionNotes":["Semiannually is the interval for valve supervisory switch testing (§13.3.3.5.1), not for operating the valve itself.","Correct — each control valve is operated annually through its full range and returned to its normal position.","Every 3 years is used for dry pipe full-flow trip tests and gas leakage tests, not control valve operation.","Quarterly is a control valve inspection interval for electrically supervised valves, not the operation test."]},{"deck":"testing","system":"Valves","frequency":"","drill":false,"question":"You are opening a post indicator valve after having closed it for repairs. NFPA 25 requires you to open it until what condition is observed, and how often is this check required?","options":["Until the target reads OPEN, checked annually","Until spring or torsion is felt in the rod, checked every time the valve is closed","Until the handwheel stops turning, checked semiannually","Until the stem has moved one-fifth of its travel, checked quarterly"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.3.3.2 and §13.3.3.2.1","explanation":"Feeling spring or torsion in the rod as it reaches full open proves the rod is still coupled to the gate. Without that feedback you could have a rod spinning freely on a detached gate that is still closed — with the indicator plate happily reading OPEN. Because it verifies the rod connection, the check is done every single time the valve is closed.","optionNotes":["The target plate can read OPEN even with a detached rod, which is precisely the failure this test exists to catch, and the trigger is valve closure, not an annual schedule.","Correct — open until spring or torsion is felt in the rod, and do it every time the valve is closed.","Running the handwheel to a hard stop is not the criterion, and semiannual is the valve supervisory switch test interval.","One-fifth of stem travel is the valve supervisory switch signal criterion (§13.3.3.5.2), not the PIV opening criterion."]},{"deck":"testing","system":"Valves","frequency":"","drill":false,"question":"After fully opening a post indicator valve or an OS&Y valve, what does NFPA 25 require, and why?","options":["Back it a one-quarter turn from fully open to prevent jamming","Back it a full turn from fully open to relieve stem stress","Leave it hard against the fully open stop so tampering is detectable","Back it a one-half turn and re-seal it in that position"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.3.3.3","explanation":"Driving a gate hard into the backseat and leaving it there lets it jam, so the next person who needs to close it in a hurry cannot budge it. A quarter turn back keeps the valve fully open for flow while leaving it free to operate.","optionNotes":["Correct — backed a one-quarter turn from the fully open position to prevent jamming.","A full turn is more than the standard specifies.","Leaving the valve hard against the stop is the jamming condition the requirement exists to prevent.","A one-half turn is not the figure given in this section."]},{"deck":"testing","system":"Valves","frequency":"","drill":false,"question":"A contractor closes a sectional control valve to make a repair, then reopens it. What additional test does NFPA 25 require?","options":["A main drain test at the nearest system riser","A valve status test","A full-range operational test of every other valve on the system","A forward flow test through the backflow preventer"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.3.3.4","explanation":"Any time a control valve is closed and reopened, a valve status test is run at the system riser. It confirms the water is actually back on and the valve is truly in its normal position — the closed-valve-left-closed failure is one of the most common causes of sprinkler systems failing in fires.","optionNotes":["A main drain test is required annually per lead-in and quarterly where the sole supply is through a backflow preventer or PRV; it is not the specific action §13.3.3.4 names here.","Correct — a valve status test is conducted any time a control valve is closed and reopened at the system riser.","Only the affected valve triggers the requirement; there is no obligation to exercise every valve on the system.","A forward flow test is the annual backflow preventer test (§13.7.2.1), not the response to closing and reopening a control valve."]},{"deck":"testing","system":"Valves","frequency":"Semiannually","drill":true,"question":"How often are valve supervisory switches tested, and at what point in valve travel must the distinctive signal be produced?","options":["Annually; within the first two revolutions of the handwheel or one-fifth of stem travel","Semiannually; within the first two revolutions of the handwheel or one-fifth of stem travel","Semiannually; within the first five revolutions of the handwheel or one-half of stem travel","Quarterly; at any point before the valve is fully closed"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.3.3.5.1 and §13.3.3.5.2","explanation":"Supervisory switches are tested twice a year, and the signal has to come early in the valve's travel — within two turns of the handwheel or after the stem has moved one-fifth of the way from normal. Catching the movement early is the whole point; a switch that only signals at fully closed is useless.","optionNotes":["Annually is the test interval for supervisory signal devices other than valve supervisory switches (§13.2.6.2); the switches themselves are semiannual.","Correct — semiannual test, signal within the first two handwheel revolutions or one-fifth of stem travel.","The interval is right but the travel criteria are wrong — two revolutions and one-fifth of stem travel are the figures in the standard.","Quarterly is the inspection interval for control valve supervisory alarm devices (§13.3.2.1.3), and signaling only before fully closed would defeat early detection."]},{"deck":"testing","system":"Valves","frequency":"","drill":false,"question":"A valve supervisory switch signals when the valve is moved off normal. As the valve is returned toward its normal position, at what point may the signal be restored?","options":["Once the stem has returned to within one-fifth of its normal position","At any position the technician judges to be substantially open","Only at the normal position","Once the handwheel is within two revolutions of normal"],"correctIndex":2,"citation":"NFPA 25 (2020) §13.3.3.5.3","explanation":"The supervisory signal must stay active until the valve is genuinely back in its normal position — nowhere short of it. Otherwise a valve could sit almost-but-not-fully open with a clear panel, and nobody would know.","optionNotes":["The travel figures in §13.3.3.5.2 govern when the signal must be initiated, not when it may be cleared.","Technician judgement is not a permitted restoration point; the standard is explicit.","Correct — the supervisory signal may clear only once the valve is genuinely back at its normal position, and at no earlier point in its travel.","Two revolutions of the handwheel is an initiation criterion, not a restoration criterion."]},{"deck":"maintenance","system":"Valves","frequency":"Annually","drill":false,"question":"NFPA 25 requires the operating stems of OS&Y valves to be lubricated annually. What must be done immediately after lubricating?","options":["Nothing further — the lubricant works in during normal operation","Completely close and reopen the valve to test operation and distribute the lubricant","Back the valve a one-half turn and re-seal it","Perform a main drain test to confirm the valve did not shift"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.3.4.1 and §13.3.4.2","explanation":"Grease sitting on a stem does nothing. The valve is cycled fully closed and back open so the lubricant is carried down the threads and so you get proof the valve still operates. Lubrication and operation are a single maintenance action, not two separate ones.","optionNotes":["An OS&Y valve sits in one position for years; there is no normal operation to work the lubricant in.","Correct — the valve is completely closed and reopened to test its operation and distribute the lubricant.","A one-quarter turn back from fully open is the anti-jamming requirement (§13.3.3.3), and it is not the action tied to lubrication.","A main drain test is not what §13.3.4.2 calls for; note that closing and reopening the valve does separately trigger a valve status test under §13.3.3.4."]},{"deck":"inspection","system":"Valves","frequency":"Quarterly","drill":true,"question":"How often are alarm valves and system riser check valves externally inspected, and how often are they and their associated strainers, filters, and restriction orifices inspected internally?","options":["Externally quarterly; internally every 5 years","Externally monthly; internally annually","Externally quarterly; internally annually","Externally annually; internally every 5 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.4.1.1 and §13.4.1.2","explanation":"Alarm valves get a quarterly walk-by looking at gauges, trim condition, valve positions, and whether the retarding chamber or alarm drains are leaking. The internal look — including strainers, filters, and restriction orifices — is on a 5-year cycle, shortened if tests show it is needed sooner.","optionNotes":["Correct — quarterly external inspection, 5-year internal inspection.","Monthly external inspection applies to dry pipe, preaction, and deluge valves, not alarm valves.","The external interval is right but the internal interval is 5 years; annual internal inspection applies to preaction, deluge, and dry pipe valve interiors at the trip test.","Annual is not the external inspection interval for alarm valves."]},{"deck":"inspection","system":"Valves","frequency":"Every 5 years","drill":true,"question":"Under NFPA 25 Chapter 13, how often are check valves inspected internally?","options":["Annually","Every 3 years","Every 5 years","Quarterly"],"correctIndex":2,"citation":"NFPA 25 (2020) §13.4.2.1","explanation":"Check valve internals are opened up every 5 years to verify all the components operate correctly. A check valve that has a corroded hinge pin or a clapper stuck partly open will still hold pressure but will not perform, and only an internal look finds it.","optionNotes":["Annual internal inspection applies to preaction, deluge, and dry pipe valve interiors in conjunction with the trip test, not to check valves.","Every 3 years is the interval for dry pipe full-flow trip tests and dry pipe/preaction gas leakage tests.","Correct — check valves are inspected internally every 5 years.","Quarterly is the alarm valve external inspection interval, not a check valve internal inspection interval."]},{"deck":"inspection","system":"Valves","frequency":"Every 5 years","drill":true,"question":"A preaction valve can be reset without removing a faceplate. How often does NFPA 25 permit the internal inspection of that valve to be conducted?","options":["Annually, at the time of the trip test","Every 5 years","Every 3 years","Quarterly"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.4.3.1.2 and §13.4.3.1.2.1","explanation":"The default is an annual internal inspection at the trip test. But if the valve design lets you reset it without pulling a faceplate, the standard allows stretching the internal inspection to every 5 years — the same allowance applies to deluge valves under §13.4.4.1.2.1. Note the dry pipe valve does not get this allowance.","optionNotes":["Annual at the trip test is the baseline requirement (§13.4.3.1.2); the faceplate allowance extends it.","Correct — 5 years is permitted for valves that can be reset without removal of a faceplate.","Every 3 years is the preaction full-flow trip test and air leakage test interval, not an internal inspection interval.","Quarterly applies to preaction priming water level and low air pressure alarm testing, not internal inspection."]},{"deck":"inspection","system":"Valves","frequency":"Annually","drill":true,"question":"How often is the interior of a dry pipe valve inspected, and when?","options":["Every 5 years, whenever the valve can be reset without removing a faceplate","Annually, when the trip test is conducted","Monthly, at the same time as the external inspection","Every 3 years, at the full-flow trip test"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.4.5.1.3","explanation":"The dry pipe valve interior is inspected every year, at the annual trip test — you already have it open. Watch this one: preaction and deluge valves get a 5-year allowance when they can be reset without removing a faceplate, but the dry pipe valve section contains no such allowance.","optionNotes":["The reset-without-faceplate 5-year allowance is written for preaction (§13.4.3.1.2.1) and deluge (§13.4.4.1.2.1) valves, not for dry pipe valves.","Correct — annually, when the trip test is conducted.","Monthly is the external inspection interval for the dry pipe valve (§13.4.5.1.2), not the internal one.","Every 3 years is the dry pipe full-flow trip test and gas leakage test interval, not the internal inspection."]},{"deck":"inspection","system":"Valves","frequency":"Monthly","drill":false,"question":"During the monthly external inspection of a dry pipe valve, which of these is a required verification?","options":["The retarding chamber is not leaking","The intermediate chamber is not leaking","The priming water level is correct","The valve seat is not leaking"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.4.5.1.2","explanation":"The monthly dry pipe valve external inspection covers three things: the valve is free of physical damage, all trim valves are in the appropriate open or closed position, and the intermediate chamber is not leaking. A weeping intermediate chamber usually means the clapper seat is passing water and the valve is on its way to a false trip.","optionNotes":["The retarding chamber and alarm drains are a quarterly alarm valve external inspection item (§13.4.1.1).","Correct — the intermediate chamber not leaking is one of the three monthly dry pipe valve external inspection items.","Priming water level is a quarterly test (§13.4.5.2.1), not part of the monthly external inspection list.","Valve seat not leaking is an item on the monthly external inspection of preaction (§13.4.3.1.1) and deluge (§13.4.4.1.1) valves, not the dry pipe valve list."]},{"deck":"testing","system":"Valves","frequency":"Quarterly","drill":true,"question":"A supervised preaction system is in service. How often must the priming water level be tested?","options":["Monthly","Quarterly","Semiannually","Annually"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.4.3.2.1","explanation":"Priming water on a supervised preaction system is checked quarterly against the manufacturer's requirements — the same interval that applies to dry pipe valve priming water under §13.4.5.2.1. Too little prime and the clapper can trip prematurely or fail to seal after reset.","optionNotes":["Monthly is the external inspection interval for the preaction valve, not the priming water test.","Correct — quarterly for priming water level in supervised preaction systems.","Semiannually is the valve supervisory switch and vane/paddle waterflow device test interval.","Annually is the preaction trip test and manual actuation device interval, not priming water."]},{"deck":"testing","system":"Valves","frequency":"Every 3 years","drill":true,"question":"A preaction system is due for its air leakage test. Using the pressure test method, what test pressure, duration, and allowable loss does NFPA 25 specify, and how often is this test performed?","options":["40 psi (3.2 bar) for 2 hours, allowable loss up to 3 psi (0.2 bar), every 3 years","40 psi (3.2 bar) for 4 hours, allowable loss up to 5 psi (0.3 bar), annually","50 psi (3.5 bar) for 2 hours, allowable loss up to 3 psi (0.2 bar), every 5 years","150 psi (10 bar) for 2 hours, no allowable loss, every 5 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.4.3.2.6","explanation":"The preaction air leakage pressure test is 40 psi held for 2 hours, on a 3-year cycle. Losing up to 3 psi over the 2 hours is acceptable; more than that and the leaks have to be addressed. The identical numbers apply to dry pipe gas leakage testing under §13.4.5.2.9.","optionNotes":["Correct — 40 psi for 2 hours, up to 3 psi loss permitted, every 3 years.","The 4-hour figure belongs to the alternate method (shutting off the air source for 4 hours), and the interval is 3 years, not annual.","50 psi above normal working pressure relates to hydrostatic testing of a replaced fire department connection on other than sprinkler systems (Table 13.11.1), not to air leakage.","150 psi for 2 hours is the hydrostatic test for FDC piping to the check valve (§13.8.5), a completely different test."]},{"deck":"testing","system":"Valves","frequency":"Every 3 years","drill":false,"question":"Instead of the pressure test method, a technician chooses the alternate air leakage test method on a preaction system. What does that method involve?","options":["Shut off the air source with the system at normal pressure for 4 hours; if the low air pressure alarm sounds within that period, address the leaks","Shut off the air source for 2 hours; if system pressure drops more than 3 psi, address the leaks","Pressurize the system to 40 psi for 4 hours and measure the loss","Isolate the system and hold 150 psi for 2 hours"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.4.3.2.6(2)","explanation":"The second permitted method uses the system's own low air pressure alarm as the pass/fail indicator. Leave the system at its normal pressure, shut off the compressor or shop air, and wait 4 hours. If the low air alarm trips in that window, the system is leaking too much. The same method is offered for dry pipe systems in §13.4.5.2.9(2).","optionNotes":["Correct — air source shut off for 4 hours, with the low air pressure alarm sounding within that period indicating leaks to address.","2 hours is the duration of the pressure test method, and the 3 psi loss criterion belongs to that method, not this one.","The 40 psi pressure test is held for 2 hours, not 4.","150 psi for 2 hours is the FDC piping hydrostatic test (§13.8.5), unrelated to air leakage."]},{"deck":"testing","system":"Valves","frequency":"Every 3 years","drill":true,"question":"NFPA 25 requires preaction valves to be trip tested with the control valve fully open on what interval, and what is required in the intervening years?","options":["Annually fully open; no test required in other years","Every 3 years fully open; trip tested with the control valve partially open in the other years","Every 5 years fully open; trip tested with the control valve partially open in the other years","Every 3 years fully open; internal inspection only in the other years"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.4.3.2.2 and §13.4.3.2.3","explanation":"The full-flow trip test with the control valve wide open runs on a 3-year cycle. In the years between, the preaction valve is still trip tested, but with the control valve only partially open — you prove the valve and detection release without dumping full system flow. Preaction systems protecting freezers are handled under §13.4.3.2.5.","optionNotes":["Testing is required every year; only the control valve position changes with the cycle.","Correct — every 3 years fully open, partially open in the intervening years.","The full-flow interval is 3 years, not 5; the 5-year figure applies to internal inspections and cleaning of faceplate-resettable valves.","An internal inspection does not substitute for the interim trip test."]},{"deck":"testing","system":"Valves","frequency":"Quarterly","drill":true,"question":"A preaction system has low air pressure alarms and a dry pipe system in the same building also has low air pressure alarms. What test intervals apply?","options":["Both quarterly","Both annually","Preaction quarterly; dry pipe annually","Preaction annually; dry pipe quarterly"],"correctIndex":2,"citation":"NFPA 25 (2020) §13.4.3.2.11 and §13.4.5.2.6","explanation":"This is a genuine split in the standard that people miss. Low air pressure alarms on preaction systems are tested quarterly. Low air pressure alarms on dry pipe systems are tested annually. Same device, different chapter section, different interval.","optionNotes":["Only the preaction low air pressure alarms are quarterly.","Only the dry pipe low air pressure alarms are annual.","Correct — preaction low air pressure alarms quarterly, dry pipe low air pressure alarms annually.","The two intervals are reversed."]},{"deck":"testing","system":"Valves","frequency":"Annually","drill":true,"question":"A deluge valve is installed in a heated enclosure fitted with a low temperature alarm. How often is that low temperature alarm tested, and when?","options":["Quarterly, year round","Annually, at the beginning of the heating season","Monthly during cold weather only","Annually, at the same time as the deluge valve trip test"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.4.4.2.14","explanation":"Low temperature alarms in valve enclosures are tested once a year and specifically at the start of the heating season — testing it in July proves nothing about whether it will call for help in January. The same timing applies to preaction (§13.4.3.2.12) and dry pipe (§13.4.5.2.7) valve enclosures.","optionNotes":["Quarterly applies to low air pressure supervisory devices on the deluge detection system (§13.4.4.2.13), not the low temperature alarm.","Correct — annually at the beginning of the heating season.","There is no monthly cold-weather test for the low temperature alarm; monthly is the deluge valve external inspection interval.","The interval is right but the timing is specified as the beginning of the heating season, not the trip test — automatic air pressure maintenance devices are the ones tied to the annual trip test (§13.4.4.2.15)."]},{"deck":"testing","system":"Valves","frequency":"Annually","drill":true,"question":"How often must each deluge valve be trip tested at full flow, and under what weather condition?","options":["Every 3 years, in warm weather","Annually, in warm weather","Annually, regardless of weather","Semiannually, in warm weather"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.4.4.2.3","explanation":"Deluge valves are trip tested annually at full flow, and the standard specifies warm weather so the discharged water does not create an ice hazard or freeze in the open piping. Two exceptions follow it, for property where water cannot be discharged at all and for property where discharge requires an equipment shutdown.","optionNotes":["Every 3 years is the cap on the test interval when full flow testing must wait for a scheduled equipment shutdown (§13.4.4.2.3.3), not the general rule.","Correct — annually at full flow in warm weather.","The warm weather condition is stated explicitly in the requirement.","Semiannual is not a deluge trip test interval."]},{"deck":"testing","system":"Water Spray","frequency":"Every 3 years","drill":true,"question":"A deluge system protects energized electrical equipment, so water cannot be discharged unless that equipment is shut down. What does NFPA 25 require?","options":["Conduct the full flow system test at the next scheduled shutdown, with the test frequency not exceeding 3 years","Conduct the full flow test annually regardless, using temporary de-energization","Waive the full flow test and perform an annual internal inspection instead","Conduct the full flow test at the next scheduled shutdown, with no maximum interval"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.4.4.2.3.2 and §13.4.4.2.3.3","explanation":"The standard accommodates real-world constraints but puts a ceiling on them. You may wait for the next scheduled equipment shutdown to run the full flow test, but that interval is not allowed to stretch beyond 3 years. Open spray nozzles are inspected per §13.4.4.2.4 during that same shutdown test.","optionNotes":["Correct — full flow test at the next scheduled shutdown, not to exceed 3 years.","The exception exists precisely because forcing an annual discharge on energized equipment is unsafe.","The test is deferred, not waived, and an internal inspection is not offered as a substitute.","There is a maximum — §13.4.4.2.3.3 caps the frequency at 3 years."]},{"deck":"testing","system":"Water Spray","frequency":"Annually","drill":false,"question":"During an annual full flow deluge test, where must pressure readings be recorded?","options":["At the deluge valve only","At the hydraulically most remote nozzle or sprinkler, and a second reading at the deluge valve","At the fire pump discharge and at the deluge valve","At the hydraulically most remote nozzle only"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.4.4.2.7.1, §13.4.4.2.7.2 and §13.4.4.2.7.3","explanation":"Two readings are required: one at the hydraulically most remote nozzle or sprinkler and one at the deluge valve. Both are compared against the hydraulic design pressures to confirm the water supply still meets the original design. One reading alone cannot tell you whether a shortfall is in the supply or in the piping.","optionNotes":["A reading at the valve alone does not confirm the most remote device is getting design pressure.","Correct — a reading at the hydraulically most remote nozzle or sprinkler plus a second reading at the deluge valve.","The fire pump discharge is not one of the two locations this section specifies.","The remote reading alone does not give the comparison point at the valve that the standard requires."]},{"deck":"testing","system":"Water Spray","frequency":"","drill":false,"question":"On a deluge system, the pressure reading taken at the riser during the annual test indicates the water supply has deteriorated. What does NFPA 25 require next?","options":["Gauge the hydraulically most remote nozzle or sprinkler and check that reading against the pressure the system was designed to deliver there","Re-run the test with the control valve partially open to reduce demand","Immediately declare the system impaired under Chapter 15","Conduct a main drain test at the nearest riser and record the result"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.4.4.2.7.5","explanation":"A deteriorated reading at the riser is a warning, not a conclusion. You gauge the hydraulically most remote nozzle or sprinkler and compare it against the required design pressure to find out whether the system still delivers what it was designed to deliver at the far end.","optionNotes":["Correct — the follow-up is a gauge reading at the far end of the system, measured against the design pressure required at that point.","Partially opening the control valve is a permitted arrangement for certain trip tests (§13.4.4.2.6), not a way to re-run a supply evaluation.","An impairment declaration is not the action §13.4.4.2.7.5 specifies.","A main drain test evaluates the supply lead-in and is not the follow-up this section directs."]},{"deck":"testing","system":"Water Spray","frequency":"","drill":false,"question":"A facility has several deluge systems that could operate together in a fire. What does NFPA 25 require regarding testing them?","options":["Each system is tested individually only, to isolate results","Flow the largest group of systems that would realistically run together in a fire, all at once, to see whether the supply can carry that combined demand","All deluge systems in the facility are tested simultaneously regardless of the fire scenario","Simultaneous testing is prohibited because of the discharge volume"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.4.4.2.8","explanation":"Testing systems one at a time proves each one works, but says nothing about whether the water supply can carry several at once. §13.4.4.2.8 requires the largest realistic simultaneous group — the number you would expect to see operate in a fire — to be flowed together, because that is the demand the supply actually has to meet.","optionNotes":["Individual testing alone does not verify the supply under realistic simultaneous demand.","Correct — the systems credibly expected to run together in a fire are flowed at the same time so the water supply is judged against that combined demand.","The benchmark is the number expected to operate in a fire, not every system in the facility.","Simultaneous testing is required here, not prohibited."]},{"deck":"maintenance","system":"Valves","frequency":"","drill":false,"question":"While rebuilding a dry pipe valve, a technician wants to apply a light film of grease to the clapper seating surface to improve the seal. What does NFPA 25 say?","options":["Permitted if the grease is listed for fire protection service","Permitted only on the water side of the seat","Prohibited — no grease or sealing compound may be put on the seating surfaces","Permitted if reapplied at each annual trip test"],"correctIndex":2,"citation":"NFPA 25 (2020) §13.4.5.2.3","explanation":"Sealing compounds on the seat are flatly off limits. Grease traps grit, hardens over time, and can hold the clapper down so the valve fails to trip when it is needed. The same prohibition is written for preaction valves (§13.4.3.2.9) and deluge valves (§13.4.4.2.11).","optionNotes":["No listing exception is offered; the prohibition is unqualified.","There is no water-side or air-side distinction in this requirement.","Correct — §13.4.5.2.3 bars grease and other sealing compounds from the seating surfaces of dry pipe valves.","Reapplication frequency is irrelevant; the practice itself is prohibited."]},{"deck":"testing","system":"Valves","frequency":"Every 3 years","drill":true,"question":"On what interval must a dry pipe valve be trip tested with the control valve fully open and the quick-opening device, if provided, in service?","options":["Annually","Every 3 years, and whenever the system is altered","Every 5 years","Semiannually"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.4.5.2.2.2","explanation":"The full-flow trip test — control valve wide open, QOD in service — is required every 3 years and any time the system is altered. In the years between, the dry pipe valve is still trip tested annually during warm weather, but with the control valve only partially open (§13.4.5.2.2 and §13.4.5.2.2.3).","optionNotes":["Annually is the interval for the trip test during warm weather, but that interim test is done with the control valve partially open.","Correct — every 3 years and whenever the system is altered, with the control valve fully open and the QOD in service.","Every 5 years applies to internal inspections of strainers, filters, restricted orifices, and check valves — not the full-flow trip test.","Semiannual is not a dry pipe trip test interval."]},{"deck":"testing","system":"Sprinkler","frequency":"","drill":false,"question":"After a trip test, a dry pipe system serving a normal (non-refrigerated) area is being refilled. What does NFPA 25 require of the air supply?","options":["It must restore normal air pressure within 30 minutes","It must restore normal air pressure within 60 minutes","It must restore normal air pressure within 90 seconds","It must restore normal air pressure before the end of the work shift"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.4.5.2.2.4 and §13.4.5.2.2.5","explanation":"The general requirement is 30 minutes to bring the system back to normal air pressure. The one relaxation is for refrigerated spaces maintained below 5 degrees F, where 60 minutes is permitted — cold air is denser and compressors work harder in those conditions.","optionNotes":["Correct — 30 minutes for a normal dry pipe system.","60 minutes applies only in refrigerated spaces maintained below 5°F (-15°C).","90 seconds is the waterflow initiating device activation time limit (§13.2.4.2), a completely different requirement.","There is no shift-based allowance; the standard states a specific time."]},{"deck":"testing","system":"Sprinkler","frequency":"","drill":false,"question":"A dry pipe system protects a refrigerated space maintained at 0 degrees F. What time frame is permitted for the air supply to restore normal system air pressure?","options":["30 minutes","45 minutes","60 minutes","No time limit applies in refrigerated spaces"],"correctIndex":2,"citation":"NFPA 25 (2020) §13.4.5.2.2.5","explanation":"For refrigerated spaces maintained below 5 degrees F, the 30-minute restoration requirement is extended to 60 minutes. At 0 degrees F the space qualifies, so an hour is acceptable.","optionNotes":["30 minutes is the general requirement (§13.4.5.2.2.4), which this exception relaxes.","45 minutes is not a figure in this section.","Correct — 60 minutes is permitted in refrigerated spaces maintained below 5°F (-15°C).","A limit still applies; it is simply extended to 60 minutes."]},{"deck":"testing","system":"Valves","frequency":"Quarterly","drill":true,"question":"A dry pipe system is equipped with a quick-opening device. How often must that device be tested?","options":["Monthly","Quarterly","Annually","Every 3 years"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.4.5.2.4","explanation":"Quick-opening devices are tested quarterly. They are also inspected on the same schedule as the dry pipe valve and carry their own gauge requirement — the QOD gauge should read the same pressure as the gauge on the system side of the dry pipe valve (§13.2.5.1.3.1).","optionNotes":["Monthly is the external inspection interval for the dry pipe valve, not the QOD test.","Correct — quick-opening devices, if provided, are tested quarterly.","Annually is the dry pipe valve trip test interval and the low air pressure alarm test interval on dry systems, not the QOD test.","Every 3 years is the full-flow trip test and gas leakage test interval."]},{"deck":"general","system":"Valves","frequency":"","drill":false,"question":"After a dry pipe valve trip test, what must be attached to the valve itself?","options":["A copy of the full trip test report including tripping air pressure and water transit time","A tag or card showing the date the valve was last tripped and the name of the person and organization conducting the test","A calibration certificate for the gauges used in the test","An AHJ-issued inspection sticker showing the next due date"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.4.5.2.5, §13.4.5.2.5.1 and §13.4.5.2.5.2","explanation":"The valve gets a tag or card with the trip date and who did the work. The detailed records — initial air and water pressure, tripping air pressure, operating conditions, and for full-flow trip tests the tripping time and water transit delivery time to the inspector's test connection — are kept separately on the premises for comparison against previous tests.","optionNotes":["Those detailed records are required, but they are maintained as separate records on the premises rather than attached to the valve.","Correct — a tag or card showing the date last tripped and the name of the person and organization conducting the test.","Gauge calibration certificates are not what the standard requires be attached to the valve.","There is no AHJ sticker requirement in this section."]},{"deck":"inspection","system":"Valves","frequency":"Quarterly","drill":true,"question":"How often are sprinkler system pressure-reducing valves inspected, and what is one of the required verifications?","options":["Annually; verify the outlet hose threads are not damaged","Quarterly; verify the valve is in the open position, not leaking, maintaining downstream pressure per design criteria, with handwheels installed and unbroken","Weekly; verify normal downstream and supply pressures are maintained","Monthly; verify the valve is free of physical damage and trim valves are correctly positioned"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.5.1.1","explanation":"Sprinkler pressure-reducing valves are inspected quarterly against a four-item list: open position, no leaking, downstream pressure meeting design criteria, and handwheel installed and unbroken. This is a different interval from hose connection and hose rack pressure-regulating devices, which are inspected annually.","optionNotes":["Annual inspection with a hose thread check describes hose connection pressure-regulating devices (§13.5.2.1), not sprinkler PRVs.","Correct — quarterly inspection with those four verification items.","Weekly inspection verifying normal downstream and supply pressures describes master pressure-regulating devices (§13.5.4.1).","Monthly external inspection verifying physical damage and trim valve position describes preaction, deluge, and dry pipe valves."]},{"deck":"testing","system":"Valves","frequency":"Every 5 years","drill":true,"question":"A sprinkler system pressure-reducing valve is in service. What testing does NFPA 25 require and on what intervals?","options":["A full flow test annually and a partial flow test quarterly","A full flow test at 5-year intervals and a partial flow test annually","A full flow test at 5-year intervals only","A partial flow test annually only"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.5.1.2 and §13.5.1.3","explanation":"Two tests on two clocks. Every 5 years the valve gets a full flow test compared against previous results. Every year it gets a partial flow test — just enough flow to move the valve off its seat and prove it is not stuck. Table 13.1.1.2 shows this as \"annually/5 years.\"","optionNotes":["Annual full flow and quarterly partial flow describe master pressure-regulating devices (§13.5.4.2 and §13.5.4.3), not sprinkler PRVs.","Correct — full flow test at 5-year intervals, partial flow test annually.","The annual partial flow test is also required, not just the 5-year full flow test.","The 5-year full flow test is also required."]},{"deck":"testing","system":"Valves","frequency":"Weekly","drill":true,"question":"A master pressure-regulating device is installed on a standpipe system. What are its inspection, partial flow test, and full flow test intervals?","options":["Inspect weekly; partial flow quarterly; full flow annually","Inspect quarterly; partial flow annually; full flow every 5 years","Inspect weekly; partial flow annually; full flow every 5 years","Inspect annually; partial flow quarterly; full flow annually"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.5.4.1, §13.5.4.2 and §13.5.4.3","explanation":"Master pressure-regulating devices carry the most demanding schedule in Section 13.5: a weekly inspection confirming normal downstream and supply pressures and no damage or leaks, a quarterly partial flow test to move the valve off its seat, and a full flow test every year compared to previous results. They sit at the head of the system, so a failure affects everything downstream.","optionNotes":["Correct — weekly inspection, quarterly partial flow, annual full flow.","Quarterly inspection with annual partial flow and 5-year full flow describes sprinkler pressure-reducing valves (§13.5.1).","The inspection interval is right but the test intervals shown belong to sprinkler PRVs.","Annual inspection describes hose connection and hose rack pressure-regulating devices, not master devices."]},{"deck":"inspection","system":"Standpipe","frequency":"Annually","drill":false,"question":"Hose connection pressure-regulating devices are inspected annually. Which of the following is one of the required verifications?","options":["The valve is maintaining downstream pressure in accordance with design criteria","The outlet hose threads are not damaged","The retarding chamber is not leaking","Normal supply pressure is maintained upstream of the device"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.5.2.1","explanation":"The annual inspection of a hose connection pressure-regulating device covers four things: the handwheel is not broken or missing, the outlet hose threads are not damaged, no leaks are present, and the hose adapter and cap are not missing. Damaged threads mean the fire department cannot connect — a real-world failure that a pressure check would never catch.","optionNotes":["Maintaining downstream pressure per design criteria is a sprinkler pressure-reducing valve inspection item (§13.5.1.1).","Correct — outlet hose threads not damaged is one of the four annual inspection items.","The retarding chamber is an alarm valve item under the quarterly external inspection (§13.4.1.1).","Normal supply pressure maintained is a master pressure-regulating device weekly inspection item (§13.5.4.1)."]},{"deck":"inspection","system":"Fire Pump","frequency":"","drill":false,"question":"A fire pump installation has a circulation relief valve. When is that valve inspected, and what must the inspection verify?","options":["Annually during the flow test; verify it relieves at the correct pressure and closes below that setting","On the same frequency as the no-flow (churn) test; verify water flows through the valve when the pump is operating at shutoff pressure","Quarterly; verify the valve is in the open position and not leaking","Weekly; verify normal downstream pressure is maintained"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.5.6.1.1 and §13.5.6.1.2","explanation":"The circulation relief valve is inspected on the churn test schedule, and the check is that water actually flows through it while the pump is at shutoff pressure. That flow is what carries heat away and keeps the pump from cooking itself. On completion of any fire pump test you also verify the valve closes (§13.5.6.1.3).","optionNotes":["Relieving at the correct pressure and closing

below the setting describes the main pressure relief valve during the annual fire pump flow test (§13.5.6.2.3).","Correct — inspected on the same frequency as the no-flow (churn) test, verifying flow through the valve at shutoff pressure.","Quarterly open-position and leak checks describe sprinkler pressure-reducing valves (§13.5.1.1).","Weekly downstream pressure checks describe master pressure-regulating devices (§13.5.4.1)."]},{"deck":"testing","system":"Fire Pump","frequency":"Annually","drill":false,"question":"During the annual fire pump flow test, what must be verified about the main pressure relief valve?","options":["That it is correctly adjusted, set to relieve at the correct pressure, and closes below that pressure setting","That it discharges continuously throughout the test","That the pressure downstream never falls below the pump's rated pressure","That it is replaced if it has been in service more than 5 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.5.6.2.3 and §13.5.6.2.2","explanation":"Three things about the setting get confirmed: correct adjustment, correct relief pressure, and that it reseats below that pressure. Separately, the inspection during any fire pump test verifies that pressure downstream of the relief valve fittings does not exceed the rating of the system components.","optionNotes":["Correct — correctly adjusted, relieving at the correct pressure, and closing below that setting.","Continuous discharge is not the verification; the valve must relieve and then close.","The concern in §13.5.6.2.2 is that downstream pressure not exceed component ratings, not that it stay above pump rated pressure.","There is no 5-year replacement requirement for main pressure relief valves in this section."]},{"deck":"testing","system":"Standpipe","frequency":"Annually","drill":true,"question":"A Class I standpipe system has hose valves at each floor landing. How often are they tested, and how?","options":["Every 3 years, by opening and closing the valves","Annually, by fully opening and closing the valves","Quarterly, by fully opening and closing the valves","Annually, by conducting a flow test at the system demand"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.6.2.1","explanation":"Class I and Class III standpipe hose valves are operated annually — fully open, then fully closed. Any that are difficult to operate or that leak must be repaired or replaced (§13.6.2.1.1). Class II hose valves and hose stations attached to sprinkler systems get a longer 3-year interval.","optionNotes":["Every 3 years applies to hose valves on hose stations attached to sprinkler systems and to Class II standpipe systems (§13.6.2.2).","Correct — Class I and Class III standpipe hose valves are tested annually by fully opening and closing them.","Quarterly is the hose valve inspection interval (§13.6.1.1), not the test interval.","The test is a physical operation of the valve, not a flow test at system demand."]},{"deck":"testing","system":"Standpipe","frequency":"Every 3 years","drill":true,"question":"A building has hose stations attached to the sprinkler system and a Class II standpipe. How often are those hose valves tested?","options":["Annually","Every 3 years","Quarterly","Every 5 years"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.6.2.2","explanation":"Hose valves on hose stations attached to sprinkler systems and on Class II standpipe systems are opened and closed every 3 years — a longer interval than the annual test for Class I and Class III standpipe hose valves. Any that are hard to operate or leak get repaired or replaced.","optionNotes":["Annually applies to Class I and Class III standpipe system hose valves (§13.6.2.1).","Correct — every 3 years for hose stations attached to sprinkler systems and Class II standpipe systems.","Quarterly is the hose valve inspection interval, not the test interval.","Every 5 years is not a hose valve test interval."]},{"deck":"maintenance","system":"Standpipe","frequency":"","drill":false,"question":"During a hose valve test the valve operates but does not open fully and binds partway. What does NFPA 25 require?","options":["Tag it as impaired and notify the AHJ within 24 hours","Lubricate, repair, or replace it","Leave it in the partially open position and note it in the report","Replace it only if it also leaks"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.6.3","explanation":"Hose valves that do not operate smoothly or open fully are lubricated, repaired, or replaced — three escalating options depending on what the valve needs. A binding hose valve is one that the fire department may not be able to open when they need water.","optionNotes":["An AHJ notification timeline is not what this maintenance section specifies.","Correct — lubricated, repaired, or replaced.","Leaving a binding valve in service and simply documenting it does not satisfy the maintenance requirement.","Leaking is a separate trigger; failing to open fully is on its own enough to require action."]},{"deck":"inspection","system":"Valves","frequency":"Weekly","drill":true,"question":"A reduced-pressure backflow prevention assembly protects a sprinkler system. How often is it inspected, and what specifically is being verified?","options":["Weekly, to ensure the differential-sensing valve relief port is not continuously discharging","Quarterly, to ensure the isolation valves are in the normal open position","Monthly, to verify the assembly is free of physical damage","Annually, to verify the check valves fully open"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.7.1.1","explanation":"Reduced-pressure assemblies and reduced-pressure detector assemblies get a weekly look, and the specific thing you are checking is whether the differential-sensing valve relief port is continuously discharging. Continuous discharge means a fouled check and a system that may not deliver its design flow.","optionNotes":["Correct — weekly, verifying the differential-sensing valve relief port is not continuously discharging.","Verifying isolation valves are in the normal open position is required after any testing or repair (§13.7.1.2), not on a quarterly schedule.","Monthly physical damage inspection applies to air compressors and nitrogen generators (§13.10.2) and to dry pipe, preaction, and deluge valve exteriors.","Verifying the check valves will fully open is the substance of the internal inspection permitted in lieu of the forward flow test during long-term water rationing (§13.7.2.1.1)."]},{"deck":"testing","system":"Valves","frequency":"Annually","drill":true,"question":"How often must a backflow preventer installed in fire protection system piping be exercised, and at what flow rate?","options":["Every 5 years, at the maximum flow rate possible","Annually, by a forward flow test at a minimum flow rate of the system demand","Quarterly, by a forward flow test at 50 percent of system demand","Annually, by a reverse flow differential pressure test"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.7.2.1","explanation":"The forward flow test is annual and must reach at least the system demand flow rate. Anything less does not prove the check valves swing fully open under the flow the system will actually see in a fire. Where hydrants or inside hose stations are downstream, the test must also include hose stream demand (§13.7.2.2).","optionNotes":["Every 5 years is the internal inspection interval for backflow prevention assemblies (§13.7.1.3); the maximum-flow-possible allowance applies only where connections do not permit verification at system demand (§13.7.2.3).","Correct — annually, at a minimum flow rate of the system demand.","Quarterly is not the forward flow interval, and 50 percent of demand would not verify full check valve travel.","The required test is a forward flow test, not a reverse flow differential test."]},{"deck":"testing","system":"Valves","frequency":"Annually","drill":true,"question":"Which of the following relieves a facility of conducting the annual forward flow test on a backflow preventer?","options":["The backflow preventer is internally inspected every 5 years","Annual fire pump testing causes the system flow rate to flow through the backflow preventer","The backflow preventer has been in service less than 5 years","The assembly has a reduced-pressure detector rather than a reduced-pressure assembly"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.7.2.1.2 and §13.7.2.1.1","explanation":"If the annual fire pump test already pushes system flow through the backflow preventer, a separate forward flow test is not required — the exercise has already happened. The other relief in this section is narrower: where water rationing is enforced during shortages lasting more than a year, an internal inspection verifying the checks fully open may substitute.","optionNotes":["The 5-year internal inspection under §13.7.1.3 is a separate requirement and does not substitute for the annual forward flow test.","Correct — the annual forward flow test is not required where annual fire pump testing causes system flow rate through the backflow preventer.","Age of the assembly is not a basis for exemption.","Both reduced-pressure assemblies and reduced-pressure detector assemblies are covered by the same weekly inspection and annual forward flow requirements."]},{"deck":"testing","system":"Valves","frequency":"Annually","drill":false,"question":"A backflow preventer is installed where the piping arrangement makes it impossible to verify forward flow at the minimum system demand rate. What does NFPA 25 require?","options":["Waive the forward flow test and document the limitation","Conduct the test at the maximum flow rate possible","Substitute an annual internal inspection of the assembly","Install a permanent test header before the next annual test"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.7.2.3","explanation":"When the connections physically will not let you reach system demand, you flow as much as the arrangement allows. Something is better than nothing — you still get evidence the checks are moving and are not seized.","optionNotes":["The test is not waived; a reduced-flow version is required.","Correct — tests are conducted at the maximum flow rate possible.","The internal inspection substitution is reserved for enforced water rationing lasting more than 1 year (§13.7.2.1.1), not for connection limitations.","Requiring installation of a test header is not what this section states."]},{"deck":"inspection","system":"Sprinkler","frequency":"Quarterly","drill":true,"question":"How often is a fire department connection inspected, and which of the following is one of the required items?","options":["Quarterly; verify the automatic drain valve is in place and operating properly","Annually; verify the interior of the connection is free of obstructions","Monthly; verify the couplings rotate smoothly","Semiannually; verify the check valve is not leaking"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.8.1","explanation":"FDCs are inspected quarterly against a ten-item list that includes visibility and accessibility, undamaged couplings that rotate smoothly, plugs or caps in place, gaskets in place, identification signs, a check valve that is not leaking, an automatic drain valve in place and working, clappers in place and operating, an obstruction check of the interior, and undamaged visible supply piping.","optionNotes":["Correct — quarterly inspection, and the automatic drain valve in place and operating properly is one of the ten listed items.","The interior obstruction check is on the quarterly list; the annual interval applies to interior inspections where approved locking caps or locking plugs are installed (§13.8.2).","Couplings rotating smoothly is on the quarterly list, not a monthly one.","The check valve not leaking is on the quarterly list, not semiannual."]},{"deck":"inspection","system":"Sprinkler","frequency":"Annually","drill":true,"question":"A fire department connection is fitted with approved locking caps. How often must interior inspections be conducted?","options":["Quarterly, the same as all other FDC inspection items","Annually","Every 3 years","Interior inspection is not required where locking caps are installed"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.8.2","explanation":"Approved locking caps or locking plugs keep debris and vandalism out, so the standard relaxes the interior inspection to annually instead of the quarterly cycle that applies otherwise. Any obstructions found still have to be removed under §13.8.4.","optionNotes":["The quarterly cycle governs the general FDC inspection list, but locking caps or plugs extend the interior inspection specifically.","Correct — interior inspections are conducted annually where approved locking caps or locking plugs are installed.","Every 3 years is not an FDC inspection interval.","The inspection is extended, not eliminated."]},{"deck":"testing","system":"Sprinkler","frequency":"Every 5 years","drill":true,"question":"NFPA 25 requires the piping from the fire department connection to the fire department check valve to be hydrostatically tested. At what pressure, for how long, and how often?","options":["150 psi (10 bar) for 2 hours, at least once every 5 years","200 psi (14 bar) for 2 hours, at least once every 5 years","150 psi (10 bar) for 4 hours, annually","50 psi (3.5 bar) above normal working pressure for 2 hours, every 3 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.8.5","explanation":"The FDC-to-check-valve piping is hydrostatically tested at 150 psi held for 2 hours, at least once every 5 years. This length of pipe is normally dry and unsupervised, so nothing else would reveal that it has corroded through or been damaged until the day the fire department tries to pump into it.","optionNotes":["Correct — 150 psi (10 bar) for 2 hours, at least once every 5 years.","200 psi (14 bar) is the stated minimum in Table 13.11.1 for hydrostatically testing a replaced FDC on other than sprinkler systems, not the routine §13.8.5 test.","The duration is 2 hours, not 4, and the interval is 5 years, not annual.","50 psi above normal working pressure applies to a replaced FDC on other than sprinkler systems per Table 13.11.1."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"A fire department connection on a sprinkler system is being replaced. What action does Table 13.11.1 require after the replacement?","options":["Isolate and hydrostatically test for 2 hours at 150 psi (10 bar), and perform a valve status test","Isolate and hydrostatically test for 2 hours at 50 psi (3.5 bar) above normal working pressure, 200 psi (14 bar) minimum","Perform a forward flow test at system demand and a valve status test","Perform a main drain test and inspect for leaks at system pressure"],"correctIndex":0,"citation":"NFPA 25 (2020) Table 13.11.1","explanation":"Table 13.11.1 splits fire department connections into two rows for replacement. On sprinkler systems the replaced FDC is isolated and hydrostatically tested for 2 hours at 150 psi, followed by a valve status test. On other than sprinkler systems the test pressure is 50 psi above normal working pressure with a 200 psi minimum.","optionNotes":["Correct — 150 psi (10 bar) for 2 hours plus a valve status test, for FDCs on sprinkler systems.","That pressure regime is the row for fire department connections on other than sprinkler systems.","A forward flow test is the backflow preventer requirement (§13.7.2.1), not the FDC replacement action.","Inspecting for leaks at system pressure per Section 13.8 with a valve status test is the action for adjusting or repairing an FDC, not for replacing one."]},{"deck":"inspection","system":"Sprinkler","frequency":"Monthly","drill":true,"question":"An air compressor is dedicated to a dry pipe fire protection system. How often is it inspected, and which of the following is one of the required checks?","options":["Quarterly; verify the compressor restores normal supervisory pressure in the required time frame","Monthly; verify air compressors requiring oil have the required amount of oil in the oil reservoir","Annually; verify the compressor does not overheat while running","Weekly; verify the compressor is free of physical damage"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.10.2","explanation":"Dedicated air compressors and nitrogen generators are inspected monthly. The five items are physical damage to the unit, intact power wiring, intact piping to the fire protection system, secure anchoring to the structure or system piping, and the correct oil level where the compressor requires oil.","optionNotes":["Restoring normal supervisory pressure in the required time frame is part of the annual test (§13.10.3), not the monthly inspection.","Correct — monthly inspection, including verifying the required amount of oil in the reservoir for compressors requiring oil.","Verifying the compressor does not overheat while running is one of the three annual test items (§13.10.3).","Weekly is not the inspection interval for dedicated air compressors."]},{"deck":"testing","system":"Sprinkler","frequency":"Annually","drill":true,"question":"How often is a nitrogen generator dedicated to a water-based fire protection system tested, and what must the test verify?","options":["Annually; that it operates as intended on the proper drop of air pressure, restores normal supervisory pressure in the required time frame, and does not overheat while running","Quarterly; that it maintains supervisory pressure and the low air alarm functions","Monthly; that it is free of physical damage and correctly anchored","Every 3 years; that it can restore normal pressure within 30 minutes"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.10.3","explanation":"The annual test on a dedicated air compressor or nitrogen generator covers three points: it starts on the proper drop of air pressure, it restores normal supervisory pressure within the required time frame, and it does not overheat while running. A compressor that runs but cannot keep up is not doing its job.","optionNotes":["Correct — annual test covering proper-drop operation, restoration of supervisory pressure in the required time frame, and no overheating.","Quarterly is not the interval, and the listed items do not match §13.10.3.","Monthly physical damage and anchoring checks are the inspection requirements (§13.10.2), not the test.","Every 3 years is not applicable here; the 30-minute figure belongs to the air supply restoration requirement for refilling a dry system (§13.4.5.2.2.4)."]},{"deck":"maintenance","system":"Sprinkler","frequency":"Annually","drill":true,"question":"An air compressor dedicated to a dry pipe system requires oil. How often must the oil be replaced?","options":["Every 5 years, or sooner if the oil is discolored","Annually, unless the manufacturer's instructions require more frequent replacement","Monthly, at the time of the compressor inspection","Only when the annual test shows the compressor overheating"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.10.4.2","explanation":"Oil replacement is annual, with the manufacturer's instructions able to shorten but not lengthen the interval. Note this is distinct from the monthly inspection item, which only verifies the reservoir holds the required amount of oil — not that the oil is fresh.","optionNotes":["Every 5 years is not the oil replacement interval; the standard sets an annual baseline.","Correct — annually, unless the manufacturer's instructions require more frequent replacement.","Monthly is when the oil level is checked as part of the inspection (§13.10.2), not when the oil is changed.","Oil replacement is a scheduled task, not one triggered only by an overheating finding."]},{"deck":"general","system":"Sprinkler","frequency":"","drill":false,"question":"A building has a shop air compressor that serves plant equipment and also feeds a dry pipe sprinkler system. It is not dedicated to the fire protection system. What ITM requirements apply?","options":["The same monthly inspection and annual test as a dedicated compressor","Inspection, testing, and maintenance in accordance with the manufacturer's instructions","No ITM is required because it is not dedicated fire protection equipment","Quarterly inspection and testing under Chapter 4 general requirements"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.10.1.2","explanation":"The prescriptive monthly inspection and annual test in §13.10.2 and §13.10.3 are written for compressors and nitrogen generators dedicated to water-based fire protection systems. A non-dedicated compressor follows the manufacturer's instructions instead.","optionNotes":["Those specific intervals are tied to dedicated equipment under §13.10.1.1.","Correct — air compressors not dedicated to water-based fire protection systems follow the manufacturer's instructions.","ITM is still required; the governing document is simply the manufacturer's instructions.","Chapter 4 is not cited as the governing requirement for non-dedicated compressors in this section."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"A dry pipe valve's trim is repaired during an ITM visit. What does NFPA 25 require, and does it trigger a design review?","options":["The actions in Table 13.11.1 shall be performed, and these actions do not require a design review","The actions in Table 13.11.1 shall be performed, and a design review is required before return to service","Only a valve status test is required, and a design review is required","Nothing beyond the manufacturer's instructions, and a design review is required"],"correctIndex":0,"citation":"NFPA 25 (2020) §13.11.1 and §13.11.3","explanation":"Any time a valve, valve component, or valve trim is adjusted, repaired, reconditioned, or replaced, the corresponding actions in Table 13.11.1 have to be performed. The standard is explicit that these actions do not require a design review — this is restoring existing equipment, not redesigning the system.","optionNotes":["Correct — perform the Table 13.11.1 actions, and no design review is required.","The Table 13.11.1 actions are right, but §13.11.3 states these actions shall not require a design review.","A valve status test is one of several actions in the table for a dry pipe valve, and no design review is required.","Table 13.11.1 governs the required actions, and no design review is required."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"Under NFPA 25 Chapter 13, who is responsible for having the manufacturers' literature available that provides specific instructions for inspecting, testing, and maintaining valves and associated equipment?","options":["The installing contractor","The authority having jurisdiction","The property owner or designated representative","The ITM service provider performing the work"],"correctIndex":2,"citation":"NFPA 25 (2020) §13.2.1","explanation":"The obligation sits with the property owner or their designated representative. Valve trim varies enormously between manufacturers and models, so the specific literature for the installed equipment is what tells a technician how to reset, prime, and service it correctly.","optionNotes":["The installing contractor typically supplies the literature at turnover, but the ongoing responsibility to have it available rests with the owner.","The AHJ enforces the standard rather than maintaining the owner's equipment literature.","Correct — the property owner or designated representative.","The service provider uses the literature, but the standard places the duty to have it available on the owner or designated representative."]},{"deck":"general","system":"Valves","frequency":"","drill":false,"question":"A sprinkler system requires three separate control valves to be closed before work can be done on it. What does NFPA 25 require regarding signage?","options":["A single sign at the main riser listing all three valves","A sign on each affected valve referring to the existence and location of the other valves","Signage only on the valve furthest from the riser","No additional signage beyond each valve's system identification sign"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.3.1.1","explanation":"Every affected valve gets a sign pointing to the other valves. Standing at one valve, a technician needs to learn from that valve itself that two more exist and where they are — otherwise a partial shutdown gets mistaken for a complete one and someone gets sprayed, or worse, someone assumes the system is back in service when it is not.","optionNotes":["A single riser sign does not help someone standing at one of the remote valves.","Correct — a sign on each affected valve referring to the existence and location of other valves.","There is no allowance to sign only one of the valves.","This signage is in addition to the identification sign required for each control valve by §13.3.1."]},{"deck":"general","system":"Valves","frequency":"","drill":false,"question":"Which of the following valves is NOT required by NFPA 25 to be sealed, locked, or electrically supervised?","options":["A normally open sectional control valve","A normally closed valve on a bypass around a backflow preventer","A hose valve","A normally open post indicator valve"],"correctIndex":2,"citation":"NFPA 25 (2020) §13.3.1.3, §13.3.1.4 and §13.3.1.5","explanation":"Normally open valves must be sealed, locked, or electrically supervised, and normally closed valves must be sealed or electrically supervised. Hose valves are specifically exempted — they are designed to be opened by the fire department without hunting for a key or breaking a seal.","optionNotes":["Normally open valves are secured by seal, lock, or electrical supervision under §13.3.1.3.","Normally closed valves are secured by seal or electrical supervision under §13.3.1.4.","Correct — sealing or electrical supervision is not required for hose valves.","A post indicator valve in the normal open position falls under the §13.3.1.3 requirement."]},{"deck":"general","system":"Valves","frequency":"","drill":false,"question":"A contractor completes alterations to a sprinkler system. Under NFPA 25 Chapter 13, what inspection is required afterward and who conducts it?","options":["An inspection by the AHJ to confirm the alteration meets NFPA 13","A check by the property owner or designated representative confirming the system is back in service, with every valve at its normal position and its seal, lock, or supervision restored","An inspection by the installing contractor's licensed engineer","No additional inspection beyond the next scheduled quarterly control valve inspection"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.3.2.1.4","explanation":"After any alterations or repairs, the owner or their designated representative verifies the system is genuinely back in service — every valve in its normal position and properly sealed, locked, or electrically supervised. A closed valve left behind after work is one of the classic causes of a sprinkler system failing to control a fire.","optionNotes":["AHJ involvement may occur, but §13.3.2.1.4 places this specific verification on the property owner or designated representative.","Correct — the owner or designated representative performs this post-work check.","A licensed engineer's inspection is not what this section requires.","Waiting for the next scheduled inspection leaves the system potentially impaired in the interim; the check is required after the work."]},{"deck":"general","system":"Valves","frequency":"","drill":false,"question":"A preaction system has three auxiliary drains. What signage does NFPA 25 require?","options":["A sign at each auxiliary drain identifying the system it serves","A sign posted at the valve stating how many auxiliary drains the system has and where to find each one","A sign at the riser stating the date auxiliary drains were last operated","No signage is required if the drains are shown on the as-built drawings"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.4.3.1.4","explanation":"The sign goes at the valve and tells you both how many auxiliary drains exist and where each one is. Without it, a technician draining down before freezing weather has no way to know a third low point exists and will leave trapped water to freeze and split the pipe. The identical requirement applies to dry pipe systems under §13.4.5.1.1.","optionNotes":["Signs out at the drains themselves do not help — a technician standing at the valve still has no way to know how many low points exist or where they are.","Correct — the sign lives at the valve and gives both the count and the location of every auxiliary drain.","The sign conveys the number and locations, not a record of when they were last operated.","The signage is required regardless of what appears on drawings."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"When must auxiliary drains on a dry pipe sprinkler system be drained?","options":["Monthly during the heating season","Each time the system trips, again before freezing weather sets in, and as often after that as conditions call for","Only after the annual trip test","Quarterly, at the same time as the priming water level test"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.4.5.3.2","explanation":"Three triggers: after the system operates, before freezing weather arrives, and as often after that as conditions require. Trapped water in a drum drip that freezes will split the pipe and take the system out of service. The same requirement pattern applies to preaction (§13.4.3.3.3) and deluge (§13.4.4.3.3) systems.","optionNotes":["A fixed monthly schedule is not what the standard specifies; the triggers are event-based plus as-needed.","Correct — three triggers: after the system operates, ahead of the freezing season, and as often afterward as conditions require.","System operation is only one of the triggers, and the annual trip test is not the sole basis.","Quarterly priming water level testing is a separate requirement (§13.4.5.2.1) and does not set the auxiliary drain schedule."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"Automatic detection equipment is used to actuate a deluge system but is not of a type covered by NFPA 72. What does NFPA 25 require?","options":["It is exempt from ITM because NFPA 72 does not apply","NFPA 25 covers it directly: keep the detectors mounted, fastened, and shielded from corrosion, weather, and physical damage, and keep the wiring, panels, or pneumatic tubing working","It must be replaced with NFPA 72 compliant detection at the next system alteration","It follows the deluge valve trip test schedule only, with no separate detection requirements"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.9.1 and §13.9.2","explanation":"Detection that NFPA 72 covers is inspected, tested, and maintained under that standard (§13.9.1). Detection that falls outside it — pneumatic rate-of-rise tubing being the classic example — does not get a pass. §13.9.2 picks it up and spells out what has to be verified: the detectors still mounted and fastened where they belong, protected against corrosion, weather, and physical damage, and the wiring, panels, or tubing still working.","optionNotes":["Falling outside NFPA 72 does not exempt the equipment; §13.9.2 picks it up directly.","Correct — §13.9.2 sets out its own ITM expectations for detection that NFPA 72 does not cover.","Replacement is not required by this section.","Detection carries its own requirements in addition to the valve trip test; the deluge flow test does verify automatic activation under §13.4.4.2.1, but §13.9.2 imposes separate detection ITM."]},{"deck":"testing","system":"Valves","frequency":"","drill":false,"question":"When conducting a deluge or preaction valve flow test, what does NFPA 25 require the test to incorporate?","options":["Automatic activation only, since manual release is a separate annual check","The system exercised as a complete unit — detection and release, valve and piping — proven through both the automatic path and the manual path","Manual activation only, to avoid unnecessary detector cycling","Automatic activation with the control valve partially open in all cases"],"correctIndex":1,"citation":"NFPA 25 (2020) §13.4.4.2.1 and §13.4.3.2.4","explanation":"The flow test has to exercise the system as a complete unit — detection, release, valve, and piping — through both automatic and manual activation paths. Proving the valve trips on a manual pull says nothing about whether the detection release will do it, and vice versa. Manual actuation devices are separately required to be operated annually (§13.4.4.2.9, §13.4.3.2.7).","optionNotes":["Both activation paths are part of the flow test requirement.","Correct — the whole chain gets exercised, and both the automatic and manual release paths must be demonstrated.","Automatic activation is expressly included.","Control valve position depends on which test is being conducted; full flow tests are conducted with the control valve fully open per §13.4.4.2.5."]},{"deck":"inspection","system":"Obstruction","frequency":"Every 5 years","drill":true,"question":"A wet pipe sprinkler system has never had its internal piping condition assessed and the owner has no approved risk analysis on file. What is the maximum interval NFPA 25 allows between assessments of the internal condition of piping?","options":["Annually","Every 3 years","Every 5 years","Every 10 years"],"correctIndex":2,"citation":"NFPA 25 (2020) §14.2.1.1","explanation":"With no approved risk analysis in place, the default in Chapter 14 is that the internal condition of the piping must be assessed at least once every five years to look for foreign organic and inorganic material. A risk analysis can change that interval, but absent one, five years is the ceiling.","optionNotes":["Annual is the interval for the internal ice-obstruction inspection of dry/preaction piping in refrigerated spaces, not for the general internal piping condition assessment.","Three years is not the Chapter 14 assessment interval; it does not appear as the default frequency for internal piping condition.","Correct — five years is the stated minimum frequency unless an approved risk analysis establishes a different one.","Ten years is too long; nothing in Chapter 14 permits stretching the assessment to a decade."]},{"deck":"general","system":"Obstruction","frequency":"Risk-analysis based","drill":true,"question":"An owner wants to use something other than the fixed five-year interval for assessing the internal condition of sprinkler piping. What does NFPA 25 allow as the basis for a different frequency?","options":["Written permission from the sprinkler contractor of record","An approved risk analysis that establishes the assessment frequency","A clean report from the previous assessment","The manufacturer's published maintenance schedule"],"correctIndex":1,"citation":"NFPA 25 (2020) §14.2.1.2","explanation":"Chapter 14 gives two paths for setting the assessment frequency: the default minimum interval, or a frequency determined by an approved risk analysis. The risk analysis has to be approved — the owner cannot simply decide on a longer interval.","optionNotes":["A contractor's letter is not an approved risk analysis and carries no authority to reset an ITM frequency.","Correct — the standard specifically permits the assessment frequency to be set by an approved risk analysis.","A clean prior assessment is good news but does not by itself authorize extending the interval.","Manufacturer's instructions govern things like strainer cleaning; they do not set the internal piping assessment frequency."]},{"deck":"testing","system":"Obstruction","frequency":"","drill":false,"question":"While opening a flushing connection during an internal piping assessment, the technician finds tubercules and a slimy deposit on the pipe wall. What does NFPA 25 require next?","options":["Immediately flush the entire system and return it to service","Have the material tested for indications of microbiologically influenced corrosion (MIC)","Replace the affected section of pipe within 30 days","Nothing — tubercules are normal in wet pipe systems"],"correctIndex":1,"citation":"NFPA 25 (2020) §14.2.1.3","explanation":"Tubercules and slime are the classic visual signatures of biological corrosion activity. When they are found during the internal condition assessment, the standard requires that they be tested for indications of MIC so the owner knows whether a corrosion mechanism is at work rather than simple sediment.","optionNotes":["A complete flushing program is required when an obstruction investigation shows enough material to obstruct piping — it is not the first step when tubercules or slime are discovered.","Correct — the finding triggers testing for indications of MIC.","Pipe replacement may eventually be needed, but the standard's stated requirement at this point is testing, not a 30-day replacement deadline.","Wrong and dangerous — the standard treats these findings as significant enough to require testing."]},{"deck":"inspection","system":"Obstruction","frequency":"","drill":false,"question":"During a five-year internal assessment, enough foreign organic material is found in the cross main to obstruct piping and sprinklers. What does NFPA 25 require?","options":["An obstruction investigation as described in Section 14.3","A hydrostatic test of the affected system","Replacement of all sprinklers on the affected branch lines","An immediate impairment tag and shutdown of the system"],"correctIndex":0,"citation":"NFPA 25 (2020) §14.2.1.4","explanation":"The assessment is a look-and-see activity. When it turns up enough material to actually obstruct pipe or sprinklers, the standard escalates the work to a full obstruction investigation under Section 14.3, which defines where and how the system is examined.","optionNotes":["Correct — the finding escalates the assessment into an obstruction investigation.","A hydrostatic test evaluates pressure integrity; it tells you nothing about internal obstructing material.","Blanket sprinkler replacement is not the required response; the investigation comes first and determines the corrective work.","Chapter 15 impairment procedures apply when equipment is removed from service, not automatically when material is found."]},{"deck":"inspection","system":"Obstruction","frequency":"","drill":false,"question":"A residential building has a sprinkler system piped entirely in listed CPVC. How does the internal piping condition assessment requirement of Section 14.2 apply?","options":["It applies, but only every 10 years for nonmetallic pipe","It applies exactly as it does to steel pipe","Nonmetallic pipe is not required to comply with Section 14.2","It applies only if the system has previously had a leak"],"correctIndex":2,"citation":"NFPA 25 (2020) §14.2.1.5","explanation":"The internal condition assessment is aimed at corrosion products and foreign material accumulation in metallic piping. Chapter 14 explicitly relieves nonmetallic pipe from the Section 14.2 assessment requirement.","optionNotes":["No extended interval is granted for nonmetallic pipe — the section simply does not apply to it.","Not correct; the standard carves nonmetallic pipe out of this requirement.","Correct — nonmetallic pipe is not required to comply with Section 14.2.","There is no leak-history trigger that pulls nonmetallic pipe back into Section 14.2."]},{"deck":"inspection","system":"Obstruction","frequency":"","drill":false,"question":"A warehouse is protected by six separate wet pipe sprinkler systems. When the internal condition assessment comes due, how many systems must be assessed?","options":["All six systems","Every other system — three of the six","Only the system with the longest run of piping","One system chosen by the AHJ"],"correctIndex":1,"citation":"NFPA 25 (2020) §14.2.2","explanation":"For buildings with multiple wet pipe systems, the standard allows a sampling approach: every other system gets the internal condition assessment. It is a way to get a representative look at the building's piping without opening every system every cycle.","optionNotes":["All systems must be assessed only if foreign material is found in one of them.","Correct — every other system is assessed in buildings with multiple wet pipe systems.","Pipe length is not the selection criterion in the standard.","The standard sets the alternating pattern itself; it does not leave the selection to the AHJ."]},{"deck":"inspection","system":"Obstruction","frequency":"","drill":false,"question":"Three of a building's six wet pipe systems were assessed in the last internal condition assessment. What must happen at the next required assessment?","options":["The same three systems are reassessed for trend comparison","The three alternate systems not assessed last time are assessed","All six systems are assessed","Only one system needs to be assessed if the previous results were clean"],"correctIndex":1,"citation":"NFPA 25 (2020) §14.2.2.1","explanation":"The alternating scheme only works if the rotation actually rotates. At the next required assessment the systems skipped last cycle are the ones that get opened, so over two cycles every system in the building has been looked at.","optionNotes":["Repeating the same systems would leave the other half of the building never assessed.","Correct — the alternate systems not assessed previously are the ones assessed next.","Assessing all systems is the response to finding foreign material, not the normal rotation.","Clean prior results do not reduce the number of systems in the rotation."]},{"deck":"inspection","system":"Obstruction","frequency":"","drill":false,"question":"During the assessment of the rotating half of a building's wet pipe systems, foreign inorganic material is found in one system. What does NFPA 25 require for the remaining systems?","options":["Nothing — the rotation continues normally at the next cycle","Only the systems fed from the same riser must be assessed","All systems in the building must be assessed","The remaining systems must be flushed but not opened"],"correctIndex":2,"citation":"NFPA 25 (2020) §14.2.2.2","explanation":"Finding foreign material in a sampled system invalidates the assumption that the sample represented a clean building. Once material is found in any system, the standard requires that all systems in that building be assessed.","optionNotes":["Continuing the rotation ignores the evidence that the building has a piping problem.","The standard does not limit the follow-up to a single riser — it says all systems.","Correct — a positive finding in one system pulls every system in the building into the assessment.","Flushing is a corrective measure that follows an obstruction investigation, not a substitute for assessing the other systems."]},{"deck":"inspection","system":"Obstruction","frequency":"","drill":false,"question":"During a routine main drain test the discharge carries out a significant quantity of scale and debris. Under Chapter 14, what does this condition require?","options":["An obstruction investigation of the system or yard main piping","Recording the observation and rechecking at the next annual inspection","A full flow test of the fire pump","Replacement of the main drain valve"],"correctIndex":0,"citation":"NFPA 25 (2020) §14.3.1(2)","explanation":"Discharge of obstructive material during routine water tests is one of the listed conditions that obligates an obstruction investigation of the system or yard main piping. The debris is evidence that something upstream is shedding material into the water.","optionNotes":["Correct — this is one of the enumerated trigger conditions for an obstruction investigation.","Deferring to the next annual inspection ignores a condition the standard treats as a mandatory trigger.","A fire pump flow test does not address the source of obstructive material in the piping.","The drain valve is not the problem; the material came through it from the system."]},{"deck":"testing","system":"Obstruction","frequency":"","drill":false,"question":"A dry pipe system's full flow trip test shows water reaching the inspector's test connection well behind the original acceptance test time. At what point does NFPA 25 require an obstruction investigation on this basis?","options":["Any measurable increase over the acceptance test time","A 25 percent increase in water travel time","A 50 percent increase in water travel time","A doubling of the water travel time"],"correctIndex":2,"citation":"NFPA 25 (2020) §14.3.1(15)","explanation":"Chapter 14 uses the dry system's own acceptance test as the baseline. Once the time from valve trip to water at the inspector's test connection grows by half again over that original figure, the delay is treated as evidence of possible obstruction and an investigation is required.","optionNotes":["Small variations are expected between tests; the standard sets a defined threshold rather than reacting to any change.","Twenty-five percent is below the stated threshold.","Correct — a 50 percent increase over the original acceptance test time is the listed trigger.","A doubling would be a 100 percent increase — well past the point the standard requires action."]},{"deck":"general","system":"Obstruction","frequency":"","drill":false,"question":"A sprinkler system in a seasonally closed facility has been shut down and drained for the past 18 months and is now being returned to service. What does Chapter 14 require?","options":["Only a main drain test before returning it to service","An obstruction investigation, because the shutdown exceeded 1 year","A hydrostatic test at 200 psi for 2 hours","Nothing beyond the normal annual inspection"],"correctIndex":1,"citation":"NFPA 25 (2020) §14.3.1(11)","explanation":"A system returned to service after an extended shutdown of more than one year is one of the listed conditions requiring an obstruction investigation. Long dormancy gives corrosion products and debris time to accumulate where flowing water would normally have carried them along.","optionNotes":["A main drain test checks the water supply, not the internal condition of the piping.","Correct — a shutdown longer than one year is an enumerated trigger for an obstruction investigation.","Hydrostatic testing is a pressure-tightness check found in the Chapter 13 valve and FDC requirements; it is not the response the standard gives for a long shutdown, and the pressure quoted here is not the value that applies to a sprinkler system.","Treating an 18-month dormant system as routine ignores a specific listed trigger."]},{"deck":"general","system":"Obstruction","frequency":"","drill":false,"question":"After a fire, records show the fire department pumped from a nearby pond into the FDC to supplement the sprinkler system. What does NFPA 25 require afterward?","options":["An obstruction investigation, because the system was supplied with raw water through the FDC","Only replacement of the FDC check valve","A backflow preventer forward flow test","Nothing, provided the system holds pressure afterward"],"correctIndex":0,"citation":"NFPA 25 (2020) §14.3.1(13)","explanation":"Raw water pumped in through the fire department connection carries silt, organics, and whatever else was in the source. Chapter 14 lists this specifically as a condition requiring an obstruction investigation.","optionNotes":["Correct — supplying a system with raw water via the FDC is an enumerated obstruction investigation trigger.","Swapping the check valve does nothing about the material now sitting in the system piping.","A forward flow test verifies the backflow device passes system demand; it does not address contamination.","Holding pressure proves the system is tight, not that it is clear of obstructing material."]},{"deck":"inspection","system":"Obstruction","frequency":"Every 5 years","drill":true,"question":"An obstruction-producing condition was identified on a system, was never corrected, and is the kind of condition that could obstruct piping even after previous flushing. How often must that system be examined for internal obstructions?","options":["Annually","Every 3 years","Every 5 years","Every 10 years"],"correctIndex":2,"citation":"NFPA 25 (2020) §14.3.2.1","explanation":"When the underlying condition is still present — or is one that flushing alone will not resolve — Chapter 14 requires the system to be examined internally for obstructions on a five-year cycle rather than being left alone between events.","optionNotes":["Annual is the interval for internal ice-obstruction inspections in refrigerated spaces, not for this ongoing obstruction examination.","Three years is not a frequency used for internal obstruction examination.","Correct — a five-year internal examination is required while the condition remains uncorrected.","Ten years is not permitted for a known, uncorrected obstruction condition."]},{"deck":"inspection","system":"Obstruction","frequency":"","drill":false,"question":"When a system is examined internally for obstructions, NFPA 25 specifies a minimum set of locations. Which set is correct?","options":["System valve, riser, cross main, and branch line","Riser, feed main, cross main, and the most remote sprinkler","Fire department connection, riser, cross main, and branch line","Backflow preventer, riser, branch line, and inspector's test connection"],"correctIndex":0,"citation":"NFPA 25 (2020) §14.3.2.2","explanation":"The examination has to sample the system from the supply end out to the small pipe, because obstructing material sorts itself by pipe size and velocity. The four minimum points are the system valve, the riser, a cross main, and a branch line.","optionNotes":["Correct — these are the four minimum internal examination points named in Chapter 14.","The most remote sprinkler is a hydraulic design concept; it is not one of the four listed examination points.","The FDC is not one of the four minimum points; the system valve is.","The backflow preventer and inspector's test connection are not among the four minimum points listed."]},{"deck":"inspection","system":"Obstruction","frequency":"","drill":false,"question":"A contractor proposes using a borescope inserted through existing openings instead of cutting the pipe open at each of the four internal examination points. Is this acceptable under NFPA 25?","options":["No — internal examination must always be by physical opening of the pipe","Yes — alternative nondestructive examination methods are permitted","Only if the AHJ waives the internal examination entirely","Only on dry pipe systems"],"correctIndex":1,"citation":"NFPA 25 (2020) §14.3.2.3","explanation":"Chapter 14 expressly permits alternative nondestructive examination methods in place of cutting piping apart, as long as the examination still gets the needed look at the internal condition.","optionNotes":["The standard does not require destructive examination; nondestructive alternatives are allowed.","Correct — alternative nondestructive examination methods are permitted.","This is not a waiver situation; the standard itself allows the alternative method.","The allowance is not limited to dry systems."]},{"deck":"maintenance","system":"Obstruction","frequency":"","drill":false,"question":"An obstruction investigation confirms there is enough material in the system to obstruct sprinkler piping. What does NFPA 25 require, and by whom?","options":["Partial flushing of the affected branch lines by the building maintenance staff","A complete flushing program conducted by qualified personnel","Replacement of the system piping under an approved engineering plan","Increased inspection frequency until the next five-year assessment"],"correctIndex":1,"citation":"NFPA 25 (2020) §14.3.3","explanation":"Confirmed obstructing material calls for a complete flushing program, not a spot cleanup, and the standard puts that work in the hands of qualified personnel because improper flushing can drive material deeper into the system.","optionNotes":["A partial effort by untrained staff misses material elsewhere in the system and is not what the standard requires.","Correct — a complete flushing program performed by qualified personnel is required.","Repiping may be a business decision but is not the requirement the standard states here.","Watching the problem more often does not remove the material."]},{"deck":"inspection","system":"Obstruction","frequency":"Annually","drill":true,"question":"A dry pipe sprinkler system serves a freezer held at 10°F. How often must the piping be inspected internally for ice obstructions?","options":["Quarterly","Semiannually","Annually","Every 5 years"],"correctIndex":2,"citation":"NFPA 25 (2020) §14.4","explanation":"Dry pipe and preaction piping that protects or passes through spaces kept below freezing gets an annual internal inspection for ice obstructions, because trapped moisture in a below-freezing environment builds ice that no amount of external inspection will reveal.","optionNotes":["Quarterly is not the interval the standard sets for the internal ice obstruction inspection.","Semiannual is not the interval used for the internal ice obstruction inspection.","Correct — the internal ice obstruction inspection is annual.","Five years is the Section 14.2 internal piping condition assessment interval, not the ice obstruction inspection."]},{"deck":"inspection","system":"Obstruction","frequency":"Annually","drill":false,"question":"Where does NFPA 25 direct the technician to perform the annual internal ice obstruction inspection on dry pipe sprinkler piping serving a refrigerated space?","options":["At the dry pipe valve trim","At the point where the piping enters the refrigerated area","At the most remote sprinkler in the freezer","At the inspector's test connection"],"correctIndex":1,"citation":"NFPA 25 (2020) §14.4","explanation":"Ice forms where warm, moist air in the piping meets the cold zone, so the standard points the inspection at the transition — the location where the piping crosses into the refrigerated area.","optionNotes":["The valve trim is outside the cold zone and will not show the ice plug.","Correct — the inspection is performed where the piping enters the refrigerated area.","The most remote sprinkler is a hydraulic design term; the standard names the entry point, not the remote end.","The inspector's test connection is used for trip testing and waterflow verification, not this inspection."]},{"deck":"inspection","system":"Obstruction","frequency":"","drill":false,"question":"An ice obstruction is discovered at one penetration into a cold storage room. What else does NFPA 25 require?","options":["Only removal of the ice at that penetration and a return to service","Examination of additional pipe to confirm no other ice obstructions or blockages exist","Conversion of the system to an antifreeze system","An obstruction investigation of the entire building's yard main"],"correctIndex":1,"citation":"NFPA 25 (2020) §14.4.2","explanation":"Every place the piping crosses into a cold space gets checked, not just the one that looked suspect. And one ice plug is treated as a warning rather than an isolated event: the technician has to open up and look at more of the pipe before calling the system clear, because whatever let moisture collect at that penetration almost certainly exists at the others.","optionNotes":["Clearing the one visible plug leaves any others in place and undetected.","Correct — additional pipe must be examined once an ice obstruction is found.","The standard does not call for a system conversion as the response to a found ice obstruction.","Yard main obstruction investigation addresses foreign material triggers, not ice at a refrigerated penetration."]},{"deck":"general","system":"Impairment","frequency":"","drill":false,"question":"A property owner has not designated anyone as impairment coordinator and there is no lease provision assigning ITM responsibility. Who is the impairment coordinator?","options":["The sprinkler contractor performing the ITM work","The fire department officer having jurisdiction","The property owner or designated representative","The building's insurance carrier"],"correctIndex":2,"citation":"NFPA 25 (2020) §15.2.1, §15.2.2","explanation":"Chapter 15 puts the duty to assign an impairment coordinator on the property owner or designated representative, and if no specific person has been designated, the owner or designated representative is the coordinator by default. The role never goes vacant.","optionNotes":["The servicing contractor may cause or discover an impairment but is not the default coordinator.","The AHJ is notified of impairments; it does not become the coordinator.","Correct — with no designee, the property owner or designated representative is considered the impairment coordinator.","The insurance carrier is on the notification list, not in the coordinator role."]},{"deck":"general","system":"Impairment","frequency":"","drill":false,"question":"A written management contract specifically grants authority for inspection, testing, and maintenance of the sprinkler systems to the managing firm. Who assigns the impairment coordinator?","options":["The property owner, since ownership cannot be delegated","The managing firm, because the contract grants it ITM authority","The AHJ, which must approve any coordinator designation","Whoever holds the fire insurance policy"],"correctIndex":1,"citation":"NFPA 25 (2020) §15.2.3","explanation":"Chapter 15 follows the authority. Where a lease, written use agreement, or management contract specifically grants ITM authority to a tenant, management firm, or managing individual, that party is the one who assigns a person as impairment coordinator.","optionNotes":["The owner's default duty is displaced when a written agreement specifically transfers ITM authority.","Correct — the party granted ITM authority by the written agreement assigns the impairment coordinator.","The AHJ does not approve coordinator designations under this section.","Holding the insurance policy carries no coordinator-assignment duty in the standard."]},{"deck":"general","system":"Impairment","frequency":"","drill":false,"question":"A sprinkler system is taken out of service for repairs. Where must the impairment tag be posted?","options":["At each fire department connection and the system control valve, plus any locations the AHJ requires","At the main building entrance and the fire alarm control panel","At the riser only","On the sprinkler contractor's work order and in the ITM records"],"correctIndex":0,"citation":"NFPA 25 (2020) §15.3.1, §15.3.2","explanation":"The tag exists so that anyone who might rely on the system — including responding firefighters — learns it is out of service before they need it. That is why the standard puts tags at the FDC and the system control valve, and lets the AHJ require additional locations.","optionNotes":["Correct — FDC, system control valve, and any additional AHJ-required locations.","The entrance and alarm panel are not the locations named by the standard.","Tagging only the riser leaves arriving fire crews at the FDC with no warning.","Paperwork is not a substitute for physically posted tags."]},{"deck":"general","system":"Impairment","frequency":"","drill":false,"question":"Which of the following is NOT listed in Chapter 15 among the impaired equipment covered by the impairment program?","options":["Water mist systems","Fire service control valves","Portable fire extinguishers","Underground fire service mains"],"correctIndex":2,"citation":"NFPA 25 (2020) §15.4.2","explanation":"The impaired equipment list in Chapter 15 covers water-based systems and their supply components — sprinkler, standpipe, fire hose, underground mains, fire pumps, water storage tanks, water spray, foam-water, water mist, fire service control valves, and the water supply. Extinguishers are not water-based system equipment under this standard.","optionNotes":["Water mist systems are expressly on the list.","Fire service control valves are expressly on the list.","Correct — portable extinguishers are not among the impaired equipment listed in Chapter 15.","Underground fire service mains are expressly on the list."]},{"deck":"general","system":"Impairment","frequency":"","drill":false,"question":"A contractor plans to shut down a sprinkler system next Tuesday to relocate branch lines. Who must authorize this preplanned impairment?","options":["The fire department","The impairment coordinator","The insurance carrier","The general contractor's superintendent"],"correctIndex":1,"citation":"NFPA 25 (2020) §15.5.1","explanation":"Every preplanned impairment must be authorized by the impairment coordinator, who is also responsible for verifying that the required preparation steps have been carried out before the system comes down.","optionNotes":["The fire department must be notified, but notification is not the same as authorization.","Correct — preplanned impairments are authorized by the impairment coordinator.","The insurance carrier is on the notification list, not the authorization step.","Construction scheduling authority is not fire protection impairment authority."]},{"deck":"general","system":"Impairment","frequency":"","drill":false,"question":"A sprinkler system will be out of service for 14 hours during a single day for pipe replacement. What does NFPA 25 require the impairment coordinator to arrange?","options":["Nothing additional, as long as the fire department has been notified","One of the following: evacuation of the affected area, an approved fire watch, a temporary water supply, or an approved program to eliminate ignition sources and limit fuel","Both an approved fire watch and a temporary water supply","Continuous on-site presence of the AHJ for the duration of the work"],"correctIndex":1,"citation":"NFPA 25 (2020) §15.5.2(4)","explanation":"Once a system is out of service for more than 10 hours within a 24-hour period, the standard requires a compensating measure. The coordinator arranges one of four listed options — evacuation of the affected building or portion, an approved fire watch, a temporary water supply, or an approved program that removes ignition sources and limits available fuel.","optionNotes":["Notification alone does not satisfy the requirement once the 10-hour threshold in a 24-hour period is exceeded.","Correct — one of those four compensating measures must be arranged.","The standard requires one of the listed options, not a combination of two.","The standard does not require the AHJ to stand by on site."]},{"deck":"general","system":"Impairment","frequency":"","drill":false,"question":"During a routine annual inspection a technician discovers a closed and locked sectional control valve that no one knew about. Under Chapter 15, how is this classified?","options":["A preplanned impairment, since it was found during scheduled ITM work","An emergency impairment, because impairments found during ITM activities are included in that category","A deficiency only — impairment procedures do not apply","An informational note requiring no action beyond the inspection report"],"correctIndex":1,"citation":"NFPA 25 (2020) §15.6.1","explanation":"Chapter 15 draws the line by how the impairment arrived, not by how dramatic it is. Anything unplanned lands in the emergency bucket — a lost water supply, a broken or frozen line, failed equipment — and the standard deliberately sweeps in whatever a technician stumbles onto while doing routine ITM work. A valve found shut in the field was never scheduled or authorized by anyone, so it is handled as an emergency impairment.","optionNotes":["A preplanned impairment is one scheduled and authorized in advance; a surprise discovery is not preplanned.","Correct — impairments found during ITM activities are emergency impairments.","Calling it a paperwork deficiency ignores that protection is actually out of service.","Documenting it without acting leaves the area unprotected."]},{"deck":"general","system":"Impairment","frequency":"","drill":false,"question":"An emergency impairment occurs when a water main break interrupts the supply to a sprinkler system. What procedure does the impairment coordinator follow?","options":["A separate emergency-only checklist published by the AHJ","The same steps required for preplanned impairments in Section 15.5","No formal procedure — emergency impairments are exempt from Chapter 15 steps","Only fire department notification and tagging"],"correctIndex":1,"citation":"NFPA 25 (2020) §15.6.2","explanation":"Chapter 15 does not create a second, looser process for emergencies. The coordinator implements the same steps required for preplanned impairments, so the notifications, risk mitigation, tagging, and compensating measures still get done.","optionNotes":["The standard points back to its own Section 15.5 rather than to an AHJ checklist.","Correct — the coordinator implements the steps outlined in Section 15.5.","Emergency impairments are covered by Chapter 15, not exempt from it.","Notification and tagging are only part of the required steps."]},{"deck":"general","system":"Impairment","frequency":"","drill":false,"question":"Repairs are finished and the sprinkler system has been refilled and pressurized. Which action completes the restoration process under NFPA 25?","options":["Removing the impairment tag after verifying the required inspections, tests, and notifications are complete","Removing the impairment tag first so the system reads as in service, then completing the notifications","Leaving the tag in place until the next annual inspection confirms performance","Filing the repair invoice with the ITM records"],"correctIndex":0,"citation":"NFPA 25 (2020) §15.7","explanation":"Restoring a system to service is a verification sequence, not just closing a valve. The coordinator confirms the necessary inspections and tests were performed, confirms supervisors, the fire department, the owner or designated representative, the insurance carrier, the alarm company, and other AHJs have been told protection is back, and then the impairment tag comes off.","optionNotes":["Correct — the tag is removed as part of a completed verification and notification sequence.","Pulling the tag early misrepresents the system's status while notifications are still outstanding.","The tag is removed once restoration is verified; it is not held for a year.","Recordkeeping is good practice but is not the restoration step the standard describes."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"A water-based system's ITM requirement in a referenced NFPA standard conflicts with the corresponding requirement in NFPA 25. Which governs?","options":["NFPA 25, since it is the ITM standard","The referenced standard takes precedence","Whichever requirement is more frequent","The AHJ decides on a case-by-case basis"],"correctIndex":1,"citation":"NFPA 25 (2020) §16.1.1.3","explanation":"Chapter 16 exists to collect ITM requirements for water-based systems that live in other NFPA documents and differ from NFPA 25. Where the two conflict, the standard resolves it in favor of the referenced standard.","optionNotes":["NFPA 25 itself directs the user to the referenced standard when the two differ.","Correct — the referenced standard takes precedence over NFPA 25 in a conflict.","Picking the stricter interval is a common habit but is not what this section says.","The standard settles the conflict itself rather than leaving it to case-by-case judgement."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"A small residential board and care facility is protected by a sprinkler system installed to NFPA 13D. Under Chapter 16, how must that system be inspected, tested, and maintained?","options":["In accordance with NFPA 101","In accordance with NFPA 13D itself","In accordance with the wet pipe chapters of NFPA 25","In accordance with the manufacturer's instructions only"],"correctIndex":0,"citation":"NFPA 25 (2020) §16.2.1, §16.2.1.1","explanation":"Chapter 16 carves out residential board and care facilities whose sprinkler systems were installed to NFPA 13D as described in NFPA 101, and sends their inspection, testing, and maintenance requirements to NFPA 101 rather than to the main body of NFPA 25.","optionNotes":["Correct — those NFPA 13D systems are inspected, tested, and maintained in accordance with NFPA 101.","NFPA 13D is the installation standard for the system; Chapter 16 points the ITM requirements at NFPA 101.","The general NFPA 25 chapters are exactly what this section redirects away from for these systems.","Manufacturer's instructions supplement but do not replace the referenced standard."]}]}

    maintenance:{ac:'var(--green)',soft:'var(--green-soft)',glow:'var(--green-glow)',ic:'M',
      name:'Maintenance',tag:'What you service',
      desc:'Servicing, lubrication, replacement and rebuild triggers — the work that keeps a system in the condition the standard assumes.'},
    general:{ac:'var(--steel)',soft:'var(--steel-soft)',glow:'var(--steel-glow)',ic:'G',
      name:'General',tag:'Administration',
      desc:'Owner responsibility, records, impairments and the administrative spine of the standard.'}
  }[d] || {ac:'var(--steel)',soft:'var(--steel-soft)',glow:'var(--steel-glow)',ic:'?',name:d,tag:'',desc:''};
}

function qid(q){
  var s = q.question || '';
  var h = 5381;
  for(var i=0;i<s.length;i++){ h = ((h<<5) + h + s.charCodeAt(i)) | 0; }
  return 'q' + (h >>> 0).toString(36);
}
BANK.questions.forEach(function(q){ q._id = qid(q); });

/* ============================================================
   STATE
   ============================================================ */
var KEY = 'fsm-nfpa25-itm-v1';
var state = {seen:{}, right:{}, wrong:{}, cards:{}, tests:[], answered:0, correct:0};

function loadState(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var p = JSON.parse(raw);
      ['seen','right','wrong','cards'].forEach(function(k){ if(p[k]) state[k] = p[k]; });
      if(Array.isArray(p.tests)) state.tests = p.tests;
      if(typeof p.answered === 'number') state.answered = p.answered;
      if(typeof p.correct === 'number') state.correct = p.correct;
    }
  }catch(e){}
}
function saveState(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function resetState(){
  state = {seen:{}, right:{}, wrong:{}, cards:{}, tests:[], answered:0, correct:0};
  saveState(); route();
}

function record(q, ok){
  var id = q._id;
  state.seen[id] = (state.seen[id]||0) + 1;
  if(ok){ state.right[id] = (state.right[id]||0) + 1; state.correct++; }
  else  { state.wrong[id] = (state.wrong[id]||0) + 1; }
  state.answered++;
  saveState();
}

/* A question is a weak spot while misses outnumber hits, or it has any
   miss and has not since been answered right twice. */
function isWeak(q){
  var w = state.wrong[q._id]||0, r = state.right[q._id]||0;
  return w > 0 && r < w + 1;
}
function weakList(){ return BANK.questions.filter(isWeak); }

function accuracy(){ return state.answered ? Math.round(100*state.correct/state.answered) : null; }

/* ============================================================
   DOM HELPER
   ============================================================ */
function el(tag, attrs){
  var n = document.createElement(tag);
  attrs = attrs || {};
  for(var k in attrs){
    var v = attrs[k];
    if(v === null || v === undefined) continue;
    if(k === 'class') n.className = v;
    else if(k === 'html') n.innerHTML = v;
    else if(k === 'text') n.textContent = v;
    else if(k.slice(0,2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for(var i=2;i<arguments.length;i++){
    var c = arguments[i];
    if(c === null || c === undefined || c === false) continue;
    if(Array.isArray(c)) c.forEach(function(x){ if(x) n.appendChild(x); });
    else n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return n;
}
function plural(n, word){ return n + ' ' + word + (n === 1 ? '' : 's'); }
function shuffle(a){
  var r = a.slice();
  for(var i=r.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=r[i]; r[i]=r[j]; r[j]=t; }
  return r;
}
function scrollTop(){ window.scrollTo({top:0, behavior:'smooth'}); }

/* ============================================================
   ROUTING
   ============================================================ */
function go(path){ location.hash = '#' + path; }
function parts(){ return (location.hash||'#/').replace(/^#/,'').split('/').filter(Boolean); }
window.addEventListener('hashchange', route);

function route(){
  var p = parts();
  var app = document.getElementById('app');
  app.innerHTML = '';
  app.className = 'fade';
  var head = p[0] || '';

  if(!head)                          renderHome(app);
  else if(head === 'definitions')    renderCards(app);
  else if(head === 'progress')       renderProgress(app);
  else if(head === 'frequency')      renderRun(app, freqSet(), {title:'Frequency Drill', accent:'var(--amber)', back:'/'});
  else if(head === 'weak')           renderWeak(app);
  else if(head === 'exam')           renderExamSetup(app);
  else if(DECKS.indexOf(head) >= 0){
    var deck = head, mode = p[1];
    if(mode === 'study')      renderRun(app, deckSet(deck), {title:deckMeta(deck).name+' — Study', accent:deckMeta(deck).ac, back:'/'+deck, deck:deck});
    else if(mode === 'test')  renderTestSetup(app, deck);
    else                      renderDeckHome(app, deck);
  }
  else renderHome(app);
}

function deckSet(deck){ return BANK.questions.filter(function(q){ return q.deck === deck; }); }
/* Only questions that genuinely ask you to choose an interval or judge a schedule.
   A question like "during the annual inspection, what must you check?" carries a
   frequency for context but tests content, so it stays in its own deck instead. */
function freqSet(){ return BANK.questions.filter(function(q){ return q.drill; }); }

    ));

  modes.appendChild(el('button',{class:'mode', style:'--ac:var(--blue)', onclick:function(){ go('/exam'); }},

function crumb(root){

function renderDeckHome(root, deck){

    el('h2',{}, m.name),

        el('h3',{}, el('span',{class:'dot'}), 'Study mode'),
        el('p',{},'Walk every question at your own pace. Answer, see why, move on. Nothing is scored — the point is the explanation.')
      ),
      el('button',{class:'mode', style:'--ac:'+m.ac, onclick:function(){ go('/'+deck+'/test'); }},
        el('h3',{}, el('span',{class:'dot'}), 'Test mode'),

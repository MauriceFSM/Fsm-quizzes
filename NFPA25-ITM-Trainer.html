§1.1.1.2, §1.1.1.3","explanation":"The two standards split the work and then have to be coordinated. ITM required by NFPA 72 follows NFPA 72; ITM required by NFPA 25 follows NFPA 25; and the two must be coordinated so the system operates as intended. The 2020 edition adds an explicit statement that NFPA 25 does not address all ITM of the electrical components of the detection equipment used to activate preaction and deluge systems.","optionNotes":["Wrong. This is the common assumption, and the 2020 edition added language specifically to correct it.","Correct. Detection electrical components for preaction and deluge activation fall to NFPA 72, with the two standards' activities coordinated.","Wrong. NFPA 70E is the electrical safety standard applied to worker safety during ITM (§4.9.6.2), not the ITM standard for detection devices.","Wrong. Licensing does not decide which standard's ITM requirements apply."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"Which of the following is within the scope of NFPA 25 as a water supply component of the systems it covers?","options":["The municipal water treatment plant supplying the city main","Private fire service mains, fire pumps, water storage tanks, and valves controlling system flow","Domestic plumbing branches downstream of the fire service backflow assembly","Only the sprinkler system piping downstream of the riser check valve"],"correctIndex":1,"citation":"NFPA 25 (2020) §1.1.2.1, §1.1.2.2","explanation":"The scope covers sprinkler, standpipe and hose, fixed water spray, private fire hydrants, water mist, and foam-water systems — and it expressly pulls in the water supplies that are part of them, including private fire service mains and appurtenances, fire pumps, water storage tanks, and the valves that control system flow.","optionNotes":["Wrong. Public waterworks infrastructure is not a component of the protected property's system under this standard.","Correct. These water supply components are specifically named as included in the standard's scope.","Wrong. Domestic plumbing is not a water-based fire protection system component under this standard.","Wrong. The scope is far broader than system piping — that is precisely why water supply components are called out separately."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"An inspection reveals a condition that must be corrected for the system to operate satisfactorily. Which document governs the corrective action?","options":["Always the installation standard in effect when the system was built","NFPA 25, unless NFPA 25 specifically refers the corrective action to an installation standard","Always the current edition of the applicable installation standard","The manufacturer's instructions only"],"correctIndex":1,"citation":"NFPA 25 (2020) §1.1.4","explanation":"Corrective action needed to make a system operate satisfactorily is governed by NFPA 25 itself — the exception being where NFPA 25 specifically points you to an appropriate installation standard. Watching for that internal referral is the whole point of the clause.","optionNotes":["Wrong. Defaulting to the original installation standard ignores that NFPA 25 governs unless it hands the question off.","Correct. NFPA 25 governs corrective action by default, with a specific-referral exception.","Wrong. NFPA 25 does not make every correction a current-installation-standard upgrade.","Wrong. Manufacturer's instructions are required to be followed for ITM and impairment procedures (§4.1.1.1), but they do not replace the standard for corrective action."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"A property owner leases a warehouse to a tenant and delegates inspecting, testing, maintenance, and the managing of impairments to that tenant as his designated representative. What does NFPA 25 say about the arrangement?","options":["Delegation is not permitted; the property owner must personally perform or contract all ITM","Delegation is permitted where the owner is not the occupant, and the designated representative must then meet the owner's requirements throughout the standard","Delegation is permitted, but the property owner remains the only party who may manage impairments","Delegation requires prior written approval from the AHJ in every case"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.1.1, §4.1.1.3, §4.1.1.4","explanation":"The property owner or designated representative carries responsibility for properly maintaining the system. Where the owner is not the occupant, the authority for inspecting, testing, maintenance, and managing impairments may be delegated to a designated representative — and once that authority is accepted, the designated representative has to comply with every requirement the standard places on the property owner or designated representative.","optionNotes":["Wrong. The standard expressly permits delegation when the owner is not the occupant.","Correct. Delegation is permitted, and it carries the full set of owner obligations with it.","Wrong. Managing impairments is specifically named among the authorities that may be delegated.","Wrong. No blanket AHJ pre-approval of delegation is required by this section."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"Before a scheduled main drain test on a system protecting a room full of paper records, what does NFPA 25 require of the owner regarding water damage?","options":["Nothing — water damage is entirely the servicing contractor's liability","The owner must coordinate with the entity conducting the ITM activities to minimize water damage from discharge","The owner must relocate all water-sensitive contents before any test that discharges water","The owner must obtain a waiver from the AHJ before any test that discharges water"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.1.1.2.1","explanation":"The standard makes water damage a shared planning problem: the owner is required to coordinate with whoever is performing the ITM so that damage from discharged water is minimized. It is a coordination duty, not a prohibition on discharging.","optionNotes":["Wrong. The standard places an explicit coordination duty on the owner.","Correct. Coordination with the ITM entity to minimize discharge-related water damage is required of the owner.","Wrong. Relocating contents may be a sensible outcome of coordination, but the standard requires coordination, not relocation.","Wrong. No AHJ waiver is required to perform a required test that discharges water."]},{"deck":"inspection","system":"General","frequency":"","drill":false,"question":"A wet pipe system's water-filled piping runs through a conditioned building area that is subject to freezing, and there is no antifreeze and no other means of freeze protection on that piping. What minimum temperature must the property owner or designated representative ensure is maintained?","options":["32°F (0°C)","40°F (4°C)","55°F (13°C)","No minimum, provided the piping is insulated"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.1.2, §4.1.2.1","explanation":"The owner or designated representative has to ensure water-filled piping is kept at or above 40°F (4°C) unless an approved antifreeze solution is used. All building areas containing water-filled piping without another means of freeze protection have to be held to that same minimum.","optionNotes":["Wrong. Freezing point is not the threshold the standard uses — 40°F builds in a margin above freezing.","Correct. 40°F (4°C) is the minimum for water-filled piping absent approved antifreeze.","Wrong. 55°F is not a temperature the standard sets for freeze protection of water-filled piping.","Wrong. Insulation alone does not remove the temperature requirement; §4.1.2.3 still requires insulated/heat-traced pipe in exposed areas to be held within a temperature band."]},{"deck":"inspection","system":"General","frequency":"","drill":false,"question":"A dry system's water-filled supply piping runs through an unheated but enclosed space that, based on the building's climate and construction, is not subject to freezing. How does the 2020 edition treat the 40°F requirement there?","options":["The 40°F requirement still applies to every unheated space without exception","The 40°F requirement does not apply where the water-filled piping is in unconditioned building spaces or outside the building envelope and is not subject to freezing","The 40°F requirement applies only if the space is a plenum","The owner must add antifreeze to any piping in an unheated space"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.1.2.2","explanation":"The 2020 edition adds an exception: where water-filled piping sits in unconditioned building spaces or outside the building envelope and is not subject to freezing, the 40°F requirement of §4.1.2 does not apply. Both conditions matter — unconditioned/outside the envelope AND not subject to freezing.","optionNotes":["Wrong. This ignores a new-material exception added in the 2020 edition.","Correct. The exception is conditioned on the piping not being subject to freezing.","Wrong. Plenum status is not the criterion in this exception.","Wrong. Antifreeze is one alternative to the temperature requirement generally, but it is not what §4.1.2.2 mandates."]},{"deck":"inspection","system":"General","frequency":"","drill":false,"question":"An aboveground water-filled sprinkler main passes through an open loading passageway that drops below 40°F in winter and is protected by a listed heat tracing system. What temperature range must that piping be maintained within?","options":["Between 32°F (0°C) and 100°F (37.8°C)","Between 40°F (4°C) and 120°F (48.9°C)","At or above 40°F (4°C) with no stated upper limit","At or above 55°F (13°C) with no stated upper limit"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.1.2.3","explanation":"Where aboveground water-filled pipe runs through spaces that get colder than 40°F — think open bays, coolers, and covered walkways — and is kept from freezing by wrapping it, enclosing it, running listed heat trace on it, or some other dependable method, the pipe has to sit in a band between 40°F (4°C) and 120°F (48.9°C). The upper bound is the half of this rule people forget: heat tape that runs too hot puts the pipe out of compliance just as surely as a cold snap does.","optionNotes":["Wrong. Neither bound is what the standard states for this condition.","Correct. The band for cold-exposed aboveground water-filled pipe with freeze protection is 40°F to 120°F.","Wrong. This misses the upper limit, which is the part of the requirement heat-trace installations actually violate.","Wrong. 55°F is not a temperature this standard sets, and the upper limit is again omitted."]},{"deck":"inspection","system":"General","frequency":"Daily","drill":true,"question":"A dry pipe valve sits in an exterior valve enclosure that is subject to freezing, and the enclosure has no low-temperature alarm. How often must the enclosure be inspected during cold weather to verify it is at least 40°F (4°C)?","options":["Daily","Weekly","Monthly","Quarterly"],"correctIndex":0,"citation":"NFPA 25 (2020) §4.1.2.5","explanation":"New in the 2020 edition: valve enclosures for preaction valves, deluge valves, and dry pipe valves that are subject to freezing get a daily cold-weather inspection to confirm a minimum of 40°F (4°C). The frequency drops only when a low-temperature alarm is present.","optionNotes":["Correct. Daily during cold weather is the base requirement for an enclosure with no low-temperature alarm.","Wrong for this scenario. Weekly is the reduced frequency permitted when the enclosure is equipped with a low-temperature alarm (§4.1.2.5.1).","Wrong. Monthly is not a permitted interval for freezing-susceptible valve enclosures.","Wrong. Quarterly is far too long for a freeze-exposed valve enclosure and is not an interval this section allows."]},{"deck":"inspection","system":"General","frequency":"Weekly","drill":true,"question":"A preaction valve enclosure that is subject to freezing is equipped with a low-temperature alarm. What cold-weather inspection frequency is permitted for that enclosure?","options":["Daily","Weekly","Monthly","Semiannually"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.1.2.5, §4.1.2.5.1","explanation":"Adding a low-temperature alarm buys a reduction in manual inspection: enclosures equipped with low-temperature alarms are permitted to be inspected weekly instead of daily. The alarm is doing the continuous watching that the daily walk-through was doing.","optionNotes":["Wrong for this scenario. Daily is the requirement when there is no low-temperature alarm.","Correct. Weekly is the permitted frequency once a low-temperature alarm is installed in the enclosure.","Wrong. Monthly is not offered as a reduced frequency for these enclosures.","Wrong. Semiannual is not an interval this section permits for a freeze-exposed valve enclosure."]},{"deck":"inspection","system":"General","frequency":"Annually","drill":true,"question":"A valve enclosure is equipped with a low-temperature alarm so the enclosure can be inspected weekly. What does NFPA 25 require regarding the alarm itself?","options":["Once a year, timed to the start of the heating season, it is checked over for physical damage","It must be flow-tested quarterly along with the other supervisory devices","It must be replaced every 5 years regardless of condition","No separate inspection is required as long as the enclosure inspection is performed"],"correctIndex":0,"citation":"NFPA 25 (2020) §4.1.2.5.2","explanation":"If a low-temperature alarm is the reason you dropped from daily to weekly enclosure checks, the alarm itself has to be trustworthy. The 2020 edition puts it on a yearly look — deliberately scheduled at the front end of the heating season — to confirm nothing has been physically damaged. The timing is the point: a broken alarm gets caught before the cold months it is supposed to cover, not after.","optionNotes":["Correct. A yearly check for physical damage, scheduled at the start of the heating season.","Wrong. Quarterly is a real NFPA 25 interval for various device tests, but this provision sets a yearly inspection tied to the heating season, not a quarterly test.","Wrong. No blanket 5-year replacement is set for these alarms; 5 years is a genuine interval elsewhere in NFPA 25 but not here.","Wrong. The alarm gets its own inspection precisely because the reduced enclosure frequency depends on it working."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"A contractor is about to shut down a sprinkler system's water supply to perform a required test. Which of the following must the notification to the AHJ, the fire department (if required), and the alarm-receiving facility include?","options":["Only the contractor's license number and the date","Why the shutdown or test is happening, which system or component it affects, when it is expected to start, and how long it should last","Only the estimated duration and an emergency contact number","A copy of the most recent inspection report and the hydraulic calculations"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.1.4, §4.1.4.1","explanation":"Before a system or its supply is tested or shut down, the owner or designated representative notifies the AHJ, the fire department where that is required, and the alarm-receiving facility — and the standard does not leave the content open. Four things go in the call: the reason, the specific system or component affected, the anticipated start, and how long it will be down or under test.","optionNotes":["Wrong. Licensing information is not part of the notification content the standard specifies.","Correct. Reason, affected system or component, expected start, and expected length are the four stated items.","Wrong. Duration is only one of four elements; the reason and the affected system or component are also required.","Wrong. Reports and calculations are records (§4.3), not the content of a shutdown notification."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"A technician finishes a fire pump test and restores the system to service. What does NFPA 25 require next?","options":["Nothing further; the pre-test notification covers the entire event","The AHJ, the fire department, and the alarm-receiving facility must be notified that the system, supply, or component is back in service or that the test is complete","Only the alarm-receiving facility needs to be notified of restoration","A new impairment tag must be attached documenting the completed test"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.1.4.2","explanation":"Notification is a two-ended requirement. The same parties told before the shutdown or test have to be told when the system, supply, or component is returned to service or when the test is complete. Skipping the close-out call is one of the most common real-world violations of this section.","optionNotes":["Wrong. The standard requires a separate restoration notification, not just an advance notice.","Correct. All three parties are notified again at return to service or test completion.","Wrong. Notifying only the alarm-receiving facility leaves out the AHJ and the fire department.","Wrong. Impairment tags are attached to impaired systems under Chapter 15 procedures (§4.1.11.1), not to document a completed test."]},{"deck":"maintenance","system":"General","frequency":"","drill":false,"question":"During routine maintenance, a contractor discovers that a batch of installed devices is subject to a manufacturer recall program. What does the 2020 edition of NFPA 25 require?","options":["The contractor must remove the recalled devices immediately without notifying anyone","The owner must be notified in writing, and the owner or designated representative must correct, remedy, repair, or replace the recalled components and equipment","The contractor must report the recall directly to the AHJ, who then decides whether replacement is needed","No action is required until the manufacturer contacts the owner directly"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.1.5.1.1, §4.1.5.1.2","explanation":"New in the 2020 edition: whoever discovers recalled or replacement-program components — owner's maintenance staff, designated representative, or contractor — has to notify the owner in writing. The duty to actually correct, remedy, repair, or replace those components then rests with the property owner or designated representative.","optionNotes":["Wrong. Written notification to the owner is a required step, and the correction responsibility is the owner's.","Correct. Written notice to the owner plus owner responsibility for correction is exactly what the two new subsections require.","Wrong. The standard routes the discovery to the owner in writing; it does not make the AHJ the decision-maker on recalls.","Wrong. The standard triggers on discovery during ITM, not on manufacturer outreach."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"A tenant wants to convert half of an office suite into rack storage for plastic goods. What does NFPA 25 require of the property owner, and how does that requirement relate to routine ITM?","options":["Nothing until the next annual inspection, when the change will be documented","The change must not be made without an evaluation of the fire protection systems' capability to protect the new use, and that evaluation is not part of normal ITM","The owner may proceed and simply add sprinklers if the next annual inspection flags a problem","The owner must notify the alarm-receiving facility, which satisfies the requirement"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.1.6, §4.1.6.1, §4.1.6.2","explanation":"The owner or designated representative is barred from changing occupancy, use or process, or the materials used or stored without first evaluating whether the fire protection systems can still protect the new condition. The standard also makes clear that this evaluation sits outside normal ITM — it is a separate engineering exercise, and the listed factors include occupancy conversions, process or material changes, building revisions like added mezzanines or ceilings below sprinklers, removal of heating in freeze-susceptible spaces, storage method or height changes, and water supply changes.","optionNotes":["Wrong. The evaluation is required before the change, and it is expressly not folded into the routine inspection.","Correct. Evaluate first, and understand it is outside the scope of normal ITM.","Wrong. This reverses the sequence the standard requires and treats the annual inspection as the design check it is not.","Wrong. Alarm-receiving facility notification relates to shutdowns and testing (§4.1.4), not to occupancy or hazard changes."]},{"deck":"inspection","system":"General","frequency":"","drill":false,"question":"Which of these systems requires a permanently marked metal or rigid plastic information sign at its system control riser?","options":["Every wet pipe sprinkler system without exception","A riser supplying an antifreeze loop, dry system, preaction system, or auxiliary system control valve","Only systems fed by a fire pump","Only systems in buildings over three stories"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.1.9.1, §4.1.9.2","explanation":"The trigger for the sign is the type of system on the riser, not the building or the water supply: antifreeze loops, dry systems, preaction systems, and auxiliary system control valves. The sign is fastened with corrosion-resistant wire, chain, or another approved method, and it has to tell a responder or technician four things — what area that system covers, where to find the auxiliary and low-point drains on dry pipe and preaction systems, whether antifreeze or another auxiliary system is present and where it is, and whether heat tape is present and where it runs.","optionNotes":["Wrong. The requirement is tied to specific system types, not to every wet system.","Correct. Those four riser conditions are what trigger the information sign.","Wrong. Fire pump presence is not the trigger for this sign.","Wrong. Building height is not a criterion in this section."]},{"deck":"inspection","system":"General","frequency":"","drill":false,"question":"An antifreeze system's main valve carries an antifreeze information sign. Which set of information must that sign convey?","options":["The system's design density and remote area","Which antifreeze product is in the pipe (its type and brand), how strong the mix is by volume, and how much solution the system holds","The date of the last freeze point test and the technician's name","The hydraulic reference point and static pressure"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.1.10","explanation":"This sign lives on the antifreeze system's main valve and its job is to describe what is actually in the pipe: the product itself, the strength of the mix expressed as concentration by volume, and the quantity of solution charged into the system. Those are the three things a technician needs before topping off or drawing a sample from the loop.","optionNotes":["Wrong. Density and remote area are design data; this sign is not a design placard.","Correct. Product type/brand, concentration by volume, and solution volume are the three items required.","Wrong. Test dates and technician names belong in records (§4.3.2), not on the antifreeze sign.","Wrong. Hydraulic reference point and static pressure are not the content of this sign."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"An owner asks how long she must keep her fire protection records. Which answer matches NFPA 25?","options":["All records may be discarded after 1 year from the date they were created","As-built drawings, hydraulic calculations, original acceptance test records, and device data sheets are kept for the life of the system; subsequent records are kept 1 year after the next ITM of that type","All records must be kept for the life of the system without exception","Records must be kept 3 years, matching the performance-based program review cycle"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.3.4, §4.3.5","explanation":"The standard splits retention into two buckets. The permanent set — as-built installation drawings, hydraulic calculations, original acceptance test records, and device manufacturers' data sheets — is retained for the life of the system. Everything after that is retained for one year past the next inspection, test, or maintenance of that same type. Records are maintained by the property owner and may be stored and accessed electronically.","optionNotes":["Wrong. This ignores the permanent-retention set entirely.","Correct. Two retention rules: life of system for the original documentation set, and one year past the next like activity for subsequent records.","Wrong. Only the specific documents listed in §4.3.4 carry life-of-system retention.","Wrong. Three years is the review interval for performance-based program goals (§4.7.3), not a record retention period."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"Which of the following must appear on an NFPA 25 inspection, test, or maintenance record?","options":["The system's hydraulic design density and the remote area size","What activity was done, who did it, how often the standard requires it, the outcome and the date it happened, and contact details for the qualified contractor or owner including the lead person on the job","The AHJ's permit number and the building's occupancy classification","The manufacturer's warranty status for each component tested"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.3.1, §4.3.1.1, §4.3.2, §4.3.3","explanation":"Every inspection, test, and maintenance activity on the system and its components gets a record, and the property owner is the one who keeps it. Five things have to be readable off that record: the activity itself, the organization behind it, the interval the standard sets for it, what happened and on what date, and who to call — contractor or owner, with the lead person named. The AHJ can ask to see it at any point.","optionNotes":["Wrong. Design data belongs to the permanent records set (§4.3.4); it is not the required content of an ITM record.","Correct. Those five items are what the record has to show.","Wrong. Permit numbers and occupancy classification are not listed record content.","Wrong. Warranty status is not among the required record elements."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"A technician needs to work on a backflow assembly and wants to close the fire pump suction valve for two hours during the job. What does NFPA 25 require regarding water supply status during ITM?","options":["Water supplies and fire pumps stay in service through the work unless qualified people are continuously on hand, or unless the Chapter 15 impairment process is followed","Water supplies may be shut down freely during ITM since the technician is on site","Water supplies may be shut down for up to 4 hours without any additional measures","Water supplies must never be shut down for any reason once a system is in service"],"correctIndex":0,"citation":"NFPA 25 (2020) §4.4, §4.1.11.1","explanation":"The default posture during inspection, testing, and maintenance is that the water supply — fire pumps included — keeps working. There are only two ways around that: qualified personnel in constant attendance, or running the job through the Chapter 15 impairment procedures, which include tagging the impaired system.","optionNotes":["Correct. In service by default, with constant attendance by qualified personnel or the Chapter 15 impairment route as the only alternatives.","Wrong. Being on site is not the same as the constant attendance by qualified personnel the standard describes, and it does not substitute for impairment procedures.","Wrong. §4.4 sets no blanket time allowance for taking a supply out of service.","Wrong. The standard plainly contemplates planned shutdowns; it governs how they are handled."]},{"deck":"testing","system":"General","frequency":"Every 3 years","drill":true,"question":"A facility uses automated testing equipment on its sprinkler system in accordance with NFPA 25. How often, at a minimum, must that automated testing be observed?","options":["Monthly","Annually","Once every 3 years","Once every 5 years"],"correctIndex":2,"citation":"NFPA 25 (2020) §4.6.1.1, §4.6.1.2","explanation":"Automated testing does not run unattended forever. Where automated testing under §4.6.6 is used, the testing has to be observed at a minimum of once every 3 years; and where it cannot be visually observed, the test has to be conducted manually at that same minimum of once every 3 years. The 3-year human check is the safeguard on the automation.","optionNotes":["Wrong. Monthly is a real NFPA 25 interval for many inspection items, but it is not the observation interval for automated testing.","Wrong. Annual is a common ITM frequency but is not what this section sets.","Correct. Once every 3 years is the minimum observation frequency, and the same interval applies to manual conduct of the test where observation is impossible.","Wrong. Five years is a real NFPA 25 interval elsewhere but is not the automated-testing observation frequency."]},{"deck":"testing","system":"General","frequency":"Every 3 years","drill":false,"question":"An automated testing system is set up so that it does not discharge water when it performs a required test. Is that permitted, and what condition attaches?","options":["It is prohibited — every automated test must discharge water every time","It is permitted, but the discharge must be visually observed at a minimum of once every 3 years","It is permitted only if the AHJ grants a written waiver for each test cycle","It is permitted only on dry pipe and preaction systems"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.6.6.4, §4.6.6.4.1, §4.6.6.4.2","explanation":"The baseline is that automated testing discharges water where the standard requires discharge. Equipment that does not discharge water for a test is permitted, but with a catch: the discharge has to be visually observed at least once every 3 years. That periodic real discharge is what proves the flow path is actually clear.","optionNotes":["Wrong. Non-discharging automated testing is expressly permitted, subject to the 3-year observed discharge.","Correct. Permitted, with visual observation of the discharge at minimum once every 3 years.","Wrong. The standard does not condition this on per-cycle AHJ waivers.","Wrong. The allowance is not limited to particular system types."]},{"deck":"testing","system":"General","frequency":"","drill":false,"question":"An automated test is performed and a sprinkler system component fails to pass. What signal does NFPA 25 require, and how does that differ from a failure of the testing equipment itself?","options":["Both conditions produce a trouble signal","A component or system that fails an automated test produces an audible supervisory signal; failure of the automated inspection and testing equipment produces a trouble signal per NFPA 72","Both conditions produce an audible alarm signal at the fire alarm control unit","Neither condition requires a signal as long as the failure is entered in the records"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.6.6.9, §4.6.6.10, §4.6.6.8, §4.6.6.11","explanation":"The 2020 edition separates two different failures. A component or system failing an automated test gives an audible supervisory signal — the protected system has a problem. Failure of the automated inspection and testing equipment gives a trouble signal in accordance with NFPA 72 — the monitoring tool has a problem. Separately, testing equipment failure must not impair system operation unless a supervisory signal indicates it, and any failure that impairs the system triggers impairment procedures.","optionNotes":["Wrong. This collapses two distinct requirements into one and loses the supervisory/trouble distinction.","Correct. Supervisory for a failed component or system, trouble for failed testing equipment.","Wrong. Neither condition is treated as an alarm signal; alarm signals indicate fire conditions.","Wrong. Both conditions carry signaling requirements, not just recordkeeping."]},{"deck":"testing","system":"General","frequency":"","drill":false,"question":"A building owner installs automated testing equipment and asks whether he can relax the standard's testing frequencies because the automation runs continuously. What is the correct answer?","options":["Yes — continuous automated monitoring replaces the periodic frequencies in the standard","No — the testing frequencies of the standard must be maintained regardless of whether the automated testing equipment is functioning","Yes, but only with an approved performance-based program under Chapter 4","Only the frequencies for valves and alarm devices may be relaxed"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.6.6.12, §4.6.6.13","explanation":"Automation changes how a test is performed, not how often. The standard's testing frequencies stand regardless of the functionality of the automated testing equipment, and a record of all inspections and testing still has to be kept per the recordkeeping requirements.","optionNotes":["Wrong. Automation is permitted as a method, not as a substitute for the required frequencies.","Correct. Frequencies survive intact regardless of automated equipment functionality.","Wrong. A performance-based program (§4.7) is a separate approved pathway for adjusting frequencies; it is not something automated equipment confers automatically.","Wrong. No component category gets a frequency reduction merely from automation."]},{"deck":"testing","system":"General","frequency":"","drill":false,"question":"A vendor proposes automated inspection and testing devices. Which of the devices must be listed for the purpose of the test being conducted?","options":["No automated devices are required to be listed","Automated test devices and equipment must be listed, except devices that either are not under system pressure or are not integral to how the system operates during a fire event","Every device, sensor, and cable in the automated system must be listed without exception","Only devices installed after the original system acceptance must be listed"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.6.6.6, §4.6.6.7","explanation":"The baseline (§4.6.6.6) is that automated test devices and equipment are listed for the purpose of the test being conducted. The 2020 edition then adds a carve-out (§4.6.6.7, new material): a device is exempt from listing if it is not subjected to system pressure, or if it is not integral to how the system operates during a fire. Note the 'or' — meeting either condition is enough. In practice that means the only automated devices you must insist be listed are the ones that are both under system pressure and part of how the system performs in a fire.","optionNotes":["Wrong. Listing is the general requirement for automated test devices and equipment.","Correct. Listed by default, with a 2020-edition exemption that applies when either condition is satisfied.","Wrong. This ignores the exemption entirely; not every ancillary component has to be listed.","Wrong. Installation timing is not the criterion for the listing requirement."]},{"deck":"testing","system":"General","frequency":"","drill":false,"question":"A dry pipe valve is rebuilt after a trip test reveals worn internal parts. What testing does NFPA 25 require once the work is done?","options":["Only a visual inspection of the reassembled valve is required","It must be tested in accordance with the original acceptance test required for that subsystem, or the requirements specified by the standard","No test is required until the next scheduled annual trip test","Only the results of the most recent test need to be reviewed"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.6.5, §4.6.4","explanation":"When a component or subsystem is adjusted, repaired, reconditioned, or replaced, it goes back through the original acceptance test for that subsystem, or through whatever the standard specifies. And test results generally are compared with the original acceptance test results if available and with the most recent test results — trending is how a slowly degrading system is caught.","optionNotes":["Wrong. Visual inspection does not verify that a rebuilt valve functions as intended.","Correct. Reconditioned or replaced components get acceptance-level testing.","Wrong. Deferring to the next scheduled test leaves the rebuilt component unverified in the meantime.","Wrong. Comparing prior results is required in addition to testing (§4.6.4), not instead of it."]},{"deck":"testing","system":"General","frequency":"","drill":false,"question":"A technician finishes flowing an auxiliary drain and a test valve on a dry system. What does NFPA 25 require before he leaves the site?","options":["Nothing beyond documenting the test results in the inspection report","The components must be restored to full operational condition, including reinstallation of plugs and caps for auxiliary drains and test valves","The valves must be left open to allow residual water to drain over the following 24 hours","The system must be left tagged as impaired until the next scheduled inspection"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.6.3","explanation":"Restoring the system is part of the test, not an afterthought. Fire protection system components have to be brought back to full operational condition after testing, and the standard specifically names reinstalling plugs and caps on auxiliary drains and test valves — the exact items that get left off in the field and turn into an unnoticed open orifice.","optionNotes":["Wrong. Documentation is required, but it does not discharge the duty to restore the system.","Correct. Full restoration including plugs and caps on auxiliary drains and test valves is expressly required.","Wrong. Leaving drain valves open leaves the system compromised; the standard requires restoration.","Wrong. A completed test does not leave the system impaired; impairment tagging follows Chapter 15 when a system is actually out of service."]},{"deck":"general","system":"General","frequency":"Every 3 years","drill":true,"question":"A facility operates an approved performance-based compliance program for its sprinkler ITM. How often must the program's goals and goal achievement be reviewed?","options":["Annually","A minimum of every 3 years, with ITM frequencies adjusted to reflect current conditions and the historical record","Every 5 years","Only when the AHJ requests the historical record"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.7, §4.7.1, §4.7.2, §4.7.3, §4.7.4","explanation":"A performance-based program has to have clearly identifiable goals and define how it meets them, and compliance with an approved program counts as compliance with the standard. The tradeoff is a mandatory review: goals and goal achievement get reviewed at least every 3 years, with ITM frequencies adjusted to match current conditions and the historical record. That record must be available to the AHJ for review.","optionNotes":["Wrong. Annual is a real ITM frequency but not the review interval for performance-based program goals.","Correct. Minimum of every 3 years, with frequency adjustment based on conditions and history.","Wrong. Five years is a real NFPA 25 interval elsewhere but is not the performance-based review cycle.","Wrong. AHJ availability of the historical record (§4.7.4) is a separate requirement from the mandatory periodic review."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"A technician is preparing to test an electric controller for a motor-driven fire pump. Which safety provisions does NFPA 25 require at a minimum?","options":["Only the fire pump manufacturer's instructions","The provisions of NFPA 70E or an approved equivalent, along with legally required precautions","Only the facility's own written lockout program","No specific standard is referenced; general care is sufficient"],"correctIndex":1,"citation":"NFPA 25 (2020) §4.9.6.1, §4.9.6.2, §4.9.1","explanation":"ITM activities generally are conducted per applicable safety regulations. For electrical work specifically, legally required precautions apply when testing or maintaining electric controllers for motor-driven fire pumps, and the standard sets a floor: at a minimum, NFPA 70E or an approved equivalent is applied.","optionNotes":["Wrong. Manufacturer's instructions govern ITM procedures (§4.1.1.1) but are not the electrical safety benchmark.","Correct. NFPA 70E or an approved equivalent is the stated minimum for this work.","Wrong. A facility program may be part of compliance, but the standard names NFPA 70E or an approved equivalent as the minimum.","Wrong. The standard does reference a specific electrical safety benchmark."]},{"deck":"general","system":"General","frequency":"","drill":false,"question":"A crew is scheduled to inspect the interior of a 300,000-gallon ground storage tank and a below-grade valve pit. Which requirements does NFPA 25 place on the property owner or designated representative regarding site hazards?","options":["The owner must advise anyone performing ITM about hazardous materials stored on the premises, and legally required confined space, fall protection, and drowning precautions apply","The owner has no safety obligations; site safety is entirely the contractor's responsibility","The owner must perform the confined space entry personally","The owner must obtain an AHJ permit before any tank or valve pit entry"],"correctIndex":0,"citation":"NFPA 25 (2020) §4.9.2, §4.9.3, §4.9.4, §4.9.5.1, §4.9.5.2","explanation":"Chapter 4's safety section covers several fronts: legally required precautions before entering confined spaces such as tanks, valve pits, or trenches; legally required fall protection equipment; precautions against hazards such as drowning when working on top of a filled embankment or supported rubberized fabric tank or over open water; legally required equipment where hazardous materials are present; and a specific owner duty to advise anyone performing ITM about hazardous materials stored on site.","optionNotes":["Correct. The owner's hazardous-materials advisory duty plus the confined space, fall protection, and drowning precautions all apply to this scenario.","Wrong. The standard places an explicit advisory duty on the property owner or designated representative.","Wrong. The standard does not require the owner to perform entries personally; it requires precautions and disclosure.","Wrong. Permits may be required by other regulations, but this section does not condition entry on AHJ permitting."]},{"deck":"inspection","system":"Sprinkler","frequency":"Annually","drill":true,"question":"How does NFPA 25 require sprinklers themselves to be inspected in a normally occupied, accessible area?","options":["Annually, viewed from the floor level","Quarterly, viewed from the floor level","Annually, with each sprinkler examined close-up from a lift","Semiannually, viewed from the floor level"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.1.1 and Table 5.1.1.2","explanation":"The routine sprinkler inspection is an annual visual check made from the floor. Close-up access is not required for the routine inspection — the inspector is looking for obvious defects visible from below.","optionNotes":["Correct — annual, from floor level.","Quarterly is the inspection interval for waterflow alarm and supervisory signal initiating devices, not for sprinklers.","The standard deliberately allows the annual sprinkler inspection to be made from the floor; requiring close-up examination of every sprinkler is beyond what is required.","Semiannual is the test interval for vane-type and pressure switch-type waterflow alarm devices, not the sprinkler inspection interval."]},{"deck":"inspection","system":"Sprinkler","frequency":"","drill":false,"question":"On an annual inspection you find several sprinklers in a warehouse that the tenant's painters oversprayed white. The paint was not applied by the sprinkler manufacturer. What does NFPA 25 require?","options":["The sprinklers shall be replaced","The paint shall be carefully removed and the sprinklers left in service","The condition shall be documented and re-evaluated at the next annual inspection","The sprinklers shall be replaced only if paint covers the deflector"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.1.1.1(6)","explanation":"Paint applied by anyone other than the sprinkler manufacturer is one of the listed conditions that requires replacement. Field-applied paint can insulate the thermal element and delay or prevent operation.","optionNotes":["Correct — field-applied paint is a replace condition.","Cleaning a sprinkler in the field is not an approved remedy; the standard does not permit restoring a painted sprinkler by removing the paint.","Deferring is not permitted — the listed conditions in §5.2.1.1.1 call for replacement, not monitoring.","The standard makes no distinction based on which part of the sprinkler is painted; any non-manufacturer paint triggers replacement."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"During an inspection you find a pendent sprinkler that was installed upright on a branch line where the design called for pendent. What does NFPA 25 allow?","options":["Correct the orientation by repositioning the branch line, drop, or sprig, or replace the sprinkler","Leave it in place as long as the deflector is below the ceiling","Swap it for a sprinkler listed for either upright or pendent installation","Nothing — installation orientation is a design issue outside the scope of NFPA 25"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.1.1.2","explanation":"A sprinkler installed in the wrong orientation must be corrected. The standard gives two acceptable routes: physically reposition the piping (branch line, drop, or sprig) so the sprinkler sits correctly, or replace the sprinkler.","optionNotes":["Correct — reposition the piping or replace the sprinkler.","Deflector position alone does not satisfy the requirement; the sprinkler must be in its listed orientation.","The standard does not offer a dual-orientation swap as the remedy for this condition; it specifies repositioning or replacement.","NFPA 25 explicitly addresses incorrect orientation found during inspection, so it is squarely within scope."]},{"deck":"inspection","system":"Sprinkler","frequency":"","drill":false,"question":"What does NFPA 25 require for sprinklers installed in concealed spaces such as above a suspended ceiling?","options":["They are not required to be inspected","They shall be inspected annually through access panels","They shall be inspected every 5 years","They shall be inspected during each scheduled shutdown"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.1.1.3","explanation":"Sprinklers hidden in concealed spaces are exempted from the routine inspection because they are not exposed to the damage, loading, and painting that the inspection is looking for, and access would be disproportionate.","optionNotes":["Correct — concealed-space sprinklers are exempt from inspection.","There is no annual access-panel inspection requirement for concealed-space sprinklers.","Five years is the sampling test interval for extra-high-temperature solder-type sprinklers and harsh-environment sprinklers, not an inspection interval for concealed spaces.","Inspection during each scheduled shutdown applies to sprinklers inaccessible for safety reasons due to process operations (§5.2.1.1.4), not to concealed spaces."]},{"deck":"inspection","system":"Sprinkler","frequency":"","drill":false,"question":"A section of sprinklers in a chemical plant cannot be safely accessed while the process is running. How does NFPA 25 handle their inspection?","options":["They shall be inspected during each scheduled shutdown","They are permanently exempt from inspection","They shall be inspected annually regardless, with the process shut down for the purpose","They shall be inspected quarterly from the nearest safe vantage point"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.1.1.4","explanation":"Where process operations make an area unsafe to enter, the standard ties the inspection to the plant's own scheduled shutdowns rather than forcing an arbitrary calendar interval or unsafe access.","optionNotes":["Correct — inspect during each scheduled shutdown.","The exemption is not permanent; it defers the inspection to shutdowns.","NFPA 25 does not require the owner to shut a process down purely to make the annual date.","There is no quarterly vantage-point inspection for this condition."]},{"deck":"inspection","system":"Sprinkler","frequency":"","drill":false,"question":"During an annual inspection you find a recessed pendent sprinkler whose escutcheon is missing. The listed escutcheon for that sprinkler is still available from the manufacturer. What is required?","options":["Replace the missing escutcheon with the escutcheon listed for that sprinkler","No action — escutcheons are decorative trim only","Replace the sprinkler itself","Record it as a deficiency but take no corrective action, since the sprinkler still operates"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.1.1.5","explanation":"For recessed, flush, and concealed sprinklers the escutcheon or coverplate is part of the listed assembly and affects how heat reaches the element and how the sprinkler seats in the ceiling. A missing one must be replaced with the listed component.","optionNotes":["Correct — install the listed escutcheon or coverplate.","On recessed, flush, and concealed sprinklers the escutcheon is part of the listed assembly, not trim.","Replacing the sprinkler is required only where the listed escutcheon or coverplate is no longer commercially available (§5.2.1.1.5.1).","Documenting without correcting does not meet the requirement; the standard says the escutcheon shall be replaced."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"A listed concealed sprinkler is missing its coverplate, and the manufacturer has discontinued that coverplate — it is no longer commercially available. What does NFPA 25 require?","options":["The sprinkler shall be replaced","A coverplate from any listed concealed sprinkler assembly shall be substituted","The opening shall be closed with a field-fabricated plate of matching thickness","The sprinkler shall be left as is and noted on the report"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.1.1.5.1","explanation":"The sprinkler and its coverplate are listed together as an assembly. If the matching listed component cannot be obtained, the assembly cannot be restored, so the whole sprinkler is replaced.","optionNotes":["Correct — replace the sprinkler when the listed coverplate is unavailable.","Mixing components across assemblies breaks the listing; the standard's remedy is sprinkler replacement.","Field fabrication is not permitted — the assembly is listed as manufactured.","Leaving the assembly incomplete does not satisfy §5.2.1.1.5.1."]},{"deck":"inspection","system":"Sprinkler","frequency":"","drill":false,"question":"A standard pendent sprinkler on a drop — not recessed, flush, or concealed — is missing its escutcheon. What does NFPA 25 require?","options":["Replacement of the escutcheon is not required","The escutcheon shall be replaced with a listed escutcheon","The sprinkler shall be replaced","The ceiling opening shall be sealed within 24 hours"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.1.1.6","explanation":"This is the exception people miss. For ordinary pendent sprinklers that are not recessed, flush, or concealed, the escutcheon is not part of the listed operating assembly, so a missing one does not have to be replaced.","optionNotes":["Correct — no replacement required for non-recessed, non-flush, non-concealed pendent sprinklers.","Mandatory escutcheon replacement applies to recessed, flush, and concealed sprinklers (§5.2.1.1.5).","Sprinkler replacement applies where a listed escutcheon or coverplate from a listed assembly is unavailable (§5.2.1.1.5.1).","NFPA 25 sets no such sealing deadline for this condition."]},{"deck":"inspection","system":"Sprinkler","frequency":"","drill":false,"question":"Absent any greater or lesser requirement from another provision, what minimum clearance must be maintained between a sprinkler deflector and the top of storage?","options":["18 in. (457 mm)","36 in. (914 mm)","24 in. (610 mm)","12 in. (305 mm)"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.1.2.1","explanation":"The baseline clearance below sprinkler deflectors is 18 in. This keeps the discharge pattern from being blocked immediately at the sprinkler.","optionNotes":["Correct — 18 in. (457 mm) is the general minimum.","36 in. is the greater clearance required for special sprinklers (§5.2.1.2.3) and for rubber tire storage (§5.2.1.2.4).","24 in. is not a clearance value used in §5.2.1.2.","12 in. is below the required baseline; lesser clearance is only allowed where the installation standard specifically permits it (§5.2.1.2.6)."]},{"deck":"inspection","system":"Sprinkler","frequency":"","drill":false,"question":"A storage area is protected by special sprinklers. What minimum clearance is required between the deflectors and the top of storage?","options":["36 in. (914 mm)","18 in. (457 mm)","24 in. (610 mm)","48 in. (1219 mm)"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.1.2.3","explanation":"Special sprinklers get a larger clearance than the general rule because their listed discharge patterns need more room to develop below the deflector.","optionNotes":["Correct — 36 in. (914 mm) for special sprinklers.","18 in. is the general minimum that applies unless a greater distance is required (§5.2.1.2.1).","24 in. is not a value used in §5.2.1.2.","48 in. is not a clearance specified in this section."]},{"deck":"inspection","system":"Sprinkler","frequency":"","drill":false,"question":"You are inspecting a warehouse storing rubber tires. What is the minimum clearance required from the top of storage to the sprinkler deflectors?","options":["36 in. (914 mm)","18 in. (457 mm)","30 in. (762 mm)","No specific clearance — rubber tire storage is governed only by in-rack criteria"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.1.2.4","explanation":"Rubber tire storage is one of the commodities that gets the enlarged 36 in. clearance rather than the 18 in. general rule.","optionNotes":["Correct — 36 in. (914 mm) where rubber tires are stored.","18 in. is the general baseline and is not sufficient for rubber tire storage.","30 in. is not a value used in §5.2.1.2.","§5.2.1.2.4 sets an explicit clearance for rubber tire storage."]},{"deck":"inspection","system":"Sprinkler","frequency":"","drill":false,"question":"Which statement about in-rack sprinklers is correct under NFPA 25 Chapter 5?","options":["They are not required to meet the obstruction criteria or the clearance-from-storage requirements","They must meet the same 18 in. clearance as ceiling sprinklers","They must meet the 36 in. clearance required for special sprinklers","They are exempt from the clearance rules only where the racks are open-frame"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.1.2.5","explanation":"In-rack sprinklers sit inside the storage array by design, so applying the clearance-to-storage and obstruction criteria written for ceiling sprinklers would be meaningless. The standard exempts them.","optionNotes":["Correct — in-rack sprinklers are exempt from both the obstruction criteria and the storage clearance requirements.","The 18 in. rule is the general ceiling-sprinkler baseline (§5.2.1.2.1); in-rack sprinklers are exempted from it.","36 in. applies to special sprinklers and rubber tire storage at the ceiling, not to in-rack sprinklers.","The exemption in §5.2.1.2.5 is not conditioned on rack construction type."]},{"deck":"inspection","system":"Sprinkler","frequency":"Annually","drill":false,"question":"The annual inspection of the spare sprinkler supply must verify which set of items?","options":["Correct number and type of spare sprinklers, a sprinkler wrench for each type, and the posted list of spare sprinklers","Correct number of spares and the cabinet's lock condition only","Spare sprinkler count, manufacture dates, and hydrostatic test records","Spare sprinkler count and the freeze point of any antifreeze in the system"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.1.4 and Table 5.1.1.2","explanation":"The annual spare-sprinkler inspection is a three-part check: the right quantity and types are on hand, the correct wrench exists for every sprinkler type, and the list of sprinklers is posted.","optionNotes":["Correct — number and type, wrench per type, and the list.","A lock check is not one of the three specified items, and it omits the wrench and list requirements.","Manufacture dates and hydrostatic test records are not part of the spare sprinkler inspection.","Antifreeze freeze point is checked under the annual antifreeze test (§5.3.4), not the spare sprinkler inspection."]},{"deck":"inspection","system":"Sprinkler","frequency":"Annually","drill":true,"question":"What is the required routine inspection for sprinkler pipe and fittings in an accessible, exposed area?","options":["Annually from the floor level","Quarterly from the floor level","Annually with close-up access to each fitting","Every 5 years from the floor level"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.2 and Table 5.1.1.2","explanation":"Pipe and fittings get the same treatment as sprinklers — an annual visual check made from floor level, looking for mechanical damage, leakage, and corrosion.","optionNotes":["Correct — annual, from the floor.","Quarterly applies to waterflow alarm and supervisory signal initiating device inspection, not pipe and fittings.","The standard specifically allows the pipe and fittings inspection to be made from floor level.","Five years is a sprinkler sampling test interval, not a pipe inspection interval."]},{"deck":"inspection","system":"Sprinkler","frequency":"","drill":false,"question":"During an inspection you find that an electrician has hung several runs of conduit from the sprinkler branch lines. What does NFPA 25 say about this?","options":["Nothing may be rested on or suspended from sprinkler piping — it is not permitted to carry outside loads","It is acceptable if the branch line is 2 in. or larger","It is acceptable if additional hangers were added at the load points","It is acceptable provided the conduit weighs less than the water-filled pipe"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.2.2","explanation":"Sprinkler pipe is hung and braced to carry its own weight plus water and nothing else. Conduit, cable tray, ductwork, or anything else laid on it or slung from it changes the load path and can pull hangers out or overstress fittings, so NFPA 25 (2020) §5.2.2.2 treats any such foreign load as a deficiency.","optionNotes":["Correct — sprinkler pipe may not carry outside loads, whether they sit on top of it or hang beneath it.","Pipe size does not create an exception in §5.2.2.2.","Adding hangers is not an exception the standard grants; the prohibition on outside loads is unqualified.","There is no weight-comparison allowance in the standard."]},{"deck":"inspection","system":"Sprinkler","frequency":"Annually","drill":true,"question":"What is the required inspection for sprinkler pipe hangers, braces, and supports in an accessible area?","options":["Annually from the floor level","Quarterly from the floor level","Semiannually from the floor level","Every 5 years, with physical load testing"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.3 and Table 5.1.1.2","explanation":"Hangers, braces, and supports are inspected annually from the floor, looking for damage and for components that are loose or have come unattached.","optionNotes":["Correct — annually, from floor level.","Quarterly is the waterflow alarm and supervisory signal device inspection interval.","Semiannual is the vane-type and pressure switch-type waterflow alarm device test interval.","NFPA 25 does not require physical load testing of hangers in Chapter 5."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"You find a sprinkler pipe hanger that has come loose from the structure. What does NFPA 25 require?","options":["It shall be replaced or refastened","It shall be replaced — refastening is not permitted","It shall be documented and corrected within the next inspection cycle","No action is required unless the pipe has visibly sagged"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.3.2","explanation":"Hangers, braces, and supports that are damaged, loose, or unattached must be put back into service either by replacing the component or by refastening it. The standard gives both options.","optionNotes":["Correct — replace or refasten.","Refastening is expressly permitted alongside replacement.","Deferring correction to a future cycle is not what the standard requires.","Pipe sag is not the trigger; damaged, loose, or unattached is the trigger."]},{"deck":"inspection","system":"Sprinkler","frequency":"Quarterly","drill":true,"question":"How often must waterflow alarm and supervisory signal initiating devices be inspected to verify they are free of physical damage?","options":["Quarterly","Annually","Semiannually","Monthly"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.4 and Table 5.1.1.2","explanation":"This is a visual inspection only — you are looking for physical damage to the device, not operating it. It happens four times a year.","optionNotes":["Correct — quarterly inspection for physical damage.","Annual is the inspection interval for sprinklers, pipe and fittings, hangers, and signs.","Semiannual is the test interval for vane-type and pressure switch-type waterflow alarm devices, not the inspection interval for the device's physical condition.","Monthly is not an interval used for this device in Chapter 5."]},{"deck":"inspection","system":"Sprinkler","frequency":"Annually","drill":false,"question":"During an annual inspection you find the hydraulic design information sign at the riser is faded to the point of being unreadable. What does NFPA 25 require?","options":["The sign shall be replaced","The sign shall be traced over with permanent marker to restore legibility","The sign shall be replaced only if the system has been modified since installation","No action — the information is available in the as-built drawings"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.5 and §5.2.5.1","explanation":"The annual inspection verifies the hydraulic design information sign is provided, securely attached to the riser, and legible. A sign that is missing or illegible must be replaced — the whole point is that the design basis is readable at the riser.","optionNotes":["Correct — a missing or illegible sign is replaced.","Field-restoring a sign is not the remedy the standard specifies.","Replacement is required whenever the sign is missing or illegible, regardless of whether the system was modified.","The standard requires the sign itself to be legible at the riser; drawings do not substitute."]},{"deck":"inspection","system":"Sprinkler","frequency":"Per manufacturer's requirements","drill":true,"question":"How often is heat tracing on a sprinkler system required to be inspected under NFPA 25?","options":["Per the manufacturer's requirements","Annually","Quarterly","Semiannually"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.6 and Table 5.1.1.2","explanation":"Heat tracing is one of the few items where NFPA 25 sets no calendar interval of its own — it defers entirely to the manufacturer's inspection and maintenance requirements.","optionNotes":["Correct — the manufacturer's requirements govern both inspection and maintenance of heat tracing.","Annual is the interval for signs, sprinklers, pipe and fittings, and hangers — not heat tracing.","Quarterly applies to waterflow alarm and supervisory signal device inspection.","Semiannual applies to vane-type and pressure switch-type waterflow alarm device testing."]},{"deck":"inspection","system":"Sprinkler","frequency":"Annually","drill":true,"question":"How often must the antifreeze information sign be inspected, and what is being verified?","options":["Annually, to verify it is present, securely attached, and legible","Quarterly, to verify the antifreeze concentration written on it","Annually, to verify the freeze point matches the last test result","Only when the antifreeze solution is changed"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.2.9","explanation":"Like the other required signs, the antifreeze information sign gets an annual check for three things: it exists, it is fastened down, and you can read it. Verifying the solution itself is a separate testing requirement.","optionNotes":["Correct — annual check for presence, secure attachment, and legibility.","The inspection is annual, and the sign inspection verifies the sign's condition, not the solution's chemistry.","Verifying the actual freeze point is part of the annual antifreeze test under §5.3.4, not the sign inspection.","The sign inspection is on an annual cycle, not event-driven."]},{"deck":"testing","system":"Sprinkler","frequency":"At 50 years and every 10 years thereafter","drill":true,"question":"A building's sprinklers have been in place for 50 years. What does NFPA 25 require, and how often thereafter?","options":["Replace them, or test representative samples — and repeat the test procedure at 10-year intervals","Replace them all immediately; sample testing is not permitted at 50 years","Test representative samples and repeat at 5-year intervals","Test representative samples and repeat at 20-year intervals"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.1.1.1 and §5.3.1.1.1.1","explanation":"At the 50-year mark the owner has a choice: wholesale replacement, or submit representative samples from one or more sample areas to a recognized testing laboratory. If sampling is chosen, that testing repeats every 10 years.","optionNotes":["Correct — replace or sample-test at 50 years, then retest every 10 years.","Sample testing is expressly offered as an alternative to replacement at 50 years.","Five-year retesting applies after the 75-year mark (§5.3.1.1.1.5), and to extra-high-temperature solder-type and harsh-environment sprinklers.","Twenty years is the trigger age for fast-response sprinklers (§5.3.1.1.1.3), not a retest interval."]},{"deck":"maintenance","system":"Sprinkler","frequency":"","drill":false,"question":"You identify sprinklers in an old mill that were manufactured in 1917. What does NFPA 25 require?","options":["They shall be replaced","They shall be sample tested at 10-year intervals","They shall be sample tested at 5-year intervals","They may remain in service if a representative sample passes a laboratory test"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.1.1.1.2","explanation":"Sprinklers manufactured before 1920 get no sampling option at all — they are simply replaced. This is one of the few absolute replacement mandates in the chapter.","optionNotes":["Correct — pre-1920 sprinklers are replaced outright.","Ten-year retesting is the follow-on interval for the 50-year sampling program, and for fast-response and dry sprinkler sampling programs — not an option for pre-1920 sprinklers.","Five-year retesting applies to 75-year-old sprinklers, extra-high-temperature solder types, and harsh-environment sprinklers.","There is no test-and-keep pathway for sprinklers manufactured prior to 1920."]},{"deck":"testing","system":"Sprinkler","frequency":"At 20 years and every 10 years thereafter","drill":true,"question":"Sprinklers manufactured using fast-response elements have been installed for 20 years. What does NFPA 25 require?","options":["Replace them, or test representative samples and retest at 10-year intervals","Replace them, or test representative samples and retest at 5-year intervals","No action until they reach 50 years in service","Replace them outright — sampling is not permitted for fast-response elements"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.1.1.1.3","explanation":"Fast-response elements get tested much earlier than standard-response sprinklers — the clock starts at 20 years, then repeats every 10 years if sampling is chosen instead of replacement.","optionNotes":["Correct — 20 years, then every 10 years.","The retest interval for fast-response sampling is 10 years, not 5. Five-year retesting applies to 75-year sprinklers, extra-high-temperature solder types, and harsh environments.","Fifty years is the general sprinkler trigger; fast-response elements are pulled forward to 20 years.","Representative sample testing is expressly offered as an alternative to replacement."]},{"deck":"testing","system":"Sprinkler","frequency":"Every 5 years","drill":true,"question":"Solder-type sprinklers with a temperature classification of extra high [325°F (163°C)] or greater are exposed to semicontinuous to continuous maximum allowable ambient temperature. How often must representative samples be tested?","options":["Every 5 years","Every 10 years","Every 20 years","At 50 years, then every 10 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.1.1.1.4","explanation":"Solder links held near their maximum allowable ambient temperature for long stretches can creep and lose reliability, so this population is sampled on a much tighter 5-year cycle. Note both conditions must be present: extra high or greater classification AND sustained high ambient exposure.","optionNotes":["Correct — 5-year sampling intervals.","Ten years is the follow-on retest interval for the 50-year, 20-year fast-response, and 15-year dry sprinkler sampling programs.","Twenty years is the trigger age for fast-response elements, not a retest interval here.","The 50-year/10-year schedule is the general sprinkler rule; this high-temperature solder population is pulled onto a 5-year cycle."]},{"deck":"testing","system":"Sprinkler","frequency":"At 75 years and every 5 years thereafter","drill":true,"question":"Sprinklers in a historic building have been installed for 75 years. If the owner chooses sample testing rather than replacement, how often must the testing be repeated?","options":["Every 5 years","Every 10 years","Every 15 years","Every 20 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.1.1.1.5","explanation":"The retest interval tightens as sprinklers age. Up to 75 years the sampling repeats every 10 years; once they pass 75 years in service, the cycle shortens to every 5 years.","optionNotes":["Correct — after 75 years, retesting is on a 5-year cycle.","Ten years is the retest interval for the 50-year program — it shortens to 5 years at 75 years.","Fifteen years is the trigger age for dry sprinklers, not a retest interval.","Twenty years is the trigger age for fast-response sprinklers, not a retest interval."]},{"deck":"testing","system":"Sprinkler","frequency":"At 15 years and every 10 years thereafter","drill":true,"question":"Dry sprinklers protecting a loading dock have been installed for 15 years. What does NFPA 25 require?","options":["Replace them, or test representative samples and retest at 10-year intervals","Replace them, or test representative samples and retest at 5-year intervals","No action until 20 years in service","Replace them outright — dry sprinklers cannot be sample tested"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.1.1.1.6","explanation":"Dry sprinklers have the earliest age trigger of any sprinkler type in Chapter 5 — 15 years — because the seal and internal assembly are exposed to conditions that standard sprinklers are not. After that, sampling repeats every 10 years.","optionNotes":["Correct — 15 years, then every 10 years.","Five-year retesting belongs to the 75-year, extra-high-temperature solder-type, and harsh-environment categories.","Twenty years is the fast-response element trigger; dry sprinklers are triggered earlier, at 15 years.","Sample testing is expressly permitted as the alternative to replacement."]},{"deck":"testing","system":"Sprinkler","frequency":"Every 5 years","drill":false,"question":"Standard (not listed corrosion-resistant) sprinklers are installed in a corrosive atmosphere. What are the owner's options under NFPA 25?","options":["Replace them, or test representative samples on a 5-year basis","Replace them, or test representative samples on a 10-year basis","Inspect them quarterly and test only if corrosion is visible","Replace them — sampling is not permitted in harsh environments"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.1.1.2","explanation":"Harsh environments, including corrosive atmospheres, accelerate degradation. The standard gives two acceptable paths: replacement, or representative sample testing on a 5-year cycle.","optionNotes":["Correct — replace, or sample test every 5 years.","The 10-year basis is the relief given to listed corrosion-resistant sprinklers installed in harsh environments (§5.3.1.1.3), not to ordinary sprinklers.","Visible corrosion is a replacement condition under the inspection requirements, but it does not replace the required 5-year sampling program.","Sample testing on a 5-year basis is one of the two permitted options."]},{"deck":"testing","system":"Sprinkler","frequency":"Every 10 years","drill":true,"question":"Listed corrosion-resistant sprinklers are installed in a harsh environment. What sampling interval does NFPA 25 permit?","options":["A 10-year basis","A 5-year basis","A 20-year basis","The same annual interval as the visual inspection"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.1.1.3","explanation":"This is the payoff for specifying the right sprinkler. Because listed corrosion-resistant sprinklers are built for the exposure, the standard permits doubling the sampling interval from 5 years to 10 years.","optionNotes":["Correct — 10-year basis for listed corrosion-resistant sprinklers in harsh environments.","Five years is the interval for ordinary sprinklers in harsh environments (§5.3.1.1.2); the listed corrosion-resistant relief extends it to 10.","Twenty years is not a sampling interval in this section.","Annual is a visual inspection interval, not a laboratory sampling interval."]},{"deck":"testing","system":"Sprinkler","frequency":"","drill":false,"question":"A sample area contains 900 sprinklers due for field service testing. What is the minimum representative sample that must be submitted?","options":["9 sprinklers","4 sprinklers","1 sprinkler","18 sprinklers"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.1.2","explanation":"The rule is the greater of four sprinklers or 1 percent of the sprinklers in that individual sample. One percent of 900 is 9, which is greater than 4, so 9 sprinklers must be submitted.","optionNotes":["Correct — 1 percent of 900 is 9, which exceeds the four-sprinkler floor.","Four is the absolute minimum floor; it applies only when 1 percent works out to fewer than four (i.e., fewer than 400 sprinklers in the sample).","One sprinkler never satisfies the requirement — the floor is four.","Eighteen would be 2 percent; the standard requires 1 percent."]},{"deck":"testing","system":"Sprinkler","frequency":"","drill":false,"question":"A representative sample of 6 sprinklers is submitted for field service testing and one of the six fails. What does NFPA 25 require?","options":["All sprinklers within the area represented by that sample shall be replaced","Only the failed sprinkler's immediate branch line shall be replaced","A second, larger sample shall be pulled and tested before any replacement","The sample shall be re-tested by a second laboratory before action is taken"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.1.3","explanation":"The sample stands in for the whole population it was drawn from. A single failure invalidates the population, so every sprinkler in the area that sample represented gets replaced.","optionNotes":["Correct — the entire represented area is replaced on a single failure.","The failure condemns the whole represented area, not just one branch line.","The standard does not offer a second-sample appeal; one failure triggers replacement.","There is no second-laboratory retest provision in §5.3.1.3."]},{"deck":"testing","system":"Sprinkler","frequency":"Quarterly","drill":true,"question":"How often must mechanical waterflow alarm devices, such as water motor gongs, be tested?","options":["Quarterly","Semiannually","Annually","Monthly"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.3.1 and Table 5.1.1.2","explanation":"Mechanical waterflow alarm devices — the water motor gong being the classic example — are tested four times a year. This is the tighter of the two waterflow alarm test intervals in Chapter 5.","optionNotes":["Correct — mechanical devices are tested quarterly.","Semiannual is the test interval for vane-type and pressure switch-type waterflow alarm devices (§5.3.3.2).","Annual is an inspection interval for sprinklers, pipe, hangers, and signs — not the mechanical waterflow alarm test.","Monthly is not used for waterflow alarm testing in Chapter 5."]},{"deck":"testing","system":"Sprinkler","frequency":"Semiannually","drill":true,"question":"How often must vane-type and pressure switch-type waterflow alarm devices be tested?","options":["Semiannually","Quarterly","Annually","Every 3 years"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.3.2 and Table 5.1.1.2","explanation":"Electric waterflow devices — vane type and pressure switch type — are tested twice a year, half as often as mechanical water motor gongs.","optionNotes":["Correct — semiannually for vane-type and pressure switch-type devices.","Quarterly is the interval for mechanical waterflow alarm devices including water motor gongs (§5.3.3.1), and for the visual inspection of waterflow devices (§5.2.4).","Annual is not a waterflow alarm device test interval in Chapter 5.","Three years is the minimum frequency for opening the inspector's test connection on vane-type devices that are otherwise tested with circulated water or an integral automated test feature (§5.3.3.4.2)."]},{"deck":"testing","system":"Sprinkler","frequency":"","drill":false,"question":"You are scheduled to test a pressure switch-type waterflow alarm on a wet pipe system, but the inspector's test connection discharges outdoors and it is 5°F. What does NFPA 25 permit?","options":["The bypass connection is permitted to be used","The test must be postponed until the weather allows use of the inspector's test connection","The main drain may be substituted for the inspector's test connection","The test may be waived and documented as weather-restricted"],"correctIndex":0,"citation":"NFPA 25 (2020) §5.3.3.3 and §5.3.3.3.1","explanation":"The default method is opening the inspector's test connection. Where freezing weather or other circumstances prohibit its use, the standard specifically allows the bypass connection instead so the alarm still gets verified.","optionNotes":["Correct — the bypass connection is permitted where freezing weather or other circumstances prohibit using the inspector's test connection.","Postponing is unnecessar

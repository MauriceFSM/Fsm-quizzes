<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Storage Procedure · FSM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1524;--panel:#122032;--panel2:#18293f;--line:#24384f;--orange:#F5821F;--gold:#F5B301;--teal:#17C3B2;--ink:#FFFFFF;--muted:#93A4BC;--green:#1D9E75;--red:#E23A1E}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 64px}
header > div{min-width:0}
header{display:flex;align-items:center;gap:12px;padding:8px 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
header img{width:40px;height:40px}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.06em;color:var(--orange);font-size:14px;text-transform:uppercase}
h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;overflow-wrap:anywhere;line-height:1.05;margin:2px 0 0}
h2{font-family:'Barlow Condensed',sans-serif;font-size:24px;margin:4px 0 12px}
h3{font-family:'Barlow Condensed',sans-serif;font-size:17px;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;margin:24px 0 8px}
p{line-height:1.55}
.muted{color:var(--muted);font-size:14px}
button{font:inherit;cursor:pointer}
.tabs{display:flex;gap:8px;margin:0 0 16px}
.tab{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700}
.tab.on{background:var(--orange);border-color:var(--orange);color:#111}
.ep{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;margin:0 0 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.ep .num{flex:none;width:44px;height:44px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--orange)}
.ep > span:last-child{min-width:0}
.ep .t{font-weight:700;font-size:16px}
.ep .meta{color:var(--muted);font-size:13px;margin-top:3px}
.back{background:none;border:0;color:var(--teal);padding:8px 0;font-weight:700}
.player{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 8px}
audio{width:100%}
.speeds{display:flex;gap:8px;margin-top:10px}
.speeds button{flex:1;padding:10px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:700}
.speeds button.on{border-color:var(--teal);color:var(--teal)}
.ctl{display:flex;align-items:center;justify-content:center;gap:22px;margin:4px 0 14px}
.ctl .big{width:96px;height:96px;border-radius:50%;border:0;background:var(--orange);color:#111;font-size:40px;line-height:1;display:grid;place-items:center}
.ctl .skip{width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:800;font-size:15px;line-height:1.1}
.printlink{display:block;text-align:center;margin:10px 0 0;color:var(--teal);font-weight:700}
.noaudio{color:var(--muted);font-size:14px;padding:6px 0}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.badge{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;margin-bottom:8px}
.badge.find{background:rgba(245,130,31,.15);color:var(--orange)}
.badge.say{background:rgba(23,195,178,.15);color:var(--teal)}
.q .text{font-weight:600;line-height:1.5}
.reveal{width:100%;margin-top:12px;padding:12px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--muted);font-weight:700}
.ans{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.q.open .ans{display:block}
.q.open .reveal{display:none}
.f{margin:0 0 10px;line-height:1.55;font-size:15px}
.f b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold)}
.f.answer b{color:var(--green)}
.f.answer{font-weight:700;font-size:16px}
.f.wrong b{color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:220px}
.card .lbl{font-family:'Barlow Condensed',sans-serif;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.card .cq{font-size:18px;font-weight:700;line-height:1.45;margin:8px 0 0}
.card .ca{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:12px;line-height:1.55}
.card.open .ca{display:block}
.card .src{color:var(--muted);font-size:13px;margin-top:8px}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;padding:14px 0;border-radius:10px;border:0;font-weight:800;color:#111}
.b-show{background:var(--gold)}
.b-got{background:var(--green);color:#fff!important}
.b-miss{background:var(--red);color:#fff!important}
select{width:100%;padding:12px;border-radius:10px;background:var(--panel);color:var(--ink);border:1px solid var(--line);font:inherit;margin:0 0 12px}
.score{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:0 0 10px}
footer{margin-top:32px;color:var(--muted);font-size:12px;line-height:1.5;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>

<script>
const EPS = [{"n":1,"title":"The Route Map","mins":14,"audio":"audio/ep01.mp3","questions":[{"step":"Step zero. The high-piled gate.","kind":"say","q":"A Class Three commodity, stored ten feet high. Under the 2022 edition, is it high-piled or low-piled, and where do you go next?","fields":[{"label":"The answer","text":"low-piled. You go to Chapter Four, the low-piled section."},{"label":"Where it lives","text":"the high-piled definition sets the line, and the low-piled section in Chapter Four protects it."},{"label":"Why","text":"Class One through Class Four is high-piled only at more than twelve feet. Ten is not more than twelve."},{"label":"If you said high-piled","text":"you used the five-foot line. That line is only for Group A plastics. A Class One through Four commodity still uses twelve."}]},{"step":"Step two. Chapter Twenty, General Requirements for Storage.","kind":"find","q":"A customer adds a building of baled cotton. Which section in Chapter Twenty covers baled cotton, and where does it send you for protection?","fields":[{"label":"The answer","text":"section twenty point four point eleven point one, the baled cotton section. It sends you to Chapter Twenty-Six, section twenty-six point five."},{"label":"The path","text":"Chapter Twenty, Commodity Classes, page thirteen, one eighty-three. Look in the right column."},{"label":"Why that path","text":"baled cotton is a special commodity, and special commodities are classified in twenty point four, Commodity Classes. The section number tells you what it is. The section it points to tells you where it's protected."},{"label":"If you said twenty point four point eleven","text":"you stopped one level too high. Twenty point four point eleven is Display and Storage of Up to Group A Plastics, and it sends you to twenty-six point three. Baled cotton is its point one."}]},{"step":"Step two. Chapter Twenty, General Requirements for Storage.","kind":"say","q":"Name the three things you write down before you leave Chapter Twenty.","fields":[{"label":"The answer","text":"the commodity class, the storage arrangement, and the storage height."},{"label":"Where it lives","text":"Chapter Twenty. Commodity classes at twenty point four, storage arrangement at twenty point five, heights at twenty point nine."},{"label":"Why","text":"those three are your keys for every table that comes after."},{"label":"If you said the sprinkler density","text":"Chapter Twenty doesn't give you the sprinkler density yet. That comes from the protection chapter you pick in step four."}]},{"step":"Step three. Screen the building.","kind":"say","q":"The roof slopes three inches in twelve. Which sprinkler technology does that take off the table, and which rule says so?","fields":[{"label":"The answer","text":"ESFR."},{"label":"Where it lives","text":"section fourteen point two point three, the ESFR slope limit. Two in twelve, maximum. The storage criteria in twenty point nine point one are written for that same two in twelve."},{"label":"Why","text":"three in twelve is steeper than two in twelve, and for ESFR that's a hard limit. And the other storage criteria are written for two in twelve too, so a steeper roof needs a section that specifically allows it."},{"label":"If you said you'd find out in Chapter Twenty-Three","text":"the slope limit is in Chapter Fourteen. That's why you screen the building before you open the protection chapter."}]},{"step":"Step four. Pick the protection chapter.","kind":"say","q":"You've picked your protection chapter, and its table doesn't cover your commodity, arrangement, and height. What are your two moves?","fields":[{"label":"The answer","text":"move to another chapter, or, if it's rack storage, add in-rack sprinklers under Chapter Twenty-Five."},{"label":"Where it lives","text":"Chapter Twenty-Five is In-Rack Sprinklers, for when the ceiling alone can't do the job."},{"label":"Why","text":"the table only covers what it lists. You design from inside a table, never past it."},{"label":"If you said use the closest row that doesn't quite cover you","text":"that's stretching the table, and you don't stretch it."}]},{"step":"Step five. Hose allowance and duration.","kind":"find","q":"Your warehouse is ESFR. Where do you find the hose stream allowance and the water supply duration?","fields":[{"label":"The answer","text":"Table twenty point fifteen point two point six, the hose table."},{"label":"The path","text":"Chapter Twenty, section twenty point fifteen, Hose Stream Allowance and Water Supply Duration. Page thirteen, one ninety. Find your commodity, then your sprinkler type, then the row for the number of sprinklers in your design. The table has rows for CMDA, CMSA, and ESFR."},{"label":"Why that path","text":"the words hose and duration send you to Chapter Twenty, section twenty point fifteen. The table has an ESFR row, so you read that one. If you went looking in Chapter Twenty-Three: that's where the ESFR sprinkler design is, but hose and duration come back to this one table in Chapter Twenty."}]}],"cards":[{"q":"Under NFPA 13 (2022), when does storage become high-piled?","a":"Class I–IV stored more than 12 ft high; Group A plastics stored more than 5 ft high.","src":"§3.3.100 (page not recorded)."},{"q":"Group A plastic stored 8 ft high. High-piled under 2019? Under 2022?","a":"2019 no (12 ft line for everything, §3.3.95). 2022 yes (over the 5 ft plastics line).","src":"2022 §3.3.100; 2019 §3.3.95."},{"q":"Where is baled cotton in Ch 20, and where is it protected?","a":"§20.4.11.1 → protected per §26.5. (§20.4.11 itself is Display/Storage of Up to Group A Plastics → §26.3.)","src":"2022 book p. 13-183."},{"q":"Tires and roll paper: classified where, designed where?","a":"Classified in Ch 20 (tires §20.4.9, roll paper §20.4.10). Design criteria sit in Ch 21, 22 and 23, one section each. Not Ch 26.","src":"2022 book p. 13-183 (classification); tires §21.7 / roll paper §21.8 p. 13-207, Table 22.6 p. 13-223, §23.5 / §23.6 p. 13-225."},{"q":"ESFR limits on system type and ceiling slope?","a":"Wet pipe only unless the specific sprinkler is listed for dry or preaction (§14.2.2); ceiling slope 2 in 12 maximum (§14.2.3).","src":"🟡 LiNK Q29, identical to 2019 §14.2.2 / §14.2.3 (no page recorded)."},{"q":"Which table gives hose stream allowance and water supply duration for storage?","a":"Table 20.15.2.6 (rows for CMDA, CMSA and ESFR).","src":"2022 book p. 13-190."}]},{"n":2,"title":"Classify the Commodity","mins":18,"audio":"audio/ep02.mp3","questions":[{"step":"Warm-up","kind":"say","q":"Group A plastic, stored eight feet high. Under the 2022 edition, is that high-piled storage?","fields":[{"label":"The answer","text":"yes. Eight is more than five."},{"label":"Where it lives","text":"Chapter Three, section three point three point one hundred, High-Piled Storage."},{"label":"Why","text":"2022 has two lines. More than twelve feet for Class One through Four. More than five feet for Group A plastics."},{"label":"If you said no","text":"you used the twelve-foot line, the 2019 rule for everything."}]},{"step":"Warm-up","kind":"say","q":"You need the hose stream allowance and the water supply duration for a storage design. Which table?","fields":[{"label":"The answer","text":"Table twenty point fifteen point two point six."},{"label":"Where it lives","text":"Chapter Twenty, page thirteen, one ninety. The last stop on the map."}]},{"step":"Warm-up","kind":"say","q":"Rubber tires in storage. Do their design criteria come from Chapter Twenty-Six?","fields":[{"label":"The answer","text":"no."},{"label":"Where it lives","text":"tires are classified in Chapter Twenty, section twenty point four point nine. Their design criteria sit inside Chapters Twenty-One, Twenty-Two, and Twenty-Three, one section each."},{"label":"If you said yes","text":"you lumped tires in with baled cotton. Of tires, roll paper, and baled cotton, only baled cotton goes to Twenty-Six."}]},{"step":"Step A. Find the plastic.","kind":"find","q":"A pallet load of products made of silicone rubber. What is it protected as?","fields":[{"label":"The answer","text":"Class Four."},{"label":"The path","text":"Chapter Twenty, section twenty point four point six, the Group B list, page thirteen, one eighty-three. Silicone rubber is on it. Then section twenty point four point eight point one, on the same page: Group B is protected the same as Class Four."},{"label":"Why that path","text":"the question named a material. A material name sends you to the plastics lists, not the class ladder. Find the group, then read the rule for that group."},{"label":"If you said Class Three","text":"you read it as Group C. Silicone rubber is on the Group B list, and Group B rides as Class Four."}]},{"step":"Step B. The Class One through Four ladder.","kind":"say","q":"A cartoned product that's ten percent nonexpanded Group A plastic by weight. What class is it?","fields":[{"label":"The answer","text":"Class Four."},{"label":"Where it lives","text":"section twenty point four point four, Class Four, page thirteen, one eighty-one."},{"label":"Why","text":"cartoned nonexpanded, more than five and up to fifteen percent by weight. The middle band is Class Four."},{"label":"If you said Class Three","text":"Class Three allows only five percent or less. If you said Group A nonexpanded: cartoned needs more than fifteen."}]},{"step":"Step C. Group A: cartoned or exposed, expanded or nonexpanded.","kind":"find","q":"An exposed product, no carton. Its only plastic is expanded Group A, at twenty percent by volume. Is it Class Four, or something else?","fields":[{"label":"The answer","text":"Group A nonexpanded."},{"label":"The path","text":"Chapter Twenty, section twenty point four point five point four, the nonexpanded definition, page thirteen, one eighty-three. Read the exposed line written by volume: more than five, up to twenty-five percent expanded."},{"label":"Why that path","text":"two words picked it, exposed and expanded. The Class Four list has no exposed expanded line, so the answer has to be in the Group A definitions."},{"label":"If you said Class Four","text":"you used the cartoned line, more than five up to twenty-five by volume. That line needs a carton."}]},{"step":"Step D. Check the pallet.","kind":"find","q":"A cartoned Class Three product on unreinforced H-D-P-E pallets, permanently marked. The building has ceiling-only spray sprinklers, K sixteen point eight. Does the commodity class go up?","fields":[{"label":"The answer","text":"no. It stays Class Three."},{"label":"The path","text":"Chapter Twenty, the K sixteen point eight exception, page thirteen, one eighty-one. The increase rule is on page thirteen, one eighty. Turn the page for the exception."},{"label":"Why that path","text":"H-D-P-E pallet sent you to Pallet Types. Ceiling-only spray, K sixteen point eight, sent you to the exception. It's keyed on the pallet material and the sprinkler."},{"label":"If you said Class Four","text":"you applied the unreinforced-pallet rule and stopped on page thirteen, one eighty."}]},{"step":"Step E. Check for encapsulation.","kind":"say","q":"Palletized storage, encapsulated, Class Three, eighteen feet high. What's the minimum K-factor, and what's the density?","fields":[{"label":"The answer","text":"K eleven point two or larger, and point six over two thousand square feet."},{"label":"Where it lives","text":"Chapter Twenty-One, section twenty-one point two point three, starting on page thirteen one ninety-five."},{"label":"Why","text":"encapsulated, over fifteen feet up to twenty, palletized. Eighteen is inside that range."},{"label":"If you said point five three","text":"that's Class Two. Class Three and Four share point six."}]},{"step":"Step F. Check for mixed commodities.","kind":"find","q":"A building whose ceiling protection is designed for Class Two. The owner wants to keep some Group A pallet loads scattered through a thirty-thousand-square-foot area. How many loads are allowed?","fields":[{"label":"The answer","text":"five pallet loads, scattered, with no two adjacent in any direction, diagonals included."},{"label":"The path","text":"Chapter Twenty, the ten-load allowance, page thirteen, one eighty-four. Read the conditions under it, down to the ceiling design."},{"label":"Why that path","text":"a few loads of a worse commodity is a mixed-commodity question. The allowance is keyed on the area and on what the ceiling is designed for."},{"label":"If you said ten","text":"you missed the condition. A Class One or Two ceiling drops it to five."}]}],"cards":[{"q":"Under the 2022 edition, how is Group B plastic protected? Free-flowing Group A? Group C?","a":"Group B and free-flowing Group A: as Class IV. Group C: as Class III.","src":"§20.4.8.1 and §20.4.8.2, p. 13-183."},{"q":"What makes a Group A product \"expanded,\" cartoned vs exposed?","a":"Cartoned: more than 40% by volume expanded plastic. Exposed: more than 25% by volume expanded plastic.","src":"§20.4.5.3, p. 13-183."},{"q":"An exposed product with more than 5% up to 25% by volume expanded Group A plastic is classified as what?","a":"Group A nonexpanded. Class IV has no exposed-expanded line, so the product skips Class IV.","src":"§20.4.5.4, p. 13-183; Class IV list §20.4.4, p. 13-181."},{"q":"A plastic (PP or HDPE) pallet has no marking and no manufacturer certification. What do you assume, and what does it do to a Class IV commodity?","a":"Assume reinforced. Reinforced raises the commodity two classes; Class IV becomes cartoned nonexpanded Group A.","src":"§20.3.2.2.2.1 and §20.3.2.2.2.2, p. 13-180."},{"q":"Name the three exceptions to the plastic-pallet class increase.","a":"(1) Group A plastics get no increase. (2) Ceiling-only spray sprinklers K-16.8 or larger: the PP/HDPE increases don't apply (PP/HDPE only, not the new §20.3.2.4 \"other plastic\" pallets). (3) Nonwood pallets listed as no worse a fire hazard than wood get no increase.","src":"§20.3.2.2.3 (p. 13-180); §20.3.2.2.4 and §20.3.2.3 (p. 13-181)."},{"q":"Mixed commodities: how many higher-hazard pallet loads are allowed, in what area, and when does that number drop?","a":"Up to 10 pallet loads in an area of 40,000 ft² or less, randomly dispersed, no adjacent loads in any direction including diagonally. Drops to 5 loads of Class IV or Group A when the ceiling is designed for Class I or II.","src":"§20.4.13.3, p. 13-184."}]},{"n":3,"title":"Arrangement and Rack Type","mins":18,"audio":"audio/ep03.mp3","questions":[{"step":"Warm-up","kind":"say","q":"Group B plastic, and free-flowing Group A plastic. What are they protected the same as?","fields":[{"label":"The answer","text":"Class Four. Both of them."},{"label":"Where it lives","text":"section twenty point four point eight point one, page thirteen, one eighty-three."},{"label":"Why","text":"free-flowing plastics fall out of their containers in a fire, fill the flue spaces, and smother the fire. That's why they ride down to Class Four. Group B is simply listed in Class Four's own list, item one."},{"label":"If you said Class Three","text":"you swapped the groups. Group C is the one protected the same as Class Three, twenty point four point eight point two."}]},{"step":"Warm-up","kind":"say","q":"An exposed product, Group A plastic, with more than five, up to twenty-five percent by volume of expanded plastic. What is it?","fields":[{"label":"The answer","text":"Group A nonexpanded."},{"label":"Where it lives","text":"section twenty point four point five point four, the nonexpanded definition, page thirteen one eighty-three."},{"label":"Why","text":"Class Four has no line for exposed expanded plastic. So the exposed product skips Class Four and lands in the plastics groups."},{"label":"If you said Class Four","text":"you used the cartoned line. Cartoned, more than five up to twenty-five percent by volume expanded is Class Four. Exposed is not. The carton is worth a whole category."}]},{"step":"Warm-up","kind":"say","q":"A Class Two product on polypropylene pallets with no marking, under K eleven point two ceiling sprinklers. What class do you protect it as?","fields":[{"label":"The answer","text":"Class Four."},{"label":"Where it lives","text":"section twenty point three point two, Pallet Types, page thirteen, one eighty."},{"label":"Why","text":"no marking and no manufacturer certification means you assume reinforced. Reinforced raises it two classes. Class Two becomes Class Four."},{"label":"If you said Class Three","text":"you used the unreinforced rule, up one class. That only applies when the pallet is permanently marked as unreinforced."}]},{"step":"Step B. Name the rack type.","kind":"say","q":"Two double-row racks, each eight feet deep, with a three-foot aisle between them. What rack type?","fields":[{"label":"The answer","text":"multiple-row."},{"label":"Where it lives","text":"Chapter Three, the multiple-row rack definition, section three point three point one thirty-four."},{"label":"Why","text":"three feet is under three and a half, so the aisle doesn't count. Eight, plus three, plus eight is nineteen. Over twelve, with an aisle under three and a half. Under three and a half feet of aisle, two racks become one."},{"label":"If you said double-row","text":"you checked each rack's depth, saw eight is under twelve, and stopped. You never checked the aisle. Check the aisle every time."}]},{"step":"Step B. Name the rack type.","kind":"say","q":"A single-row rack is set eighteen inches from a wall. What rack type is it treated as, and where is its longitudinal flue?","fields":[{"label":"The answer","text":"double-row. The longitudinal flue is the gap between the rack and the wall."},{"label":"Where it lives","text":"the wall rule, in the annex, A point three point three point two hundred."},{"label":"Why","text":"eighteen inches is within twenty-four inches of the wall. The wall plays the missing back row."},{"label":"If you said single-row","text":"you read only the Chapter Three definition and missed the annex. If you said the wall is the flue: the wall is not the flue. The gap is."}]},{"step":"Step C. Check the flues.","kind":"find","q":"A double-row open rack holds a Class Three commodity, stored to twenty-two feet. Is a longitudinal flue required?","fields":[{"label":"The answer","text":"no. Not required."},{"label":"The path","text":"Chapter Twenty, section twenty point five point three point four, page thirteen, one eighty-four. Find the longitudinal flue paragraphs, point four point one, and read the first one, point one point one, the twenty-five-and-under flue rule."},{"label":"Why that path","text":"the words longitudinal flue and double-row open rack picked the flue section. The rule is keyed on storage height, with twenty-five feet as the line, and on the commodity, Class One through Four or Group A. Class Three at twenty-two feet is inside it."},{"label":"If you said yes, six inches","text":"you read the over-twenty-five flue rule. That one starts over twenty-five feet. Twenty-two is under. And remember, not required doesn't mean the rack stays open on its own. That's Step D."}]},{"step":"Step D. Open rack or solid shelf.","kind":"find","q":"A double-row rack has no shelves. Storage is twenty-four feet. The operator pushed the loads back to back, so there's no longitudinal flue. Transverse flues are four feet apart. Open rack or solid-shelf rack?","fields":[{"label":"The answer","text":"open rack."},{"label":"The path","text":"Chapter Twenty, section twenty point five point three point one, page thirteen, one eighty-four. Find the double-row paragraphs, point one point two. Point two point one, the no-flue rule, makes it solid. Keep reading to point two point two, the way-out rule."},{"label":"Why that path","text":"the question is open or solid, so you're in the shelving section, not the flue section. Double-row picks point one point two. The way-out rule is keyed on two things: storage twenty-five feet or less, and transverse flues no more than five feet apart. Twenty-four feet and four feet pass both."},{"label":"If you said solid","text":"you stopped at the no-flue rule and never read the way out. Always read the next paragraph. Now push the same rack to thirty feet, and the way out is gone. That's our forklift drill."}]},{"step":"Step D. Open rack or solid shelf.","kind":"find","q":"A double-row rack has one solid steel shelf, fifteen square feet in area. The rest of the rack is open, with its six-inch longitudinal flue and transverse flues in place. Does that shelf make it a solid-shelf rack?","fields":[{"label":"The answer","text":"no."},{"label":"The path","text":"Chapter Twenty, section twenty point five point three point one point one, the solid shelf test, page thirteen, one eighty-four, left column."},{"label":"Why that path","text":"the words solid shelf picked the solid shelf test. It's keyed on two things: how open the shelving is, and the area. The area has to be greater than twenty square feet. Fifteen isn't."},{"label":"If you said yes","text":"you hung the twenty square feet on the blocked-flue half only. Read the sentence again. The twenty applies to both halves."}]},{"step":"Step E. The heights.","kind":"say","q":"Most of the year a building stores to twenty-two feet. Every peak season, the same racks are stacked to twenty-eight feet. What storage height do you design for?","fields":[{"label":"The answer","text":"twenty-eight feet."},{"label":"Where it lives","text":"the design height rule, section twenty point nine point three point one."},{"label":"Why","text":"twenty-eight feet exists periodically, every peak season, and the higher stack creates the greater water demand. Both halves of the rule point at twenty-eight."},{"label":"If you said twenty-two feet","text":"you designed to today's walkthrough. Routinely or periodically. The peak season counts."}]}],"cards":[{"q":"Two double-row racks with a 3 ft aisle between them, overall width over 12 ft. What rack type?","a":"Multiple-row. An aisle under 3.5 ft doesn't count as an aisle, so the code sees one rack over 12 ft wide.","src":"§3.3.134 (LiNK Q1, matches 2019 §3.3.127). Page not in photos."},{"q":"A single-row rack set within 24 in. of a wall is treated as what, and where is the longitudinal flue?","a":"As a double-row rack. The gap between the rack and the wall is the longitudinal flue, not the wall.","src":"A.3.3.200 (LiNK Q2, matches 2019 A.3.3.191). Page not in photos."},{"q":"Double-row open rack, Class I–IV or Group A plastic. When is a longitudinal flue required, and how wide?","a":"Over 25 ft of storage: a nominal 6 in. longitudinal flue. Up to and including 25 ft: not required.","src":"§20.5.3.4.1.1 / §20.5.3.4.1.2, p. 13-184."},{"q":"The solid shelf test: what two conditions, and what area threshold applies to them?","a":"Shelving less than 50% open, or loads blocking openings that would serve as flues; either one counts only over an area greater than 20 ft². The 20 ft² applies to both.","src":"§20.5.3.1.1, p. 13-184 (left column)."},{"q":"A double-row rack with no solid shelves and no longitudinal flue: open or solid? What's the way out?","a":"Treated as a solid-shelf rack. It counts as open only when storage is 25 ft or less and transverse flues are at maximum 5 ft intervals.","src":"§20.5.3.1.2.1 / §20.5.3.1.2.2 (new in 2022), p. 13-184."},{"q":"What storage height do you design for?","a":"The storage height that routinely or periodically exists in the building and creates the greatest water demand. Not today's walkthrough.","src":"§20.9.3.1 (LiNK Q33, matches 2019 §20.6.3.1). Page not in photos."}]},{"n":4,"title":"CMDA","mins":17,"audio":"audio/ep04.mp3","questions":[{"step":"Warm-up","kind":"say","q":"Two ten-foot double-row racks stand with a three-foot aisle between them. What rack type does the code see?","fields":[{"label":"The answer","text":"multiple-row."},{"label":"Where it lives","text":"the multiple-row rack definition in Chapter Three, section three point three point one thirty-four."},{"label":"Why","text":"three feet is under three and a half, so the aisle doesn't count as an aisle anymore. The code sees one rack twenty-three feet wide. Over twelve is multiple-row."},{"label":"If you said double-row","text":"you checked each rack's depth and skipped the aisle. Under three and a half feet of aisle, two racks become one."}]},{"step":"Warm-up","kind":"say","q":"Double-row open racks. Above what storage height is a six-inch longitudinal flue required?","fields":[{"label":"The answer","text":"over twenty-five feet."},{"label":"Where it lives","text":"section twenty point five point three point four point one point two, page thirteen, one eighty-four."},{"label":"Why","text":"at twenty-five feet or less, the section just before it, twenty point five point three point four point one point one, says a longitudinal flue is not required. Over twenty-five, a nominal six-inch one is."},{"label":"If you said twenty-five feet","text":"at exactly twenty-five it isn't required. The line is over twenty-five."}]},{"step":"Warm-up","kind":"say","q":"A thirty-foot double-row rack with no shelves in it at all. The owner pushes the loads back to back and closes the longitudinal flue. Open rack, or solid shelf?","fields":[{"label":"The answer","text":"it's treated as a solid-shelf rack."},{"label":"Where it lives","text":"section twenty point five point three point one point two point one, page thirteen, one eighty-four."},{"label":"Why","text":"a double-row rack with no longitudinal flue is treated as solid-shelf. The one way out needs storage of twenty-five feet or less, with transverse flues no more than five feet apart. Thirty feet doesn't qualify."},{"label":"If you said open, because there are no shelves","text":"missing flues turn an open rack into a solid-shelf rack, even with no shelf in it."}]},{"step":"Step A. Find your section.","kind":"say","q":"Class Three commodity in double-row racks, thirty feet of storage, CMDA. Where does Chapter Twenty-One send you, and what comes with it?","fields":[{"label":"The answer","text":"Chapter Twenty-Five. Ceiling sprinklers plus in-rack sprinklers."},{"label":"Where it lives","text":"section twenty-one point four point two point one, page thirteen, two oh seven."},{"label":"Why","text":"Class One through Four, over twenty-five feet. That's section twenty-one point four point two, and its first rule hands you to Chapter Twenty-Five, the in-rack chapter."},{"label":"If you said a density table in section twenty-one point four point one","text":"those tables stop at twenty-five feet. Thirty is over."}]},{"step":"Step B. Read the table.","kind":"find","q":"Double-row racks, Class Two, not encapsulated, twenty-four feet of storage, eight-foot aisles, ordinary-temperature sprinklers. What density does the table give?","fields":[{"label":"The answer","text":"point six five gallons per minute per square foot."},{"label":"The path","text":"Chapter Twenty-One, Table E. The page number isn't on our photo, so look for it ahead of page thirteen, two oh seven. Go down to Class Two, not encapsulated, take the eight-foot aisle line, and read the last column, ordinary-temperature."},{"label":"Why that path","text":"double-row picks the single- and double-row tables, not the multiple-row ones. Twenty-four feet picks part E, over twenty-two up to and including twenty-five. Then the table is keyed on commodity class, encapsulation, aisle width, and temperature rating, in that order across the row."},{"label":"If you said point five eight","text":"you read the high-temperature column. That's the lower number. If you said point seven seven: you read the four-foot aisle line. And if you said \"See Chapter Twenty-Five\": you were in the multiple-row table. Remember, that's a density only. Table E doesn't give a design area."}]},{"step":"Step B. Read the table.","kind":"say","q":"Twenty-four feet of storage, not encapsulated. Class Four in double-row racks, and Class Two in multiple-row racks sixteen feet deep with eight-foot aisles. Which one can CMDA protect with ceiling sprinklers only?","fields":[{"label":"The answer","text":"neither one."},{"label":"Where it lives","text":"Table E for the double-row rack, and multiple-row Table E on page thirteen, two oh seven."},{"label":"Why","text":"in Table E, Class Four not encapsulated reads in-racks mandatory, yes. In multiple-row Table E, only Class One not encapsulated gets a ceiling-only density. Class Two says \"See Chapter Twenty-Five.\""},{"label":"If you said the Class Two rack","text":"you carried the double-row pattern into the multiple-row table. Only Class One gets through there."}]},{"step":"Step C. The adjustments.","kind":"say","q":"The encapsulation adder. What rack type and height band does it cover, and what does it add for Class One through Three, and for Class Four?","fields":[{"label":"The answer","text":"multiple-row racks, over twelve feet up to and including twenty-five. Class One through Three, twenty-five percent. Class Four, fifty percent."},{"label":"Where it lives","text":"section twenty-one point four point one point six, page thirteen, two oh seven."},{"label":"Why","text":"encapsulation is the trigger and multiple-row is the rack type. Over twenty-five feet a different rule takes over, section twenty-one point four point two point two, and it adds twenty-five percent for encapsulated Class One through Four."},{"label":"If you said twenty percent","text":"that's the slave pallet rule, and it drops off when in-racks are in the design."}]},{"step":"Step D. Run our warehouse.","kind":"find","q":"Cartoned Group A plastic, thirty feet of storage, and the designer puts the top in-rack level at twenty-two feet. What ceiling design do you use?","fields":[{"label":"The answer","text":"point four five gallons per minute per square foot, over two thousand square feet."},{"label":"The path","text":"Chapter Twenty-Five, the cartoned plastics section, then the option figures. Start with part A, option one. The page number isn't on our photo. Read the ceiling design printed across the top of the figure."},{"label":"Why that path","text":"Group A plastic, over twenty-five feet. Section twenty-one point six sends you to Chapter Twenty-Five, and cartoned picks the cartoned plastics section. The ceiling line is keyed on the storage above the top in-rack level, not on the total storage height. Thirty minus twenty-two is eight feet. Over five, up to ten."},{"label":"If you said point three zero","text":"you took the five-feet-or-less line. That needs the top level at twenty-five feet or higher. And if the designer had put the top level at eighteen feet, that's twelve feet above it. The ten-foot rule says no."}]},{"step":"Step E. Hose and duration.","kind":"find","q":"A different job, CMDA, with a ceiling design area of fourteen hundred square feet. What hose stream and duration?","fields":[{"label":"The answer","text":"five hundred gallons per minute, ninety minutes."},{"label":"The path","text":"Chapter Twenty, the hose table, page thirteen, one ninety. Find the CMDA line, then read down the column for size of design area at ceiling."},{"label":"Why that path","text":"hose and duration for this design come from this table. For CMDA, the rows are keyed to the size of the design area. The CMSA and ESFR rows in the same table are keyed to the number of sprinklers instead."},{"label":"If you said a hundred twenty minutes","text":"that's the over-fifteen-hundred row, the one our two-thousand square foot warehouse uses. If you said two hundred fifty gallons per minute and sixty minutes: that row stops at twelve hundred."}]}],"cards":[{"q":"Class I–IV rack storage over 25 ft, CMDA. Where does Chapter 21 send you, and what comes with it?","a":"§21.4.2.1 → Chapter 25 (the in-rack chapter): ceiling sprinklers plus in-rack sprinklers.","src":"NFPA 13 (2022) §21.4.2.1, p. 13-207."},{"q":"Table 21.4.1.2.1.1(e) (single/double-row, over 22 ft up to and incl. 25 ft): Class III not encapsulated, 8-ft aisles, densities? And Class IV not encapsulated?","a":"Class III NE, 8-ft: 0.65 high-temp / 0.74 ordinary, in-racks not mandatory. Class IV NE: in-racks mandatory = yes (See Ch 25).","src":"NFPA 13 (2022) Table 21.4.1.2.1.1(e) (page number not captured; it falls before p. 13-207)."},{"q":"Multiple-row Table 21.4.1.3.1.1(e), same height band: which line gets a ceiling-only density?","a":"Only Class I not encapsulated (0.65 HT / 0.72 OT). Every other line: See Chapter 25.","src":"NFPA 13 (2022) Table 21.4.1.3.1.1(e), p. 13-207."},{"q":"Name three CMDA ceiling-density increases on p. 13-207.","a":"§21.4.1.6: encapsulated, multiple-row, over 12 ft up to and incl. 25 ft → +25% Class I–III, +50% Class IV. §21.4.2.2: encapsulated Class I–IV over 25 ft → +25%. §21.4.1.7.2: slave pallets, up to and incl. 25 ft → +20%, not applied when in-racks are in the design.","src":"NFPA 13 (2022) §21.4.1.6, §21.4.2.2, §21.4.1.7.2, p. 13-207."},{"q":"Cartoned Group A over 25 ft, CMDA with in-racks: ceiling design, in-rack design, and the max storage above the top in-rack level?","a":"Ceiling 0.30 gpm/ft² over 2,000 ft² with ≤ 5 ft above the top in-rack level; 0.45 over 2,000 ft² with over 5 ft up to 10 ft. In-racks: minimum 14 heads (7 on each of the top two levels) at 30 gpm, OT, K-5.6 min. Max 10 ft above the top level (§25.3.3.3.1.2). Clearance over 10 ft → §25.3.3.3.1.3: one level of supplemental QR in-racks directly below the top tier, at every flue space intersection; ceiling then designed on a 10-ft clearance.","src":"NFPA 13 (2022) §25.3.3.3.1.1–.3 + Figure 25.3.3.3.1.1(a) (page numbers not captured)."},{"q":"CMDA hose stream and duration by ceiling design area?","a":"Up to 1,200 ft²: 250 gpm / 60 min · over 1,200 up to 1,500: 500 / 90 · over 1,500 up to 2,600: 500 / 120 · over 2,600: 500 / 150.","src":"NFPA 13 (2022) Table 20.15.2.6, p. 13-190."}]},{"n":5,"title":"CMSA and ESFR","mins":15,"audio":"audio/ep05.mp3","questions":[{"step":"Warm-up","kind":"say","q":"Our warehouse under CMDA. Cartoned Group A plastic, thirty feet of storage. Can the ceiling sprinklers do it alone?","fields":[{"label":"The answer","text":"No. Over twenty-five feet, CMDA never stands alone. In-racks, every time."},{"label":"Where it lives","text":"section twenty-one point six, page thirteen, two oh seven. It sends you to Chapter Twenty-Five, the in-rack chapter."},{"label":"Why","text":"over twenty-five feet, both CMDA paths leave Chapter Twenty-One. Class One through Four goes by section twenty-one point four point two point one, Group A plastic goes by section twenty-one point six, and both land in Chapter Twenty-Five."},{"label":"If you said yes, with a higher density","text":"you stayed in Chapter Twenty-One. Over twenty-five feet, section twenty-one point six sends you out to Chapter Twenty-Five."}]},{"step":"Warm-up","kind":"say","q":"Same warehouse, CMDA with in-racks. The top in-rack level sits at twenty-five feet, so there are five feet of storage above it. What's the ceiling design?","fields":[{"label":"The answer","text":"point three zero gallons per minute per square foot, over two thousand square feet."},{"label":"Where it lives","text":"the ceiling design across the top of Figures twenty-five point three point three point three point one point one, parts A through G. Call them the seven option figures."},{"label":"Why","text":"five feet or less above the top in-rack level gets point three zero. Over five feet, up to ten feet, gets point four five."},{"label":"If you said point four five","text":"you put five feet in the upper band. Point four five starts over five feet."}]},{"step":"Warm-up","kind":"say","q":"That CMDA ceiling design covers two thousand square feet. What's the hose allowance and duration?","fields":[{"label":"The answer","text":"five hundred gallons per minute, a hundred twenty minutes."},{"label":"Where it lives","text":"Table twenty point fifteen point two point six, page thirteen, one ninety. Call it the hose table."},{"label":"Why","text":"for CMDA, the hose table is keyed on the size of the design area. Two thousand falls in over fifteen hundred, up to twenty-six hundred."},{"label":"If you said ninety minutes","text":"you read the over twelve hundred, up to fifteen hundred row. Two thousand is past that."}]},{"step":"Step A. Screen the building.","kind":"say","q":"An ESFR area sits right next to an area of standard-response sprinklers. What has to go between them, and how big?","fields":[{"label":"The answer","text":"a noncombustible draft curtain at least two feet deep, with a clear aisle at least four feet wide centered under it."},{"label":"Where it lives","text":"section twenty-three point one point two, page thirteen, two twenty-five."},{"label":"Why","text":"it's one of the limits Chapter Twenty-Three puts on ESFR before you ever open a table. Screen first."},{"label":"If you said a four-foot curtain","text":"you swapped the two numbers. The curtain is two feet deep. The aisle is four feet wide."}]},{"step":"Step B. CMSA.","kind":"find","q":"Our warehouse. Cartoned nonexpanded Group A plastic, double-row racks, thirty feet of storage, thirty-five-foot ceiling, CMSA. What head, how many design sprinklers, and what pressure?","fields":[{"label":"The answer","text":"K nineteen point six pendent, wet, fifteen design sprinklers, twenty-five psi."},{"label":"The path","text":"Chapter Twenty-Two, Table twenty-two point five, page thirteen, two twenty-two. Find the cartoned nonexpanded block, then the row with thirty feet of storage and thirty-five feet of ceiling. There's one option on that row."},{"label":"Why that path","text":"CMSA picked Chapter Twenty-Two. Group A plastic in racks, up to thirty-five feet, picked Table twenty-two point five. This table is keyed on storage height and ceiling height, so you need both numbers: thirty over thirty-five."},{"label":"If you said thirty psi","text":"you read the thirty-five over forty row. That's thirty-five feet of storage under a forty-foot ceiling. Match both heights."},{"label":"If you said in-rack sprinklers required","text":"you read the K eleven point two or K sixteen point eight upright rows at twenty-five feet of storage under a thirty-five-foot ceiling. Our storage is thirty feet."}]},{"step":"Step C. ESFR.","kind":"find","q":"Our warehouse. Thirty feet of storage under a thirty-five-foot ceiling, ESFR ceiling-only, K twenty-five point two pendent. What's the minimum pressure?","fields":[{"label":"The answer","text":"twenty psi."},{"label":"The path","text":"Chapter Twenty-Three, Table twenty-three point three point one, page thirteen, two twenty-six. Find the Class One through Four and cartoned nonexpanded Group A block. Go down to the thirty-five-foot ceiling row. Read across to the K twenty-five point two pendent column."},{"label":"Why that path","text":"ESFR picked Chapter Twenty-Three, and ceiling-only picked this table. The table is keyed on ceiling height only. The thirty feet of storage never enters it."},{"label":"If you said fifteen psi","text":"you read the thirty-foot row. Thirty is your storage height, and this table has no storage column. Use the thirty-five-foot ceiling row."}]},{"step":"Step C. ESFR.","kind":"find","q":"Same ceiling, thirty-five feet. Now the commodity is cartoned expanded plastic. What does ESFR ceiling-only give you?","fields":[{"label":"The answer","text":"nothing. The thirty-five-foot row for cartoned expanded is all dashes. No ESFR ceiling-only."},{"label":"The path","text":"Chapter Twenty-Three, Table twenty-three point three point one, page thirteen, two twenty-six. Find the cartoned expanded block, then the thirty-five-foot ceiling row."},{"label":"Why that path","text":"the commodity picks the block, the ceiling picks the row. Cartoned expanded only has values at twenty-five and thirty feet of ceiling."},{"label":"If you said seventy-five or fifty-two psi","text":"you read the Class One through Four and cartoned nonexpanded block. Expanded and nonexpanded are different blocks. Check the commodity before you read across."}]},{"step":"Step D. ESFR with one level of in-racks.","kind":"say","q":"Foam cups again, cartoned expanded plastic, thirty-five-foot ceiling. The ceiling-only table is all dashes. Can you add one level of in-racks and use the ESFR plus in-rack table?","fields":[{"label":"The answer","text":"No. The ESFR plus in-rack table covers Class One through Four and nonexpanded plastics only, cartoned or exposed. Expanded plastic isn't in it."},{"label":"Where it lives","text":"Table twenty-five point five point four point one, page thirteen, three twenty-eight."},{"label":"Why","text":"the in-rack option has its own commodity limits. A dash in the ceiling-only table doesn't open it for you. Separately, that table also caps the ceiling at forty-five feet."},{"label":"If you said yes","text":"you heard \"the ceiling-only table ran out\" and stopped there. Check the commodity column of the ESFR plus in-rack table before you use it."}]},{"step":"Step E. Hose and duration.","kind":"say","q":"ESFR with twelve design heads. What's the hose allowance and duration? And standard-spacing CMSA with fifteen?","fields":[{"label":"The answer","text":"ESFR, two hundred fifty gallons per minute, sixty minutes. CMSA, five hundred gallons per minute, ninety minutes."},{"label":"Where it lives","text":"Table twenty point fifteen point two point six, page thirteen, one ninety."},{"label":"Why","text":"for CMSA and ESFR the hose table counts ceiling sprinklers in the design. Twelve falls in \"up to twelve.\" Fifteen falls in \"over twelve, up to fifteen.\""},{"label":"If you said five hundred and ninety minutes for ESFR","text":"you put twelve heads in the over-twelve row. Twelve is \"up to twelve.\""}]}],"cards":[{"q":"ESFR ceiling-only Table 23.3.1 is keyed on what height?","a":"Maximum ceiling/roof height only. There is no storage-height column.","src":"NFPA 13 (2022) Table 23.3.1, p. 13-226."},{"q":"ESFR ceiling-only, Class I–IV or cartoned nonexpanded Group A, 35 ft ceiling, K-25.2 pendent: minimum pressure?","a":"20 psi. (The 30 ft row gives 15 psi; that's the wrong row.)","src":"Table 23.3.1, p. 13-226."},{"q":"ESFR ceiling design area?","a":"The most demanding 12 sprinklers, 4 on each of 3 branch lines.","src":"§23.2.2, p. 13-225."},{"q":"CMSA, cartoned nonexpanded Group A, double-row racks, 30 ft storage / 35 ft ceiling?","a":"K-19.6 pendent, wet, 15 design sprinklers, 25 psi. Ceiling-only. No star on that row.","src":"Table 22.5, p. 13-222."},{"q":"Does ESFR plus one level of in-racks (Table 25.5.4.1) cover expanded plastic?","a":"No. Class I–IV and nonexpanded (cartoned or exposed) Group A only. Max 40 ft storage, 45 ft ceiling, 12 ceiling heads: K-14 pendent 90 psi or K-16.8 pendent 63 psi.","src":"Table 25.5.4.1, p. 13-328."},{"q":"Hose and duration: ESFR with 12 design heads? CMSA (standard spacing) with 15?","a":"ESFR 12 = 250 gpm, 60 min (\"up to 12\"). CMSA 15 = 500 gpm, 90 min (\"over 12 to 15\").","src":"Table 20.15.2.6, p. 13-190."}]},{"n":6,"title":"In-Racks, Alternatives, Special Designs","mins":16,"audio":"audio/ep06.mp3","questions":[{"step":"Warm-up","kind":"say","q":"Table twenty-three point three point one, the ESFR ceiling-only table. What is it keyed on?","fields":[{"label":"The answer","text":"the commodity picks the block, then the maximum ceiling or roof height picks the row. No storage height at all."},{"label":"Where it lives","text":"Table twenty-three point three point one, page thirteen, two twenty-six."},{"label":"Why","text":"the table has no storage-height column. You find the commodity, then the row for your ceiling height, then read across by K-factor."},{"label":"If you said storage height","text":"that's the trap. Thirty feet of storage under a thirty-five-foot ceiling reads the thirty-five-foot row."}]},{"step":"Warm-up","kind":"say","q":"In an ESFR ceiling design, how many sprinklers are in the design area, and how are they laid out?","fields":[{"label":"The answer","text":"the most demanding twelve sprinklers, four on each of three branch lines."},{"label":"Where it lives","text":"section twenty-three point two point two."},{"label":"Why","text":"ESFR is designed by a head count, not a density over an area. And that count of twelve is what puts its hose at two fifty and sixty minutes."},{"label":"If you said fifteen","text":"that's the CMSA head count for our warehouse, from Table twenty-two point five."}]},{"step":"Warm-up","kind":"say","q":"CMSA with fifteen design heads. What hose stream and what duration?","fields":[{"label":"The answer","text":"five hundred gallons per minute, ninety minutes."},{"label":"Where it lives","text":"Table twenty point fifteen point two point six."},{"label":"Why","text":"for CMSA and ESFR, that table is keyed to the number of ceiling sprinklers in the design. Fifteen sits in the over-twelve-up-to-fifteen row."},{"label":"If you said two fifty and sixty minutes","text":"that's the up-to-twelve row. That's the ESFR answer, not CMSA."}]},{"step":"Step B. Pick the arrangement.","kind":"find","q":"Same cartoned Group A plastic over twenty-five feet, but you pick option two instead of option one. How far apart can the in-rack levels be, vertically?","fields":[{"label":"The answer","text":"fifteen feet."},{"label":"The path","text":"Chapter Twenty-Five, option figure B, page thirteen, three fourteen. Read the notes under the drawing. Note eight, the last one, gives the vertical spacing."},{"label":"Why that path","text":"\"cartoned Group A over twenty-five feet\" is the cartoned over-twenty-five section, which hands you to the option figures. \"Option two\" is part B, and each figure carries its own notes."},{"label":"If you said ten feet","text":"you carried over option one. Ten feet is options one, four, five, six, and seven. And on that same page, note two puts face sprinklers in option two."}]},{"step":"Step B. Pick the arrangement.","kind":"say","q":"Our warehouse, option one, in-rack levels at ten and twenty feet only, thirty feet of storage. What's the ceiling density?","fields":[{"label":"The answer","text":"point four five over two thousand."},{"label":"Where it lives","text":"the ceiling design box, printed the same on all seven option figures."},{"label":"Why","text":"ten feet of storage sits above the top level. Point three zero is only for five feet or less. More than five, up to ten, is point four five."},{"label":"If you said point three zero","text":"that's the answer only after you add the level at twenty-five feet."}]},{"step":"Step D. In-racks under ESFR.","kind":"find","q":"ESFR at the ceiling, open racks, one level of in-racks. The drawing shows K five point six standard-response in-racks. What has to change?","fields":[{"label":"The answer","text":"two things. The heads have to be quick-response, and at least K eight point zero."},{"label":"The path","text":"Chapter Twenty-Five, section twenty-five point five, page thirteen, three twenty-seven. The ESFR in-rack head rule is on that page, and so is the five-foot horizontal spacing."},{"label":"Why that path","text":"the words \"ESFR at the ceiling\" pick section twenty-five point five, the in-racks-with-ESFR section. The CMDA option figures don't apply here."},{"label":"If you said the drawing is fine","text":"you used the CMDA option figures. Their first note allows quick- or standard-response at K five point six. Under ESFR, both of those are out."}]},{"step":"Step D. In-racks under ESFR.","kind":"find","q":"Our warehouse: cartoned nonexpanded Group A, thirty feet of storage, thirty-five-foot ceiling, ESFR with one level of in-racks. The ceiling heads are K sixteen point eight pendent. How many ceiling heads, at what pressure?","fields":[{"label":"The answer","text":"twelve heads at sixty-three psi."},{"label":"The path","text":"Chapter Twenty-Five, Table twenty-five point five point four point one, page thirteen, three twenty-eight. Find the K sixteen point eight pendent row and read across to the number of sprinklers and the pressure."},{"label":"Why that path","text":"\"one level of in-racks\" under ESFR means the one-level figure, and its first note sends the ceiling design to this table. Its rows are by K-factor."},{"label":"If you said fifty-two psi","text":"you read Table twenty-three point three point one, the ESFR ceiling-only table, at the thirty-five-foot ceiling row. That's the answer with no in-racks. If you said ninety: that's the K fourteen row."}]},{"step":"Step E. The hydraulics.","kind":"say","q":"The in-rack demand and the ceiling demand meet at the connection. What happens to the flows, and what happens to the pressures?","fields":[{"label":"The answer","text":"the flows are added. The pressures are balanced to the higher of the two."},{"label":"Where it lives","text":"section twenty-eight point two point five point two, the balancing rule."},{"label":"Why","text":"each side is calculated on its own first. Where they meet, the lower-pressure side gets raised to match."},{"label":"If you said the pressures add, or you split the difference","text":"no. Flows add. Pressures go to the higher side, and the lower side doesn't get to pull it down."}]},{"step":"Step E. The hydraulics.","kind":"find","q":"You're using section twenty-five point six, in-racks independent of the ceiling. Cartoned nonexpanded Group A plastic, option two B. What's the maximum vertical spacing between in-rack levels?","fields":[{"label":"The answer","text":"forty feet."},{"label":"The path","text":"Chapter Twenty-Five, Table twenty-five point six point two point four point one, the independent spacing table, page thirteen, three thirty-six. Find the cartoned nonexpanded Group A row and read across to the option two B column."},{"label":"Why that path","text":"\"independent of the ceiling\" picks section twenty-five point six, not the CMDA option figures. This table is keyed on the commodity and the option."},{"label":"If you said thirty feet","text":"you read the option two A column, or the cartoned expanded row, where option two B is thirty. If you said ten, fifteen, or twenty: those are the CMDA option figures, and this table doesn't use them."}]}],"cards":[{"q":"CMDA in-racks for cartoned Group A over 25 ft: how many arrangement options, and what vertical spacing does each allow?","a":"Seven, Figures 25.3.3.3.1.1(a)–(g). Options 1, 4, 5, 6, 7 = levels no more than 10 ft apart; option 2 = 15 ft; option 3 = 20 ft (drawn with horizontal barriers).","src":"§25.3.3.3.1.1 and the figure notes; Fig (b) on p. 13-314."},{"q":"With the CMDA option figures, what sets the ceiling density, and what's the cap on storage above the top in-rack level?","a":"0.30 gpm/ft² over 2000 ft² with 5 ft or less of storage above the top level; 0.45 over 2000 ft² with more than 5, up to 10 ft. Never more than 10 ft above the top level (§25.3.3.3.1.2).","src":"ceiling design box, identical on all seven figures (e.g., Fig (b), p. 13-314)."},{"q":"In-rack heads and design for the CMDA option figures?","a":"Ordinary-temperature, quick- or standard-response, minimum K-5.6; designed for a minimum of 14 heads (7 on each of the top two levels) at 30 gpm.","src":"Note 1 on all seven figures 25.3.3.3.1.1(a)–(g)."},{"q":"In-racks under an ESFR ceiling (open racks): head type and horizontal spacing?","a":"Quick-response, ordinary-temperature, minimum K-8.0 (§25.5.2.2); no more than 5 ft apart horizontally (§25.5.3.2).","src":"p. 13-327."},{"q":"ESFR plus one level of in-racks: in-rack demand and ceiling design?","a":"In-racks: 8 heads at 60 gpm for an open rack (Table 25.5.3.3). Ceiling: 12 heads, K-14 pendent at 90 psi or K-16.8 pendent at 63 psi (Table 25.5.4.1). One level at the tier closest to, but not below, half the storage height, storage up to 40 ft (Fig 25.5.3.1).","src":"pp. 13-327/328."},{"q":"Where the in-rack piping meets the ceiling system, what happens to flow and pressure?","a":"Flows are added; pressures are balanced to the higher of the two. The lower-pressure side is raised; it can't pull the other down.","src":"§28.2.5.2 (LiNK Q20; not in the book photos)."}]}];
const app = document.getElementById('app');
const store = {
  get(k, d) { try { const v = localStorage.getItem('fsmsp:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fsmsp:' + k, JSON.stringify(v)); } catch (e) {} }
};
const SPEEDS = [0.75, 0.85, 1, 1.25, 1.5];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function home(tab) {
  const total = EPS.reduce((a, e) => a + e.questions.length, 0);
  const cards = EPS.reduce((a, e) => a + e.cards.length, 0);
  app.innerHTML = `
    <div class="tabs">
      <button class="tab ${tab !== 'drill' ? 'on' : ''}" onclick="location.hash=''">Episodes</button>
      <button class="tab ${tab === 'drill' ? 'on' : ''}" onclick="location.hash='drill'">Card drill</button>
    </div>
    ${tab === 'drill' ? '' : `<p class="muted">${EPS.length} episodes · ${total} pause-and-answer questions · ${cards} review cards. When the narrator says "Pause the audio now," pause, answer, then play.</p>
    ${EPS.map(e => `
      <button class="ep" onclick="location.hash='ep${e.n}'">
        <span class="num">${e.n}</span>
        <span><div class="t">${esc(e.title)}</div>
        <div class="meta">About ${e.mins} min · ${e.questions.length} questions · ${e.cards.length} cards</div></span>
      </button>`).join('')}`}`;
}

function episode(n) {
  const e = EPS.find(x => x.n === n);
  if (!e) return home();
  let step = null, body = '';
  e.questions.forEach((q, i) => {
    if (q.step !== step) { step = q.step; body += `<h3>${esc(step)}</h3>`; }
    body += `<div class="q" id="q${i}">
      <span class="badge ${q.kind}">${q.kind === 'find' ? 'Find it · book open' : 'Say it · no book'}</span>
      <div class="text">${esc(q.q)}</div>
      <button class="reveal" onclick="this.parentNode.classList.add('open')">Show the answer</button>
      <div class="ans">${q.fields.map(f => `<p class="f ${f.label === 'The answer' ? 'answer' : f.label.startsWith('If you said') ? 'wrong' : ''}"><b>${esc(f.label)}</b>${esc(f.text)}</p>`).join('')}</div>
    </div>`;
  });
  const rate = SPEEDS.includes(store.get('rate', 1)) ? store.get('rate', 1) : 1;
  app.innerHTML = `
    <button class="back" onclick="location.hash=''">‹ All episodes</button>
    <div class="brand">Episode ${e.n}</div>
    <h2>${esc(e.title)}</h2>
    <div class="player">
      <div class="ctl" id="ctl">
        <button class="skip" id="back15" aria-label="Back 15 seconds">↺<br>15</button>
        <button class="big" id="pp" aria-label="Play">▶</button>
        <button class="skip" id="fwd15" aria-label="Forward 15 seconds">↻<br>15</button>
      </div>
      <audio id="au" controls preload="metadata" src="${e.audio}"></audio>
      <div class="noaudio" id="na" hidden>Audio for this episode hasn't been added yet. The questions below work now.</div>
      <div class="speeds">${SPEEDS.map(r => `<button data-r="${r}" class="${r === rate ? 'on' : ''}">${r}×</button>`).join('')}</div>
      <a class="printlink" href="questions.pdf" target="_blank">🖨 Print the questions (all 6 episodes)</a>
    </div>
    <p class="muted">The questions from this episode, in order. Try each one before you tap.</p>
    ${body}`;
  const au = document.getElementById('au');
  au.playbackRate = rate;
  au.addEventListener('error', () => { au.hidden = true; document.getElementById('ctl').hidden = true; document.getElementById('na').hidden = false; });
  const pp = document.getElementById('pp');
  const showPP = () => { pp.textContent = au.paused ? '▶' : '❚❚'; pp.setAttribute('aria-label', au.paused ? 'Play' : 'Pause'); };
  pp.onclick = () => { au.paused ? au.play() : au.pause(); };
  au.addEventListener('play', showPP); au.addEventListener('pause', showPP);
  document.getElementById('back15').onclick = () => { au.currentTime = Math.max(0, au.currentTime - 15); };
  document.getElementById('fwd15').onclick = () => { au.currentTime = Math.min(au.duration || 0, au.currentTime + 15); };
  au.addEventListener('loadedmetadata', () => { const t = store.get('pos' + n, 0); if (t > 5 && t < au.duration - 5) au.currentTime = t; });
  let last = 0;
  au.addEventListener('timeupdate', () => { if (Math.abs(au.currentTime - last) > 4) { last = au.currentTime; store.set('pos' + n, au.currentTime); } });
  document.querySelectorAll('.speeds button').forEach(b => b.onclick = () => {
    const r = +b.dataset.r; au.playbackRate = r; store.set('rate', r);
    document.querySelectorAll('.speeds button').forEach(x => x.classList.toggle('on', x === b));
  });
  window.scrollTo(0, 0);
}

let deck = [], pos = 0, got = 0, miss = 0;
function drill() {
  home('drill');
  const pick = store.get('deck', 'all');
  app.insertAdjacentHTML('beforeend', `
    <select id="pick">
      <option value="all">All episodes (${EPS.reduce((a, e) => a + e.cards.length, 0)} cards)</option>
      ${EPS.map(e => `<option value="${e.n}">Episode ${e.n}: ${esc(e.title)}</option>`).join('')}
    </select>
    <div class="score"><span id="prog"></span><span id="tally"></span></div>
    <div id="card"></div>`);
  const sel = document.getElementById('pick');
  sel.value = pick;
  sel.onchange = () => { store.set('deck', sel.value); start(sel.value); };
  start(pick);
}
function start(pick) {
  deck = [];
  EPS.forEach(e => { if (pick === 'all' || String(e.n) === String(pick)) e.cards.forEach(c => deck.push({ ...c, ep: e.n })); });
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  pos = 0; got = 0; miss = 0; show();
}
function show() {
  const el = document.getElementById('card');
  document.getElementById('prog').textContent = deck.length ? `Card ${Math.min(pos + 1, deck.length)} of ${deck.length}` : '';
  document.getElementById('tally').textContent = `Got ${got} · Missed ${miss}`;
  if (pos >= deck.length) {
    el.innerHTML = `<div class="card"><div class="lbl">Done</div><p class="cq">All ${got} cards cleared. ${miss} misses along the way.</p>
      <p class="muted">Missed cards came back at the end of the deck. Run it again until there are none.</p>
      <div class="row"><button class="b-show" onclick="start(document.getElementById('pick').value)">Run it again</button></div></div>`;
    return;
  }
  const c = deck[pos];
  el.innerHTML = `<div class="card" id="cc"><div class="lbl">Episode ${c.ep}</div><p class="cq">${esc(c.q)}</p>
    <div class="ca">${esc(c.a)}<div class="src">${esc(c.src)}</div></div>
    <div class="row" id="r1"><button class="b-show" onclick="document.getElementById('cc').classList.add('open');document.getElementById('r1').hidden=true;document.getElementById('r2').hidden=false">Show answer</button></div>
    <div class="row" id="r2" hidden><button class="b-miss" onclick="miss++;deck.push(deck[pos]);pos++;show()">Missed it</button><button class="b-got" onclick="got++;pos++;show()">Got it</button></div></div>`;
}

function route() {
  const h = location.hash.slice(1);
  if (h === 'drill') return drill();
  const m = h.match(/^ep(\d)$/);
  if (m) return episode(+m[1]);
  home();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
